[package]
name = "structural-distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic native package and atomic installation lifecycle owner"

[[bin]]
name = "structural-installer"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints]
workspace = true
