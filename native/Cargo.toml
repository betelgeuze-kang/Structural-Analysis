[workspace]
members = [
  "../implementation/phase1/mgt_hip_full_residual_ffi",
  "crates/structural-contracts",
  "crates/structural-ffi-sys",
  "crates/structural-ffi",
  "crates/structural-runtime",
  "crates/structural-report",
  "crates/structural-catalog",
  "crates/structural-evidence",
  "crates/structural-frontend-contract",
  "crates/structural-distribution",
  "crates/structural-cli",
  "crates/structural-workbench",
]
exclude = ["../implementation/phase1/structural_runtime_ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/betelgeuze-kang/structural-analysis"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
