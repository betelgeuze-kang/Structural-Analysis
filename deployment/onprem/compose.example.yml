name: structural-native-onprem

services:
  workbench:
    build:
      context: ../..
      dockerfile: deployment/onprem/Containerfile
      args:
        STRUCTURAL_RELEASE_ID: "${STRUCTURAL_RELEASE_ID:?set an immutable release ID}"
        STRUCTURAL_SOURCE_SHA256: "${STRUCTURAL_SOURCE_SHA256:?set sha256:<64 lowercase hex>}"
    image: "structural-analysis/native-workbench:${STRUCTURAL_RELEASE_ID:?set an immutable release ID}"
    network_mode: none
    read_only: true
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - "${STRUCTURAL_WORKSPACE_DIR:-./workspace}:/workspace"
    command: ["--version"]
