[build-system]
requires = [
  "setuptools==80.9.0",
  "wheel==0.45.1",
  "packaging==26.2",
  "tomli==2.4.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "structural-analysis"
version = "0.3.0"
description = "Evidence-bounded structural analysis engine and engineering workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
]
dev = [
  "beautifulsoup4>=4.12",
  "coverage[toml]>=7.5,<8",
  "cryptography>=42",
  "h5py>=3.10",
  "mypy>=1.10,<2",
  "pypdf>=4.0",
  "pytest>=8.0",
  "reportlab>=4.0",
  "requests>=2.31",
  "ruff>=0.5,<0.16",
]

[project.scripts]
structural-analysis = "structural_analysis.api.cli:main"
structural-analysis-benchmark = "structural_analysis.benchmark.cli:main"
structural-analysis-nonlinear-fiber-frame = "structural_analysis.api.nonlinear_fiber_frame_cli:main"
structural-analysis-nonlinear-frame = "structural_analysis.api.nonlinear_frame_cli:main"
structural-analysis-planar-frame = "structural_analysis.api.planar_frame_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["structural_analysis*"]

[tool.setuptools.package-data]
structural_analysis = ["schemas/*.json"]

[tool.ruff]
extend-exclude = [
  "implementation/phase1/_vendor/**",
  "implementation/phase1/open_data/demo/**",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/structural_analysis/adapters",
  "src/structural_analysis/analyses",
  "src/structural_analysis/dynamics/transient_checkpoint.py",
  "src/structural_analysis/elements/corotational_frame3d.py",
  "src/structural_analysis/elements/stateful_corotational_fiber_frame3d.py",
  "src/structural_analysis/materials",
  "src/structural_analysis/model",
  "src/structural_analysis/results/schema.py",
  "src/structural_analysis/results/validation.py",
  "src/structural_analysis/engine_v2/contracts/result_quantity.py",
  "src/structural_analysis/solvers/nonlinear/transient.py",
  "src/structural_analysis/units",
]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "scipy", "scipy.*"]
ignore_missing_imports = true
