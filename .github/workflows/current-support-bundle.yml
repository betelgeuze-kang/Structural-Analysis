              raw_bytes = repository_bytes(source_path)
              binding = frontend_inputs.get(label)
              require(
                  binding
                  == {
                      "bytes": len(raw_bytes),
                      "path": source_path,
                      "regular_file": True,
                      "sha256": (
                          "sha256:" + hashlib.sha256(raw_bytes).hexdigest()
                      ),
                  },
