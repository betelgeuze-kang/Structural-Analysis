              "source_worktree_clean",
              "trusted_toolchain_exact",
          }
          require(
              isinstance(frontend.get("checks"), dict)
              and set(frontend["checks"]) == expected_frontend_checks
              and all(value is True for value in frontend["checks"].values()),
              "frontend_audit_checks_invalid",
          )
          frontend_inputs = frontend.get("inputs")
          require(
              isinstance(frontend_inputs, dict)
              and set(frontend_inputs)
              == {
                  "package_json",
                  "package_lock",
                  "dependency_surface_violations",
              }
              and frontend_inputs.get("dependency_surface_violations") == [],
