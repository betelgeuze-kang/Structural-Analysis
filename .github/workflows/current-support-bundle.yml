              "frontend_audit_summary_invalid",
          )
          require_no_authority_keys(frontend, "frontend_audit")

          for label in all_labels:
              if label in expected_generated:
                  continue
              source_path = canonical_sources[label]
              raw_bytes = repository_bytes(source_path)
              row = rows_by_label[label]
              redacted_bytes = bounded_regular_file(
                  expected_redacted_paths[label]
              ).read_bytes()
              require(
                  row["bytes"] == len(raw_bytes)
                  and row["sha256"] == hashlib.sha256(raw_bytes).hexdigest()
                  and redacted_bytes == expected_redacted(raw_bytes),
                  f"repository_support_binding_invalid:{label}",
              )

          def verify_input_checksums(checksums, generated_paths=()):
              for path, recorded_hash in checksums.items():
                  if path in generated_paths:
                      raw_bytes = bounded_regular_file(path).read_bytes()
                      require(
                          recorded_hash
                          == "sha256:" + hashlib.sha256(raw_bytes).hexdigest(),
                          f"generated_input_checksum_invalid:{path}",
                      )
                      continue
                  tree_row = tree_by_path.get(path)
                  if tree_row is None:
                      require(
                          recorded_hash == "missing",
                          f"missing_input_checksum_invalid:{path}",
                      )
                  else:
                      raw_bytes = repository_bytes(path)
                      require(
                          recorded_hash
                          == "sha256:" + hashlib.sha256(raw_bytes).hexdigest(),
                          f"repository_input_checksum_invalid:{path}",
                      )

          verify_input_checksums(p0_payload["input_checksums"])
          verify_input_checksums(
              p1_payload["input_checksums"],
              generated_paths={expected_generated["p0_status"]},
          )
          fixture_path = "tests/fixtures/current_support_bundle/client_input/model.json"
          fixture_bytes = repository_bytes(fixture_path)
          expected_client_file_row = {
              "path": "model.json",
              "bytes": len(fixture_bytes),
              "sha256": "sha256:" + hashlib.sha256(fixture_bytes).hexdigest(),
          }
          require(
              hashlib.sha256(fixture_bytes).hexdigest()
              == "a87029edea78dbc30081e2abcf662a39cfa8f5a4710a8dc8e31416e460856330"
              and client_file_rows == [expected_client_file_row]
              and client_binding.get("validator_path")
              == "scripts/validate_client_input_package.py"
              and client_binding.get("validator_sha256")
              == (
                  "sha256:"
                  + hashlib.sha256(
                      repository_bytes("scripts/validate_client_input_package.py")
                  ).hexdigest()
              )
              and client_binding.get("schema_path")
              == (
                  "src/structural_analysis/schemas/"
                  "client_input_validation_report_v1.schema.json"
              )
              and client_binding.get("schema_sha256")
              == (
                  "sha256:"
                  + hashlib.sha256(
                      repository_bytes(
                          "src/structural_analysis/schemas/"
                          "client_input_validation_report_v1.schema.json"
                      )
                  ).hexdigest()
              ),
              "client_source_binding_invalid",
          )

          expected_output_files = {
              receipt_path,
              *(
                  bounded_regular_file(path)
                  for path in expected_generated.values()
              ),
              *(
                  bounded_regular_file(path)
                  for path in expected_support.values()
              ),
              *(
                  bounded_regular_file(path)
                  for path in expected_redacted_paths.values()
              ),
              audit_file,
              license_file,
          }
          actual_output_files = set()
          for candidate in output_resolved.rglob("*"):
              require(not candidate.is_symlink(), "unexpected_output_symlink")
              if candidate.is_dir():
                  continue
              require(candidate.is_file(), "unexpected_output_file_type")
              actual_output_files.add(candidate.resolve(strict=True))
          require(
              actual_output_files == expected_output_files,
              "output_file_allowlist_invalid",
          )
          expected_archive_members = {
              path.relative_to(output_resolved).as_posix()
              for path in expected_output_files
          }
          expected_archive_directories = {
              f"{parent.as_posix()}/"
              for member in expected_archive_members
              for parent in PurePosixPath(member).parents
              if parent.as_posix() != "."
          }
          require(
              archive_member_names == expected_archive_members
              and archive_directory_names.issubset(expected_archive_directories),
              "artifact_archive_member_allowlist_invalid",
          )
          PY

      - name: Attest receipt provenance, not product signing authority
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.RECEIPT }}

      - name: Retain and verify exact provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" "$ATTESTATION_BUNDLE"
          gh attestation verify "$RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/current-support-bundle.yml" \
            --signer-digest "$WORKFLOW_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION"

      - name: Upload current support-bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-support-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
