                  return (redact_text(text) + "\n").encode("utf-8")
              return (
                  json.dumps(
                      redact_payload(value),
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n"
              ).encode("utf-8")

