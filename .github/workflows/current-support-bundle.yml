name: Current Support Bundle

# This lane attests support-bundle completeness and provenance only. Child
# OPEN/BLOCKED states remain authoritative; this is not product code signing,
# human usability evidence, release authority, or commercial clearance.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-support-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  OUTPUT_ROOT: .ci/current-support-bundle
  RECEIPT: .ci/current-support-bundle/current-support-bundle-receipt.v1.json
  ATTESTATION_BUNDLE: .ci/current-support-bundle/current-support-bundle-receipt.sigstore.json
  ATTESTATION_VERIFICATION: .ci/current-support-bundle/current-support-bundle-receipt.attestation-verification.json

jobs:
  build-verify:
    name: build-verify-unprivileged
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      handoff-artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      handoff-artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
    steps:
      - name: Checkout exact current-main source without LFS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: false
          persist-credentials: false

      - name: Bootstrap official Node audit toolchain before repository code
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          node_root="$RUNNER_TEMP/trusted-node-v24.20.0"
          download_home="$RUNNER_TEMP/trusted-node-download-home"
          archive="$RUNNER_TEMP/node-v24.20.0-linux-x64.tar.xz"
          shasums="$RUNNER_TEMP/node-v24.20.0-SHASUMS256.txt"
          test ! -e "$node_root"
          /usr/bin/mkdir -m 700 "$node_root" "$download_home"
          download=(/usr/bin/env -i "HOME=$download_home" "PATH=/usr/bin:/bin" LANG=C.UTF-8 LC_ALL=C.UTF-8)
          "${download[@]}" /usr/bin/curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --noproxy '*' \
            https://nodejs.org/dist/v24.20.0/SHASUMS256.txt -o "$shasums"
          "${download[@]}" /usr/bin/curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --noproxy '*' \
            https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz -o "$archive"
          expected='2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  node-v24.20.0-linux-x64.tar.xz'
          actual="$(/usr/bin/awk '$2 == "node-v24.20.0-linux-x64.tar.xz" {print; found++} END {if (found != 1) exit 1}' "$shasums")"
          test "$actual" = "$expected"
          test "$(/usr/bin/sha256sum "$archive" | /usr/bin/awk '{print $1}')" = "${expected%% *}"
          /usr/bin/tar --extract --xz --file "$archive" --directory "$node_root" \
            --strip-components=1 --no-same-owner --no-same-permissions
          node="$node_root/bin/node"
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test ! -L "$node" && test -f "$node"
          test ! -L "$npm_cli" && test -f "$npm_cli"
          test "$(/usr/bin/sha256sum "$node" | /usr/bin/awk '{print $1}')" = \
            89af8424dd53e560b1933f87ba650d8bf57c83ca5a04600eefb31f416aabbae7
          test "$(/usr/bin/sha256sum "$npm_cli" | /usr/bin/awk '{print $1}')" = \
            8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7
          isolated=(/usr/bin/env -i HOME="$download_home" PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8)
          test "$("${isolated[@]}" "$node" --version)" = v24.20.0
          test "$("${isolated[@]}" "$node" "$npm_cli" --version)" = 11.19.0
          test "$(/usr/bin/realpath "$node")" = "$node"
          test "$(/usr/bin/realpath "$npm_cli")" = "$npm_cli"
          test "$(/usr/bin/realpath /usr/bin/git)" = /usr/bin/git
          {
            echo "node=$node"
            echo "npm-cli=$npm_cli"
            echo "node-sha256=sha256:$(/usr/bin/sha256sum "$node" | /usr/bin/awk '{print $1}')"
            echo "npm-cli-sha256=sha256:$(/usr/bin/sha256sum "$npm_cli" | /usr/bin/awk '{print $1}')"
            echo "git-sha256=sha256:$(/usr/bin/sha256sum /usr/bin/git | /usr/bin/awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Verify workflow and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          test "$(/usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git rev-parse HEAD)" = "$SOURCE_SHA"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/git show "$WORKFLOW_SHA:.github/workflows/current-support-bundle.yml" \
            | cmp - .github/workflows/current-support-bundle.yml
          test -z "$(/usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git status --porcelain=v1 --untracked-files=all)"

      - name: Clean-copy install and registry audit before repository code
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          TRUSTED_NODE: ${{ steps.toolchain.outputs.node }}
          TRUSTED_NPM_CLI: ${{ steps.toolchain.outputs.npm-cli }}
          TRUSTED_NODE_SHA256: ${{ steps.toolchain.outputs.node-sha256 }}
          TRUSTED_NPM_CLI_SHA256: ${{ steps.toolchain.outputs.npm-cli-sha256 }}
          TRUSTED_GIT_SHA256: ${{ steps.toolchain.outputs.git-sha256 }}
        run: |
          set -euo pipefail
          audit_capture="$RUNNER_TEMP/frontend-audit-capture"
          audit_workspace="$RUNNER_TEMP/frontend-audit-workspace"
          audit_cache="$RUNNER_TEMP/frontend-audit-cache"
          audit_config="$RUNNER_TEMP/frontend-audit-config"
          test ! -e "$audit_capture"
          test ! -e "$audit_workspace"
          test ! -e "$audit_config"
          mkdir -m 700 "$audit_capture"
          mkdir -m 700 "$audit_workspace"
          mkdir -m 700 "$audit_config"
          ln -s /dev/null "$audit_config/user.npmrc"
          ln -s /dev/null "$audit_config/global.npmrc"
          test "$audit_config/user.npmrc" -ef /dev/null
          test "$audit_config/global.npmrc" -ef /dev/null
          forbidden=(
            .npmrc .pnpmfile.cjs .yarnrc .yarnrc.yml bun.lock bun.lockb
            bunfig.toml npm-shrinkwrap.json pnpm-lock.yaml pnpm-workspace.yaml
            yarn.lock .yarn
          )
          for path in "${forbidden[@]}"; do
            test ! -e "$path" && test ! -L "$path"
          done
          ancestor="$GITHUB_WORKSPACE"
          while :; do
            test ! -e "$ancestor/.npmrc" && test ! -L "$ancestor/.npmrc"
            parent="$(dirname "$ancestor")"
            test "$parent" != "$ancestor" || break
            ancestor="$parent"
          done
          /usr/bin/cp package.json package-lock.json "$audit_workspace/"
          test "$(/usr/bin/find "$audit_workspace" -mindepth 1 -maxdepth 1 -type f | /usr/bin/wc -l)" -eq 2
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/frontend-audit-home" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 "$TRUSTED_NODE" - "$GITHUB_WORKSPACE" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.argv[2]
          const forbidden = new Set(['.npmrc','.pnpmfile.cjs','.yarn','.yarnrc','.yarnrc.yml','bun.lock','bun.lockb','bunfig.toml','npm-shrinkwrap.json','pnpm-lock.yaml','pnpm-workspace.yaml','yarn.lock'])
          const ignored = new Set(['.git','dist','node_modules'])
          const pending = [root]
          while (pending.length) {
            const directory = pending.pop()
            for (const entry of fs.readdirSync(directory, {withFileTypes:true})) {
              if (forbidden.has(entry.name)) throw new Error(`forbidden dependency surface: ${entry.name}`)
              if (!entry.isSymbolicLink() && entry.isDirectory() && !ignored.has(entry.name)) pending.push(path.join(directory, entry.name))
            }
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'))
          const lock = JSON.parse(fs.readFileSync(path.join(root,'package-lock.json'),'utf8'))
          for (const field of ['bundleDependencies','bundledDependencies','devEngines','overrides','workspaces']) if (Object.hasOwn(manifest, field)) throw new Error(`unsupported manifest field: ${field}`)
          if (manifest.packageManager !== 'npm@11.19.0' || JSON.stringify(manifest.engines) !== JSON.stringify({node:'24.20.0',npm:'11.19.0'})) throw new Error('manifest toolchain mismatch')
          if (manifest.private !== true || manifest.license !== 'SEE LICENSE IN LICENSE') throw new Error('manifest license policy mismatch')
          if (lock.lockfileVersion !== 3 || lock.requires !== true || !lock.packages || !lock.packages[''] || lock.name !== manifest.name || lock.version !== manifest.version || lock.license !== manifest.license || lock.packages[''].name !== manifest.name || lock.packages[''].version !== manifest.version || lock.packages[''].license !== manifest.license) throw new Error('lock root mismatch')
          NODE
          capture_source() {
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git rev-parse HEAD
            /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git rev-parse 'HEAD^{tree}'
            if test -z "$(/usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git status --porcelain=v1 --untracked-files=all)"; then
              printf '%s\n' clean
            else
              printf '%s\n' dirty
            fi
          }
          capture_source > "$audit_capture/source-before.txt"
          config_env=(
            /usr/bin/env -i
            "PATH=/usr/bin:/bin"
            "HOME=$RUNNER_TEMP/frontend-audit-home"
            "TMPDIR=$RUNNER_TEMP/frontend-audit-tmp"
            "LANG=C.UTF-8"
            "LC_ALL=C.UTF-8"
            "NPM_CONFIG_USERCONFIG=$audit_config/user.npmrc"
            "NPM_CONFIG_GLOBALCONFIG=$audit_config/global.npmrc"
            "NPM_CONFIG_CACHE=$audit_cache"
          )
          /usr/bin/mkdir -m 700 "$RUNNER_TEMP/frontend-audit-home" "$RUNNER_TEMP/frontend-audit-tmp"
          config_args=(
            --registry=https://registry.npmjs.org/
            --strict-ssl=true
            --include=prod
            --include=dev
            --include=optional
            --include=peer
          )
          "${config_env[@]}" "$TRUSTED_NODE" --version > "$audit_capture/node-version.txt"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" --version
          ) > "$audit_capture/npm-version.txt"
          test "$(cat "$audit_capture/node-version.txt")" = "v24.20.0"
          test "$(cat "$audit_capture/npm-version.txt")" = "11.19.0"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" config get registry "${config_args[@]}"
          ) > "$audit_capture/effective-registry.txt"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" config get strict-ssl "${config_args[@]}"
          ) > "$audit_capture/effective-strict-ssl.txt"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" config get proxy "${config_args[@]}"
          ) > "$audit_capture/effective-proxy.txt"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" config get https-proxy "${config_args[@]}"
          ) > "$audit_capture/effective-https-proxy.txt"
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" config get cafile "${config_args[@]}"
          ) > "$audit_capture/effective-cafile.txt"
          set +e
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" ci --ignore-scripts --engine-strict \
              "${config_args[@]}"
          ) > "$audit_capture/npm-ci.stdout.txt" \
            2> "$audit_capture/npm-ci.stderr.txt"
          install_exit=$?
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" audit --json --audit-level=info \
              "${config_args[@]}"
          ) > "$audit_capture/npm-audit.stdout.json"
          audit_exit=$?
          (
            cd "$audit_workspace"
            "${config_env[@]}" "$TRUSTED_NODE" "$TRUSTED_NPM_CLI" audit signatures --json \
              "${config_args[@]}"
          ) \
            > "$audit_capture/npm-audit-signatures.stdout.json"
          signatures_exit=$?
          set -e
          printf '%s\n' "$install_exit" > "$audit_capture/npm-ci.exit-code.txt"
          printf '%s\n' "$audit_exit" > "$audit_capture/npm-audit.exit-code.txt"
          printf '%s\n' "$signatures_exit" \
            > "$audit_capture/npm-audit-signatures.exit-code.txt"
          cmp package.json "$audit_workspace/package.json"
          cmp package-lock.json "$audit_workspace/package-lock.json"
          capture_source > "$audit_capture/source-after.txt"
          test "$install_exit" -eq 0
          test "$audit_exit" -eq 0
          test "$signatures_exit" -eq 0
          cmp "$audit_capture/source-before.txt" "$audit_capture/source-after.txt"
          test "$(cat "$audit_capture/effective-registry.txt")" \
            = "https://registry.npmjs.org/"
          test "$(cat "$audit_capture/effective-strict-ssl.txt")" = "true"
          test "$(cat "$audit_capture/effective-proxy.txt")" = "null"
          test "$(cat "$audit_capture/effective-https-proxy.txt")" = "null"
          test "$(cat "$audit_capture/effective-cafile.txt")" = "null"
          printf '%s\n' "$TRUSTED_NODE" > "$audit_capture/trusted-node-path.txt"
          /usr/bin/realpath "$TRUSTED_NODE" > "$audit_capture/trusted-node-realpath.txt"
          printf '%s\n' "$TRUSTED_NODE_SHA256" > "$audit_capture/trusted-node-sha256.txt"
          printf '%s\n' "$TRUSTED_NPM_CLI" > "$audit_capture/trusted-npm-cli-path.txt"
          /usr/bin/realpath "$TRUSTED_NPM_CLI" > "$audit_capture/trusted-npm-cli-realpath.txt"
          printf '%s\n' "$TRUSTED_NPM_CLI_SHA256" > "$audit_capture/trusted-npm-cli-sha256.txt"
          printf '%s\n' /usr/bin/git > "$audit_capture/trusted-git-path.txt"
          /usr/bin/realpath /usr/bin/git > "$audit_capture/trusted-git-realpath.txt"
          printf '%s\n' "$TRUSTED_GIT_SHA256" > "$audit_capture/trusted-git-sha256.txt"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/git --version > "$audit_capture/trusted-git-version.txt"
          printf '%s\n' https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz > "$audit_capture/node-archive-url.txt"
          printf '%s\n' sha256:2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2 > "$audit_capture/node-archive-sha256.txt"
          printf '%s\n' https://nodejs.org/dist/v24.20.0/SHASUMS256.txt > "$audit_capture/node-shasums-url.txt"
          printf '%s\n' '2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  node-v24.20.0-linux-x64.tar.xz' > "$audit_capture/node-official-shasum-line.txt"

      - name: Set up Python control plane
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Install hash-locked contract tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build and independently verify exact-source support bundle and npm audit
        run: |
          set -euo pipefail
          python scripts/build_current_support_bundle.py build \
            --output-root "$OUTPUT_ROOT" \
            --expected-source-sha "$SOURCE_SHA" \
            --frontend-audit-capture-dir "$RUNNER_TEMP/frontend-audit-capture"
          python scripts/build_current_support_bundle.py verify \
            --receipt "$RECEIPT" \
            --expected-source-sha "$SOURCE_SHA"

      - name: Upload unprivileged handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-support-bundle-handoff-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-verified-handoff
    if: github.ref == 'refs/heads/main'
    needs: build-verify
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify exact handoff without repository code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_ID: ${{ needs.build-verify.outputs.handoff-artifact-id }}
          HANDOFF_ARTIFACT_DIGEST: ${{ needs.build-verify.outputs.handoff-artifact-digest }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_API_URL" = "https://api.github.com"
          test "$OUTPUT_ROOT" = ".ci/current-support-bundle"
          test "$RECEIPT" = "$OUTPUT_ROOT/current-support-bundle-receipt.v1.json"
          test -n "$HANDOFF_ARTIFACT_ID"
          python -I - \
            "$RECEIPT" \
            "$SOURCE_SHA" \
            "$WORKFLOW_SHA" \
            "$OUTPUT_ROOT" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKFLOW_REF" \
            "$GITHUB_REF" \
            "$HANDOFF_ARTIFACT_ID" \
            "$HANDOFF_ARTIFACT_DIGEST" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_API_URL" <<'PY'
          import base64
          from datetime import datetime, timezone
          import hashlib
          from io import BytesIO
          import json
          import os
          from pathlib import Path
          from pathlib import PurePosixPath
          import re
          import sys
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import build_opener, HTTPRedirectHandler, Request
          import zipfile

          receipt_arg = sys.argv[1]
          source_sha = sys.argv[2]
          workflow_sha = sys.argv[3]
          output_arg = sys.argv[4]
          repository = sys.argv[5]
          workflow_ref = sys.argv[6]
          source_ref = sys.argv[7]
          artifact_id = sys.argv[8]
          artifact_digest = sys.argv[9]
          run_id = sys.argv[10]
          run_attempt = sys.argv[11]
          api_url = sys.argv[12]
          expected_workflow_ref = (
              f"{repository}/.github/workflows/current-support-bundle.yml@"
              "refs/heads/main"
          )

          def require(condition, reason):
              if not condition:
                  raise SystemExit(reason)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, f"json_duplicate_key:{key}")
                  result[key] = value
              return result

          def load_json(path):
              return json.loads(
                  path.read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=lambda token: (_ for _ in ()).throw(
                      ValueError(f"nonfinite:{token}")
                  ),
              )

          def utc_timestamp(value):
              if not isinstance(value, str) or not value:
                  return False
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return False
              return (
                  parsed.tzinfo is not None
                  and parsed.utcoffset() == timezone.utc.utcoffset(parsed)
              )

          def sha256_path(path, *, prefix=True):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              value = digest.hexdigest()
              return f"sha256:{value}" if prefix else value

          def canonical_digest(value):
              return hashlib.sha256(
                  json.dumps(
                      value,
                      allow_nan=False,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              ).hexdigest()

          require(source_sha == workflow_sha, "source_workflow_sha_mismatch")
          require(source_ref == "refs/heads/main", "source_ref_invalid")
          require(workflow_ref == expected_workflow_ref, "workflow_ref_invalid")
          require(re.fullmatch(r"[1-9][0-9]*", artifact_id), "artifact_id_invalid")
          require(
              re.fullmatch(r"[0-9a-f]{64}", artifact_digest),
              "artifact_digest_invalid",
          )
          require(re.fullmatch(r"[1-9][0-9]*", run_id), "run_id_invalid")
          require(re.fullmatch(r"[1-9][0-9]*", run_attempt), "run_attempt_invalid")
          require(
              receipt_arg == f"{output_arg}/current-support-bundle-receipt.v1.json",
              "receipt_arg_invalid",
          )
          token = os.environ.get("GH_TOKEN", "")
          require(bool(token), "github_token_missing")
          require(
              api_url == "https://api.github.com"
              or api_url.startswith("http://127.0.0.1:"),
              "github_api_url_invalid",
          )
          api_parts = urlsplit(api_url)
          require(
              api_parts.username is None
              and api_parts.password is None
              and api_parts.path in {"", "/"}
              and not api_parts.query
              and not api_parts.fragment,
              "github_api_origin_invalid",
          )

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect)

          def api_json(path):
              require(
                  isinstance(path, str)
                  and path.startswith("/")
                  and not path.startswith("//")
                  and "#" not in path,
                  "github_api_path_invalid",
              )
              expected_url = f"{api_url.rstrip('/')}{path}"
              request = Request(
                  expected_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "current-support-bundle-privileged-verifier",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  response_context = opener.open(request, timeout=30)
              except HTTPError as error:
                  if 300 <= error.code < 400:
                      raise SystemExit("github_api_redirect_forbidden") from None
                  raise SystemExit(f"github_api_status:{path}:{error.code}") from None
              with response_context as response:
                  require(response.status == 200, f"github_api_status:{path}")
                  require(
                      response.geturl() == expected_url,
                      "github_api_origin_or_path_changed",
                  )
                  return json.loads(
                      response.read(),
                      object_pairs_hook=unique_object,
                      parse_constant=lambda value: (_ for _ in ()).throw(
                          ValueError(f"nonfinite:{value}")
                      ),
                  )

          repository_path = quote(repository, safe="/")
          run_meta = api_json(
              f"/repos/{repository_path}/actions/runs/{run_id}/attempts/{run_attempt}"
          )
          require(
              isinstance(run_meta, dict)
              and str(run_meta.get("id")) == run_id
              and str(run_meta.get("run_attempt")) == run_attempt
              and run_meta.get("head_sha") == source_sha
              and run_meta.get("path")
              == ".github/workflows/current-support-bundle.yml",
              "github_run_attempt_binding_invalid",
          )
          jobs_meta = api_json(
              f"/repos/{repository_path}/actions/runs/{run_id}/attempts/"
              f"{run_attempt}/jobs?per_page=100"
          )
          jobs = jobs_meta.get("jobs") if isinstance(jobs_meta, dict) else None
          require(
              isinstance(jobs, list)
              and type(jobs_meta.get("total_count")) is int
              and jobs_meta["total_count"] == len(jobs)
              and len(jobs) <= 100,
              "github_jobs_response_invalid",
          )
          build_jobs = [
              row
              for row in jobs
              if isinstance(row, dict)
              and row.get("name") == "build-verify-unprivileged"
          ]
          require(len(build_jobs) == 1, "github_build_job_identity_invalid")
          build_job = build_jobs[0]
          require(
              type(build_job.get("id")) is int
              and build_job["id"] > 0
              and str(build_job.get("run_id")) == run_id
              and str(build_job.get("run_attempt")) == run_attempt
              and build_job.get("head_sha") == source_sha
              and build_job.get("status") == "completed"
              and build_job.get("conclusion") == "success"
              and utc_timestamp(build_job.get("completed_at")),
              "github_build_job_completion_invalid",
          )
          artifact_meta = api_json(
              f"/repos/{repository_path}/actions/artifacts/{artifact_id}"
          )
          expected_artifact_name = (
              f"current-support-bundle-handoff-{run_id}-{run_attempt}-{source_sha}"
          )
          artifact_run = artifact_meta.get("workflow_run")
          require(
              isinstance(artifact_meta, dict)
              and str(artifact_meta.get("id")) == artifact_id
              and artifact_meta.get("name") == expected_artifact_name
              and artifact_meta.get("digest") == f"sha256:{artifact_digest}"
              and artifact_meta.get("expired") is False
              and type(artifact_meta.get("size_in_bytes")) is int
              and artifact_meta["size_in_bytes"] > 0
              and isinstance(artifact_run, dict)
              and str(artifact_run.get("id")) == run_id
              and artifact_run.get("head_sha") == source_sha,
              "github_artifact_metadata_binding_invalid",
          )

          archive_api_path = (
              f"/repos/{repository_path}/actions/artifacts/{artifact_id}/zip"
          )
          archive_api_url = f"{api_url.rstrip('/')}{archive_api_path}"
          archive_request = Request(
              archive_api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "current-support-bundle-privileged-verifier",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              opener.open(archive_request, timeout=30)
          except HTTPError as redirect:
              require(
                  redirect.code in {302, 303, 307, 308},
                  "artifact_archive_redirect_status_invalid",
              )
              require(
                  redirect.geturl() == archive_api_url,
                  "artifact_archive_api_origin_or_path_changed",
              )
              archive_url = redirect.headers.get("Location", "")
          else:
              raise SystemExit("artifact_archive_redirect_required")
          redirect_url = urlsplit(archive_url)
          redirect_host = (redirect_url.hostname or "").lower()
          local_redirect = (
              api_parts.hostname == "127.0.0.1"
              and redirect_url.scheme == "http"
              and redirect_host == "127.0.0.1"
              and redirect_url.port == api_parts.port
          )
          production_redirect = (
              redirect_url.scheme == "https"
              and (
                  redirect_host.endswith(".blob.core.windows.net")
                  or redirect_host.endswith(".actions.githubusercontent.com")
              )
          )
          require(
              bool(archive_url)
              and redirect_url.username is None
              and redirect_url.password is None
              and not redirect_url.fragment
              and (local_redirect or production_redirect),
              "artifact_archive_redirect_invalid",
          )
          archive_download_request = Request(
              archive_url,
              headers={
                  "Accept": "application/octet-stream",
                  "User-Agent": "current-support-bundle-privileged-verifier",
              },
          )
          try:
              archive_response_context = opener.open(
                  archive_download_request,
                  timeout=30,
              )
          except HTTPError as error:
              if 300 <= error.code < 400:
                  raise SystemExit("artifact_storage_redirect_forbidden") from None
              raise SystemExit(
                  f"artifact_archive_download_status:{error.code}"
              ) from None
          with archive_response_context as response:
              require(response.status == 200, "artifact_archive_download_failed")
              require(
                  response.geturl() == archive_url,
                  "artifact_storage_origin_or_path_changed",
              )
              archive_bytes = response.read(256 * 1024 * 1024 + 1)
          require(
              len(archive_bytes) <= 256 * 1024 * 1024
              and len(archive_bytes) == artifact_meta["size_in_bytes"]
              and hashlib.sha256(archive_bytes).hexdigest() == artifact_digest,
              "artifact_archive_byte_binding_invalid",
          )

          workspace = Path.cwd().resolve(strict=True)
          output_path = Path(output_arg)
          require(bool(output_arg), "output_arg_invalid")
          output_root = output_path if output_path.is_absolute() else workspace / output_path
          require(
              not output_root.exists() and not output_root.is_symlink(),
              "output_root_preexisting",
          )
          output_root.mkdir(parents=True, mode=0o700)
          archive_member_names = set()
          archive_directory_names = set()
          total_uncompressed = 0
          with zipfile.ZipFile(BytesIO(archive_bytes), "r") as artifact_zip:
              require(not artifact_zip.comment, "artifact_archive_comment_forbidden")
              for info in artifact_zip.infolist():
                  name = info.filename
                  pure = PurePosixPath(name)
                  require(
                      isinstance(name, str)
                      and bool(name)
                      and "\\" not in name
                      and not pure.is_absolute()
                      and all(part not in {"", ".", ".."} for part in pure.parts)
                      and name not in archive_member_names
                      and name not in archive_directory_names
                      and not (info.flag_bits & 0x1),
                      "artifact_archive_member_invalid",
                  )
                  mode_type = (info.external_attr >> 16) & 0o170000
                  require(
                      mode_type in {0, 0o040000, 0o100000},
                      "artifact_archive_member_type_invalid",
                  )
                  if info.is_dir():
                      archive_directory_names.add(name)
                      continue
                  require(
                      info.compress_type in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED}
                      and info.file_size <= 64 * 1024 * 1024,
                      "artifact_archive_member_size_invalid",
                  )
                  total_uncompressed += info.file_size
                  require(
                      total_uncompressed <= 512 * 1024 * 1024,
                      "artifact_archive_expansion_invalid",
                  )
                  archive_member_names.add(name)
                  destination = output_root.joinpath(*pure.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  raw_member = artifact_zip.read(info)
                  require(
                      len(raw_member) == info.file_size,
                      "artifact_archive_member_read_invalid",
                  )
                  with destination.open("xb") as stream:
                      stream.write(raw_member)
          output_resolved = output_root.resolve(strict=True)

          def bounded_regular_file(path_text):
              lexical = Path(path_text)
              require(
                  lexical.is_absolute() is output_path.is_absolute(),
                  "artifact_path_mode_invalid",
              )
              candidate = lexical if lexical.is_absolute() else workspace / lexical
              try:
                  relative = candidate.relative_to(output_root)
              except ValueError:
                  raise SystemExit("artifact_outside_output") from None
              current_path = output_root
              for part in relative.parts:
                  current_path /= part
                  require(not current_path.is_symlink(), "artifact_symlink_forbidden")
              resolved = candidate.resolve(strict=True)
              try:
                  resolved.relative_to(output_resolved)
              except ValueError:
                  raise SystemExit("artifact_resolves_outside_output") from None
              require(resolved.is_file(), "artifact_not_regular_file")
              return resolved

          receipt_path = bounded_regular_file(receipt_arg)
          payload = load_json(receipt_path)
          require(isinstance(payload, dict), "receipt_object_required")

          top_keys = {
              "artifact_hash",
              "blockers",
              "checks",
              "claim_boundary",
              "contract_pass",
              "generated_at",
              "generated_inputs",
              "output_root",
              "readiness_status_preserved",
              "reason_code",
              "schema_version",
              "source",
              "summary_line",
              "support_bundle",
          }
          require(set(payload) == top_keys, "receipt_keys_invalid")
          body = {key: value for key, value in payload.items() if key != "artifact_hash"}
          encoded = json.dumps(
              body,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          expected_hash = "sha256:" + hashlib.sha256(encoded).hexdigest()
          require(
              payload.get("schema_version") == "current-support-bundle-receipt.v1",
              "receipt_schema_invalid",
          )
          require(utc_timestamp(payload.get("generated_at")), "generated_at_invalid")
          require(payload.get("artifact_hash") == expected_hash, "receipt_hash_invalid")
          require(payload.get("output_root") == output_arg, "receipt_output_root_invalid")
          require(payload.get("contract_pass") is True, "receipt_contract_blocked")
          require(payload.get("reason_code") == "PASS", "receipt_reason_invalid")
          require(payload.get("blockers") == [], "receipt_blockers_present")

          expected_claim_boundary = {
              "allowed": [
                  "exact-source support-bundle input availability",
                  "redaction and bundle/archive roundtrip",
                  "current readiness-state handoff",
              ],
              "not_granted": [
                  "P0 or P1 closure",
                  "project-operations readiness",
                  "human new-user observation",
                  "client-source authenticity",
                  "freshness or current authority of pre-existing bundled evidence",
                  "product code signing or platform notarization",
                  "release, commercial, or engineering-design authority",
              ],
              "sigstore_note": (
                  "Workflow attestation proves receipt provenance only; it is not an "
                  "embedded product signature or platform code-signing authority."
              ),
          }
          require(
              payload.get("claim_boundary") == expected_claim_boundary,
              "claim_boundary_invalid",
          )

          source = payload.get("source")
          require(isinstance(source, dict), "source_object_required")
          require(
              set(source)
              == {
                  "client_reference_fixture",
                  "client_reference_fixture_head_files",
                  "commit_sha",
                  "expected_commit_sha",
                  "tree_sha",
                  "worktree_clean",
              },
              "source_keys_invalid",
          )
          require(source.get("commit_sha") == source_sha, "receipt_source_invalid")
          require(
              source.get("expected_commit_sha") == source_sha,
              "receipt_expected_source_invalid",
          )
          tree_sha = source.get("tree_sha")
          require(
              isinstance(tree_sha, str)
              and tree_sha != "0" * 40
              and re.fullmatch(r"[0-9a-f]{40}", tree_sha),
              "receipt_tree_invalid",
          )
          require(source.get("worktree_clean") is True, "receipt_clean_flag_invalid")
          require(
              source.get("client_reference_fixture")
              == "tests/fixtures/current_support_bundle/client_input",
              "receipt_fixture_invalid",
          )
          require(
              source.get("client_reference_fixture_head_files")
              == ["tests/fixtures/current_support_bundle/client_input/model.json"],
              "receipt_fixture_head_invalid",
          )

          expected_checks = {
              "client_fixture_directory",
              "client_fixture_tracked_at_source_head",
              "client_reference_fixture_artifact_hash_valid",
              "client_reference_fixture_current_worktree_bound",
              "client_reference_fixture_producer_semantics_replayed",
              "client_reference_fixture_ready",
              "generated_current_inputs_present",
              "frontend_dependency_audit_exact_source_pass",
              "p0_p1_producer_semantics_replayed",
              "p0_status_current_source_and_coherent",
              "p0_status_explicit",
              "p1_status_current_source_and_coherent",
              "p1_status_explicit",
              "project_ops_status_coherent",
              "project_ops_status_explicit",
              "source_commit_matches_expected",
              "source_worktree_clean",
              "support_bundle_all_artifacts_available",
              "support_bundle_archive_roundtrip_pass",
              "support_bundle_contract_pass",
              "support_bundle_layout_pass",
              "support_bundle_missing_required_zero",
              "support_bundle_pm_failure_coverage_pass",
              "support_bundle_producer_semantics_replayed",
              "support_bundle_redaction_pass",
              "support_bundle_roundtrip_pass",
              "support_bundle_transitive_bindings_pass",
          }
          checks = payload.get("checks")
          require(
              isinstance(checks, dict)
              and set(checks) == expected_checks
              and all(value is True for value in checks.values()),
              "receipt_checks_not_exactly_green",
          )

          generated = payload.get("generated_inputs")
          support = payload.get("support_bundle")
          expected_generated = {
              "p0_status": f"{output_arg}/generated/p0-status.json",
              "p1_status": f"{output_arg}/generated/p1-readiness-status.json",
              "project_ops_snapshot": (
                  f"{output_arg}/generated/project-ops-service-snapshot.json"
              ),
              "client_input_validation_report": (
                  f"{output_arg}/generated/client-input-validation-report.json"
              ),
              "frontend_dependency_audit_report": (
                  f"{output_arg}/generated/frontend-dependency-audit-report.json"
              ),
          }
          expected_support = {
              "manifest": f"{output_arg}/support-bundle-manifest.json",
              "bundle_index": f"{output_arg}/bundle/support_bundle_index.json",
              "pm_failure_bundle_coverage": (
                  f"{output_arg}/bundle/pm_failure_bundle_coverage.json"
              ),
              "archive": f"{output_arg}/support-bundle-export.zip",
          }

          def verify_artifact_rows(section, expected_paths):
              require(isinstance(section, dict), "artifact_section_invalid")
              for label, expected_path in expected_paths.items():
                  row = section.get(label)
                  require(
                      isinstance(row, dict)
                      and set(row) == {"path", "bytes", "sha256"},
                      f"artifact_row_shape_invalid:{label}",
                  )
                  require(row.get("path") == expected_path, f"artifact_path_invalid:{label}")
                  path = bounded_regular_file(expected_path)
                  size = row.get("bytes")
                  require(
                      isinstance(size, int)
                      and not isinstance(size, bool)
                      and size == path.stat().st_size,
                      f"artifact_size_invalid:{label}",
                  )
                  require(
                      row.get("sha256") == sha256_path(path),
                      f"artifact_hash_invalid:{label}",
                  )

          require(
              isinstance(generated, dict) and set(generated) == set(expected_generated),
              "generated_inputs_invalid",
          )
          verify_artifact_rows(generated, expected_generated)
          require(
              isinstance(support, dict)
              and set(support)
              == {
                  *expected_support,
                  "artifact_count",
                  "available_artifact_count",
                  "missing_required_count",
              },
              "support_bundle_section_invalid",
          )
          verify_artifact_rows(support, expected_support)
          require(support.get("artifact_count") == 54, "artifact_count_invalid")
          require(
              support.get("available_artifact_count") == 54,
              "available_artifact_count_invalid",
          )
          require(
              support.get("missing_required_count") == 0,
              "missing_required_count_invalid",
          )

          readiness = payload.get("readiness_status_preserved")
          require(
              isinstance(readiness, dict)
              and set(readiness)
              == {
                  "p0",
                  "p1",
                  "project_ops",
                  "client_input_reference_fixture",
              },
              "readiness_shape_invalid",
          )
          p0 = readiness.get("p0")
          p1 = readiness.get("p1")
          project_ops = readiness.get("project_ops")
          client = readiness.get("client_input_reference_fixture")
          require(
              isinstance(p0, dict)
              and set(p0)
              == {
                  "status",
                  "p0_closed",
                  "core_evidence_closed",
                  "release_publication_closed",
                  "open_gates",
              }
              and all(
                  isinstance(p0.get(key), bool)
                  for key in (
                      "p0_closed",
                      "core_evidence_closed",
                      "release_publication_closed",
                  )
              )
              and p0.get("p0_closed")
              is (p0.get("core_evidence_closed") and p0.get("release_publication_closed"))
              and p0.get("status") == ("closed" if p0.get("p0_closed") else "open")
              and isinstance(p0.get("open_gates"), list)
              and all(isinstance(item, str) and item for item in p0["open_gates"]),
              "p0_snapshot_invalid",
          )
          require(
              isinstance(p1, dict)
              and set(p1)
              == {
                  "status",
                  "p1_inputs_ready",
                  "p1_execution_unblocked",
                  "p0_release_blocker",
                  "blocked_gates",
              }
              and all(
                  isinstance(p1.get(key), bool)
                  for key in (
                      "p1_inputs_ready",
                      "p1_execution_unblocked",
                      "p0_release_blocker",
                  )
              )
              and p1.get("p0_release_blocker") is (not p0.get("p0_closed"))
              and p1.get("p1_execution_unblocked")
              is (
                  p1.get("p1_inputs_ready")
                  and not p1.get("p0_release_blocker")
              )
              and p1.get("status")
              == ("ready" if p1.get("p1_execution_unblocked") else "blocked")
              and isinstance(p1.get("blocked_gates"), list)
              and all(isinstance(item, str) and item for item in p1["blocked_gates"]),
              "p1_snapshot_invalid",
          )
          require(
              isinstance(project_ops, dict)
              and set(project_ops)
              == {"contract_pass", "reason_code", "summary_line"}
              and isinstance(project_ops.get("contract_pass"), bool)
              and project_ops.get("reason_code") in {"PASS", "CHECK", "ERR_INPUT"}
              and (project_ops.get("reason_code") == "PASS")
              is project_ops.get("contract_pass")
              and isinstance(project_ops.get("summary_line"), str),
              "project_ops_snapshot_invalid",
          )
          require(
              client
              == {
                  "contract_pass": True,
                  "status": "ready",
                  "reason_code": "PASS",
                  "source_authority": "repository_reference_fixture",
              },
              "client_snapshot_invalid",
          )
          expected_summary = (
              "Current support bundle: PASS | artifacts=54/54 | "
              f"p0={p0.get('status')} | p1={p1.get('status')} | "
              f"project_ops={project_ops.get('reason_code')}"
          )
          require(payload.get("summary_line") == expected_summary, "summary_line_invalid")

          forbidden_authority_keys = {
              "commercial_authority",
              "engineering_authority",
              "product_signing_authority",
              "release_authority",
          }

          def require_no_authority_keys(value, label):
              if isinstance(value, dict):
                  require(
                      not (set(value) & forbidden_authority_keys),
                      f"forbidden_authority_key:{label}",
                  )
                  for item in value.values():
                      require_no_authority_keys(item, label)
              elif isinstance(value, list):
                  for item in value:
                      require_no_authority_keys(item, label)

          def strict_gates(status_payload, label):
              gates = status_payload.get("gates")
              require(
                  isinstance(gates, list)
                  and bool(gates)
                  and all(isinstance(row, dict) for row in gates),
                  f"gates_invalid:{label}",
              )
              labels = []
              for gate in gates:
                  gate_label = gate.get("label")
                  require(
                      isinstance(gate_label, str)
                      and bool(gate_label)
                      and isinstance(gate.get("ok"), bool),
                      f"gate_shape_invalid:{label}",
                  )
                  labels.append(gate_label)
                  children = gate.get("children", [])
                  require(
                      isinstance(children, list)
                      and all(
                          isinstance(row, dict)
                          and isinstance(row.get("label"), str)
                          and bool(row.get("label"))
                          and isinstance(row.get("ok"), bool)
                          for row in children
                      ),
                      f"gate_children_invalid:{label}",
                  )
                  if children:
                      require(
                          gate["ok"] is all(row["ok"] for row in children),
                          f"gate_child_rollup_invalid:{label}",
                      )
              require(len(labels) == len(set(labels)), f"gate_labels_duplicate:{label}")
              return gates

          def status_rows(status_payload):
              rows = []
              for gate in status_payload["gates"]:
                  rows.append(gate)
                  rows.extend(gate.get("children", []))
              return rows

          p0_payload = load_json(
              bounded_regular_file(expected_generated["p0_status"])
          )
          require(
              isinstance(p0_payload, dict)
              and set(p0_payload)
              == {
                  "core_evidence_closed",
                  "default_publication_evidence_index_missing",
                  "engine_version",
                  "gates",
                  "generated_at",
                  "input_checksums",
                  "next_action",
                  "p0_closed",
                  "publication_evidence_index",
                  "release_publication_closed",
                  "reuse_policy",
                  "reused_evidence",
                  "schema_version",
                  "source_commit_sha",
                  "status",
              }
              and p0_payload.get("schema_version") == "p0-closure-status.v1"
              and p0_payload.get("source_commit_sha") == source_sha
              and utc_timestamp(p0_payload.get("generated_at"))
              and isinstance(p0_payload.get("input_checksums"), dict)
              and all(
                  isinstance(key, str)
                  and isinstance(value, str)
                  and (
                      value == "missing"
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", value)
                  )
                  for key, value in p0_payload["input_checksums"].items()
              ),
              "p0_payload_shape_invalid",
          )
          p0_gates = strict_gates(p0_payload, "p0")
          p0_release = next(
              (
                  row
                  for row in p0_gates
                  if row.get("label") == "P0-1 release publication"
              ),
              None,
          )
          p0_core = [row for row in p0_gates if row is not p0_release]
          require(
              p0_release is not None
              and p0_payload.get("core_evidence_closed")
              is (bool(p0_core) and all(row["ok"] for row in p0_core))
              and p0_payload.get("release_publication_closed")
              is p0_release.get("ok")
              and p0_payload.get("p0_closed") is all(row["ok"] for row in p0_gates)
              and p0_payload.get("status")
              == ("closed" if p0_payload.get("p0_closed") else "open"),
              "p0_payload_semantics_invalid",
          )
          require(
              p0_payload.get("status") == "open"
              and p0_payload.get("p0_closed") is False
              and p0_payload.get("core_evidence_closed") is True
              and p0_payload.get("release_publication_closed") is False
