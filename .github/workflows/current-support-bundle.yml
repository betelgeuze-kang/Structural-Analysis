name: Current Support Bundle

# This lane attests support-bundle completeness and provenance only. Child
# OPEN/BLOCKED states remain authoritative; this is not product code signing,
# human usability evidence, release authority, or commercial clearance.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-support-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  OUTPUT_ROOT: .ci/current-support-bundle
  RECEIPT: .ci/current-support-bundle/current-support-bundle-receipt.v1.json
  ATTESTATION_BUNDLE: .ci/current-support-bundle/current-support-bundle-receipt.sigstore.json
  ATTESTATION_VERIFICATION: .ci/current-support-bundle/current-support-bundle-receipt.attestation-verification.json
  GH_TOKEN: ${{ github.token }}

jobs:
  build-verify-attest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current-main source without LFS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: false
          persist-credentials: false

      - name: Verify workflow and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show "$WORKFLOW_SHA:.github/workflows/current-support-bundle.yml" \
            | cmp - .github/workflows/current-support-bundle.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python control plane
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Install hash-locked contract tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build and independently verify exact-source support bundle
        run: |
          set -euo pipefail
          python scripts/build_current_support_bundle.py build \
            --output-root "$OUTPUT_ROOT" \
            --expected-source-sha "$SOURCE_SHA"
          python scripts/build_current_support_bundle.py verify \
            --receipt "$RECEIPT" \
            --expected-source-sha "$SOURCE_SHA"

      - name: Attest receipt provenance, not product signing authority
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.RECEIPT }}

      - name: Retain and verify exact provenance bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" "$ATTESTATION_BUNDLE"
          gh attestation verify "$RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/current-support-bundle.yml" \
            --signer-digest "$WORKFLOW_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION"

      - name: Upload current support-bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-support-bundle-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
