              and frontend_audit.get("exit_code") == 0
              and frontend_audit.get("node_version") == "v24.20.0"
              and frontend_audit.get("npm_version") == "11.19.0"
              and frontend_audit.get("effective_registry")
              == "https://registry.npmjs.org/"
              and frontend_audit.get("effective_strict_ssl") == "true"
              and frontend_audit.get("effective_proxy") == "null"
              and frontend_audit.get("effective_https_proxy") == "null"
              and frontend_audit.get("effective_cafile") == "null"
              and frontend_audit.get("config_isolation")
              == {
