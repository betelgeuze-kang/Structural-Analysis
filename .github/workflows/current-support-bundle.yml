name: Current Support Bundle

# This lane attests support-bundle completeness and provenance only. Child
# OPEN/BLOCKED states remain authoritative; this is not product code signing,
# human usability evidence, release authority, or commercial clearance.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-support-bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  OUTPUT_ROOT: .ci/current-support-bundle
  RECEIPT: .ci/current-support-bundle/current-support-bundle-receipt.v1.json
  ATTESTATION_BUNDLE: .ci/current-support-bundle/current-support-bundle-receipt.sigstore.json
  ATTESTATION_VERIFICATION: .ci/current-support-bundle/current-support-bundle-receipt.attestation-verification.json

jobs:
  build-verify:
    name: build-verify-unprivileged
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current-main source without LFS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: false
          persist-credentials: false

      - name: Verify workflow and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show "$WORKFLOW_SHA:.github/workflows/current-support-bundle.yml" \
            | cmp - .github/workflows/current-support-bundle.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python control plane
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Install hash-locked contract tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build and independently verify exact-source support bundle
        run: |
          set -euo pipefail
          python scripts/build_current_support_bundle.py build \
            --output-root "$OUTPUT_ROOT" \
            --expected-source-sha "$SOURCE_SHA"
          python scripts/build_current_support_bundle.py verify \
            --receipt "$RECEIPT" \
            --expected-source-sha "$SOURCE_SHA"

      - name: Upload unprivileged handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-support-bundle-handoff-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-verified-handoff
    if: github.ref == 'refs/heads/main'
    needs: build-verify
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download unprivileged handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: current-support-bundle-handoff-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}

      - name: Verify receipt hash and source identity without repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          python -I - "$RECEIPT" "$SOURCE_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          receipt_path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          payload = json.loads(
              receipt_path.read_text(encoding="utf-8"),
              parse_constant=lambda token: (_ for _ in ()).throw(
                  ValueError(f"nonfinite:{token}")
              ),
          )
          body = {key: value for key, value in payload.items() if key != "artifact_hash"}
          encoded = json.dumps(
              body,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          expected_hash = "sha256:" + hashlib.sha256(encoded).hexdigest()
          source = payload.get("source", {})
          checks = payload.get("checks", {})

          def require(condition, reason):
              if not condition:
                  raise SystemExit(reason)

          require(
              payload.get("schema_version") == "current-support-bundle-receipt.v1",
              "receipt_schema_invalid",
          )
          require(payload.get("artifact_hash") == expected_hash, "receipt_hash_invalid")
          require(
              payload.get("output_root") == ".ci/current-support-bundle",
              "receipt_output_root_invalid",
          )
          require(source.get("commit_sha") == source_sha, "receipt_source_invalid")
          require(
              source.get("expected_commit_sha") == source_sha,
              "receipt_expected_source_invalid",
          )
          require(
              re.fullmatch(r"[0-9a-f]{40}", str(source.get("tree_sha", ""))),
              "receipt_tree_invalid",
          )
          require(source.get("worktree_clean") is True, "receipt_clean_flag_invalid")
          require(payload.get("contract_pass") is True, "receipt_contract_blocked")
          require(payload.get("reason_code") == "PASS", "receipt_reason_invalid")
          require(payload.get("blockers") == [], "receipt_blockers_present")
          require(
              isinstance(checks, dict)
              and checks
              and all(value is True for value in checks.values()),
              "receipt_checks_not_green",
          )
          PY

      - name: Attest receipt provenance, not product signing authority
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.RECEIPT }}

      - name: Retain and verify exact provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" "$ATTESTATION_BUNDLE"
          gh attestation verify "$RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/current-support-bundle.yml" \
            --signer-digest "$WORKFLOW_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION"

      - name: Upload current support-bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-support-bundle-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
