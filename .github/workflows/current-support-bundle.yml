          frontend_audit = frontend.get("audit")
          expected_audit_keys = {
              "command",
              "execution_order",
              "working_directory",
              "install",
              "exit_code",
              "node_version",
              "npm_version",
              "effective_registry",
              "effective_strict_ssl",
              "effective_proxy",
              "effective_https_proxy",
              "effective_cafile",
              "config_isolation",
              "environment_allowlist",
              "payload",
              "payload_sha256",
              "stdout",
              "stdout_bytes",
              "stdout_sha256",
              "signatures",
          }
          require(
              isinstance(frontend_audit, dict)
              and set(frontend_audit) == expected_audit_keys
