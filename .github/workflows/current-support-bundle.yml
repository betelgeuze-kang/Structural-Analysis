              and node_tool.get("sha256") == "sha256:89af8424dd53e560b1933f87ba650d8bf57c83ca5a04600eefb31f416aabbae7"
              and node_tool.get("version") == "v24.20.0"
              and isinstance(npm_cli_tool.get("path"), str)
              and PurePosixPath(npm_cli_tool["path"]).is_absolute()
              and npm_cli_tool.get("path") == npm_cli_tool.get("realpath")
              and npm_cli_tool["path"].endswith("/trusted-node-v24.20.0/lib/node_modules/npm/bin/npm-cli.js")
              and npm_cli_tool.get("sha256") == "sha256:8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7"
              and npm_cli_tool.get("version") == "11.19.0"
              and git_tool.get("path") == "/usr/bin/git"
              and git_tool.get("realpath") == "/usr/bin/git"
              and isinstance(git_tool.get("sha256"), str)
              and re.fullmatch(r"sha256:[0-9a-f]{64}", git_tool["sha256"])
              and isinstance(git_tool.get("version"), str)
              and git_tool["version"].startswith("git version "),
