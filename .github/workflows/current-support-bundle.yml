              and package_lock.get("name") == package_json.get("name")
              == package_root.get("name")
              and package_lock.get("version") == package_json.get("version")
              == package_root.get("version")
              and type(package_lock.get("lockfileVersion")) is int
              and package_lock.get("lockfileVersion") == 3
