          }
          direct_fields = (
              "dependencies",
              "devDependencies",
              "optionalDependencies",
              "peerDependencies",
          )
          exact_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          lock_counts = {
              "prod": 1,
              "dev": 0,
              "optional": 0,
              "peer": 0,
              "peerOptional": 0,
              "total": 0,
          }
          lock_graph_valid = isinstance(package_rows, dict)
          if lock_graph_valid:
              for lock_path, lock_row in package_rows.items():
                  if lock_path == "":
                      continue
                  flags = ("dev", "optional", "devOptional", "peer")
                  row_valid = (
                      isinstance(lock_path, str)
                      and lock_path.startswith("node_modules/")
                      and isinstance(lock_row, dict)
                      and not {
                          "bundleDependencies",
                          "bundledDependencies",
                          "inBundle",
                          "link",
                          "devEngines",
                      }.intersection(lock_row)
                      and isinstance(lock_row.get("version"), str)
                      and bool(lock_row.get("version"))
                      and all(
                          flag not in lock_row
                          or isinstance(lock_row[flag], bool)
                          for flag in flags
                      )
                  )
                  if not row_valid:
                      lock_graph_valid = False
                      break
                  is_dev = (
                      lock_row.get("dev") is True
                      or lock_row.get("devOptional") is True
                  )
                  is_optional = lock_row.get("optional") is True
                  is_peer = lock_row.get("peer") is True
                  lock_counts["total"] += 1
                  lock_counts["prod"] += int(not is_dev)
                  lock_counts["dev"] += int(is_dev)
                  lock_counts["optional"] += int(is_optional)
                  lock_counts["peer"] += int(is_peer)
                  lock_counts["peerOptional"] += int(
                      is_peer and is_optional
                  )
          direct_semantics_valid = isinstance(package_rows, dict)
          for field in direct_fields:
              manifest_rows = package_json.get(field, {})
              root_rows = package_root.get(field, {}) if isinstance(package_root, dict) else None
              if not (
                  isinstance(manifest_rows, dict)
                  and isinstance(root_rows, dict)
                  and manifest_rows == root_rows
                  and all(
                      isinstance(name, str)
                      and bool(name)
                      and isinstance(spec, str)
                      and exact_semver.fullmatch(spec)
                      and isinstance(package_rows.get(f"node_modules/{name}"), dict)
                      and package_rows[f"node_modules/{name}"].get("version") == spec
                      for name, spec in manifest_rows.items()
                  )
              ):
                  direct_semantics_valid = False
          require(
