          )
          distribution = frontend_tools.get("distribution")
          node_tool = frontend_tools.get("node")
          npm_cli_tool = frontend_tools.get("npm_cli")
          git_tool = frontend_tools.get("git")
          require(
              distribution
              == {
                  "archive_url": "https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz",
                  "archive_sha256": "sha256:2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2",
                  "shasums_url": "https://nodejs.org/dist/v24.20.0/SHASUMS256.txt",
                  "official_shasum_line": "2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  node-v24.20.0-linux-x64.tar.xz",
              }
              and isinstance(node_tool, dict)
              and isinstance(npm_cli_tool, dict)
              and isinstance(git_tool, dict)
              and set(node_tool) == {"path", "realpath", "sha256", "version"}
              and set(npm_cli_tool) == {"path", "realpath", "sha256", "version"}
              and set(git_tool) == {"path", "realpath", "sha256", "version"}
              and isinstance(node_tool.get("path"), str)
              and PurePosixPath(node_tool["path"]).is_absolute()
              and node_tool.get("path") == node_tool.get("realpath")
