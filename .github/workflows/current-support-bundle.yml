          )
          npm_command_prefix = [node_tool["realpath"], npm_cli_tool["realpath"]]
          package_json = package_payloads["package_json"]
          package_lock = package_payloads["package_lock"]
          package_rows = package_lock.get("packages")
          package_root = (
              package_rows.get("") if isinstance(package_rows, dict) else None
          )
          locked_ajv = (
