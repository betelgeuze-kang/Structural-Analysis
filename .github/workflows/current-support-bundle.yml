                  "LC_ALL",
                  "NPM_CONFIG_CACHE",
                  "NPM_CONFIG_GLOBALCONFIG",
                  "NPM_CONFIG_USERCONFIG",
                  "PATH",
                  "TMPDIR",
              ],
              "frontend_audit_execution_invalid",
          )
          npm_install = frontend_audit.get("install")
          install_stdout = (
              npm_install.get("stdout")
              if isinstance(npm_install, dict)
              else None
          )
          install_stderr = (
              npm_install.get("stderr")
              if isinstance(npm_install, dict)
              else None
          )
          require(
              isinstance(npm_install, dict)
              and set(npm_install)
              == {
                  "command",
                  "exit_code",
                  "stdout",
                  "stdout_bytes",
                  "stdout_sha256",
                  "stderr",
                  "stderr_bytes",
                  "stderr_sha256",
              }
              and npm_install.get("command")
              == [
                  *npm_command_prefix,
                  "ci",
                  "--ignore-scripts",
                  "--engine-strict",
                  "--registry=https://registry.npmjs.org/",
                  "--strict-ssl=true",
                  "--include=prod",
                  "--include=dev",
                  "--include=optional",
                  "--include=peer",
              ]
              and npm_install.get("exit_code") == 0
              and isinstance(install_stdout, str)
              and isinstance(install_stderr, str)
              and npm_install.get("stdout_bytes")
              == len(install_stdout.encode("utf-8"))
              and npm_install.get("stdout_sha256")
              == "sha256:"
              + hashlib.sha256(install_stdout.encode("utf-8")).hexdigest()
              and npm_install.get("stderr_bytes")
              == len(install_stderr.encode("utf-8"))
              and npm_install.get("stderr_sha256")
              == "sha256:"
              + hashlib.sha256(install_stderr.encode("utf-8")).hexdigest(),
              "frontend_install_binding_invalid",
          )
          npm_payload = frontend_audit.get("payload")
          npm_stdout = frontend_audit.get("stdout")
          require(
              isinstance(npm_payload, dict)
              and isinstance(npm_stdout, str)
              and frontend_audit.get("payload_sha256")
              == f"sha256:{canonical_digest(npm_payload)}"
              and frontend_audit.get("stdout_bytes")
              == len(npm_stdout.encode("utf-8"))
              and frontend_audit.get("stdout_sha256")
              == (
                  "sha256:"
                  + hashlib.sha256(npm_stdout.encode("utf-8")).hexdigest()
