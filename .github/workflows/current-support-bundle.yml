              }
              and npm_signatures.get("command")
              == [
                  *npm_command_prefix,
                  "audit",
                  "signatures",
                  "--json",
                  "--registry=https://registry.npmjs.org/",
                  "--strict-ssl=true",
                  "--include=prod",
                  "--include=dev",
                  "--include=optional",
                  "--include=peer",
              ]
              and npm_signatures.get("exit_code") == 0
              and signature_payload == {"invalid": [], "missing": []}
              and isinstance(signature_stdout, str)
              and npm_signatures.get("payload_sha256")
              == f"sha256:{canonical_digest(signature_payload)}"
              and npm_signatures.get("stdout_bytes")
              == len(signature_stdout.encode("utf-8"))
              and npm_signatures.get("stdout_sha256")
              == "sha256:"
              + hashlib.sha256(signature_stdout.encode("utf-8")).hexdigest()
              and json.loads(
                  signature_stdout,
                  object_pairs_hook=unique_object,
                  parse_constant=lambda token: (_ for _ in ()).throw(
                      ValueError(f"nonfinite:{token}")
                  ),
              )
              == signature_payload
              and npm_signatures.get("claim")
              == "registry provenance check only; no product-signing authority",
              "frontend_signature_binding_invalid",
          )
          npm_metadata = npm_payload.get("metadata")
          npm_counts = (
              npm_metadata.get("vulnerabilities")
              if isinstance(npm_metadata, dict)
              else None
          )
          npm_dependencies = (
              npm_metadata.get("dependencies")
              if isinstance(npm_metadata, dict)
              else None
          )
          require(
              set(npm_payload)
              == {"auditReportVersion", "metadata", "vulnerabilities"}
              and type(npm_payload.get("auditReportVersion")) is int
              and npm_payload.get("auditReportVersion") == 2
              and npm_payload.get("vulnerabilities") == {}
              and isinstance(npm_metadata, dict)
              and set(npm_metadata) == {"vulnerabilities", "dependencies"}
              and isinstance(npm_counts, dict)
              and set(npm_counts)
              == {"info", "low", "moderate", "high", "critical", "total"}
              and all(type(value) is int and value == 0 for value in npm_counts.values())
              and isinstance(npm_dependencies, dict)
              and set(npm_dependencies)
              == {"prod", "dev", "optional", "peer", "peerOptional", "total"}
              and all(type(value) is int and value >= 0 for value in npm_dependencies.values())
              and npm_dependencies == lock_counts,
              "frontend_audit_npm_metadata_invalid",
          )
          require(
              frontend.get("summary")
              == {
                  "critical_vulnerability_count": 0,
                  "high_or_critical_vulnerability_count": 0,
                  "high_vulnerability_count": 0,
                  "info_vulnerability_count": 0,
                  "low_vulnerability_count": 0,
                  "moderate_vulnerability_count": 0,
                  "npm_clean_install_exit_code": 0,
                  "npm_audit_exit_code": 0,
                  "package_json": "package.json",
                  "package_lock": "package-lock.json",
                  "signature_invalid_count": 0,
                  "signature_missing_count": 0,
                  "vulnerability_total": 0,
