permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  public-core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Enforce mypy and 85 percent branch coverage
        run: python scripts/check_core_quality.py
      - name: Verify corotational candidate contracts
        run: >-
          python -m pytest
          tests/test_corotational_fiber_frame_displacement_control.py
          tests/test_corotational_fiber_frame_engineering_recovery.py
          tests/test_corotational_fiber_frame_general.py
          tests/test_corotational_fiber_frame_j1_j5.py
          tests/test_corotational_fiber_frame_sparse.py
          tests/test_corotational_frame2d_member_features.py
          tests/test_fracture_energy_concrete.py
          tests/test_durable_job_service.py
          tests/test_stateful_corotational_fiber_frame2d.py
          tests/test_unified_nonlinear_frame_api.py
      - name: Verify experimental P2 material candidates
        run: |
          python -m ruff check \
            src/structural_analysis/materials/confined_concrete.py \
            src/structural_analysis/materials/bond_slip.py \
            src/structural_analysis/materials/partial_composite.py \
            src/structural_analysis/materials/stateful_biaxial_fiber_section.py \
            tests/test_p2_material_candidates.py \
            tests/test_stateful_biaxial_fiber_section.py
          python -m mypy \
            src/structural_analysis/materials/confined_concrete.py \
            src/structural_analysis/materials/bond_slip.py \
            src/structural_analysis/materials/partial_composite.py \
            src/structural_analysis/materials/stateful_biaxial_fiber_section.py
          python -m pytest -q \
            tests/test_p2_material_candidates.py \
            tests/test_stateful_biaxial_fiber_section.py
      - name: Verify experimental sparse modal and buckling extraction
        run: |
          python -m ruff check \
            src/structural_analysis/solvers/sparse_generalized_eigen.py \
            src/structural_analysis/analyses/modal.py \
            src/structural_analysis/analyses/buckling.py \
            tests/test_sparse_generalized_eigen.py
          python -m mypy \
            src/structural_analysis/solvers/sparse_generalized_eigen.py \
            src/structural_analysis/analyses/modal.py \
            src/structural_analysis/analyses/buckling.py
          python -m pytest -q \
            tests/test_sparse_generalized_eigen.py \
            tests/test_whole_model_modal_analysis.py \
            tests/test_whole_model_buckling_analysis.py
      - name: Verify experimental nonlinear transient reference
        run: |
          python -m ruff check \
            src/structural_analysis/solvers/nonlinear/transient.py \
            tests/test_nonlinear_transient.py
          python -m mypy \
            src/structural_analysis/solvers/nonlinear/transient.py
          python -m pytest -q tests/test_nonlinear_transient.py
      - name: Verify experimental P2 3D frame candidates
        run: |
          python -m ruff check \
            src/structural_analysis/elements/corotational_frame3d.py \
            src/structural_analysis/elements/stateful_corotational_fiber_frame3d.py \
            src/structural_analysis/elements/stateful_corotational_partial_composite_frame3d.py \
            src/structural_analysis/elements/timoshenko_frame3d.py \
            src/structural_analysis/elements/torsion_warping.py \
            src/structural_analysis/assembly/initial_imperfection.py \
            src/structural_analysis/assembly/corotational_frame3d_global.py \
            src/structural_analysis/assembly/corotational_frame3d_graph.py \
            src/structural_analysis/assembly/stateful_corotational_frame3d_sparse.py \
            src/structural_analysis/solvers/nonlinear/scalable_sparse_factorization.py \
            tests/test_p2_frame3d_candidates.py \
            tests/test_stateful_corotational_frame3d_materials.py \
            tests/test_stateful_corotational_fiber_frame3d.py \
            tests/test_stateful_corotational_partial_composite_frame3d.py \
            tests/test_corotational_frame3d_scalable_graph.py \
            tests/test_scalable_sparse_factorization.py
          python -m mypy --follow-imports=skip \
            src/structural_analysis/elements/corotational_frame3d.py \
            src/structural_analysis/elements/stateful_corotational_fiber_frame3d.py \
            src/structural_analysis/elements/stateful_corotational_partial_composite_frame3d.py \
            src/structural_analysis/elements/timoshenko_frame3d.py \
            src/structural_analysis/elements/torsion_warping.py \
            src/structural_analysis/assembly/initial_imperfection.py \
            src/structural_analysis/assembly/corotational_frame3d_global.py \
            src/structural_analysis/assembly/corotational_frame3d_graph.py \
            src/structural_analysis/assembly/stateful_corotational_frame3d_sparse.py \
            src/structural_analysis/solvers/nonlinear/scalable_sparse_factorization.py
          python -m pytest -q \
            tests/test_p2_frame3d_candidates.py \
            tests/test_corotational_frame3d_global.py \
            tests/test_stateful_corotational_frame3d_sparse.py \
            tests/test_stateful_corotational_frame3d_materials.py \
            tests/test_stateful_corotational_fiber_frame3d.py \
            tests/test_stateful_corotational_partial_composite_frame3d.py \
            tests/test_corotational_frame3d_scalable_graph.py \
            tests/test_scalable_sparse_factorization.py
      - name: Verify bounded cyclic frame benchmarks
        run: >-
          python -m pytest -q
          tests/test_stateful_corotational_steel_frame_cyclic_benchmark.py
          tests/test_stateful_corotational_concrete_frame_cyclic_benchmark.py
          tests/test_stateful_corotational_composite_frame_cyclic_benchmark.py
          tests/test_stateful_corotational_linked_frame_cyclic_benchmark.py
      - name: Verify fail-closed P3 entry gate
        run: |
          python -m ruff check scripts/build_p3_entry_gate.py tests/test_p3_entry_gate.py
          python scripts/build_p3_entry_gate.py --check
          python -m pytest -q tests/test_p3_entry_gate.py
      - name: Verify stored container-isolated external V&V candidate
        run: |
          python -m ruff check \
            benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            tests/test_external_vv_clean_runner_contract.py
          python -m pytest -q tests/test_external_vv_clean_runner_contract.py

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Run bounded public-core compatibility tests
        run: >-
          python -m pytest
          tests/test_structural_analysis_core_api.py
          tests/test_typed_domain_model.py
          tests/test_authoritative_linear_engineering_semantics.py
          tests/test_authoritative_linear_frame.py
          tests/test_authoritative_linear_frame_reference_cases.py
          tests/test_whole_model_modal_analysis.py
          tests/test_whole_model_buckling_analysis.py
          tests/test_result_validation_tolerance.py
          tests/test_durable_job_service.py
