name: Authoritative Linear Core CI

on:
  pull_request:
    paths:
      - "src/structural_analysis/**"
      - "implementation/phase1/run_mgt_full_frame_6dof_sparse_equilibrium.py"
      - "tests/test_authoritative_linear_*.py"
      - "tests/test_elastic_material_contract.py"
      - "tests/test_mgt_frame_kernel_extraction.py"
      - "tests/test_midas_explicit_adapter.py"
      - "tests/test_midas_mgt_nodal_load_contract.py"
      - "tests/test_result_validation_tolerance.py"
      - "tests/test_structural_analysis_core_api.py"
      - "tests/test_typed_domain_model.py"
      - "pyproject.toml"
      - "setup.cfg"
      - ".github/workflows/authoritative-linear-core-ci.yml"
  push:
    branches: ["main", "agent/**", "solver/**", "core/**", "interop/**"]
    paths:
      - "src/structural_analysis/**"
      - "implementation/phase1/run_mgt_full_frame_6dof_sparse_equilibrium.py"
      - "tests/test_authoritative_linear_*.py"
      - "tests/test_elastic_material_contract.py"
      - "tests/test_mgt_frame_kernel_extraction.py"
      - "tests/test_midas_explicit_adapter.py"
      - "tests/test_midas_mgt_nodal_load_contract.py"
      - "tests/test_result_validation_tolerance.py"
      - "tests/test_structural_analysis_core_api.py"
      - "tests/test_typed_domain_model.py"
      - "pyproject.toml"
      - "setup.cfg"
      - ".github/workflows/authoritative-linear-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoritative-linear-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Ruff
        run: >-
          python -m ruff check
          src/structural_analysis
          tests/test_authoritative_linear_cli_output_integrity.py
          tests/test_authoritative_linear_cli_output_preflight.py
          tests/test_authoritative_linear_engineering_semantics.py
          tests/test_authoritative_linear_frame.py
          tests/test_authoritative_linear_frame_reference_cases.py
          tests/test_elastic_material_contract.py
          tests/test_mgt_frame_kernel_extraction.py
          tests/test_midas_explicit_adapter.py
          tests/test_midas_mgt_nodal_load_contract.py
          tests/test_result_validation_tolerance.py
          tests/test_structural_analysis_core_api.py
          tests/test_typed_domain_model.py

      - name: Compile public package and shared MGT runner
        run: >-
          python -m compileall -q
          src/structural_analysis
          implementation/phase1/run_mgt_full_frame_6dof_sparse_equilibrium.py

      - name: Focused authoritative solver, CLI, typed-model, and adapter tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_authoritative_linear_cli_output_integrity.py \
            tests/test_authoritative_linear_cli_output_preflight.py \
            tests/test_authoritative_linear_engineering_semantics.py \
            tests/test_authoritative_linear_frame.py \
            tests/test_authoritative_linear_frame_reference_cases.py \
            tests/test_elastic_material_contract.py \
            tests/test_mgt_frame_kernel_extraction.py \
            tests/test_midas_explicit_adapter.py \
            tests/test_midas_mgt_nodal_load_contract.py \
            tests/test_result_validation_tolerance.py \
            tests/test_structural_analysis_core_api.py \
            tests/test_typed_domain_model.py \
            2>&1 | tee authoritative-core-tests.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authoritative-core-tests-${{ github.run_id }}
          path: authoritative-core-tests.log
          if-no-files-found: warn
          retention-days: 14
