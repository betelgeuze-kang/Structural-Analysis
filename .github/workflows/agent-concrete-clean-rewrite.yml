name: Agent Concrete Determinism Clean Rewrite

on:
  push:
    branches:
      - agent/fix-concrete-damage-artifact-determinism

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-concrete-damage-artifact-determinism
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Validate materialized payload before rewrite
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python -m ruff check \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python -m ruff format --check \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python scripts/build_phase2_state_updated_concrete_damage_artifacts.py --check
          python -m pytest -q \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_state_updated_concrete_damage_newton.py
      - name: Rewrite branch as one four-file commit on latest main
        shell: bash
        run: |
          set -euo pipefail
          clean_dir="$(mktemp -d)"
          cp scripts/build_phase2_state_updated_concrete_damage_artifacts.py "$clean_dir/builder.py"
          cp tests/test_build_phase2_state_updated_concrete_damage_artifacts.py "$clean_dir/test.py"
          cp implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json "$clean_dir/result.json"
          cp implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json "$clean_dir/summary.json"

          git fetch origin main
          git reset --hard origin/main

          cp "$clean_dir/builder.py" scripts/build_phase2_state_updated_concrete_damage_artifacts.py
          cp "$clean_dir/test.py" tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          cp "$clean_dir/result.json" implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json
          cp "$clean_dir/summary.json" implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py \
            implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json \
            implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json
          git commit -m "Make concrete-damage localization artifacts deterministic"
          git push --force origin HEAD:agent/fix-concrete-damage-artifact-determinism
