          fi
          manifest=native/crates/structural-ffi/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "$manifest is required for native integration changes" >&2
              exit 1
            fi
            echo "Rust/C++ integration crate not introduced; lane is not applicable"
            exit 0
          fi
          cargo test --manifest-path native/Cargo.toml -p structural-ffi --locked

  python-oracle-parity:
    name: python-oracle-parity
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [scope-contract, native-pr-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested ref with explicit non-LFS fixtures
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Python oracle
        if: needs.scope-contract.outputs.oracle == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Compare bounded native outputs with the Python oracle
        env:
          ORACLE_CHANGED: ${{ needs.scope-contract.outputs.oracle }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ORACLE_CHANGED" != "true" ]]; then
            echo "Native oracle paths unchanged; parity lane is not applicable"
            exit 0
          fi
          if python3 scripts/check_native_capabilities.py --is-enabled modelir_v2_rust_wire; then
            :
          else
            code=$?
            if [[ "$code" -eq 3 ]]; then
              echo "Rust ModelIR v2 wire capability is not promoted; oracle parity is not applicable"
              exit 0
            fi
            exit "$code"
          fi
          python3 scripts/check_native_capabilities.py --is-enabled modelir_v2
          if [[ ! -f native/crates/structural-contracts/Cargo.toml ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "native structural-contracts is required for ModelIR changes" >&2
              exit 1
            fi
            echo "Native ModelIR not introduced; Python remains the oracle owner"
            exit 0
          fi
          python -m pip install -e .[dev]
          python -m pytest -q \
            tests/test_model_ir_v2_contract.py \
            tests/test_native_model_ir_rust_parity.py \
            tests/test_native_mgt_import_health_python_parity.py \
            tests/test_native_reference_elements_python_parity.py \
            tests/test_native_sparse_linear_python_parity.py \
            tests/test_native_generalized_eigen_python_parity.py \
            tests/test_native_nonlinear_ndtha_python_parity.py \
            tests/test_native_nonlinear_static_python_parity.py \
            tests/test_native_track_point_load_python_parity.py
          cargo test --manifest-path native/Cargo.toml --locked \
            -p structural-contracts -p structural-ffi -p structural-cli

  checkpoint-restart:
    name: checkpoint-restart
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [scope-contract, native-pr-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Verify exact hash binding and mismatch rejection
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          RUNTIME_CHANGED: ${{ needs.scope-contract.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; restart lane is not applicable"
            exit 0
          fi
          if python3 scripts/check_native_capabilities.py --is-enabled checkpoint_restart; then
            :
          else
            code=$?
            if [[ "$code" -eq 3 ]]; then
              echo "Checkpoint/restart capability is not promoted; lane is not applicable"
              exit 0
            fi
            exit "$code"
          fi
          manifest=native/crates/structural-runtime/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            if [[ "$RUNTIME_CHANGED" == "true" ]]; then
              echo "$manifest is required for runtime/restart changes" >&2
              exit 1
            fi
            echo "Durable runtime not introduced; restart lane is not applicable"
            exit 0
          fi
          python3 scripts/check_native_checkpoint_restart.py
          cargo test --manifest-path native/Cargo.toml -p structural-runtime --locked checkpoint
          cargo test --manifest-path native/Cargo.toml -p structural-runtime --locked restart

  bounded-product-e2e:
    name: bounded-product-e2e
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [scope-contract, native-pr-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Run bounded CLI/API to ResultIR/ReportIR path
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          RUNTIME_CHANGED: ${{ needs.scope-contract.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; product E2E lane is not applicable"
            exit 0
          fi
          if python3 scripts/check_native_capabilities.py --is-enabled product_e2e; then
            :
          else
            code=$?
            if [[ "$code" -eq 3 ]]; then
              echo "Product E2E capability is not promoted; lane is not applicable"
              exit 0
            fi
            exit "$code"
          fi
          manifest=native/crates/structural-cli/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            if [[ "$RUNTIME_CHANGED" == "true" ]]; then
              echo "$manifest is required for product E2E changes" >&2
              exit 1
            fi
            echo "Native product CLI not introduced; E2E lane is not applicable"
            exit 0
          fi
          python3 scripts/check_native_product_e2e.py
          python3 scripts/check_native_mgt_import.py
          python3 scripts/check_native_durable_jobs.py
          python3 scripts/check_native_job_service_api.py
          python3 scripts/check_native_external_comparison.py
          python3 scripts/check_native_generalized_eigen_product.py
          python3 scripts/check_native_sparse_linear_product.py
          python3 scripts/check_native_model_ir_linear_product.py
          python3 scripts/check_native_model_ir_linear_jobs.py
          python3 scripts/check_native_model_ir_linear_workbench.py
          python3 scripts/check_native_nonlinear_static_product.py
          python3 scripts/check_native_pdf_report.py
          python3 scripts/check_native_workbench.py
          cargo test --manifest-path native/Cargo.toml -p structural-runtime \
            --test durable_job --locked
          cargo test --manifest-path native/Cargo.toml -p structural-runtime \
            --test model_ir_linear_durable_job --locked
          cargo test --manifest-path native/Cargo.toml -p structural-cli --locked
          cargo test --manifest-path native/Cargo.toml -p structural-workbench --locked

  native-merge-product:
    name: native-merge-product
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - scope-contract
      - native-pr-fast
      - build-package
      - rust-cpp-integration
      - python-oracle-parity
      - checkpoint-restart
      - bounded-product-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every declared merge-product child lane
        env:
          SCOPE_RESULT: ${{ needs.scope-contract.result }}
          PR_FAST_RESULT: ${{ needs.native-pr-fast.result }}
          PACKAGE_RESULT: ${{ needs.build-package.result }}
          INTEGRATION_RESULT: ${{ needs.rust-cpp-integration.result }}
          ORACLE_RESULT: ${{ needs.python-oracle-parity.result }}
          RESTART_RESULT: ${{ needs.checkpoint-restart.result }}
          E2E_RESULT: ${{ needs.bounded-product-e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$SCOPE_RESULT" \
            "$PR_FAST_RESULT" \
            "$PACKAGE_RESULT" \
            "$INTEGRATION_RESULT" \
            "$ORACLE_RESULT" \
            "$RESTART_RESULT" \
            "$E2E_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "required native-merge-product child result: $result" >&2
              exit 1
            fi
          done
