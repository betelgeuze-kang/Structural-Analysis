name: Native PR Fast

# Hosted CPU gate for the Rust/C++/C ABI workspace. Hardware execution and
# productization evidence are deliberately outside this workflow.

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  scope-contract:
    name: scope-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.scope.outputs.native }}
      rust: ${{ steps.scope.outputs.rust }}
      cpp: ${{ steps.scope.outputs.cpp }}
      abi: ${{ steps.scope.outputs.abi }}
      modelir: ${{ steps.scope.outputs.modelir }}
      runtime: ${{ steps.scope.outputs.runtime }}
      oracle: ${{ steps.scope.outputs.oracle }}
      ci-control: ${{ steps.scope.outputs.ci_control }}
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify native workflow shape
        run: |
          python3 scripts/check_native_ci_contract.py --fail-blocked
          python3 scripts/check_native_capabilities.py --fail-invalid

      - name: Verify exact tested ref identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EXPECTED_MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$EXPECTED_MERGE_SHA" ]]; then
            echo "checkout is not github.sha" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t parents < <(git show -s --format='%P' HEAD | tr ' ' '\n')
            if [[ "${#parents[@]}" -ne 2 ]]; then
              echo "pull-request gate requires an exact two-parent merge ref" >&2
              exit 1
            fi
            if [[ "${parents[0]}" != "$EXPECTED_BASE_SHA" ]]; then
              echo "merge-ref base parent mismatch" >&2
              exit 1
            fi
            if [[ "${parents[1]}" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "merge-ref head parent mismatch" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$actual_sha" != "${{ github.event.merge_group.head_sha }}" ]]; then
              echo "merge-group head mismatch" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          fi
          printf 'base_sha=%s\nhead_sha=%s\ntested_sha=%s\ntree_sha=%s\n' \
            "$EXPECTED_BASE_SHA" \
            "$EXPECTED_HEAD_SHA" \
            "$actual_sha" \
            "$(git rev-parse HEAD^{tree})"

      - name: Classify changed paths and protect evidence
        id: scope
        env:
          NATIVE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          NATIVE_CI_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/classify_native_ci_scope.py
          --github-output "$GITHUB_OUTPUT"
          --fail-protected-evidence

  rust-quality:
    name: rust-quality
    needs: [scope-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Run workspace fmt, clippy and unit tests
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; Rust lane is not applicable"
            exit 0
          fi
          if [[ ! -f native/Cargo.toml ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "native/Cargo.toml is required for native source changes" >&2
              exit 1
            fi
            echo "Rust workspace not introduced; lane is not applicable to this bootstrap diff"
            exit 0
          fi
          rustup component add rustfmt clippy
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path native/Cargo.toml --workspace --locked
          cargo fmt --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml -- --check
          cargo clippy \
            --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml \
            --all-targets --locked -- -D warnings
          cargo test \
            --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml \
            --locked
          cargo build \
            --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml \
            --release --locked --target-dir build/native-legacy-runtime-r4
          python3 scripts/check_structural_runtime_ffi_r4.py \
            --legacy-library build/native-legacy-runtime-r4/release/libstructural_runtime_ffi.so \
            --json --fail-blocked
          rustup toolchain install 1.77.0 --profile minimal
          cargo +1.77.0 check --manifest-path native/Cargo.toml \
            --workspace --all-targets --locked
          cargo +1.77.0 check \
            --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml \
            --all-targets --locked

  cpp-quality:
    name: cpp-quality
    needs: [scope-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Configure, build and test CPU-only C++20 targets
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; C++ lane is not applicable"
            exit 0
          fi
          if [[ ! -f native/cpp/CMakeLists.txt ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "native/cpp/CMakeLists.txt is required for native source changes" >&2
              exit 1
            fi
            echo "C++ workspace not introduced; lane is not applicable to this bootstrap diff"
            exit 0
          fi
          cmake -S native/cpp -B build/native-pr-fast -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTRUCTURAL_BUILD_TESTS=ON \
            -DSTRUCTURAL_ENABLE_HIP=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DSTRUCTURAL_WARNINGS_AS_ERRORS=ON
          cmake --build build/native-pr-fast --parallel 2
          ctest --test-dir build/native-pr-fast --output-on-failure
          python3 scripts/check_native_reference_elements.py
          python3 scripts/check_native_sparse_linear.py
          python3 scripts/check_native_generalized_eigen.py
          python3 scripts/check_native_sparse_linear_hip.py --json
          python3 scripts/check_native_generalized_eigen_hip.py --json
          python3 scripts/check_native_nonlinear_static_hip.py --json
          python3 scripts/check_native_nonlinear_ndtha_hip.py --json
          python3 scripts/check_native_full_residual_backend_hip.py --json
          python3 scripts/check_native_backend_selector.py --json --fail-blocked
          python3 scripts/check_native_replay_product_link.py \
            --binary build/native-pr-fast/bin/structural_legacy_frame_force_replay_consumer \
            --binary build/native-pr-fast/bin/structural_legacy_shell_csr_replay_consumer \
            --binary build/native-pr-fast/bin/structural_legacy_full_residual_replay_consumer \
            --binary build/native-pr-fast/bin/structural_legacy_full_residual_worker_consumer \
            --json --fail-blocked

  abi-contract:
    name: abi-contract
    needs: [scope-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Compile public header and run ABI failure-path tests
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
          ABI_CHANGED: ${{ needs.scope-contract.outputs.abi }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; ABI lane is not applicable"
            exit 0
          fi
          header=native/cpp/include/structural/abi_v1.h
          if [[ ! -f "$header" ]]; then
            if [[ "$NATIVE_CHANGED" == "true" || "$ABI_CHANGED" == "true" ]]; then
              echo "$header is required for ABI changes" >&2
              exit 1
            fi
            echo "C ABI v1 not introduced; lane is not applicable to this bootstrap diff"
            exit 0
          fi
          cmake -S native/cpp -B build/native-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTRUCTURAL_BUILD_TESTS=ON \
            -DSTRUCTURAL_ENABLE_HIP=OFF \
            -DSTRUCTURAL_WARNINGS_AS_ERRORS=ON
          cmake --build build/native-abi --target \
            structural_abi_header_c11_smoke \
            structural_abi_header_cpp20_smoke \
            structural_abi_contract_tests \
            structural_backend_selector_abi_tests \
            structural_track_point_load_abi_tests \
            structural_nonlinear_static_abi_tests \
            structural_nonlinear_ndtha_abi_tests \
            structural_reference_elements_abi_tests \
            structural_model_ir_linear_assembly_abi_tests \
            structural_sparse_linear_abi_tests \
            structural_generalized_eigen_abi_tests \
            structural_legacy_frame_force_replay_consumer \
            structural_legacy_shell_csr_replay_consumer \
            structural_legacy_full_residual_replay_consumer \
            structural_legacy_full_residual_worker_consumer
          ctest --test-dir build/native-abi --output-on-failure -L abi

  modelir-golden:
    name: modelir-golden
    needs: [scope-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Run bounded ModelIR canonical and negative fixtures
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
          MODELIR_CHANGED: ${{ needs.scope-contract.outputs.modelir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; ModelIR golden lane is not applicable"
            exit 0
          fi
          if python3 scripts/check_native_capabilities.py --is-enabled modelir_v2_rust_wire; then
            :
          else
            code=$?
            if [[ "$code" -eq 3 ]]; then
              echo "Rust ModelIR v2 wire capability is not promoted; golden lane is not applicable"
              exit 0
            fi
            exit "$code"
          fi
          manifest=native/crates/structural-contracts/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "$manifest is required for ModelIR changes" >&2
              exit 1
            fi
            echo "Native ModelIR contract not introduced; lane is not applicable"
            exit 0
          fi
          cargo test --manifest-path native/Cargo.toml -p structural-contracts --locked
          if python3 scripts/check_native_capabilities.py --is-enabled modelir_v2_cpp_core; then
            cmake -S native/cpp -B build/native-modelir -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DSTRUCTURAL_BUILD_TESTS=ON \
              -DSTRUCTURAL_ENABLE_HIP=OFF \
              -DSTRUCTURAL_WARNINGS_AS_ERRORS=ON
            cmake --build build/native-modelir --parallel 2
            ctest --test-dir build/native-modelir --output-on-failure \
              --no-tests=error -L modelir
          else
            code=$?
            if [[ "$code" -eq 3 ]]; then
              echo "C++ ModelIR semantic core is not promoted; focused CTest is not applicable"
            else
              exit "$code"
            fi
          fi
          python3 scripts/check_native_capabilities.py --is-enabled modelir_v2
          cargo test --manifest-path native/Cargo.toml --locked \
            -p structural-ffi -p structural-runtime -p structural-cli

  dependency-boundary:
    name: dependency-boundary
    needs: [scope-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Enforce native ownership and Python-free product source
        run: |
          python3 scripts/check_native_capabilities.py --json --fail-invalid
          python3 scripts/check_native_dependency_boundary.py --json --fail-blocked
          python3 scripts/check_native_deployment_cutover.py --json --fail-blocked
          python3 scripts/check_native_automation_cutover.py --json --fail-blocked
          python3 scripts/check_native_workbench_ui_transition.py --json --fail-blocked

      - name: Check locked dependency sources and SPDX policy
        run: python3 scripts/check_native_dependency_licenses.py --json --fail-blocked

      - name: Validate Cargo dependency graph when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f native/Cargo.toml ]]; then
            cargo metadata --manifest-path native/Cargo.toml --locked --no-deps > /dev/null
          else
            echo "Rust workspace not introduced; Cargo graph check is not applicable"
          fi

  windows-hosted-smoke:
    name: windows-hosted-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Build shared native candidate and run installed-layout Frame3D smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          if (-not (Test-Path -LiteralPath "native/Cargo.toml" -PathType Leaf) -or
              -not (Test-Path -LiteralPath "native/cpp/CMakeLists.txt" -PathType Leaf)) {
            throw "complete Cargo/CMake workspace required for Windows native smoke"
          }

          $cmakeBuild = Join-Path $PWD "build/native-windows-hosted"
          $candidate = Join-Path $PWD "build/native-windows-candidate"
          $rustTarget = Join-Path $PWD "build/native-windows-rust"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "native-windows-frame3d-smoke"
          cmake -S native/cpp -B $cmakeBuild -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DSTRUCTURAL_BUILD_TESTS=ON `
            -DSTRUCTURAL_BUILD_FUZZERS=OFF `
            -DSTRUCTURAL_ENABLE_HIP=OFF `
            -DSTRUCTURAL_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake configure failed" }
          cmake --build $cmakeBuild --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows C++ build failed" }
          ctest --test-dir $cmakeBuild -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows C++ tests failed" }
          cmake --install $cmakeBuild --config Release --prefix $candidate
          if ($LASTEXITCODE -ne 0) { throw "Windows candidate install failed" }

          $candidateBin = Join-Path $candidate "bin"
          $candidateLib = Join-Path $candidate "lib"
          foreach ($required in @(
            (Join-Path $candidateBin "structural_c_abi_v1.dll"),
            (Join-Path $candidateLib "structural_c_abi_v1.lib"),
            (Join-Path $candidate "include/structural/abi_v1.h"),
            (Join-Path $candidate "share/structural-native/structural-native-build.json")
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Windows candidate file is missing: $required"
            }
          }

          $env:STRUCTURAL_NATIVE_PREFIX = $candidate
          cargo build --manifest-path native/Cargo.toml --release --locked `
            --target-dir $rustTarget `
            -p structural-cli `
            -p structural-catalog `
            -p structural-evidence `
            -p structural-workbench `
            -p structural-distribution
          if ($LASTEXITCODE -ne 0) { throw "Windows Rust product build failed" }
          foreach ($executable in @(
            "structural-cli",
            "structural-catalog",
            "structural-evidence",
            "structural-workbench",
            "structural-installer"
          )) {
            Copy-Item -LiteralPath (Join-Path $rustTarget "release/$executable.exe") `
              -Destination (Join-Path $candidateBin "$executable.exe")
          }

          New-Item -ItemType Directory -Path $smokeRoot -ErrorAction Stop | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $smokeRoot "claim-boundary.txt"),
            "GitHub-hosted Windows CPU shared-library deterministic structural-distribution bundle create/verify, isolated temporary-root install/update/rollback, internal interrupted-transaction recovery injection, and bounded installed-payload Frame3D smoke only. Not a clean-machine or public installed-recovery receipt, commercial-solver validation, release eligibility, or engineering acceptance.`n",
            [Text.UTF8Encoding]::new($false)
          )
          function Invoke-CapturedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$Executable,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][string]$OutputStem
            )
            $stdoutPath = Join-Path $smokeRoot "$OutputStem.stdout.txt"
            $stderrPath = Join-Path $smokeRoot "$OutputStem.stderr.txt"
            $receiptPath = Join-Path $smokeRoot "$OutputStem.process.json"
            $exitCode = $null
            $launchError = $null
            try {
              $process = Start-Process -FilePath $Executable `
                -ArgumentList $Arguments `
                -NoNewWindow `
                -Wait `
                -PassThru `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -ErrorAction Stop
              $exitCode = $process.ExitCode
            } catch {
              $launchError = $_ | Out-String
              [IO.File]::WriteAllText(
                $stderrPath,
                $launchError,
                [Text.UTF8Encoding]::new($false)
              )
            }
            $receipt = [ordered]@{
              schema_version = "structural-native-windows-process-receipt.v1"
              executable = [IO.Path]::GetFileName($Executable)
              exit_code = $exitCode
              launch_error = $launchError
              stdout_file = [IO.Path]::GetFileName($stdoutPath)
              stderr_file = [IO.Path]::GetFileName($stderrPath)
            } | ConvertTo-Json
            [IO.File]::WriteAllText(
              $receiptPath,
              "$receipt`n",
              [Text.UTF8Encoding]::new($false)
            )
            if ($null -ne $launchError) {
              throw "Windows process launch failed; see $receiptPath"
            }
            [PSCustomObject]@{
              ExitCode = $exitCode
              StdoutPath = $stdoutPath
              StderrPath = $stderrPath
              ReceiptPath = $receiptPath
            }
          }
          $recoveryTestInvocation = Invoke-CapturedProcess `
            -Executable "cargo" `
            -Arguments @(
              "test",
              "--manifest-path", "native/Cargo.toml",
              "--release",
              "--locked",
              "-p", "structural-distribution",
              "--lib",
              "every_durable_install_boundary_recovers",
              "--", "--nocapture"
            ) `
            -OutputStem "distribution-recovery-unit-test"
          if ($recoveryTestInvocation.ExitCode -ne 0) {
            throw "Windows interrupted-transaction recovery unit test failed with exit code $($recoveryTestInvocation.ExitCode); see $($recoveryTestInvocation.ReceiptPath)"
          }
          $workspaceManifest = Get-Content -LiteralPath "native/Cargo.toml" -Raw
          $versionMatch = [regex]::Match(
            $workspaceManifest,
            '(?m)^version\s*=\s*"([^"]+)"'
          )
          if (-not $versionMatch.Success) {
            throw "Windows distribution package version could not be resolved"
          }
          $packageVersion = $versionMatch.Groups[1].Value
          $sourceArchive = Join-Path $env:RUNNER_TEMP "native-windows-source.tar"
          git -c "filter.lfs.process=" `
            -c "filter.lfs.smudge=" `
            -c "filter.lfs.required=false" `
            archive --format=tar --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Windows source archive identity failed" }
          $sourceSha256 = "sha256:" + (Get-FileHash -LiteralPath $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Remove-Item -LiteralPath $sourceArchive -Force
          $bundle = Join-Path $smokeRoot "distribution-bundle"
          $installer = Join-Path $candidateBin "structural-installer.exe"
          $releaseId = "windows-cpu-shared-$packageVersion-$($env:GITHUB_SHA.Substring(0, 12))"
          $bundleCreateInvocation = Invoke-CapturedProcess `
            -Executable $installer `
            -Arguments @(
              "bundle-create",
              "--payload", $candidate,
              "--output", $bundle,
              "--release-id", $releaseId,
              "--package-version", $packageVersion,
              "--backend", "cpu-only",
              "--linkage", "shared",
              "--source-sha256", $sourceSha256
            ) `
            -OutputStem "distribution-bundle-create"
          if ($bundleCreateInvocation.ExitCode -ne 0) {
            throw "Windows distribution bundle creation failed with exit code $($bundleCreateInvocation.ExitCode); see $($bundleCreateInvocation.ReceiptPath)"
          }
          $bundleCreate = Get-Content -LiteralPath $bundleCreateInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($bundleCreate.schema_version -ne "structural-installer-result.v1" -or
              $bundleCreate.action -ne "bundle_create" -or
              $bundleCreate.result.schema_version -ne "structural-distribution.v1") {
            throw "Windows distribution bundle creation receipt mismatch"
          }
          $bundleVerifyInvocation = Invoke-CapturedProcess `
            -Executable $installer `
            -Arguments @("bundle-verify", "--bundle", $bundle) `
            -OutputStem "distribution-bundle-verify"
          if ($bundleVerifyInvocation.ExitCode -ne 0) {
            throw "Windows distribution bundle verification failed with exit code $($bundleVerifyInvocation.ExitCode); see $($bundleVerifyInvocation.ReceiptPath)"
          }
          $bundleVerify = Get-Content -LiteralPath $bundleVerifyInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($bundleVerify.schema_version -ne "structural-installer-result.v1" -or
              $bundleVerify.action -ne "bundle_verify" -or
              $bundleVerify.result.manifest_hash -ne $bundleCreate.result.manifest_hash) {
            throw "Windows distribution bundle verification identity mismatch"
          }
          $bundleReceipt = [ordered]@{
            schema_version = "structural-native-windows-distribution-bundle-receipt.v1"
            authority = "github_hosted_windows_cpu_c5"
            claim_boundary = "Deterministic Windows x64 CPU shared bundle create/verify only; install-root lifecycle and installed-payload smoke are recorded separately, with no clean-machine, validation, release, or engineering authority."
            release_id = $releaseId
            source_sha256 = $sourceSha256
            manifest_hash = $bundleCreate.result.manifest_hash
            file_count = $bundleCreate.result.files.Count
            backend_profile = $bundleCreate.result.backend_profile
            linkage = $bundleCreate.result.linkage
            bundle_create_exit_code = $bundleCreateInvocation.ExitCode
            bundle_verify_exit_code = $bundleVerifyInvocation.ExitCode
            clean_machine_installer_lifecycle_exercised = $false
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $smokeRoot "distribution-bundle-receipt.json"),
            "$bundleReceipt`n",
            [Text.UTF8Encoding]::new($false)
          )
          $updateBundle = Join-Path $env:RUNNER_TEMP "native-windows-update-bundle"
          $updateReleaseId = "$releaseId-update"
          $updateBundleCreateInvocation = Invoke-CapturedProcess `
            -Executable (Join-Path $bundle "payload/bin/structural-installer.exe") `
            -Arguments @(
              "bundle-create",
              "--payload", $candidate,
              "--output", $updateBundle,
              "--release-id", $updateReleaseId,
              "--package-version", $packageVersion,
              "--backend", "cpu-only",
              "--linkage", "shared",
              "--source-sha256", $sourceSha256
            ) `
            -OutputStem "distribution-update-bundle-create"
          if ($updateBundleCreateInvocation.ExitCode -ne 0) {
            throw "Windows update bundle creation failed with exit code $($updateBundleCreateInvocation.ExitCode); see $($updateBundleCreateInvocation.ReceiptPath)"
          }
          $updateBundleCreate = Get-Content -LiteralPath $updateBundleCreateInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($updateBundleCreate.schema_version -ne "structural-installer-result.v1" -or
              $updateBundleCreate.action -ne "bundle_create" -or
              $updateBundleCreate.result.release_id -ne $updateReleaseId -or
              $updateBundleCreate.result.manifest_hash -eq $bundleCreate.result.manifest_hash) {
            throw "Windows update bundle creation identity mismatch"
          }
          Copy-Item -LiteralPath (Join-Path $updateBundle "structural-distribution.json") `
            -Destination (Join-Path $smokeRoot "distribution-update-manifest.json")

          $installRoot = Join-Path $env:RUNNER_TEMP "native-windows-install-root"
          $bundledInstaller = Join-Path $bundle "payload/bin/structural-installer.exe"
          $installInvocation = Invoke-CapturedProcess `
            -Executable $bundledInstaller `
            -Arguments @("install", "--bundle", $bundle, "--root", $installRoot) `
            -OutputStem "distribution-install"
          if ($installInvocation.ExitCode -ne 0) {
            throw "Windows distribution install failed with exit code $($installInvocation.ExitCode); see $($installInvocation.ReceiptPath)"
          }
          $installResult = Get-Content -LiteralPath $installInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($installResult.schema_version -ne "structural-installer-result.v1" -or
              $installResult.action -ne "install" -or
              $installResult.result.generation -ne 1 -or
              $installResult.result.current_release -ne $releaseId -or
              $null -ne $installResult.result.previous_release) {
            throw "Windows distribution install activation mismatch"
          }

          $installedBase = Join-Path $installRoot "releases/$releaseId/payload"
          $installedBaseInstaller = Join-Path $installedBase "bin/structural-installer.exe"
          $updateInvocation = Invoke-CapturedProcess `
            -Executable $installedBaseInstaller `
            -Arguments @("update", "--bundle", $updateBundle, "--root", $installRoot) `
            -OutputStem "distribution-update"
          if ($updateInvocation.ExitCode -ne 0) {
            throw "Windows distribution update failed with exit code $($updateInvocation.ExitCode); see $($updateInvocation.ReceiptPath)"
          }
          $updateResult = Get-Content -LiteralPath $updateInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($updateResult.schema_version -ne "structural-installer-result.v1" -or
              $updateResult.action -ne "update" -or
              $updateResult.result.generation -ne 2 -or
              $updateResult.result.current_release -ne $updateReleaseId -or
              $updateResult.result.previous_release -ne $releaseId) {
            throw "Windows distribution update activation mismatch"
          }

          $installedUpdateInstaller = Join-Path $installRoot "releases/$updateReleaseId/payload/bin/structural-installer.exe"
          $rollbackInvocation = Invoke-CapturedProcess `
            -Executable $installedUpdateInstaller `
            -Arguments @("rollback", "--root", $installRoot) `
            -OutputStem "distribution-rollback"
          if ($rollbackInvocation.ExitCode -ne 0) {
            throw "Windows distribution rollback failed with exit code $($rollbackInvocation.ExitCode); see $($rollbackInvocation.ReceiptPath)"
          }
          $rollbackResult = Get-Content -LiteralPath $rollbackInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($rollbackResult.schema_version -ne "structural-installer-result.v1" -or
              $rollbackResult.action -ne "rollback" -or
              $rollbackResult.result.generation -ne 3 -or
              $rollbackResult.result.current_release -ne $releaseId -or
              $rollbackResult.result.previous_release -ne $updateReleaseId) {
            throw "Windows distribution rollback activation mismatch"
          }

          $statusInvocation = Invoke-CapturedProcess `
            -Executable $installedBaseInstaller `
            -Arguments @("status", "--root", $installRoot) `
            -OutputStem "distribution-status-after-rollback"
          if ($statusInvocation.ExitCode -ne 0) {
            throw "Windows distribution status failed with exit code $($statusInvocation.ExitCode); see $($statusInvocation.ReceiptPath)"
          }
          $statusResult = Get-Content -LiteralPath $statusInvocation.StdoutPath -Raw |
            ConvertFrom-Json
          if ($statusResult.schema_version -ne "structural-installer-result.v1" -or
              $statusResult.action -ne "status" -or
              $statusResult.result.activation.generation -ne 3 -or
              $statusResult.result.activation.current_release -ne $releaseId -or
              $statusResult.result.activation.current_manifest_hash -ne $bundleCreate.result.manifest_hash) {
            throw "Windows distribution status after rollback mismatch"
          }
          $workspace = Join-Path $smokeRoot "workspace"
          $html = Join-Path $smokeRoot "html-report"
          $model = Join-Path $PWD "tests/fixtures/model_ir_v2/frame_cantilever_all_modes.json"
          $request = Join-Path $PWD "native/tests/fixtures/model_ir_linear/frame_cantilever_weak_request.json"
          $external = Join-Path $PWD "native/tests/fixtures/model_ir_linear/frame_cantilever_external_v1.json"
          $oracle = Join-Path $PWD "native/tests/fixtures/model_ir_linear/frame_cantilever_language_neutral_oracle_v1.txt"
          $workbench = Join-Path $installedBase "bin/structural-workbench.exe"

          $workflowInvocation = Invoke-CapturedProcess `
            -Executable $workbench `
            -Arguments @(
              "workflow-model-linear", $model, $request,
              "--external-result", $external,
              "--source-artifact", $oracle,
              "--workspace", $workspace,
              "--step-budget", "1"
            ) `
            -OutputStem "workflow-model-linear"
          if ($workflowInvocation.ExitCode -ne 0) {
            throw "Windows installed-layout Frame3D workflow failed with exit code $($workflowInvocation.ExitCode); see $($workflowInvocation.ReceiptPath)"
          }
          $workflowOutput = Get-Content -LiteralPath $workflowInvocation.StdoutPath -Raw
          $workflow = $workflowOutput | ConvertFrom-Json
          if ($workflow.stage -ne "reported") {
            throw "Windows Frame3D workflow did not reach the reported stage"
          }
          [IO.File]::WriteAllText(
            (Join-Path $smokeRoot "workflow.json"),
            $workflowOutput,
            [Text.UTF8Encoding]::new($false)
          )

          $recoveryInvocation = Invoke-CapturedProcess `
            -Executable $workbench `
            -Arguments @(
              "element-recovery-view",
              "--workspace", $workspace,
              "--locale", "en-US"
            ) `
            -OutputStem "element-recovery-view"
          if ($recoveryInvocation.ExitCode -ne 0) {
            throw "Windows element recovery view failed with exit code $($recoveryInvocation.ExitCode); see $($recoveryInvocation.ReceiptPath)"
          }
          $recoveryOutput = Get-Content -LiteralPath $recoveryInvocation.StdoutPath -Raw
          $recoveryLines = $recoveryOutput -split '\r?\n'
          if ($recoveryLines -notcontains "Schema: structural-native-workbench-model-ir-linear-element-recovery-view.v1") {
            throw "Windows element recovery view schema mismatch"
          }
          if (-not ($recoveryLines | Where-Object { $_ -match '^View hash: sha256:[0-9a-f]{64}$' })) {
            throw "Windows element recovery view hash is missing or malformed"
          }
          [IO.File]::WriteAllText(
            (Join-Path $smokeRoot "element-recovery-view.txt"),
            $recoveryOutput,
            [Text.UTF8Encoding]::new($false)
          )

          $htmlInvocation = Invoke-CapturedProcess `
            -Executable $workbench `
            -Arguments @(
              "report-export-html",
              "--workspace", $workspace,
              "--output-dir", $html,
              "--locale", "en-US"
            ) `
            -OutputStem "report-export-html"
          if ($htmlInvocation.ExitCode -ne 0) {
            throw "Windows standalone HTML export failed with exit code $($htmlInvocation.ExitCode); see $($htmlInvocation.ReceiptPath)"
          }
          $htmlOutput = Get-Content -LiteralPath $htmlInvocation.StdoutPath -Raw
          $htmlReceipt = Get-Content -LiteralPath (Join-Path $html "html-receipt.json") `
            -Raw | ConvertFrom-Json
          if ($htmlReceipt.schema_version -ne "structural-native-workbench-model-ir-linear-html-report-receipt.v1") {
            throw "Windows HTML receipt schema mismatch"
          }
          $lifecycleReceipt = [ordered]@{
            schema_version = "structural-native-windows-install-lifecycle-receipt.v1"
            authority = "github_hosted_windows_cpu_c5"
            claim_boundary = "Deterministic Windows x64 CPU shared bundle install, update, rollback, final status, and installed-payload Frame3D smoke in one isolated hosted temporary root, plus internal interruption injection at prepared/materialized/activated boundaries; no clean-machine, public installed-recovery, validation, release, or engineering authority."
            base_release_id = $releaseId
            update_release_id = $updateReleaseId
            base_manifest_hash = $bundleCreate.result.manifest_hash
            update_manifest_hash = $updateBundleCreate.result.manifest_hash
            install_generation = $installResult.result.generation
            update_generation = $updateResult.result.generation
            rollback_generation = $rollbackResult.result.generation
            final_current_release = $statusResult.result.activation.current_release
            install_exit_code = $installInvocation.ExitCode
            update_exit_code = $updateInvocation.ExitCode
            rollback_exit_code = $rollbackInvocation.ExitCode
            status_exit_code = $statusInvocation.ExitCode
            recovery_unit_test_exit_code = $recoveryTestInvocation.ExitCode
            installed_payload_frame3d_smoke_exercised = $true
            clean_machine_exercised = $false
            interrupted_transaction_recovery_exercised = $false
            interrupted_transaction_recovery_unit_test_exercised = $true
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $smokeRoot "distribution-install-lifecycle-receipt.json"),
            "$lifecycleReceipt`n",
            [Text.UTF8Encoding]::new($false)
          )
          foreach ($required in @(
            (Join-Path $workspace "04-resume/result-ir.json"),
            (Join-Path $workspace "04-resume/result-recovery-ir.json"),
            (Join-Path $workspace "04-resume/reaction-result-ir.json"),
            (Join-Path $workspace "05-compare/external-comparison-ir.json"),
            (Join-Path $workspace "06-report/report.pdf"),
            (Join-Path $html "report.html"),
            (Join-Path $html "html-receipt.json"),
            (Join-Path $bundle "structural-distribution.json"),
            (Join-Path $smokeRoot "distribution-bundle-receipt.json"),
            (Join-Path $smokeRoot "distribution-update-manifest.json"),
            (Join-Path $smokeRoot "distribution-install-lifecycle-receipt.json"),
            (Join-Path $smokeRoot "distribution-recovery-unit-test.process.json")
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Windows Frame3D smoke artifact is missing: $required"
            }
          }

      - name: Upload bounded Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-frame3d-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/native-windows-frame3d-smoke
          if-no-files-found: warn
          retention-days: 14

  native-pr-fast:
    name: native-pr-fast
    if: always()
    needs:
      - scope-contract
      - rust-quality
      - cpp-quality
      - abi-contract
      - modelir-golden
      - dependency-boundary
      - windows-hosted-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every declared child lane
        env:
          SCOPE_RESULT: ${{ needs.scope-contract.result }}
          RUST_RESULT: ${{ needs.rust-quality.result }}
          CPP_RESULT: ${{ needs.cpp-quality.result }}
          ABI_RESULT: ${{ needs.abi-contract.result }}
          MODELIR_RESULT: ${{ needs.modelir-golden.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-boundary.result }}
          WINDOWS_RESULT: ${{ needs.windows-hosted-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$SCOPE_RESULT" \
            "$RUST_RESULT" \
            "$CPP_RESULT" \
            "$ABI_RESULT" \
            "$MODELIR_RESULT" \
            "$DEPENDENCY_RESULT" \
            "$WINDOWS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "required native-pr-fast child result: $result" >&2
              exit 1
            fi
          done

  build-package:
    name: build-package
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [scope-contract, native-pr-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Build clean Rust and static/shared C++ packages
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; package lane is not applicable"
            exit 0
          fi
          if [[ ! -f native/Cargo.toml || ! -f native/cpp/CMakeLists.txt ]]; then
            if [[ "$NATIVE_CHANGED" == "true" ]]; then
              echo "complete Cargo/CMake workspace required for native package changes" >&2
              exit 1
            fi
            echo "Native workspace not introduced; package lane is not applicable"
            exit 0
          fi
          cargo build --manifest-path native/Cargo.toml --workspace --release --locked
          cargo build \
            --manifest-path implementation/phase1/structural_runtime_ffi/Cargo.toml \
            --release --locked --target-dir build/native-legacy-runtime-r4
          for linkage in static shared; do
            if [[ "$linkage" == "shared" ]]; then
              build_shared=ON
            else
              build_shared=OFF
            fi
            cmake -S native/cpp -B "build/native-package-$linkage" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS="$build_shared" \
              -DSTRUCTURAL_BUILD_TESTS=ON \
              -DSTRUCTURAL_ENABLE_HIP=OFF \
              -DSTRUCTURAL_WARNINGS_AS_ERRORS=ON
            cmake --build "build/native-package-$linkage" --parallel 2
            ctest --test-dir "build/native-package-$linkage" --output-on-failure -L link
            install_prefix="$PWD/build/native-package-install-$linkage"
            cmake --install "build/native-package-$linkage" --prefix "$install_prefix"
          python3 - "$install_prefix/share/structural-native/structural-native-build.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["abi_version"] == "0x0001000f"
          assert payload["hip_enabled"] is False
          assert payload["cxx_compiler"]["id"]
          PY
            if [[ "$linkage" == "shared" ]]; then
              shared_library="$install_prefix/lib/libstructural_c_abi_v1.so"
              mapfile -t exported_symbols < <(
                nm -D --defined-only "$shared_library" | awk '{ print $3 }'
              )
              if [[ "${exported_symbols[*]}" != "sa_get_api_v1" ]]; then
                echo "unexpected public ABI symbols: ${exported_symbols[*]}" >&2
                exit 1
              fi
              if ldd "$shared_library" | grep -Eiq 'hip|hsa|rocm'; then
                echo "CPU-only package links a ROCm/HIP runtime" >&2
                exit 1
              fi
              python3 scripts/check_structural_runtime_ffi_r4.py \
                --legacy-library build/native-legacy-runtime-r4/release/libstructural_runtime_ffi.so \
                --product-library "$shared_library" \
                --json --fail-blocked
              python3 scripts/check_native_backend_selector.py \
                --product-library "$shared_library" \
                --adapter-library native/target/release/libmgt_hip_full_residual_rust_ffi.so \
                --json --fail-blocked
            fi
            cmake \
              -S native/cpp/tests/package_consumer \
              -B "build/native-package-consumer-$linkage" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$install_prefix"
            cmake --build "build/native-package-consumer-$linkage" --parallel 2
            "build/native-package-consumer-$linkage/structural_native_package_consumer"
          done

      - name: Exercise install update rollback and clean-machine native E2E
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; distribution lane is not applicable"
            exit 0
          fi
          mkdir -p build/native-distribution
          package_version="$(awk '$1 == "version" && $2 == "=" {gsub(/\"/, "", $3); print $3; exit}' native/Cargo.toml)"
          source_sha256="sha256:$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          for linkage in static shared; do
            release_id="cpu-$linkage-$package_version-${GITHUB_SHA:0:12}"
            bundle="build/native-distribution/$release_id"
            receipt="build/native-distribution/$release_id-e2e.json"
            backend_receipt="build/native-distribution/$release_id-backend.json"
            scripts/build_native_distribution.sh \
              --backend cpu-only \
              --linkage "$linkage" \
              --release-id "$release_id" \
              --source-sha256 "$source_sha256" \
              --output "$bundle"
            scripts/run_native_distribution_e2e.sh \
              --bundle "$bundle" \
              --release-id "$release_id" \
              --package-version "$package_version" \
              --backend cpu-only \
              --linkage "$linkage" \
              --source-sha256 "$source_sha256" \
              --installed-backend-receipt "$backend_receipt" \
              --receipt "$receipt"
            python3 scripts/check_native_distribution_receipt.py \
              --receipt "$receipt" \
              --manifest "$bundle/structural-distribution.json" \
              --installed-backend-receipt "$backend_receipt" \
              --require-backend cpu_only \
              --require-authority \
              --json
          done

  rust-cpp-integration:
    name: rust-cpp-integration
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: [scope-contract, native-pr-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested ref without LFS
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Verify safe wrapper ownership and exception conversion
        env:
          NATIVE_APPLICABLE: ${{ needs.scope-contract.outputs.applicable }}
          NATIVE_CHANGED: ${{ needs.scope-contract.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_APPLICABLE" != "true" ]]; then
            echo "Native scope unchanged; Rust/C++ integration lane is not applicable"
