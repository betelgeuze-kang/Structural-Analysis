name: IFC Import Health Current Source

# Same-operator technical import-health execution only. Raw IFC inputs remain
# ignored and are never handed to the fresh privileged verifier.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EVIDENCE_DIR: .ci/ifc-import-health-current-source
  ACQUISITION_RECEIPT: .ci/ifc-import-health-current-source/acquisition-receipt.json
  TECHNICAL_RECEIPT: .ci/ifc-import-health-current-source/technical-receipt.json
  RECEIPT_SCHEMA: canonical/ifc-import-health-current-source-technical-receipt.v1.schema.json
  SOURCE_MANIFEST: benchmarks/import_health/buildingsmart_ifc_current_source.v1.json
  SOURCE_MANIFEST_SCHEMA: canonical/buildingsmart-ifc-current-source-manifest.v1.schema.json
  HANDOFF_ROOT: .ci/ifc-import-health-current-source-handoff

concurrency:
  group: ifc-import-health-current-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce:
    name: produce-unprivileged
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: none
      id-token: none
      attestations: none
      artifact-metadata: none
    env:
      GH_TOKEN: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Checkout exact current-main source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install product and contract tools
        run: python -m pip install -e .[dev]

      - name: Verify exact checkout identity
        run: |
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Acquire and reverify immutable IFC and license bytes
        run: |
          python scripts/acquire_buildingsmart_ifc_current_source.py \
            --source-commit-sha "$SOURCE_SHA" \
            --receipt-out "$ACQUISITION_RECEIPT"
          python scripts/acquire_buildingsmart_ifc_current_source.py \
            --source-commit-sha "$SOURCE_SHA" \
            --receipt-out "$ACQUISITION_RECEIPT" \
            --check

      - name: Execute ten-case import-health and silent-loss contracts
        run: |
          python scripts/build_phase3_buildingsmart_ifc_acquisition_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_buildingsmart_dirty_ifc_acquisition_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_ifc_import_health_execution_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_ifc_source_license_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase6_silent_import_loss_status.py

      - name: Build and verify source-bound technical receipt
        run: |
          python scripts/build_ifc_import_health_current_source_receipt.py \
            --source-commit-sha "$SOURCE_SHA" \
            --acquisition "$ACQUISITION_RECEIPT" \
            --out "$TECHNICAL_RECEIPT" \
            --fail-technical-blocked
          python scripts/build_ifc_import_health_current_source_receipt.py \
            --source-commit-sha "$SOURCE_SHA" \
            --acquisition "$ACQUISITION_RECEIPT" \
            --out "$TECHNICAL_RECEIPT" \
            --check
          python scripts/build_ifc_import_health_current_source_receipt.py \
            --source-commit-sha "$SOURCE_SHA" \
            --out "$TECHNICAL_RECEIPT" \
            --check-support-bundle
          test -z "$(find "$EVIDENCE_DIR" -type f ! -name '*.json' -print -quit)"
          test -z "$(find "$EVIDENCE_DIR" -type l -print -quit)"

      - name: Build exact JSON-only handoff and final seal
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HANDOFF_ROOT"
          mkdir -p "$HANDOFF_ROOT/.ci"
          cp -R "$EVIDENCE_DIR" "$HANDOFF_ROOT/.ci/"
          for path in "$RECEIPT_SCHEMA" "$SOURCE_MANIFEST" "$SOURCE_MANIFEST_SCHEMA"; do
            mkdir -p "$HANDOFF_ROOT/$(dirname "$path")"
            cp "$path" "$HANDOFF_ROOT/$path"
          done
          python -I - "$HANDOFF_ROOT" ifc \
            "$SOURCE_SHA" "$WORKFLOW_SHA" \
            .github/workflows/ifc-import-health-current-source.yml \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, stat, sys
          from pathlib import Path
          root, lane, source, workflow_sha, workflow, run_id, attempt = sys.argv[1:]
          root = Path(root)
          files = {}
          for path in sorted(root.rglob("*")):
              mode = os.lstat(path).st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit("handoff_symlink_forbidden")
              if stat.S_ISREG(mode):
                  relative = path.relative_to(root).as_posix()
                  if path.suffix != ".json":
                      raise SystemExit("handoff_non_json_forbidden")
                  files[relative] = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          seal = {
              "artifact_files": files,
              "lane": lane,
              "run_attempt": int(attempt),
              "run_id": int(run_id),
              "schema_version": "technical-evidence-handoff-seal.v1",
              "source_sha": source,
              "source_workflow_path": workflow,
              "source_workflow_sha": workflow_sha,
          }
          (root / "handoff-seal.json").write_text(
              json.dumps(seal, allow_nan=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          artifact_name="ifc-technical-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SOURCE_SHA"
          printf 'artifact-name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload unprivileged sealed handoff without raw IFC
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ env.HANDOFF_ROOT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  attest:
    name: attest-fresh-hosted-no-repository-code
    if: github.ref == 'refs/heads/main'
    needs: produce
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/_technical-evidence-attest.yml
    with:
      lane: ifc
      source-sha: ${{ github.sha }}
      source-workflow-sha: ${{ github.workflow_sha }}
      source-workflow-path: .github/workflows/ifc-import-health-current-source.yml
      artifact-id: ${{ needs.produce.outputs.artifact-id }}
      artifact-digest: ${{ needs.produce.outputs.artifact-digest }}
      artifact-name: ${{ needs.produce.outputs.artifact-name }}
      receipt-path: .ci/ifc-import-health-current-source/technical-receipt.json
