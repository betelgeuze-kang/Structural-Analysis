name: IFC Import Health Current Source

# Same-operator technical import-health execution only. The exact IFC inputs are
# downloaded into ignored private_corpus storage and are never uploaded. A pass
# does not grant product/legal, redistribution, solver-geometry, independent V&V,
# quantity-credit, or release authority.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: "${{ github.sha }}"
  EVIDENCE_DIR: ".ci/ifc-import-health-current-source"
  ACQUISITION_RECEIPT: ".ci/ifc-import-health-current-source/acquisition-receipt.json"
  TECHNICAL_RECEIPT: ".ci/ifc-import-health-current-source/technical-receipt.json"
  ATTESTATION_BUNDLE: ".ci/ifc-import-health-current-source/technical-receipt.sigstore.json"
  ATTESTATION_VERIFICATION: ".ci/ifc-import-health-current-source/technical-receipt.attestation-verification.json"
  GH_TOKEN: "${{ github.token }}"

concurrency:
  group: ifc-import-health-current-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-and-attest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact current-main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install product and contract tools
        run: python -m pip install -e .[dev]

      - name: Acquire immutable IFC and upstream license bytes
        run: >-
          python scripts/acquire_buildingsmart_ifc_current_source.py
          --source-commit-sha "$SOURCE_SHA"
          --receipt-out "$ACQUISITION_RECEIPT"

      - name: Verify immutable private-corpus inputs without network mutation
        run: >-
          python scripts/acquire_buildingsmart_ifc_current_source.py
          --source-commit-sha "$SOURCE_SHA"
          --receipt-out "$ACQUISITION_RECEIPT"
          --check

      - name: Execute existing ten-case import-health and silent-loss contracts
        run: |
          python scripts/build_phase3_buildingsmart_ifc_acquisition_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_buildingsmart_dirty_ifc_acquisition_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_ifc_import_health_execution_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase3_ifc_source_license_receipt.py \
            --source-commit-sha "$SOURCE_SHA"
          python scripts/build_phase6_silent_import_loss_status.py

      - name: Build fail-closed source-bound technical receipt
        run: >-
          python scripts/build_ifc_import_health_current_source_receipt.py
          --source-commit-sha "$SOURCE_SHA"
          --acquisition "$ACQUISITION_RECEIPT"
          --out "$TECHNICAL_RECEIPT"
          --fail-technical-blocked

      - name: Verify receipt and non-authority boundary
        run: |
          python scripts/build_ifc_import_health_current_source_receipt.py \
            --source-commit-sha "$SOURCE_SHA" \
            --acquisition "$ACQUISITION_RECEIPT" \
            --out "$TECHNICAL_RECEIPT" \
            --check
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["TECHNICAL_RECEIPT"]).read_text())
          if payload.get("source_commit_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("ifc_import_health_source_sha_mismatch")
          if payload.get("technical_contract_pass") is not True:
              raise SystemExit("ifc_import_health_technical_contract_blocked")
          claims = payload.get("claims", {})
          required_false = {
              "solver_ready_geometry_or_topology",
              "independent_reproduction",
              "product_legal_approval",
              "redistribution_authority",
              "commercial_use_authority",
              "phase3_quantity_credit",
              "release_authority",
          }
          if any(claims.get(key) is not False for key in required_false):
              raise SystemExit("ifc_import_health_authority_boundary_invalid")
          if payload.get("raw_ifc_files_uploaded") is not False:
              raise SystemExit("ifc_import_health_raw_upload_boundary_invalid")
          print("IFC import-health current-source technical boundary: pass")
          PY
          if find "$EVIDENCE_DIR" -type f ! -name '*.json' -print -quit | grep -q .; then
            echo "IFC import-health evidence directory contains a non-JSON raw input" >&2
            exit 1
          fi

      - name: Attest technical receipt provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: ${{ env.TECHNICAL_RECEIPT }}

      - name: Retain and verify exact provenance bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$ATTESTATION_BUNDLE"
          gh attestation verify "$TECHNICAL_RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ifc-import-health-current-source.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION"

      - name: Upload receipts without raw IFC inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ifc-import-health-current-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
