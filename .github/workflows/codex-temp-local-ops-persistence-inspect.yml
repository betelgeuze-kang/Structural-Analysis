name: Codex Temp Local Ops Persistence Inspect

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - ".github/workflows/codex-temp-local-ops-persistence-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Capture local ops persistence handler context
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/structure-viewer/index.html')
          output = Path('/tmp/viewer-local-ops-persistence-context.txt')
          lines = source.read_text(encoding='utf-8').splitlines()
          patterns = (
              'function readLocalOpsState',
              'function writeLocalOpsState',
              'function attachEvidenceIngestPreview',
              'lastIngestRenderablePayload',
              'renderable_payload',
              'readRuntimeIngestRenderablePayload',
              'writeRuntimeIngestRenderablePayload',
          )
          chunks = []
          seen = set()
          for pattern in patterns:
              matches = [index for index, line in enumerate(lines) if pattern in line]
              chunks.append(f'=== PATTERN {pattern!r} matches={len(matches)} ===')
              for index in matches[:30]:
                  begin = max(0, index - 25)
                  end = min(len(lines), index + 50)
                  key = (begin, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  chunks.append(f'--- lines {begin + 1}-{end} ---')
                  chunks.extend(
                      f'{line_number + 1:06d}: {lines[line_number]}'
                      for line_number in range(begin, end)
                  )
          output.write_text('\n'.join(chunks) + '\n', encoding='utf-8')
          print(f'captured {len(chunks)} lines to {output}')
          PY
      - name: Upload persistence context
        uses: actions/upload-artifact@v7
        with:
          name: viewer-local-ops-persistence-context-${{ github.run_id }}
          path: /tmp/viewer-local-ops-persistence-context.txt
          if-no-files-found: error
          retention-days: 1
