name: OpenSees CalculiX Clean Runner Attestor

on:
  workflow_call:
    inputs:
      producer-artifact-id: {required: true, type: string}
      producer-artifact-digest: {required: true, type: string}
      source-sha: {required: true, type: string}
      candidate-artifact-name: {required: true, type: string}
      final-artifact-name: {required: true, type: string}

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      PRODUCER_ARTIFACT_ID: ${{ inputs.producer-artifact-id }}
      PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer-artifact-digest }}
      CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate-artifact-name }}
      FINAL_ARTIFACT_NAME: ${{ inputs.final-artifact-name }}
    steps:
      - name: Fetch exact run jobs and immutable artifact
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/clean-attestor"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/clean-attestor/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/clean-attestor/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID" > "$RUNNER_TEMP/clean-attestor/artifact.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/clean-attestor/candidate.zip"

      - name: Independently validate and seal candidate
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/clean-attestor" "$PWD/candidate" <<'PY'
          import hashlib, json, math, os, re, stat, sys, unicodedata, zipfile
          from pathlib import Path, PurePosixPath
          inputs, output = map(Path, sys.argv[1:])
          def fail(code): raise SystemExit(code)
          def pairs(rows):
              value = {}
              for key, item in rows:
                  if key in value: fail("duplicate_json_key")
                  value[key] = item
              return value
          def number(token):
              value = float(token)
              if not math.isfinite(value): fail("non_finite_json_number")
              return value
          def load(path):
              try:
                  return json.loads(path.read_bytes().decode("utf-8"), object_pairs_hook=pairs,
                                    parse_float=number, parse_constant=lambda _x: fail("non_finite_json_number"))
              except (OSError, UnicodeError, json.JSONDecodeError): fail("strict_json_invalid")
          def digest_bytes(raw): return "sha256:" + hashlib.sha256(raw).hexdigest()
          def digest(path): return digest_bytes(path.read_bytes())
          run, jobs, artifact = (load(inputs / name) for name in ("run.json", "jobs.json", "artifact.json"))
          source = os.environ["SOURCE_SHA"]; repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"]); attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if (run.get("id") != run_id or run.get("run_attempt") != attempt or run.get("head_sha") != source or
              run.get("head_branch") != "main" or run.get("event") not in {"push", "workflow_dispatch"} or
              run.get("path") != ".github/workflows/opensees-calculix-current-source.yml" or
              run.get("repository", {}).get("full_name") != repository or
              run.get("head_repository", {}).get("full_name") != repository): fail("workflow_run_identity_invalid")
          job_rows = jobs.get("jobs")
          if not isinstance(job_rows, list) or len(job_rows) < 2: fail("workflow_job_inventory_invalid")
          for row in job_rows:
              labels = row.get("labels")
              if (not isinstance(labels, list) or "self-hosted" in labels or
                  not any(label in {"ubuntu-22.04", "ubuntu-24.04", "ubuntu-latest"} for label in labels) or
                  row.get("run_attempt") != attempt): fail("workflow_job_runner_invalid")
          artifact_id = int(os.environ["PRODUCER_ARTIFACT_ID"])
          artifact_digest = os.environ["PRODUCER_ARTIFACT_DIGEST"]
          expected_url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}/zip"
          workflow_run = artifact.get("workflow_run", {})
          if (not re.fullmatch(r"[0-9a-f]{64}", artifact_digest) or artifact.get("id") != artifact_id or
              artifact.get("name") != os.environ["CANDIDATE_ARTIFACT_NAME"] or
              artifact.get("digest") != "sha256:" + artifact_digest or artifact.get("expired") is not False or
              type(artifact.get("size_in_bytes")) is not int or artifact.get("size_in_bytes", 0) < 1 or
              artifact.get("archive_download_url") != expected_url or workflow_run.get("id") != run_id or
              workflow_run.get("head_sha") != source or workflow_run.get("head_branch") != "main"):
              fail("producer_artifact_metadata_invalid")
          archive_raw = (inputs / "candidate.zip").read_bytes()
          if hashlib.sha256(archive_raw).hexdigest() != artifact_digest or len(archive_raw) != artifact["size_in_bytes"]:
              fail("producer_artifact_archive_invalid")
          if output.exists(): fail("candidate_destination_not_fresh")
          output.mkdir()
          with zipfile.ZipFile(inputs / "candidate.zip") as archive:
              infos = archive.infolist()
              if not infos or len(infos) > 100 or sum(row.file_size for row in infos) > 67108864:
                  fail("producer_artifact_archive_limits_invalid")
              names = set()
              for info in infos:
                  name = info.filename
                  if (not name or "\\" in name or unicodedata.normalize("NFC", name) != name or
                      any(unicodedata.category(ch) in {"Cc", "Cf"} for ch in name) or name in names or
                      info.flag_bits & 1): fail("producer_artifact_archive_entry_invalid")
                  names.add(name)
                  trimmed = name[:-1] if info.is_dir() and name.endswith("/") else name
                  relative = PurePosixPath(trimmed)
                  if not trimmed or relative.is_absolute() or ".." in relative.parts or "." in relative.parts:
                      fail("producer_artifact_archive_entry_invalid")
                  mode = stat.S_IFMT((info.external_attr >> 16) & 0xFFFF)
                  if info.is_dir():
                      if mode not in (0, stat.S_IFDIR): fail("producer_artifact_archive_entry_invalid")
                      continue
                  if mode not in (0, stat.S_IFREG): fail("producer_artifact_archive_entry_invalid")
                  target = output.joinpath(*relative.parts); target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as src, target.open("xb") as dst:
                      while chunk := src.read(1024 * 1024): dst.write(chunk)
          expected = {
              "README.md", "clean_runner_receipt.json", "external_code_to_code_receipt.json",
              "external_modal_buckling_receipt.json",
              "host_external_code_to_code_current_source_replay.json",
              "host_external_modal_buckling_current_source_replay.json",
              "mode_vectors/calculix_buckling_modes.f64le",
              "mode_vectors/opensees_modal_modes.f64le", "mode_vectors/product_buckling_modes.f64le",
              "mode_vectors/product_modal_modes.f64le",
          }
          actual = {path.relative_to(output).as_posix() for path in output.rglob("*") if path.is_file()}
          if actual != expected or any(path.endswith((".whl", ".deb", ".rpm")) for path in actual):
              fail("candidate_file_set_invalid")
          def object_digest(value):
              raw = json.dumps(value, allow_nan=False, ensure_ascii=False,
                               separators=(",", ":"), sort_keys=True).encode()
              return digest_bytes(raw)
          expected_cases = {
              "external_code_to_code_receipt.json": {
                  "schema": "external-code-to-code-technical-execution.v1",
                  "cases": {
                      "two_dof_shear_modal": 2, "cantilever_tip_load": 3,
                      "public_corotational_portal_load_path": 12,
                      "bounded_planar_member_feature_load_path": 8,
                      "bounded_planar_prescribed_settlement_load_path": 9,
                      "spatial_frame3d_cantilever_combined_load": 10,
                      "frame3d_direct_control_axial_yield": 8,
                      "frame3d_direct_control_cyclic_axial_reversal": 19,
                      "frame3d_direct_control_torsion": 3,
                      "frame3d_direct_control_bending_rotations": 6,
                      "axial_member_tip_load": 2,
                      "tetrahedral_spatial_truss_combined_load": 12,
                  },
              },
              "external_modal_buckling_receipt.json": {
                  "schema": "external-modal-buckling-technical-execution.v1",
                  "cases": {"whole_model_frame_consistent_mass_modal": 4,
                            "whole_model_frame_repeated_mode_linear_buckling": 3},
              },
          }
          children = {}
          for filename, policy in expected_cases.items():
              child = load(output / filename); children[filename] = child
              material = dict(child); material.pop("artifact_hash", None)
              checksums = child.get("internal_source", {}).get("input_checksums")
              replay = child.get("replay_provenance", {})
              claims = child.get("claims", {})
              cases = child.get("comparisons")
              if (child.get("schema_version") != policy["schema"] or child.get("source_commit_sha") != source or
                  child.get("artifact_hash") != object_digest(material) or not isinstance(checksums, dict) or
                  child.get("internal_source", {}).get("source_set_hash") != object_digest(checksums) or
                  child.get("status") != "partial" or child.get("technical_contract_pass") is not True or
                  child.get("verification_hierarchy_credit") is not False or
                  child.get("verification_hierarchy_operator_manifest_attached") is not False or
                  replay.get("external_runtime_executed_in_this_generation") is not True or
                  replay.get("external_execution_reused") is not False or replay.get("reuse_reason") is not None or
                  replay.get("external_execution_source_commit_sha") != source or
                  replay.get("current_product_replay_pass") is not True or
                  claims.get("actual_external_solver_execution") is not True or
                  any(claims.get(key) is not False for key in ("verification_level_2", "product_legal_license_approval",
                      "external_runtime_redistribution_approval", "commercial_equivalence", "release_readiness")) or
                  not isinstance(cases, list) or {row.get("case_id") for row in cases} != set(policy["cases"])):
                  fail("child_receipt_contract_invalid")
              for case in cases:
                  metrics = case.get("metrics")
                  if (case.get("contract_pass") is not True or case.get("external_return_code") != 0 or
                      case.get("product_regularization_applied") is not False or
                      case.get("product_fallback_used") is not False or not isinstance(metrics, list) or
                      len(metrics) != policy["cases"][case["case_id"]]): fail("child_case_contract_invalid")
                  for metric in metrics:
                      values = [value for value in metric.values() if type(value) in (int, float)]
                      if not values or any(not math.isfinite(float(value)) for value in values) or metric.get("contract_pass") is not True:
                          fail("child_metric_contract_invalid")
                      if metric.get("metric_kind") == "minimum_threshold":
                          if metric.get("observed_value") < metric.get("minimum_accepted"): fail("child_metric_contract_invalid")
                      else:
                          absolute_error = abs(metric.get("product_value") - metric.get("reference_value"))
                          scale = max(abs(metric.get("product_value")), abs(metric.get("reference_value")), 1.0)
                          if (not math.isclose(metric.get("absolute_error"), absolute_error, rel_tol=1e-12, abs_tol=1e-15) or
                              absolute_error > metric.get("absolute_tolerance") + metric.get("relative_tolerance") * scale):
                              fail("child_metric_contract_invalid")
              assets = child.get("external_assets")
              expected_assets = {
                  "calculix-ccx_2.17-3_amd64.deb": "3e2001110e080e8cd01176ca171ee73993fa3a23e73e9febda3241b031a2b65e",
                  "libarpack2_3.8.0-1_amd64.deb": "07a4b576bd52ae9b0f487a3739b8922183ac88ceb1b2f2e943e3e68b8a12108a",
                  "libspooles2.2_2.2-14_amd64.deb": "34dd2bf283347402d49b7a9f3e07dc118385e62d8f63ce3fe245b612d2f3a917",
                  "openseespy-3.7.1.2-py3-none-any.whl": "1f16bc7466c252e432ac2ca69f4e9ca08f6c053e8b977157c6dccba3dfa19e65",
                  "openseespylinux-3.7.1.2-py3-none-any.whl": "63d919a3ed06bd00e7e09ce55afac6394ad82fd89180e046070b19d68717308a",
              }
              if (not isinstance(assets, list) or {row.get("filename"): row.get("sha256", "").removeprefix("sha256:") for row in assets}
                  != expected_assets or any(row.get("bundled_in_repository") is not False for row in assets)):
                  fail("child_runtime_metadata_invalid")
          host_files = {
              "code_to_code": "host_external_code_to_code_current_source_replay.json",
              "modal_buckling": "host_external_modal_buckling_current_source_replay.json",
          }
          host_children = {}
          for name, filename in host_files.items():
              host = load(output / filename); host_children[name] = host
              child_filename = (
                  "external_code_to_code_receipt.json"
                  if name == "code_to_code"
                  else "external_modal_buckling_receipt.json"
              )
              policy = expected_cases[child_filename]
              material = dict(host); material.pop("artifact_hash", None)
              replay = host.get("replay_provenance", {})
              claims = host.get("claims", {})
              cases = host.get("comparisons")
              checksums = host.get("internal_source", {}).get("input_checksums")
              if (
                  host.get("schema_version") != policy["schema"]
                  or host.get("source_commit_sha") != source
                  or host.get("artifact_hash") != object_digest(material)
                  or not isinstance(checksums, dict)
                  or host.get("internal_source", {}).get("source_set_hash")
                  != object_digest(checksums)
                  or host.get("status") != "partial"
                  or host.get("technical_contract_pass") is not True
                  or host.get("verification_hierarchy_credit") is not False
                  or replay.get("external_runtime_executed_in_this_generation") is not False
                  or replay.get("external_execution_reused") is not True
                  or not isinstance(replay.get("reuse_reason"), str)
                  or not replay["reuse_reason"].strip()
                  or replay.get("current_product_replay_pass") is not True
                  or claims.get("actual_external_solver_execution") is not True
                  or any(claims.get(key) is not False for key in (
                      "verification_level_2", "product_legal_license_approval",
                      "external_runtime_redistribution_approval", "commercial_equivalence",
                      "release_readiness",
                  ))
                  or not isinstance(cases, list)
                  or {row.get("case_id") for row in cases} != set(policy["cases"])
                  or any(
                      row.get("contract_pass") is not True
                      or len(row.get("metrics", [])) != policy["cases"].get(row.get("case_id"))
                      for row in cases
                  )
              ):
                  fail("host_reference_receipt_contract_invalid")
          modal = children["external_modal_buckling_receipt.json"]
          vector_names = {"product_modal_modes", "opensees_modal_modes", "product_buckling_modes", "calculix_buckling_modes"}
          descriptors = modal.get("mode_vector_artifacts")
          if not isinstance(descriptors, list) or {row.get("name") for row in descriptors} != vector_names:
              fail("mode_vector_descriptor_invalid")
          for row in descriptors:
              relative = row.get("artifact_path", "").split("opensees_calculix_clean_runner/", 1)[-1]
              vector = output / relative
              descriptor = dict(row); descriptor.pop("content_hash", None)
              if (not vector.is_file() or vector.stat().st_size != row.get("byte_length") or digest(vector) != row.get("data_hash") or
                  object_digest(descriptor) != row.get("content_hash") or row.get("dtype") != "<f8" or
                  row.get("byte_order") != "little" or row.get("layout") != "C"):
                  fail("mode_vector_descriptor_invalid")
          summary = load(output / "clean_runner_receipt.json")
          summary_material = dict(summary); summary_material.pop("artifact_hash", None)
          if (summary.get("schema_version") != "structural-analysis-external-vv-clean-runner-receipt.v1" or
              summary.get("source_commit_sha") != source or summary.get("artifact_hash") != object_digest(summary_material) or
              summary.get("technical_contract_pass") is not True or summary.get("status") != "partial" or
              summary.get("cross_environment_parity", {}).get("source_set_match") is not True or
              summary.get("cross_environment_parity", {}).get("metric_set_match") is not True or
              summary.get("cross_environment_parity", {}).get("numerical_contract_pass") is not True or
              summary.get("claims", {}).get("same_operator_container_isolated_reproduction") is not True or
              summary.get("claims", {}).get("cross_environment_numerical_parity") is not True or
              summary.get("claims", {}).get("verification_level_2") is not False or
              summary.get("claims", {}).get("product_legal_license_approval") is not False or
              summary.get("claims", {}).get("release_readiness") is not False): fail("summary_claim_boundary_invalid")
          summary_children = summary.get("product_receipts", {})
          if set(summary_children) != {"code_to_code", "modal_buckling"}: fail("summary_child_binding_invalid")
          for name, descriptor in summary_children.items():
              relative = descriptor.get("path", "").split("opensees_calculix_clean_runner/", 1)[-1]
              path = output / relative
              child = children["external_code_to_code_receipt.json" if name == "code_to_code" else "external_modal_buckling_receipt.json"]
              expected_case_rows = [{"case_id": row["case_id"], "contract_pass": True, "metric_count": len(row["metrics"])}
                                    for row in child["comparisons"]]
              if (not path.is_file() or digest(path) != descriptor.get("file_sha256") or
                  descriptor.get("artifact_hash") != child["artifact_hash"] or
                  descriptor.get("source_set_hash") != child["internal_source"]["source_set_hash"] or
                  descriptor.get("fresh_external_runtime_execution") is not True or
                  descriptor.get("technical_contract_pass") is not True or descriptor.get("cases") != expected_case_rows):
                  fail("summary_child_binding_invalid")
          parity = summary.get("cross_environment_parity", {})
          host_descriptors = parity.get("host_reference_receipts", {})
          if set(host_descriptors) != set(host_files):
              fail("summary_host_reference_binding_invalid")
          for name, descriptor in host_descriptors.items():
              expected_path = (
                  "artifacts/vv/opensees_calculix_clean_runner/" + host_files[name]
              )
              path = output / host_files[name]
              host = host_children[name]
              if (
                  descriptor.get("path") != expected_path
                  or digest(path) != descriptor.get("file_sha256")
                  or descriptor.get("artifact_hash") != host.get("artifact_hash")
              ):
                  fail("summary_host_reference_binding_invalid")

          def metric_scalar_map(receipt):
              values = {}
              for case in receipt["comparisons"]:
                  for metric in case["metrics"]:
                      for field in ("product_value", "reference_value", "observed_value"):
                          if field in metric:
                              values[f"{case['case_id']}/{metric['quantity']}/{field}"] = float(metric[field])
              return values

          container_code = children["external_code_to_code_receipt.json"]
          container_modal = children["external_modal_buckling_receipt.json"]
          host_code = host_children["code_to_code"]
          host_modal = host_children["modal_buckling"]
          container_values = metric_scalar_map(container_code)
          container_values.update(metric_scalar_map(container_modal))
          host_values = metric_scalar_map(host_code)
          host_values.update(metric_scalar_map(host_modal))
          shared_keys = sorted(set(container_values) & set(host_values))
          container_only = sorted(set(container_values) - set(host_values))
          host_only = sorted(set(host_values) - set(container_values))
          absolute_tolerance = 1.0e-12
          relative_tolerance = 1.0e-12
          absolute_deltas = []
          relative_deltas = []
          comparison_passes = []
          for key in shared_keys:
              container_value = container_values[key]
              host_value = host_values[key]
              delta = abs(container_value - host_value)
              scale = max(abs(container_value), abs(host_value), 1.0)
              absolute_deltas.append(delta)
              relative_deltas.append(delta / scale)
              comparison_passes.append(
                  delta <= absolute_tolerance + relative_tolerance * scale
              )
          container_evidence = container_modal["product_evidence"]
          host_evidence = host_modal["product_evidence"]
          semantic_hash_matches = {
              key: container_evidence[key] == host_evidence[key]
              for key in (
                  "modal_model_hash", "modal_semantic_result_hash",
                  "buckling_model_hash", "buckling_semantic_result_hash",
              )
          }
          source_set_match = (
              len({
                  container_code["source_commit_sha"], container_modal["source_commit_sha"],
                  host_code["source_commit_sha"], host_modal["source_commit_sha"],
              }) == 1
              and container_code["internal_source"]["source_set_hash"]
              == host_code["internal_source"]["source_set_hash"]
          )
          metric_set_match = not container_only and not host_only
          model_hashes_match = (
              semantic_hash_matches["modal_model_hash"]
              and semantic_hash_matches["buckling_model_hash"]
          )
          numerical_pass = bool(
              source_set_match
              and metric_set_match
              and all(comparison_passes)
              and model_hashes_match
          )
          expected_parity = {
              "host_reference_receipts": host_descriptors,
              "absolute_tolerance": absolute_tolerance,
              "relative_tolerance": relative_tolerance,
              "source_set_match": source_set_match,
              "metric_set_match": metric_set_match,
              "scalar_comparison_count": len(shared_keys),
              "container_scalar_count": len(container_values),
              "host_scalar_count": len(host_values),
              "container_only_metric_keys": container_only,
              "host_only_metric_keys": host_only,
              "nonzero_delta_count": sum(delta > 0.0 for delta in absolute_deltas),
              "maximum_absolute_delta": max(absolute_deltas, default=0.0),
              "maximum_relative_delta": max(relative_deltas, default=0.0),
              "semantic_hash_matches": semantic_hash_matches,
              "exact_semantic_hash_parity": all(semantic_hash_matches.values()),
              "numerical_contract_pass": numerical_pass,
          }
          if parity != expected_parity or not numerical_pass:
              fail("summary_cross_environment_parity_invalid")
          handoff = {
              "schema_version": "opensees-calculix-clean-runner-handoff.v1",
              "source_commit_sha": source, "repository": repository, "run_id": run_id,
              "run_attempt": attempt, "event": run["event"],
              "producer_artifact": {"id": artifact_id, "name": artifact["name"],
                                    "digest": artifact_digest, "size_in_bytes": artifact["size_in_bytes"]},
              "summary_sha256": digest(output / "clean_runner_receipt.json"),
              "authority": {"verification_level_2": False, "legal_use_approved": False,
                            "release_readiness": False},
          }
          (output / "clean_runner_handoff.json").write_text(json.dumps(handoff, indent=2, sort_keys=True) + "\n")
          PY

      - name: Attest exact handoff
        id: attest_handoff
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: candidate/clean_runner_handoff.json

      - name: Verify and retain provenance
        run: |
          set -euo pipefail
          cp "${{ steps.attest_handoff.outputs.bundle-path }}" candidate/clean_runner_handoff.sigstore.json
          gh attestation verify candidate/clean_runner_handoff.json --repo "$GITHUB_REPOSITORY" \
            --bundle candidate/clean_runner_handoff.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/opensees-calculix-clean-runner-attestor.yml" \
            --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > candidate/clean_runner_handoff.attestation-verification.json
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          handoff_path = Path("candidate/clean_runner_handoff.json")
          handoff = json.loads(handoff_path.read_text())
          verification = json.loads(
              Path("candidate/clean_runner_handoff.attestation-verification.json").read_text()
          )
          if not isinstance(verification, list) or len(verification) != 1:
              raise SystemExit("handoff_attestation_result_invalid")
          result = verification[0]["verificationResult"]
          certificate = result["signature"]["certificate"]
          statement = result["statement"]
          invocation = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          expected_subject = [{
              "name": handoff_path.name,
              "digest": {"sha256": hashlib.sha256(handoff_path.read_bytes()).hexdigest()},
          }]
          if not (
              certificate.get("runInvocationURI") == invocation
              and certificate.get("runnerEnvironment") == "github-hosted"
              and certificate.get("sourceRepositoryDigest") == os.environ["SOURCE_SHA"]
              and statement.get("predicate", {}).get("runDetails", {}).get("metadata", {}).get("invocationId") == invocation
              and statement.get("subject") == expected_subject
          ):
              raise SystemExit("handoff_attestation_binding_invalid")
          PY

      - name: Upload signed technical artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.final-artifact-name }}
          path: candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
