name: Codex Temp Local Model Handler Patch

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - ".github/workflows/codex-temp-local-model-file-handler-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Patch the exact local model handlers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/structure-viewer/index.html')
          text = path.read_text(encoding='utf-8')

          import_needle = "} from './viewer-project-bundle-file-reader.js';\n"
          import_block = "\n".join([
              "import {",
              "  readViewerLocalModelFile,",
              "  viewerLocalModelFileFailure,",
              "} from './viewer-local-model-file-reader.js';",
              "",
          ])
          if text.count(import_needle) != 1:
              raise SystemExit(
                  f'expected one project-bundle file-reader terminator; found={text.count(import_needle)}'
              )
          text = text.replace(import_needle, import_needle + import_block, 1)

          select_pattern = re.compile(
              r"async function handleFileSelect\(event\) \{\n"
              r"  const file = event\.target\.files\?\.\[0\];.*?"
              r"\n\}\n\nfunction showLoadingIndicator",
              re.DOTALL,
          )
          select_replacement = "\n".join([
              "async function handleFileSelect(event) {",
              "  const input = event?.target;",
              "  const file = input?.files?.[0] || null;",
              "  if (!file) return;",
              "  showLoadingIndicator(`Loading ${file.name}...`);",
              "  try {",
              "    const fileRead = await readViewerLocalModelFile(file);",
              "    await window.buildModel?.(fileRead.payload, {",
              "      mode: 'local_file',",
              "      label: fileRead.name || file.name,",
              "      resolvedPath: fileRead.name || file.name,",
              "    });",
              "  } catch (error) {",
              "    const failure = viewerLocalModelFileFailure(error, { sourceName: file.name });",
              "    console.warn(`[Viewer] Local model file blocked: ${failure.error_code}@${failure.error_path}`);",
              "    alert(`Could not load the selected JSON model (${failure.error_code} @ ${failure.error_path}).`);",
              "  } finally {",
              "    hideLoadingIndicator();",
              "    if (input instanceof HTMLInputElement) input.value = '';",
              "  }",
              "}",
              "",
              "function showLoadingIndicator",
          ])
          text, select_count = select_pattern.subn(select_replacement, text, count=1)
          if select_count != 1:
              raise SystemExit(f'expected one file-select handler; replaced={select_count}')

          drop_pattern = re.compile(
              r"  dropZone\.addEventListener\('drop', async \(e\) => \{.*?"
              r"\n  \}\);",
              re.DOTALL,
          )
          drop_replacement = "\n".join([
              "  dropZone.addEventListener('drop', async (e) => {",
              "    e.preventDefault();",
              "    dropZone.classList.remove('drag-over');",
              "    const file = e.dataTransfer?.files?.[0] || null;",
              "    if (!file) return;",
              "    showLoadingIndicator(`Loading ${file.name}...`);",
              "    try {",
              "      const fileRead = await readViewerLocalModelFile(file);",
              "      await window.buildModel?.(fileRead.payload, {",
              "        mode: 'local_file',",
              "        label: fileRead.name || file.name,",
              "        resolvedPath: fileRead.name || file.name,",
              "      });",
              "    } catch (error) {",
              "      const failure = viewerLocalModelFileFailure(error, { sourceName: file.name });",
              "      console.warn(`[Viewer] Dropped local model blocked: ${failure.error_code}@${failure.error_path}`);",
              "      alert(`Could not load the dropped JSON model (${failure.error_code} @ ${failure.error_path}).`);",
              "    } finally {",
              "      hideLoadingIndicator();",
              "      dropZone.classList.remove('drag-over');",
              "    }",
              "  });",
          ])
          text, drop_count = drop_pattern.subn(drop_replacement, text, count=1)
          if drop_count != 1:
              raise SystemExit(f'expected one drop handler; replaced={drop_count}')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/codex-temp-local-model-file-handler-patch.yml').unlink()
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('src/structure-viewer/index.html').read_text(encoding='utf-8')
          select = re.search(
              r"async function handleFileSelect\(event\)\s*\{.*?"
              r"\n\}\n\nfunction showLoadingIndicator",
              text,
              re.DOTALL,
          )
          drop = re.search(
              r"dropZone\.addEventListener\('drop', async \(e\) => \{.*?"
              r"\n  \}\);",
              text,
              re.DOTALL,
          )
          if select is None or drop is None:
              raise SystemExit('patched local model handlers not found')
          for label, handler in (('select', select.group(0)), ('drop', drop.group(0))):
              required = (
                  'readViewerLocalModelFile(file)',
                  'viewerLocalModelFileFailure(error',
                  'failure.error_code',
                  'failure.error_path',
                  'await window.buildModel?.(fileRead.payload',
              )
              missing = [value for value in required if value not in handler]
              if missing:
                  raise SystemExit(f'{label} missing contracts: {missing}')
              forbidden = ('file.text()', 'JSON.parse(', 'console.error(', '.message')
              retained = [value for value in forbidden if value in handler]
              if retained:
                  raise SystemExit(f'{label} retained unsafe operations: {retained}')
          if text.count("from './viewer-local-model-file-reader.js';") != 1:
              raise SystemExit('local model reader import missing or duplicated')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structure-viewer/index.html .github/workflows/codex-temp-local-model-file-handler-patch.yml
          git commit -m "Use bounded reads for local Viewer models"
          git push origin HEAD:${{ github.head_ref }}
