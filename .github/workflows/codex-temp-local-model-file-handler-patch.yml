name: Codex Temp Local Model Handler Context

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - ".github/workflows/codex-temp-local-model-file-handler-patch.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Capture local model handler context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/structure-viewer/index.html')
          output = Path('/tmp/local-model-handler-context.txt')
          lines = source.read_text(encoding='utf-8').splitlines()
          patterns = (
              'handleFileSelect',
              "addEventListener('drop'",
              'addEventListener("drop"',
              'file.text()',
              'JSON.parse(text)',
              'const dropZone',
              'viewer-project-bundle-file-reader.js',
          )
          chunks = []
          seen = set()
          for pattern in patterns:
              matches = [index for index, line in enumerate(lines) if pattern in line]
              chunks.append(f'=== PATTERN {pattern!r} matches={len(matches)} ===')
              for index in matches[:20]:
                  begin = max(0, index - 24)
                  end = min(len(lines), index + 48)
                  key = (begin, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  chunks.append(f'--- lines {begin + 1}-{end} ---')
                  chunks.extend(
                      f'{line_number + 1:06d}: {lines[line_number]}'
                      for line_number in range(begin, end)
                  )
          output.write_text('\n'.join(chunks) + '\n', encoding='utf-8')
          print(f'captured {len(chunks)} lines to {output}')
          PY
      - name: Upload handler context
        uses: actions/upload-artifact@v7
        with:
          name: local-model-handler-context-${{ github.run_id }}
          path: /tmp/local-model-handler-context.txt
          if-no-files-found: error
          retention-days: 1
