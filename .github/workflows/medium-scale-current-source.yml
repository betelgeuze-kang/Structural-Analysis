name: Medium Scale Current Source

# Generated current-source scale evidence only. The five cases use the same
# Python implementation for dense/sparse comparison and grant no external V&V,
# Native medium, shell/foundation, design, or release authority.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: "${{ github.sha }}"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  TZ: "UTC"
  RECEIPT_PATH: artifacts/medium-scale/current-source/medium-scale-execution.v1.json
  ATTESTATION_BUNDLE: artifacts/medium-scale/current-source/medium-scale-execution.v1.sigstore.json
  ATTESTATION_VERIFICATION: artifacts/medium-scale/current-source/medium-scale-execution.v1.attestation-verification.json
  GH_TOKEN: "${{ github.token }}"

concurrency:
  group: medium-scale-current-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-and-attest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up canonical Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.11"

      - name: Install hash-locked current-source runtime
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify focused contract and fail-closed authority boundary
        run: >-
          python -m pytest -q
          tests/test_medium_scale_current_source_execution.py

      - name: Execute isolated five-case medium-scale profile
        run: >-
          python scripts/run_medium_scale_current_source_profile.py
          --source-sha "$SOURCE_SHA"
          --out "$RECEIPT_PATH"

      - name: Verify exact-source technical 5/5 without authority promotion
        run: |
          python scripts/run_medium_scale_current_source_profile.py \
            --validate "$RECEIPT_PATH" \
            --require-pass
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text())
          summary = payload["summary"]
          assert payload["source_commit_sha"] == os.environ["SOURCE_SHA"]
          assert payload["source_tree_clean"] is True
          assert payload["contract_pass"] is True
          assert summary["technical_execution_credit_count"] == 5
          assert summary["scientific_medium_benchmark_credit_count"] == 0
          assert summary["native_medium_product_authority_count"] == 0
          assert payload["release_authority"] is False
          assert all(row["crashed"] is False for row in payload["cases"])
          assert all(row["oom"] is False for row in payload["cases"])
          PY

      - name: Attest exact current-source receipt
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.RECEIPT_PATH }}

      - name: Retain and verify provenance bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$ATTESTATION_BUNDLE"
          gh attestation verify "$RECEIPT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/medium-scale-current-source.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION"

      - name: Upload receipt and retained provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medium-scale-current-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/medium-scale/current-source
          if-no-files-found: error
          retention-days: 90
