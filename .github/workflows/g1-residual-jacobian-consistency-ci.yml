name: G1 Residual Jacobian Consistency CI

on:
  merge_group:
  pull_request:
    paths:
      - "src/structural_analysis/solvers/nonlinear/residual_jacobian_consistency.py"
      - "scripts/build_g1_residual_jacobian_consistency_reference.py"
      - "tests/test_residual_jacobian_consistency.py"
      - ".github/workflows/g1-residual-jacobian-consistency-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/structural_analysis/solvers/nonlinear/residual_jacobian_consistency.py"
      - "scripts/build_g1_residual_jacobian_consistency_reference.py"
      - "tests/test_residual_jacobian_consistency.py"
      - ".github/workflows/g1-residual-jacobian-consistency-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: "${{ github.sha }}"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

concurrency:
  group: g1-residual-jacobian-consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directional-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Run directional consistency tests
        run: python -m pytest -q tests/test_residual_jacobian_consistency.py

      - name: Build source-bound reference receipt
        run: >-
          python scripts/build_g1_residual_jacobian_consistency_reference.py --json
          --source-commit "$SOURCE_SHA"
          --out ".ci/g1-consistency/reference-receipt.json"

      - name: Upload diagnostic-only gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g1-residual-jacobian-consistency-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/g1-consistency/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
