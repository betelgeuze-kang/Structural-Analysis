name: Seed Final Authoritative Evidence Resync

on:
  pull_request:
    paths:
      - ".github/workflows/seed-authoritative-evidence-final.yml"
  push:
    branches: ["evidence/authoritative-core-resync-final"]
    paths:
      - ".github/workflows/seed-authoritative-evidence-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seed-authoritative-evidence-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final evidence branch
        uses: actions/checkout@v6
        with:
          ref: evidence/authoritative-core-resync-final
          fetch-depth: 0

      - name: Import reviewed generator and source-state contracts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin evidence/authoritative-core-resync
          for path in \
            scripts/build_phase1_core_api_contract_artifacts.py \
            tests/test_authoritative_linear_evidence_contract.py \
            tests/test_build_phase1_core_api_contract_artifacts.py \
            tests/test_phase1_core_api_source_state.py \
            .github/workflows/authoritative-core-evidence-resync.yml
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/evidence/authoritative-core-resync:$path" > "$path"
          done

      - name: Retarget resync workflow and extend focused CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/authoritative-core-evidence-resync.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              'branches: ["evidence/authoritative-core-resync"]',
              'branches: ["evidence/authoritative-core-resync-final"]',
          )
          text = text.replace(
              'ref: evidence/authoritative-core-resync',
              'ref: evidence/authoritative-core-resync-final',
          )
          text = text.replace(
              'git push origin HEAD:evidence/authoritative-core-resync',
              'git push origin HEAD:evidence/authoritative-core-resync-final',
          )
          workflow.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/authoritative-linear-core-ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          ci_text = ci_text.replace(
              'branches: ["main", "agent/**", "solver/**", "core/**", "interop/**"]',
              'branches: ["main", "agent/**", "solver/**", "core/**", "interop/**", "evidence/**"]',
          )
          trigger_anchor = '      - "tests/test_authoritative_linear_*.py"\n'
          trigger_insert = (
              trigger_anchor
              + '      - "tests/test_build_phase1_core_api_contract_artifacts.py"\n'
              + '      - "tests/test_phase1_core_api_source_state.py"\n'
              + '      - "scripts/build_phase1_core_api_contract_artifacts.py"\n'
          )
          if 'tests/test_phase1_core_api_source_state.py' not in ci_text:
              ci_text = ci_text.replace(trigger_anchor, trigger_insert, 2)
          ruff_anchor = '          tests/test_authoritative_linear_engineering_semantics.py\n'
          ruff_insert = (
              ruff_anchor
              + '          scripts/build_phase1_core_api_contract_artifacts.py\n'
              + '          tests/test_authoritative_linear_evidence_contract.py\n'
              + '          tests/test_build_phase1_core_api_contract_artifacts.py\n'
              + '          tests/test_phase1_core_api_source_state.py\n'
          )
          ci_text = ci_text.replace(ruff_anchor, ruff_insert, 1)
          pytest_anchor = '            tests/test_authoritative_linear_engineering_semantics.py \\\n'
          pytest_insert = (
              pytest_anchor
              + '            tests/test_authoritative_linear_evidence_contract.py \\\n'
              + '            tests/test_build_phase1_core_api_contract_artifacts.py \\\n'
              + '            tests/test_phase1_core_api_source_state.py \\\n'
          )
          ci_text = ci_text.replace(pytest_anchor, pytest_insert, 1)
          ci.write_text(ci_text, encoding='utf-8')
          PY

      - name: Commit seeded evidence source
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/seed-authoritative-evidence-final.yml
          git add -A
          git commit -m "Seed final authoritative evidence resync"
          git push origin HEAD:evidence/authoritative-core-resync-final
