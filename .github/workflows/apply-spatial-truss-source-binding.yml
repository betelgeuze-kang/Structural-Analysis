name: Apply spatial-truss source binding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/fix-spatial-truss-source-binding'
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Apply source inventory repair
        run: python .github/apply_spatial_truss_source_binding.py
      - name: Format, lint, and test source repair
        run: |
          python -m ruff format scripts/run_external_code_to_code_technical_receipt.py tests/test_external_code_to_code_technical_receipt.py
          python -m ruff check scripts/run_external_code_to_code_technical_receipt.py tests/test_external_code_to_code_technical_receipt.py
          pytest -q tests/test_external_code_to_code_technical_receipt.py
      - name: Commit computational source binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_external_code_to_code_technical_receipt.py tests/test_external_code_to_code_technical_receipt.py
          git commit -m "fix: bind spatial-truss evidence to computational sources"
          git push origin HEAD:${{ github.head_ref }}
      - name: Refresh current-product replay receipts
        run: |
          REASON="The spatial-truss source inventory now includes the actual linear assembly and axial element implementations; preserved external outputs are reused because this repair changes provenance binding only."
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay --reuse-reason "$REASON"
          python scripts/run_external_code_to_code_technical_receipt.py \
            --out artifacts/vv/opensees_calculix_clean_runner/external_code_to_code_receipt.json \
            --refresh-product-replay --reuse-reason "$REASON"
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay --reuse-reason "$REASON"
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --out artifacts/vv/opensees_calculix_clean_runner/external_modal_buckling_receipt.json \
            --refresh-product-replay --reuse-reason "$REASON"
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
      - name: Validate refreshed evidence
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py --check
          python scripts/run_external_code_to_code_technical_receipt.py \
            --out artifacts/vv/opensees_calculix_clean_runner/external_code_to_code_receipt.json --check
          python scripts/run_external_modal_buckling_technical_receipt.py --check
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --out artifacts/vv/opensees_calculix_clean_runner/external_modal_buckling_receipt.json --check
          pytest -q \
            tests/test_external_code_to_code_technical_receipt.py \
            tests/test_external_modal_buckling_technical_receipt.py \
            tests/test_external_vv_clean_runner_contract.py
      - name: Commit refreshed replay evidence
        run: |
          git add \
            implementation/phase1/release_evidence/productization/external_code_to_code_technical_execution_receipt.json \
            implementation/phase1/release_evidence/productization/external_modal_buckling_technical_execution_receipt.json \
            artifacts/vv/opensees_calculix_clean_runner/external_code_to_code_receipt.json \
            artifacts/vv/opensees_calculix_clean_runner/external_modal_buckling_receipt.json \
            artifacts/vv/opensees_calculix_clean_runner/clean_runner_receipt.json
          git commit -m "chore: refresh spatial-truss source-bound replay evidence"
          git push origin HEAD:${{ github.head_ref }}
