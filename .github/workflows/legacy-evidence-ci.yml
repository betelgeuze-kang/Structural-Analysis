name: Legacy Evidence CI

on:
  pull_request:
    paths:
      - "implementation/phase1/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main", "ci/**", "evidence/**", "legacy/**"]
    paths:
      - "implementation/phase1/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Validate product CI boundaries
        run: >-
          python scripts/check_product_ci_boundaries.py
          --json
          --out legacy-evidence-boundary-report.json
          --fail-blocked

      - name: Ruff and compile legacy evidence lane
        run: python scripts/run_product_ci_lane.py --lane legacy_evidence --ruff --compile

      - name: Deterministic legacy evidence contracts
        run: >-
          python -m pytest -q
          tests/test_build_ci_streak_intake_packet.py
          tests/test_build_product_readiness_snapshot.py
          tests/test_check_repo_hygiene.py
          tests/test_source_boundary_ci_contract.py

      - name: Upload legacy evidence receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-evidence-ci-${{ github.run_id }}
          path: legacy-evidence-boundary-report.json
          if-no-files-found: warn
          retention-days: 14
