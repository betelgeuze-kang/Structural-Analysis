name: Legacy Evidence CI

on:
  pull_request:
    paths:
      - "implementation/phase1/**"
      - "artifacts/vv/**"
      - "benchmarks/clean-runners/**"
      - "scripts/**"
      - "src/structural_analysis/schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main", "ci/**", "evidence/**", "legacy/**"]
    paths:
      - "implementation/phase1/**"
      - "artifacts/vv/**"
      - "benchmarks/clean-runners/**"
      - "scripts/**"
      - "src/structural_analysis/schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: legacy-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Validate product CI boundaries
        run: >-
          python scripts/check_product_ci_boundaries.py
          --json
          --out legacy-evidence-boundary-report.json
          --fail-blocked

      - name: Ruff and compile legacy evidence lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_product_ci_lane.py --lane legacy_evidence --ruff --compile 2>&1 | tee legacy-evidence-lane.log

      - name: Materialize exact current-source V&V inputs
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked
          python scripts/build_bounded_planar_external_linear_case_package.py --check
          python scripts/build_bounded_planar_external_negative_case_package.py --check
          python scripts/build_bounded_planar_external_scaling_case_package.py --check
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py --check
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py --check

      - name: Deterministic legacy evidence contracts
        run: >-
          python -m pytest -q
          tests/test_build_ci_streak_intake_packet.py
          tests/test_build_product_readiness_snapshot.py
          tests/test_check_repo_hygiene.py
          tests/test_external_code_to_code_technical_receipt.py
          tests/test_external_modal_buckling_technical_receipt.py
          tests/test_external_vv_clean_runner_contract.py
          tests/test_validate_external_vv_operator_attestation.py
          tests/test_promote_external_vv_level2.py
          tests/test_build_bounded_planar_external_linear_case_package.py
          tests/test_build_bounded_planar_external_negative_case_package.py
          tests/test_build_bounded_planar_external_scaling_case_package.py
          tests/test_build_bounded_planar_external_modal_buckling_case_package.py
          tests/test_build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          tests/test_ingest_bounded_planar_external_linear_results.py
          tests/test_ingest_bounded_planar_external_negative_results.py
          tests/test_ingest_bounded_planar_external_scaling_results.py
          tests/test_ingest_bounded_planar_external_modal_buckling_results.py
          tests/test_ingest_bounded_planar_external_nonlinear_material_recovery_results.py
          tests/test_build_bounded_planar_external_vv_matrix.py
          tests/test_source_boundary_ci_contract.py

      - name: Upload legacy evidence receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-evidence-ci-${{ github.run_id }}
          path: |
            legacy-evidence-boundary-report.json
            legacy-evidence-lane.log
          if-no-files-found: warn
          retention-days: 14
