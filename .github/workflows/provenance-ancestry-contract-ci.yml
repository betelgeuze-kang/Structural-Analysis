name: Provenance Ancestry Contract CI

on:
  merge_group:
  pull_request:
    paths:
      - "tests/test_external_vv_clean_runner_contract.py"
      - ".github/workflows/provenance-ancestry-contract-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "tests/test_external_vv_clean_runner_contract.py"
      - ".github/workflows/provenance-ancestry-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: provenance-ancestry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: provenance-ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request merge ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Hydrate parent branch ancestry
        shell: bash
        run: |
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --deepen=512 origin
          fi
          git cat-file -e "${GITHUB_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install focused contract dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Verify embedded receipt ancestry and source invalidation
        run: >-
          python -m pytest -q
          tests/test_external_vv_clean_runner_contract.py::test_embedded_product_receipts_preserve_integrity_and_invalidate_stale_sources
