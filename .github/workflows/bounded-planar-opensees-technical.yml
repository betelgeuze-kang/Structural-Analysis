name: Bounded Planar OpenSees Technical Execution

# Same-operator technical evidence only. The solver producer has no signing
# authority; a fresh no-checkout reusable job authenticates the immutable handoff.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: "${{ github.sha }}"
  WORKFLOW_SHA: "${{ github.workflow_sha }}"
  FAMILY_ID: linear
  PACKAGE_DIR: artifacts/vv/bounded_planar_external_linear_case_package
  RESULT_DIR: .ci/bounded-planar-opensees/results
  RECEIPT_PATH: .ci/bounded-planar-opensees/technical-receipt.json
  SEAL_PATH: .ci/bounded-planar-opensees/producer-seal.json
  WHEEL_DIR: /tmp/structural-analysis-opensees-${{ github.run_id }}-${{ github.run_attempt }}/wheels
  CANDIDATE_ARTIFACT_NAME: bounded-planar-opensees-technical-candidate-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: bounded-planar-opensees-technical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload_candidate.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
    steps:
      - name: Checkout exact current-main source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify exact clean source identity
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.11"

      - name: Install hash-locked contract runtime
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps \
            --force-reinstall --no-cache-dir \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock

      - name: Materialize and check exact execution package
        run: |
          set -euo pipefail
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_linear_case_package.py --check

      - name: Download and install hash-locked OpenSees wheels
        run: |
          set -euo pipefail
          mkdir -p "$WHEEL_DIR"
          python -m pip download --only-binary=:all: --require-hashes \
            --dest "$WHEEL_DIR" -r "$PACKAGE_DIR/requirements.txt"
          python -m pip install --no-index --only-binary=:all: --require-hashes \
            --force-reinstall --no-cache-dir \
            --find-links "$WHEEL_DIR" -r "$PACKAGE_DIR/requirements.txt"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libblas3 liblapack3
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import openseespylinux
          print(f"LD_LIBRARY_PATH={Path(openseespylinux.__file__).resolve().parent / 'lib'}")
          PY

      - name: Execute checksum-bound OpenSees cases
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          python "$PACKAGE_DIR/opensees/bounded_planar_linear_portal.py" "$RESULT_DIR/bounded_planar_linear_portal.json"
          python "$PACKAGE_DIR/opensees/bounded_planar_linear_multistory.py" "$RESULT_DIR/bounded_planar_linear_multistory.json"

      - name: Build fail-closed technical receipt
        run: >-
          python scripts/ingest_bounded_planar_external_linear_results.py
          --package-dir "$PACKAGE_DIR" --results-dir "$RESULT_DIR"
          --out "$RECEIPT_PATH" --fail-technical-blocked

      - name: Seal exact clean source, runtime, package, results, and receipt
        run: >-
          python scripts/build_bounded_planar_technical_producer_seal.py
          --family-id "$FAMILY_ID" --receipt-path "$RECEIPT_PATH"
          --package-dir "$PACKAGE_DIR" --wheel-dir "$WHEEL_DIR" --out "$SEAL_PATH"
          --source-sha "$SOURCE_SHA" --source-tree-sha "$(git rev-parse HEAD^{tree})"
          --workflow-sha "$WORKFLOW_SHA" --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME"

      - name: Upload immutable unprivileged candidate
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: |
            .ci/bounded-planar-opensees
            ${{ env.PACKAGE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: produce
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/bounded-planar-sealed-technical-attestor.yml
    with:
      producer-artifact-id: ${{ needs.produce.outputs.artifact-id }}
      producer-artifact-digest: ${{ needs.produce.outputs.artifact-digest }}
      source-sha: ${{ github.sha }}
      family-id: linear
      caller-workflow-path: .github/workflows/bounded-planar-opensees-technical.yml
      receipt-path: .ci/bounded-planar-opensees/technical-receipt.json
      seal-path: .ci/bounded-planar-opensees/producer-seal.json
      handoff-path: .ci/bounded-planar-opensees/artifact-handoff.json
      attestation-bundle-path: .ci/bounded-planar-opensees/artifact-handoff.sigstore.json
      attestation-verification-path: .ci/bounded-planar-opensees/attestation-verification.json
      candidate-artifact-name: bounded-planar-opensees-technical-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      final-artifact-name: bounded-planar-opensees-technical-${{ github.run_id }}-${{ github.run_attempt }}
