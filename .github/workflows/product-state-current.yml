name: Product State Current

# product_state.current is generated after every completed Nightly Full Quality
# run for a main commit. Successful and failed conclusions are both authentic
# evidence; only a successful source-bound run can pass the product-state
# contract. This also avoids embedding a self-referential commit SHA in a
# tracked file.

on:
  workflow_run:
    workflows: ["Nightly Full Quality"]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  TZ: "UTC"
  PYTHONHASHSEED: "0"
  PRODUCT_STATE_SHA: ${{ github.event.workflow_run.head_sha }}
  PRODUCT_STATE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  PRODUCT_STATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  PRODUCT_STATE_WORKFLOW_REF: ${{ github.workflow_ref }}
  PRODUCT_STATE_WORKFLOW_NAME: ${{ github.workflow }}
  PRODUCT_STATE_WORKFLOW_EVENT: ${{ github.event_name }}
  PRODUCT_STATE_WORKFLOW_RUN_ID: ${{ github.run_id }}
  PRODUCT_STATE_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
  PRODUCT_STATE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
  PRODUCT_STATE_PATH: artifacts/manifests/product_state.current.v1.json
  PRODUCT_STATE_ATTESTATION_BUNDLE: .ci/product-state-inputs/product-state.current.sigstore.json
  PRODUCT_STATE_ATTESTATION_VERIFICATION: .ci/product-state-inputs/product-state.current.attestation-verification.json
  PRODUCT_STATE_PROVENANCE_PATH: .ci/product-state-inputs/product-state.provenance-bundle.v1.json
  PRODUCT_STATE_PROVENANCE_ATTESTATION_BUNDLE: .ci/product-state-inputs/product-state.provenance-bundle.sigstore.json
  PRODUCT_STATE_PROVENANCE_ATTESTATION_VERIFICATION: .ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json
  CANONICAL_RECEIPT_PATH: artifacts/manifests/canonical_verification_environment.current.v1.json
  CANONICAL_WHEEL_CONTRACT_PATH: .ci/canonical-project-wheel-contract.json
  CANONICAL_WHEEL_PATH: .ci/canonical-wheel/structural_analysis-0.3.0-py3-none-any.whl
  DAG_STATE_PATH: .ci/product-state-inputs/generated-artifact-dag-state.v2.json
  DAG_REPORT_PATH: .ci/product-state-inputs/generated-artifact-dag-report.v2.json
  NIGHTLY_WORKFLOW_RUN_EVENT_PATH: .ci/product-state-inputs/nightly-workflow-run-event.json
  CLEAN_RUNNER_INPUT_DIR: .ci/product-state-inputs/opensees-calculix-clean-runner
  CLEAN_RUNNER_EVIDENCE_ROOT: .ci/product-state-inputs/opensees-calculix-clean-runner
  CLEAN_RUNNER_SUMMARY_PATH: .ci/product-state-inputs/opensees-calculix-clean-runner/clean_runner_receipt.json
  SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH: .ci/product-state-inputs/current-same-operator-supplemental/receipt.json
  SUPPLEMENTAL_ATTESTATION_INPUT_DIR: .ci/product-state-inputs/bounded-planar-supplemental-attestations
  POST_MAIN_OVERLAY_ROOT: .ci/product-state-inputs/post-main-overlay
  POST_MAIN_OVERLAY_SEAL: .ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json
  POST_MAIN_OVERLAY_BUNDLE: .ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.sigstore.json
  POST_MAIN_OVERLAY_API: .ci/product-state-inputs/post-main-overlay-attested-api.json
  POST_MAIN_OVERLAY_ARCHIVE: .ci/product-state-inputs/post-main-overlay-attested.zip
  GH_TOKEN: ${{ github.token }}

jobs:
  build-current-state:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      candidate-id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate-digest: ${{ format('sha256:{0}', steps.upload_candidate.outputs.artifact-digest) }}
      candidate-name: ${{ steps.candidate.outputs.name }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_STATE_SHA }}
          persist-credentials: false

      - name: Verify pristine exact-source checkout before unprivileged build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$PRODUCT_STATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(find . -xdev -type l -not -path './.git/*' -print -quit)"

      - name: Verify product-state workflow execution identity
        shell: bash
        run: |
          test "$PRODUCT_STATE_WORKFLOW_SHA" = "$PRODUCT_STATE_SHA"
          test "$PRODUCT_STATE_WORKFLOW_NAME" = "Product State Current"
          test "$PRODUCT_STATE_WORKFLOW_EVENT" = "workflow_run"
          test "$PRODUCT_STATE_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml@refs/heads/main"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$PRODUCT_STATE_SHA"
          git show \
            "$PRODUCT_STATE_WORKFLOW_SHA:.github/workflows/product-state-current.yml" \
            | cmp - .github/workflows/product-state-current.yml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.11"

      - name: Install current-state contract tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Consume authenticated exact-Nightly post-main overlay by API identity
        shell: bash
        env:
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          NIGHTLY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$NIGHTLY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$NIGHTLY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          mkdir -p .ci/product-state-inputs
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$NIGHTLY_RUN_ID" \
            > .ci/product-state-inputs/nightly-overlay-run.json
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$NIGHTLY_RUN_ID/artifacts?per_page=100" \
            > .ci/product-state-inputs/nightly-overlay-artifacts.json
          read -r overlay_id overlay_digest < <(
            python -I - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          def reject(token): raise ValueError(token)
          def finite(token):
              value = float(token)
              if not math.isfinite(value): raise ValueError(token)
              return value
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError(key)
                  result[key] = value
              return result
          def load(path):
              value = json.loads(Path(path).read_text(), object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
              if type(value) is not dict: raise SystemExit("API object required")
              return value
          run_id = int(os.environ["NIGHTLY_RUN_ID"])
          run_attempt = int(os.environ["NIGHTLY_RUN_ATTEMPT"])
          source_sha = os.environ["PRODUCT_STATE_SHA"]
          run = load(".ci/product-state-inputs/nightly-overlay-run.json")
          if not (
              run.get("id") == run_id
              and run.get("run_attempt") == run_attempt
              and run.get("head_sha") == source_sha
              and run.get("head_branch") == "main"
              and run.get("path") == ".github/workflows/nightly-full-quality.yml"
              and run.get("conclusion") == os.environ["PRODUCT_STATE_CONCLUSION"]
              and run.get("conclusion") in {
                  "action_required", "cancelled", "failure", "neutral", "skipped",
                  "stale", "success", "timed_out",
              }
              and run.get("event") in {"schedule", "workflow_dispatch"}
          ):
              raise SystemExit("Nightly overlay run identity invalid")
          expected = f"post-main-evidence-overlay-attested-{run_id}-{run_attempt}-{source_sha}"
          payload = load(".ci/product-state-inputs/nightly-overlay-artifacts.json")
          matches = [row for row in payload.get("artifacts", []) if row.get("name") == expected]
          if len(matches) != 1:
              raise SystemExit("attested post-main overlay artifact inventory ambiguous")
          row = matches[0]
          artifact_id = row.get("id")
          digest = row.get("digest")
          if not (
              type(artifact_id) is int and 1 <= artifact_id <= 9007199254740991
              and isinstance(digest, str) and len(digest) == 71 and digest.startswith("sha256:")
              and type(row.get("size_in_bytes")) is int
              and 0 < row["size_in_bytes"] <= 300_000_000
              and row.get("archive_download_url")
              == f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"
              and row.get("expired") is False
              and row.get("workflow_run", {}).get("id") == run_id
          ):
              raise SystemExit("attested post-main overlay artifact identity invalid")
          Path(".ci/product-state-inputs/post-main-overlay-attested-inventory-api.json").write_text(json.dumps(row, indent=2, sort_keys=True) + "\n")
          print(artifact_id, digest)
          PY
          )
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$overlay_id" \
            > "$POST_MAIN_OVERLAY_API"
          OVERLAY_ID="$overlay_id" OVERLAY_DIGEST="$overlay_digest" python -I - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          def reject(token): raise ValueError(token)
