          gh attestation verify "$root/product-state-candidate.seal.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" \
            --signer-digest "$PRODUCT_STATE_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/product-state-candidate.seal.attestation-verification.json"
          gh attestation verify \
            "$root/.ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$root/.ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-full-quality.yml" \
            --signer-digest "$PRODUCT_STATE_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$root/.ci/product-state-inputs/post-main-overlay-final-attestation-verification.json"
          ROOT="$root" python -I - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          def fail(reason): raise SystemExit(reason)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: fail(f"duplicate_json_key:{key}")
                  result[key] = value
              return result
          def reject(token): fail(f"nonfinite_json_number:{token}")
          def finite(token):
              value = float(token)
              if not math.isfinite(value): fail(f"nonfinite_json_number:{token}")
              return value
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "product-state-candidate.seal.attestation-verification.json").read_bytes(), object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
          if type(report) is not list or len(report) != 1 or type(report[0]) is not dict:
              fail("candidate_seal_attestation_report_shape_invalid")
          verification = report[0].get("verificationResult")
          if type(verification) is not dict or type(verification.get("signature")) is not dict or type(verification["signature"].get("certificate")) is not dict or not verification["signature"]["certificate"] or type(verification.get("verifiedTimestamps")) is not list or not verification["verifiedTimestamps"]:
              fail("candidate_seal_attestation_verification_invalid")
          statement = verification.get("statement")
          if type(statement) is not dict or set(statement) != {"_type", "subject", "predicateType", "predicate"} or statement.get("_type") != "https://in-toto.io/Statement/v1" or statement.get("predicateType") != "https://slsa.dev/provenance/v1":
              fail("candidate_seal_attestation_statement_invalid")
          seal_raw = Path(os.environ["ROOT"], "product-state-candidate.seal.json").read_bytes()
          subjects = statement.get("subject")
          if type(subjects) is not list or subjects != [{"name": "product-state-candidate.seal.json", "digest": {"sha256": hashlib.sha256(seal_raw).hexdigest()}}]:
              fail("candidate_seal_attestation_subject_invalid")
          predicate = statement.get("predicate")
          build = predicate.get("buildDefinition") if type(predicate) is dict else None
          details = predicate.get("runDetails") if type(predicate) is dict else None
          external = build.get("externalParameters") if type(build) is dict else None
          internal = build.get("internalParameters") if type(build) is dict else None
          workflow = external.get("workflow") if type(external) is dict else None
          github = internal.get("github") if type(internal) is dict else None
          dependencies = build.get("resolvedDependencies") if type(build) is dict else None
          builder = details.get("builder") if type(details) is dict else None
          metadata = details.get("metadata") if type(details) is dict else None
          repository_url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          expected_workflow = {"path": ".github/workflows/product-state-current.yml", "ref": "refs/heads/main", "repository": repository_url}
          if type(build) is not dict or build.get("buildType") != "https://actions.github.io/buildtypes/workflow/v1" or workflow != expected_workflow or type(github) is not dict or github.get("event_name") != "workflow_run" or github.get("runner_environment") != "github-hosted":
              fail("candidate_seal_attestation_workflow_invalid")
          if type(dependencies) is not list or len(dependencies) != 1 or dependencies[0] != {"uri": "git+" + repository_url + "@refs/heads/main", "digest": {"gitCommit": os.environ["PRODUCT_STATE_SHA"]}}:
              fail("candidate_seal_attestation_source_invalid")
          if builder != {"id": repository_url + "/.github/workflows/product-state-current.yml@refs/heads/main"} or metadata != {"invocationId": repository_url + f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"}:
              fail("candidate_seal_attestation_invocation_invalid")
          PY

