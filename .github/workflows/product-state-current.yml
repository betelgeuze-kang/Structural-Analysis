                      not name or len(name) > 2048 or "\\" in name or "\0" in name or any(character in name for character in '<>:"|?*')
                      or unicodedata.normalize("NFC", name) != name
                      or unicodedata.normalize("NFKC", name) != name
                      or any(unicodedata.category(character) in {"Cc", "Cf"} for character in name)
                      or path.is_absolute() or path.as_posix() != name
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or portable_path_unsafe(path)
                      or folded in collisions
                      or member.is_dir()
                      or stat.S_IFMT(mode) not in {0, stat.S_IFREG}
                      or member.flag_bits & 1
                      or member.create_system != 3
                      or member.create_version not in {20, 45}
