name: Product State Current

# product_state.current is generated after every completed Nightly Full Quality
# run for a main commit. Successful and failed conclusions are both authentic
# evidence; only a successful source-bound run can pass the product-state
# contract. This also avoids embedding a self-referential commit SHA in a
# tracked file.

on:
  workflow_run:
    workflows: ["Nightly Full Quality"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  TZ: "UTC"
  PYTHONHASHSEED: "0"
  PRODUCT_STATE_SHA: ${{ github.event.workflow_run.head_sha }}
  PRODUCT_STATE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  PRODUCT_STATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  PRODUCT_STATE_WORKFLOW_REF: ${{ github.workflow_ref }}
  PRODUCT_STATE_WORKFLOW_NAME: ${{ github.workflow }}
  PRODUCT_STATE_WORKFLOW_EVENT: ${{ github.event_name }}
  PRODUCT_STATE_WORKFLOW_RUN_ID: ${{ github.run_id }}
  PRODUCT_STATE_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
  PRODUCT_STATE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
  PRODUCT_STATE_PATH: artifacts/manifests/product_state.current.v1.json
  PRODUCT_STATE_ATTESTATION_BUNDLE: .ci/product-state-inputs/product-state.current.sigstore.json
  PRODUCT_STATE_ATTESTATION_VERIFICATION: .ci/product-state-inputs/product-state.current.attestation-verification.json
  PRODUCT_STATE_PROVENANCE_PATH: .ci/product-state-inputs/product-state.provenance-bundle.v1.json
  PRODUCT_STATE_PROVENANCE_ATTESTATION_BUNDLE: .ci/product-state-inputs/product-state.provenance-bundle.sigstore.json
  PRODUCT_STATE_PROVENANCE_ATTESTATION_VERIFICATION: .ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json
  CANONICAL_RECEIPT_PATH: artifacts/manifests/canonical_verification_environment.current.v1.json
  CANONICAL_WHEEL_CONTRACT_PATH: .ci/canonical-project-wheel-contract.json
  CANONICAL_WHEEL_PATH: .ci/canonical-wheel/structural_analysis-0.3.0-py3-none-any.whl
  DAG_STATE_PATH: .ci/product-state-inputs/generated-artifact-dag-state.v2.json
  DAG_REPORT_PATH: .ci/product-state-inputs/generated-artifact-dag-report.v2.json
  NIGHTLY_WORKFLOW_RUN_EVENT_PATH: .ci/product-state-inputs/nightly-workflow-run-event.json
  CLEAN_RUNNER_INPUT_DIR: .ci/product-state-inputs/opensees-calculix-clean-runner
  CLEAN_RUNNER_EVIDENCE_ROOT: .ci/product-state-inputs/opensees-calculix-clean-runner
  CLEAN_RUNNER_SUMMARY_PATH: .ci/product-state-inputs/opensees-calculix-clean-runner/clean_runner_receipt.json
  SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH: .ci/product-state-inputs/current-same-operator-supplemental/receipt.json
  SUPPLEMENTAL_ATTESTATION_INPUT_DIR: .ci/product-state-inputs/bounded-planar-supplemental-attestations
  GH_TOKEN: ${{ github.token }}

jobs:
  build-current-state:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_STATE_SHA }}

      - name: Verify product-state workflow execution identity
        shell: bash
        run: |
          test "$PRODUCT_STATE_WORKFLOW_SHA" = "$PRODUCT_STATE_SHA"
          test "$PRODUCT_STATE_WORKFLOW_NAME" = "Product State Current"
          test "$PRODUCT_STATE_WORKFLOW_EVENT" = "workflow_run"
          test "$PRODUCT_STATE_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml@refs/heads/main"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$PRODUCT_STATE_SHA"
          git show \
            "$PRODUCT_STATE_WORKFLOW_SHA:.github/workflows/product-state-current.yml" \
            | cmp - .github/workflows/product-state-current.yml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.11"

      - name: Install current-state contract tools
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify generated capability surfaces
        run: python scripts/generate_capability_surfaces.py

      - name: Materialize exact-SHA canonical verification receipt
        shell: bash
        run: |
          mkdir -p .ci/canonical-receipt-download .ci/product-state-inputs
          canonical_run_id=""
          for attempt in {1..30}; do
            if ! gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/p0-canonical-contract.yml/runs?branch=main&status=success&head_sha=$PRODUCT_STATE_SHA&per_page=100" \
              > .ci/product-state-inputs/canonical-verification-workflow-runs.json; then
              if test "$attempt" -lt 30; then
                sleep 10
                continue
              fi
              echo "canonical workflow lookup failed after bounded retry" >&2
              exit 1
            fi
            canonical_run_id="$(
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(".ci/product-state-inputs/canonical-verification-workflow-runs.json").read_text()
          )
          matches = [
              row
              for row in payload.get("workflow_runs", [])
              if row.get("head_sha") == os.environ["PRODUCT_STATE_SHA"]
              and row.get("head_branch") == "main"
              and row.get("conclusion") == "success"
              and row.get("path") == ".github/workflows/p0-canonical-contract.yml"
          ]
          if matches:
              print(max(matches, key=lambda row: int(row["id"]))["id"])
          PY
            )"
            if test -n "$canonical_run_id"; then
              break
            fi
            if test "$attempt" -lt 30; then
              sleep 10
            fi
          done
          if test -z "$canonical_run_id"; then
            echo "no successful exact-SHA canonical workflow run after bounded retry" >&2
            exit 1
          fi
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$canonical_run_id" \
            > .ci/product-state-inputs/canonical-verification-workflow-run.json
          canonical_download_dir=""
          for attempt in {1..12}; do
            attempt_dir=".ci/canonical-receipt-download/$attempt"
            mkdir -p "$attempt_dir"
            if gh run download "$canonical_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "canonical-verification-environment-$PRODUCT_STATE_SHA" \
              --dir "$attempt_dir"; then
              canonical_download_dir="$attempt_dir"
              break
            fi
            if test "$attempt" -lt 12; then
              sleep 5
            fi
          done
          if test -z "$canonical_download_dir"; then
            echo "exact-SHA canonical artifact unavailable after bounded retry" >&2
            exit 1
          fi
          mapfile -t downloaded_receipts < <(
            find "$canonical_download_dir" \
              -type f \
              -name "$(basename "$CANONICAL_RECEIPT_PATH")"
          )
          mapfile -t downloaded_wheel_contracts < <(
            find "$canonical_download_dir" \
              -type f \
              -name "$(basename "$CANONICAL_WHEEL_CONTRACT_PATH")"
          )
          mapfile -t downloaded_wheels < <(
            find "$canonical_download_dir" \
              -type f \
              -name "$(basename "$CANONICAL_WHEEL_PATH")"
          )
          test "${#downloaded_receipts[@]}" -eq 1
          test "${#downloaded_wheel_contracts[@]}" -eq 1
          test "${#downloaded_wheels[@]}" -eq 1
          downloaded_receipt="${downloaded_receipts[0]}"
          downloaded_wheel_contract="${downloaded_wheel_contracts[0]}"
          downloaded_wheel="${downloaded_wheels[0]}"
          mkdir -p "$(dirname "$CANONICAL_RECEIPT_PATH")"
          mkdir -p "$(dirname "$CANONICAL_WHEEL_CONTRACT_PATH")"
          mkdir -p "$(dirname "$CANONICAL_WHEEL_PATH")"
          cp "$downloaded_receipt" "$CANONICAL_RECEIPT_PATH"
          cp "$downloaded_wheel_contract" "$CANONICAL_WHEEL_CONTRACT_PATH"
          cp "$downloaded_wheel" "$CANONICAL_WHEEL_PATH"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import jsonschema

          receipt = json.loads(Path(os.environ["CANONICAL_RECEIPT_PATH"]).read_text())
          schema = json.loads(Path("canonical/canonical-verification-receipt.v1.schema.json").read_text())
          wheel_contract = json.loads(Path(os.environ["CANONICAL_WHEEL_CONTRACT_PATH"]).read_text())
          wheel_schema = json.loads(Path("canonical/canonical-project-wheel-contract.v1.schema.json").read_text())
          wheel_path = Path(os.environ["CANONICAL_WHEEL_PATH"])
          run = json.loads(Path(".ci/product-state-inputs/canonical-verification-workflow-run.json").read_text())
          jsonschema.Draft202012Validator(schema).validate(receipt)
          jsonschema.Draft202012Validator(wheel_schema).validate(wheel_contract)
          assert receipt["contract_profile"] == "p0-canonical-installed-wheel.v1"
          assert receipt["source_commit_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert receipt["source_checkout_head_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert receipt["contract_pass"] is True
          assert receipt["project_wheel"] == wheel_contract
          assert wheel_contract["source_commit_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert wheel_contract["wheel"]["filename"] == wheel_path.name
          assert wheel_contract["wheel"]["byte_length"] == wheel_path.stat().st_size
          assert wheel_contract["wheel"]["sha256"] == (
              "sha256:" + hashlib.sha256(wheel_path.read_bytes()).hexdigest()
          )
          assert wheel_contract["installed_replay"]["installed_source_commit_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert run["name"] == "P0 Canonical Verification Contract"
          assert run["path"] == ".github/workflows/p0-canonical-contract.yml"
          assert run["head_branch"] == "main"
          assert run["head_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert run["conclusion"] == "success"
          PY

      - name: Materialize exact current-source product-state inputs
        shell: bash
        run: |
          test -z "$(
            git status --porcelain=v1 --untracked-files=all -- \
              . \
              ":(exclude)$CANONICAL_RECEIPT_PATH"
          )"
          mkdir -p .ci/product-state-inputs
          cp "$GITHUB_EVENT_PATH" "$NIGHTLY_WORKFLOW_RUN_EVENT_PATH"
          cp \
            implementation/phase1/release_evidence/productization/external_code_to_code_technical_execution_receipt.json \
            .ci/product-state-inputs/code-to-code-receipt.json
          cp \
            implementation/phase1/release_evidence/productization/external_modal_buckling_technical_execution_receipt.json \
            .ci/product-state-inputs/modal-buckling-receipt.json
          python scripts/run_external_code_to_code_technical_receipt.py \
            --out .ci/product-state-inputs/code-to-code-receipt.json \
            --refresh-product-replay \
            --reuse-reason "Current-main product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --out .ci/product-state-inputs/modal-buckling-receipt.json \
            --refresh-product-replay \
            --reuse-reason "Current-main product replay; external execution bytes reused without freshness credit."
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py

      - name: Download and reverify exact-SHA supplemental technical attestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPPLEMENTAL_ATTESTATION_INPUT_DIR"
          supplemental_available="true"
          supplemental_unavailable_family=""
          supplemental_unavailable_reason=""
          mark_supplemental_unavailable() {
            supplemental_available="false"
            supplemental_unavailable_family="$1"
            supplemental_unavailable_reason="$2"
          }
          while read -r family workflow_path artifact_prefix receipt_path; do
            family_root="$SUPPLEMENTAL_ATTESTATION_INPUT_DIR/$family"
            artifact_root="$family_root/artifact"
            mkdir -p "$artifact_root"
            workflow_file="${workflow_path##*/}"
            run_id=""
            run_attempt=""
            workflow_lookup_completed="false"
            for lookup_attempt in {1..30}; do
              run_index_tmp="$family_root/workflow-runs.json.tmp"
              if gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?branch=main&status=success&head_sha=$PRODUCT_STATE_SHA&per_page=100" \
                  > "$run_index_tmp"; then
                mv "$run_index_tmp" "$family_root/workflow-runs.json"
                workflow_lookup_completed="true"
                if ! selection="$(
                  RUN_INDEX="$family_root/workflow-runs.json" \
                  EXPECTED_WORKFLOW="$workflow_path" \
                  python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUN_INDEX"]).read_text())
          matches = [
              row
              for row in payload.get("workflow_runs", [])
              if row.get("head_sha") == os.environ["PRODUCT_STATE_SHA"]
              and row.get("head_branch") == "main"
              and row.get("path") == os.environ["EXPECTED_WORKFLOW"]
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
              and row.get("event") in {"push", "workflow_dispatch"}
          ]
          if matches:
              row = max(matches, key=lambda item: int(item["id"]))
              run_id = row.get("id")
              run_attempt = row.get("run_attempt")
              if (
                  type(run_id) is not int
                  or run_id < 1
                  or type(run_attempt) is not int
                  or run_attempt < 1
              ):
                  raise SystemExit("invalid exact-SHA workflow run identity")
              print(run_id, run_attempt)
          PY
                )"; then
                  echo "invalid exact-SHA supplemental workflow lookup: $family" >&2
                  exit 1
                fi
                if test -n "$selection"; then
                  read -r run_id run_attempt <<< "$selection"
                  break
                fi
              else
                rm -f "$run_index_tmp"
              fi
              if test "$lookup_attempt" -lt 30; then
                sleep 10
              fi
            done
            if test -z "$run_id" || test -z "$run_attempt"; then
              if test "$workflow_lookup_completed" = "true"; then
                mark_supplemental_unavailable \
                  "$family" \
                  "successful_exact_sha_workflow_run_missing"
              else
                mark_supplemental_unavailable \
                  "$family" \
                  "workflow_run_lookup_failed_after_bounded_retry"
              fi
              break
            fi
            run_metadata_available="false"
            for metadata_attempt in {1..3}; do
              run_metadata_tmp="$family_root/workflow-run.json.tmp"
              if gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  > "$run_metadata_tmp"; then
                mv "$run_metadata_tmp" "$family_root/workflow-run.json"
                run_metadata_available="true"
                break
              fi
              rm -f "$run_metadata_tmp"
              if test "$metadata_attempt" -lt 3; then
                sleep 5
              fi
            done
            if test "$run_metadata_available" != "true"; then
              mark_supplemental_unavailable \
                "$family" \
                "workflow_run_metadata_lookup_failed_after_bounded_retry"
              break
            fi
            artifact_name="$artifact_prefix-$run_id-$run_attempt"
            artifact_index_available="false"
            for artifact_lookup_attempt in {1..3}; do
              artifact_index_tmp="$family_root/artifacts.json.tmp"
              if gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                  > "$artifact_index_tmp"; then
                mv "$artifact_index_tmp" "$family_root/artifacts.json"
                artifact_index_available="true"
                break
              fi
              rm -f "$artifact_index_tmp"
              if test "$artifact_lookup_attempt" -lt 3; then
                sleep 5
              fi
            done
            if test "$artifact_index_available" != "true"; then
              mark_supplemental_unavailable \
                "$family" \
                "artifact_lookup_failed_after_bounded_retry"
              break
            fi
            if ! artifact_selection="$(
              ARTIFACT_INDEX="$family_root/artifacts.json" \
              EXPECTED_ARTIFACT_NAME="$artifact_name" \
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["ARTIFACT_INDEX"]).read_text())
          matches = [
              row
              for row in payload.get("artifacts", [])
              if row.get("name") == os.environ["EXPECTED_ARTIFACT_NAME"]
          ]
          if len(matches) > 1:
              raise SystemExit("ambiguous exact-name artifact inventory")
          if not matches:
              print("missing 0")
          else:
              artifact = matches[0]
              artifact_id = artifact.get("id")
              if type(artifact_id) is not int or artifact_id < 1:
                  raise SystemExit("invalid exact-name artifact id")
              expired = artifact.get("expired")
              if expired is True:
                  print("expired", artifact_id)
              elif expired is False:
                  print("available", artifact_id)
              else:
                  raise SystemExit("invalid exact-name artifact expiry state")
          PY
            )"; then
              echo "invalid exact-SHA supplemental artifact inventory: $family" >&2
              exit 1
            fi
            read -r artifact_status _artifact_id <<< "$artifact_selection"
            if test "$artifact_status" = "missing"; then
              mark_supplemental_unavailable \
                "$family" \
                "exact_sha_artifact_missing"
              break
            fi
            if test "$artifact_status" = "expired"; then
              mark_supplemental_unavailable \
                "$family" \
                "exact_sha_artifact_expired"
              break
            fi
            if test "$artifact_status" != "available"; then
              echo "invalid exact-SHA supplemental artifact state: $family" >&2
              exit 1
            fi
            if ! gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "$artifact_root"; then
              echo "available exact-SHA supplemental artifact download failed: $family" >&2
              exit 1
            fi
            technical_receipt="$artifact_root/$receipt_path"
            artifact_handoff="${technical_receipt%technical-receipt.json}artifact-handoff.json"
            sigstore_bundle="${technical_receipt%technical-receipt.json}artifact-handoff.sigstore.json"
            test -f "$technical_receipt"
            test -f "$artifact_handoff"
            test -f "$sigstore_bundle"
            gh attestation verify "$artifact_handoff" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$sigstore_bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bounded-planar-sealed-technical-attestor.yml" \
              --signer-digest "$PRODUCT_STATE_SHA" \
              --source-digest "$PRODUCT_STATE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json \
              > "$family_root/product-state-attestation-verification.json"
          done <<'EOF'
          linear .github/workflows/bounded-planar-opensees-technical.yml bounded-planar-opensees-technical .ci/bounded-planar-opensees/technical-receipt.json
          negative .github/workflows/bounded-planar-negative-opensees-technical.yml bounded-planar-negative-opensees .ci/bounded-planar-negative-opensees/technical-receipt.json
          scaling .github/workflows/bounded-planar-scaling-opensees-technical.yml bounded-planar-scaling-opensees .ci/bounded-planar-scaling-opensees/technical-receipt.json
          modal_buckling .github/workflows/bounded-planar-modal-buckling-technical.yml bounded-planar-modal-buckling .ci/bounded-planar-modal-buckling/technical-receipt.json
          nonlinear_material_recovery .github/workflows/bounded-planar-nonlinear-material-recovery-technical.yml bounded-planar-nonlinear-material-recovery .ci/bounded-planar-nonlinear-material-recovery/technical-receipt.json
          EOF
          if test "$supplemental_available" != "true"; then
            rm -f "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"
            echo "exact-SHA supplemental evidence unavailable: family=$supplemental_unavailable_family reason=$supplemental_unavailable_reason" >&2
            exit 0
          fi
          if ! python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from strict_json import strict_json_load_path

          root = Path(os.environ["SUPPLEMENTAL_ATTESTATION_INPUT_DIR"])
          seals = sorted(root.glob("*/artifact/.ci/*/producer-seal.json"))
          if len(seals) != 5:
              raise SystemExit("supplemental_producer_seal_set_invalid")
          blocked = []
          for path in seals:
              payload = strict_json_load_path(path)
              runtime = payload.get("runtime_binding", {})
              if runtime.get("technical_authority_eligible") is not True:
                  blocked.append((payload.get("family_id"), runtime.get("blockers")))
          if blocked:
              print(f"supplemental runtime byte lock blocked: {blocked}", file=sys.stderr)
              raise SystemExit(1)
          PY
          then
            rm -f "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"
            echo "exact-SHA supplemental evidence is non-promoting until every runtime byte lock passes" >&2
            exit 0
          fi
          python scripts/build_bounded_planar_current_source_supplemental_attestation.py \
            --source-commit "$PRODUCT_STATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --input-root "$SUPPLEMENTAL_ATTESTATION_INPUT_DIR" \
            --out "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"
          python scripts/build_bounded_planar_current_source_supplemental_attestation.py \
            --check \
            --source-commit "$PRODUCT_STATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --out "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"

      - name: Materialize attested exact-SHA clean-runner evidence when available
        shell: bash
        run: |
          mkdir -p "$CLEAN_RUNNER_INPUT_DIR"
          clean_runner_run_id=""
          clean_runner_run_attempt=""
          clean_runner_conclusion=""
          for attempt in {1..20}; do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/opensees-calculix-current-source.yml/runs?branch=main&per_page=100" \
              > "$CLEAN_RUNNER_INPUT_DIR/workflow-runs.json"
            read -r clean_runner_run_id clean_runner_run_attempt clean_runner_conclusion < <(
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["CLEAN_RUNNER_INPUT_DIR"], "workflow-runs.json").read_text()
          )
          matches = [
              row
              for row in payload.get("workflow_runs", [])
              if row.get("head_sha") == os.environ["PRODUCT_STATE_SHA"]
              and row.get("head_branch") == "main"
              and row.get("path")
              == ".github/workflows/opensees-calculix-current-source.yml"
          ]
          if matches:
              row = max(matches, key=lambda item: int(item["id"]))
              print(row["id"], row.get("run_attempt", 1), row.get("conclusion") or "pending")
          else:
              print("missing 0 unavailable")
          PY
            )
            if test "$clean_runner_run_id" = "missing"; then
              break
            fi
            if test "$clean_runner_conclusion" != "pending"; then
              break
            fi
            if test "$attempt" -lt 20; then
              sleep 15
            fi
          done
          export CLEAN_RUNNER_RUN_ID="$clean_runner_run_id"
          export CLEAN_RUNNER_RUN_ATTEMPT="$clean_runner_run_attempt"
          export CLEAN_RUNNER_RUN_CONCLUSION="$clean_runner_conclusion"
          printf 'CLEAN_RUNNER_RUN_ID=%s\n' "$clean_runner_run_id" >> "$GITHUB_ENV"
          printf 'CLEAN_RUNNER_RUN_ATTEMPT=%s\n' "$clean_runner_run_attempt" >> "$GITHUB_ENV"
          printf 'CLEAN_RUNNER_RUN_CONCLUSION=%s\n' "$clean_runner_conclusion" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["CLEAN_RUNNER_INPUT_DIR"], "lookup.json")
          target.write_text(
              json.dumps(
                  {
                      "source_commit_sha": os.environ["PRODUCT_STATE_SHA"],
                      "run_id": os.environ["CLEAN_RUNNER_RUN_ID"],
                      "run_attempt": os.environ["CLEAN_RUNNER_RUN_ATTEMPT"],
                      "conclusion": os.environ["CLEAN_RUNNER_RUN_CONCLUSION"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          PY

      - name: Download and verify successful exact-SHA clean-runner artifact
        if: ${{ env.CLEAN_RUNNER_RUN_CONCLUSION == 'success' }}
        shell: bash
        run: |
          download_root="$CLEAN_RUNNER_INPUT_DIR/download"
          artifact_download_dir=""
          for attempt in {1..3}; do
            attempt_dir="$download_root/$attempt"
            mkdir -p "$attempt_dir"
            if gh run download "$CLEAN_RUNNER_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "opensees-calculix-current-source-$CLEAN_RUNNER_RUN_ID-$CLEAN_RUNNER_RUN_ATTEMPT" \
              --dir "$attempt_dir"; then
              artifact_download_dir="$attempt_dir"
              break
            fi
            if test "$attempt" -lt 3; then
              sleep 5
            fi
          done
          if test -z "$artifact_download_dir"; then
            test "$download_root" = "$CLEAN_RUNNER_INPUT_DIR/download"
            find "$download_root" -mindepth 1 -delete
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          lookup = Path(os.environ["CLEAN_RUNNER_INPUT_DIR"], "lookup.json")
          payload = json.loads(lookup.read_text())
          payload.update(
              {
                  "artifact_status": "unavailable",
                  "artifact_unavailable_reason": (
                      "exact_sha_artifact_download_failed_after_bounded_retry"
                  ),
              }
          )
          lookup.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            echo "exact-SHA clean-runner artifact unavailable; retaining blocked evidence status" >&2
            exit 0
          fi
          mapfile -t summaries < <(
            find "$artifact_download_dir" -type f -name clean_runner_receipt.json
          )
          test "${#summaries[@]}" -eq 1
          artifact_root="$(dirname "${summaries[0]}")"
          materialized_receipt_dir="$CLEAN_RUNNER_EVIDENCE_ROOT/artifacts/vv/opensees_calculix_clean_runner"
          mkdir -p "$materialized_receipt_dir"
          cp -R "$artifact_root"/. "$materialized_receipt_dir"/
          cp "${summaries[0]}" "$CLEAN_RUNNER_SUMMARY_PATH"
          for host_receipt in \
            implementation/phase1/release_evidence/productization/external_code_to_code_technical_execution_receipt.json \
            implementation/phase1/release_evidence/productization/external_modal_buckling_technical_execution_receipt.json; do
            materialized_host="$CLEAN_RUNNER_EVIDENCE_ROOT/$host_receipt"
            mkdir -p "$(dirname "$materialized_host")"
            cp "$host_receipt" "$materialized_host"
          done
          bundle="$artifact_root/clean_runner_receipt.sigstore.json"
          test -f "$bundle"
          gh attestation verify "$CLEAN_RUNNER_SUMMARY_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/opensees-calculix-current-source.yml" \
            --signer-digest "$PRODUCT_STATE_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json \
            > "$CLEAN_RUNNER_INPUT_DIR/attestation-verification.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path(os.environ["CLEAN_RUNNER_SUMMARY_PATH"]).read_text())
          assert summary["source_commit_sha"] == os.environ["PRODUCT_STATE_SHA"]
          assert summary["technical_contract_pass"] is True
          assert summary["cross_environment_parity"]["source_set_match"] is True
          assert summary["cross_environment_parity"]["numerical_contract_pass"] is True
          assert summary["claims"]["same_operator_container_isolated_reproduction"] is True
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lookup = Path(os.environ["CLEAN_RUNNER_INPUT_DIR"], "lookup.json")
          payload = json.loads(lookup.read_text())
          payload["artifact_status"] = "attached_and_attested"
          payload["materialized_evidence_root"] = os.environ[
              "CLEAN_RUNNER_EVIDENCE_ROOT"
          ]
          lookup.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          test "$download_root" = "$CLEAN_RUNNER_INPUT_DIR/download"
          find "$download_root" -mindepth 1 -delete
          test -z "$(
            git status --porcelain=v1 --untracked-files=all -- \
              artifacts/vv/opensees_calculix_clean_runner
          )"

      - name: Build exact-current external matrix and license status
        shell: bash
        run: |
          python scripts/build_bounded_planar_external_vv_matrix.py \
            --code-receipt .ci/product-state-inputs/code-to-code-receipt.json \
            --modal-receipt .ci/product-state-inputs/modal-buckling-receipt.json \
            --clean-runner-summary "$CLEAN_RUNNER_SUMMARY_PATH" \
            --same-operator-supplemental-receipt "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"
          python scripts/build_internal_license_due_diligence.py \
            --external-code-receipt .ci/product-state-inputs/code-to-code-receipt.json \
            --external-modal-receipt .ci/product-state-inputs/modal-buckling-receipt.json \
            --fail-blocked

      - name: Observe refs/heads/main immediately before build
        id: observe_main
        shell: bash
        run: |
          observed_main_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$observed_main_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$observed_main_sha" >> "$GITHUB_OUTPUT"

      - name: Build source-bound current product state
        id: build_state
        continue-on-error: true
        run: >-
          python scripts/build_product_state.py
          --write
          --json
          --observed-main-sha "${{ steps.observe_main.outputs.sha }}"
          --observed-main-source github_api_refs_heads_main_pre_build
          --nightly-workflow-run-event "$NIGHTLY_WORKFLOW_RUN_EVENT_PATH"
          --verify-legacy-git-objects
          --external-vv-code-receipt .ci/product-state-inputs/code-to-code-receipt.json
          --external-vv-modal-receipt .ci/product-state-inputs/modal-buckling-receipt.json
          --external-vv-clean-runner-summary "$CLEAN_RUNNER_SUMMARY_PATH"
          --external-vv-same-operator-supplemental-receipt "$SAME_OPERATOR_SUPPLEMENTAL_RECEIPT_PATH"
          > .ci/product-state-inputs/product-state-build-report.json

      - name: Validate current product-state schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          schema = json.loads(
              Path("canonical/product-state.current.v1.schema.json").read_text()
          )
          product_state = json.loads(Path(os.environ["PRODUCT_STATE_PATH"]).read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(product_state)
          PY

      - name: Verify current-main binding, outcome, and bounded authority
        shell: bash
        env:
          OBSERVED_MAIN_SHA: ${{ steps.observe_main.outputs.sha }}
          PRODUCT_STATE_BUILD_OUTCOME: ${{ steps.build_state.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/manifests/product_state.current.v1.json").read_text()
          )
          conclusion = os.environ["PRODUCT_STATE_CONCLUSION"]
          build_outcome = os.environ["PRODUCT_STATE_BUILD_OUTCOME"]
          observed_main_sha = os.environ["OBSERVED_MAIN_SHA"]
          source_sha = os.environ["PRODUCT_STATE_SHA"]
          assert payload["source_commit_sha"] == source_sha
          assert payload["observed_github_main_sha"] == observed_main_sha
          assert payload["observed_github_main_source"] == "github_api_refs_heads_main_pre_build"
          assert payload["quality_evidence"]["workflow_name"] == "Nightly Full Quality"
          assert payload["quality_evidence"]["conclusion"] == conclusion
          assert payload["quality_evidence"]["head_sha"] == source_sha
          assert payload["source_matches_observed_github_main"] is (
              source_sha == observed_main_sha
          )
          assert payload["product_profile"] == "repository_integrity_developer_preview"
          assert payload["release_authority"] is False
          assert payload["historical_state"]["git_object_verification"] == "passed"
          if source_sha != observed_main_sha:
              assert build_outcome == "failure"
              assert payload["status"] == "blocked"
              assert payload["contract_pass"] is False
              assert "source_commit_does_not_match_observed_github_main" in payload["blockers"]
              assert payload["quality_evidence"]["status"] == "invalid"
              assert "nightly_full_quality_evidence_invalid:head_sha" in payload["blockers"]
          elif conclusion == "success":
              assert build_outcome == "success"
              assert payload["contract_pass"] is True
              assert payload["quality_evidence"]["status"] == "available"
              assert not any(
                  blocker.startswith("nightly_full_quality_")
                  for blocker in payload["blockers"]
              )
          else:
              assert build_outcome == "failure"
              assert payload["contract_pass"] is False
              assert payload["quality_evidence"]["status"] == "available"
              assert f"nightly_full_quality_not_success:{conclusion}" in payload["blockers"]
              assert not any(
                  blocker.startswith("nightly_full_quality_evidence_invalid:")
                  for blocker in payload["blockers"]
              )
          PY

      - name: Write and validate full exact-SHA generated-artifact DAG
        shell: bash
        run: |
          if ! python scripts/check_generated_artifact_dag.py \
              --write-state "$DAG_STATE_PATH" \
              --report "$DAG_REPORT_PATH" \
              --product-state-nightly-event "$NIGHTLY_WORKFLOW_RUN_EVENT_PATH"; then
            cat "$DAG_REPORT_PATH"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          state = json.loads(Path(os.environ["DAG_STATE_PATH"]).read_text())
          report = json.loads(Path(os.environ["DAG_REPORT_PATH"]).read_text())
          state_schema = json.loads(Path("canonical/generated-artifact-dag-state.v2.schema.json").read_text())
          report_schema = json.loads(Path("canonical/generated-artifact-dag-report.v2.schema.json").read_text())
          jsonschema.Draft202012Validator(state_schema).validate(state)
          jsonschema.Draft202012Validator(report_schema).validate(report)
          assert state["state_kind"] == "full"
          assert state["evaluated_through"] == "product-state"
          assert report["scope_pass"] is True
          assert report["contract_pass"] is True
          assert report["stale_nodes"] == []
          assert all(
              row["current_binding"]["status"] == "current"
              for row in report["nodes"].values()
          )
          PY

      - name: Build exact-SHA product-state provenance bundle
        run: >-
          python scripts/build_product_state_provenance_bundle.py
          --source-sha "$PRODUCT_STATE_SHA"
          --product-state "$PRODUCT_STATE_PATH"
          --canonical-receipt "$CANONICAL_RECEIPT_PATH"
          --canonical-wheel-contract "$CANONICAL_WHEEL_CONTRACT_PATH"
          --canonical-wheel "$CANONICAL_WHEEL_PATH"
          --dag-state "$DAG_STATE_PATH"
          --dag-report "$DAG_REPORT_PATH"
          --canonical-workflow-run .ci/product-state-inputs/canonical-verification-workflow-run.json
          --nightly-workflow-run-event "$NIGHTLY_WORKFLOW_RUN_EVENT_PATH"
          --product-state-workflow-sha "$PRODUCT_STATE_WORKFLOW_SHA"
          --product-state-workflow-ref "$PRODUCT_STATE_WORKFLOW_REF"
          --product-state-workflow-name "$PRODUCT_STATE_WORKFLOW_NAME"
          --product-state-workflow-event "$PRODUCT_STATE_WORKFLOW_EVENT"
          --product-state-workflow-run-id "$PRODUCT_STATE_WORKFLOW_RUN_ID"
          --product-state-workflow-run-number "$PRODUCT_STATE_WORKFLOW_RUN_NUMBER"
          --product-state-workflow-run-attempt "$PRODUCT_STATE_WORKFLOW_RUN_ATTEMPT"
          --out "$PRODUCT_STATE_PROVENANCE_PATH"

      - name: Confirm main observation is stable before attestation
        shell: bash
        run: |
          current_main_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$current_main_sha" = "$PRODUCT_STATE_SHA"

      - name: Attest exact-SHA product state
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.PRODUCT_STATE_PATH }}

      - name: Retain and verify product-state attestation
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$PRODUCT_STATE_ATTESTATION_BUNDLE"
          gh attestation verify "$PRODUCT_STATE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PRODUCT_STATE_ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" \
            --signer-digest "$PRODUCT_STATE_WORKFLOW_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$PRODUCT_STATE_ATTESTATION_VERIFICATION"

      - name: Attest exact-SHA product-state provenance bundle
        id: attest_provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.PRODUCT_STATE_PROVENANCE_PATH }}

      - name: Retain and verify provenance-bundle attestation
        shell: bash
        run: |
          cp "${{ steps.attest_provenance.outputs.bundle-path }}" \
            "$PRODUCT_STATE_PROVENANCE_ATTESTATION_BUNDLE"
          gh attestation verify "$PRODUCT_STATE_PROVENANCE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PRODUCT_STATE_PROVENANCE_ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" \
            --signer-digest "$PRODUCT_STATE_WORKFLOW_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$PRODUCT_STATE_PROVENANCE_ATTESTATION_VERIFICATION"

      - name: Upload current and historical product-state manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-state-current-${{ env.PRODUCT_STATE_CONCLUSION }}-${{ env.PRODUCT_STATE_SHA }}
          path: |
            artifacts/manifests/product_state.current.v1.json
            artifacts/manifests/product_state.history.v1.json
            artifacts/manifests/product_state.legacy-sources.v1.json
            artifacts/manifests/bounded_planar_external_vv_matrix.current.v1.json
            artifacts/manifests/internal_license_due_diligence.current.v1.json
            artifacts/manifests/canonical_verification_environment.current.v1.json
            canonical/product-state.current.v1.schema.json
            .github/workflows/product-state-current.yml
            ${{ env.CANONICAL_WHEEL_CONTRACT_PATH }}
            ${{ env.CANONICAL_WHEEL_PATH }}
            artifacts/vv/bounded_planar_external_linear_case_package
            artifacts/vv/bounded_planar_external_negative_case_package
            artifacts/vv/bounded_planar_external_scaling_case_package
            artifacts/vv/bounded_planar_external_modal_buckling_case_package
            artifacts/vv/bounded_planar_external_nonlinear_material_recovery_case_package
            .ci/product-state-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
