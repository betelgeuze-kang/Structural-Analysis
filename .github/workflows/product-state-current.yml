          if external.get("status") != "unavailable" or external.get("evidence") != expected_external_evidence: fail("external_promotion_contract_invalid")
          matrix = product.get("bounded_planar_external_vv", {})
          matrix_claims = {"independent_operator_attested", "legal_use_approved", "formal_promotion_receipt_attached", "bounded_planar_profile_level_2"}
          for field in ("claims", "stored_claims"):
              claims = matrix.get(field)
              if type(claims) is not dict or not matrix_claims <= set(claims) or any(claims[key] is not False for key in matrix_claims): fail(f"matrix_authority_claims_invalid:{field}")
          license_track = authority_tracks.get("internal_license_due_diligence", {})
          license_claims = license_track.get("claims")
          required_license_claims = {"third_party_material_clearance_complete", "external_runtime_redistribution_approved", "external_benchmark_redistribution_approved", "product_commercial_redistribution_approved", "product_legal_approval", "formal_verification_level_2", "release_authority"}
          if type(license_claims) is not dict or not required_license_claims <= set(license_claims) or any(license_claims[key] is not False for key in required_license_claims): fail("internal_license_authority_claims_invalid")
          grants = license_track.get("does_not_grant")
          if type(grants) is not list or not {"product_legal_license_approval", "commercial_redistribution_approval", "independent_verification_level_2", "release_authority"} <= set(grants): fail("internal_license_boundary_invalid")
          if provenance.get("source_commit_sha") != source_sha or provenance.get("bundle_integrity_pass") is not True or provenance.get("release_authority") is not False: fail("provenance_authority_invalid")
          reject_promoted_authority(provenance)
          if digest(str(provenance.get("claim_boundary", "")).encode()) != "sha256:7e64826d3036d506e0c88c018a1c8542c81e5693915b6ea8293149468289b9e0": fail("provenance_claim_boundary_invalid")
          product_contract = provenance.get("contracts", {}).get("product_state", {})
          if product_contract.get("release_authority") is not False or product_contract.get("release_eligible") is not False or product_contract.get("external_promotion_status") != "unavailable" or product_contract.get("authority_claims_nonpromoting") is not True or product_contract.get("claim_boundary_sha256") != "sha256:e7d4347adbb32dea5ad315f43fa01783d3f77e6e0f1caa9485b7908d89778e4b": fail("provenance_product_boundary_invalid")
          product_schema_artifact = provenance.get("artifacts", {}).get("product_state_schema", {})
          product_schema_raw = files["canonical/product-state.current.v1.schema.json"]
          if product_schema_artifact != {"path": "canonical/product-state.current.v1.schema.json", "sha256": digest(product_schema_raw), "byte_length": len(product_schema_raw)}: fail("provenance_product_schema_invalid")
          overlay_contract = provenance.get("contracts", {}).get("post_main_overlay", {})
          effective_claim_keys = {"independent_operator_attested", "verification_hierarchy_operator_manifest_attached", "verification_hierarchy_credit", "product_legal_license_approval", "external_runtime_redistribution_approval", "commercial_redistribution_approved", "formal_verification_level_2", "commercial_equivalence", "design_authority", "release_readiness", "release_authority"}
          expected_effective_claims = {key: False for key in effective_claim_keys}
          if overlay_contract.get("contract_pass") is not True or overlay_contract.get("technical_handoff_promotion_eligible") is not False or overlay_contract.get("external_vv_promotion_eligible") is not False or overlay_contract.get("external_vv_effective_claims") != expected_effective_claims: fail("provenance_overlay_boundary_invalid")
          if dag_report.get("contract_pass") is not True or dag_report.get("stale_nodes") != []: fail("dag_report_invalid")
          overlay_nonpromotion = overlay.get("external_vv_nonpromotion", {})
          reject_promoted_authority(overlay)
          if overlay.get("source", {}).get("commit_sha") != source_sha or overlay.get("producer", {}).get("run_id") != nightly_run_id or overlay.get("producer", {}).get("run_attempt") != nightly_run_attempt or overlay.get("contract_pass") is not True or overlay.get("technical_handoff_contracts", {}).get("promotion_eligible") is not False or overlay_nonpromotion.get("promotion_eligible") is not False or overlay_nonpromotion.get("effective_claims") != expected_effective_claims or digest(str(overlay.get("claim_boundary", "")).encode()) != "sha256:de844d427c210a0967b1c25c086c423b5aa02c140d800751294808de34e32c4f": fail("post_main_overlay_invalid")
          receipt_contracts = {
              "implementation/phase1/release_evidence/productization/external_code_to_code_technical_execution_receipt.json": (".ci/product-state-inputs/code-to-code-receipt.json", "src/structural_analysis/schemas/external_code_to_code_technical_receipt_v1.schema.json", "external-code-to-code-technical-execution.v1", "external_code_to_code_technical_execution", "sha256:2c3877649b94ddd250ec2f5d4690f18c13b126db274c31c43b0232763fb0fd7a"),
              "implementation/phase1/release_evidence/productization/external_modal_buckling_technical_execution_receipt.json": (".ci/product-state-inputs/modal-buckling-receipt.json", "src/structural_analysis/schemas/external_modal_buckling_technical_receipt_v1.schema.json", "external-modal-buckling-technical-execution.v1", "external_code_to_code_modal_buckling_technical_execution", "sha256:46381abd9eee13c5b02986f21f49251f47c856c711e23581b9b57032e0457f31"),
          }
          receipt_rows = overlay_nonpromotion.get("receipts")
          if type(receipt_rows) is not list or len(receipt_rows) != 2 or {row.get("source_path") for row in receipt_rows if type(row) is dict} != set(receipt_contracts): fail("external_receipt_rows_invalid")
          nonpromoting_receipt_claims = {"commercial_equivalence", "commercial_redistribution_approved", "design_authority", "external_runtime_redistribution_approval", "product_legal_license_approval", "product_legal_approval", "release_readiness", "release_authority", "verification_level_2", "formal_verification_level_2", "independent_operator_attested"}
          for row in receipt_rows:
              if type(row) is not dict or set(row) != {"source_path","overlay_path","product_state_input_path","schema_version","schema_path","schema_blob_sha","schema_sha256","bytes","sha256","technical_contract_pass","promotion_eligible"}: fail("external_receipt_row_shape_invalid")
              source_path = row["source_path"]
              product_input, schema_path, schema_version, truth_class, boundary_hash = receipt_contracts[source_path]
              overlay_path = f"external-vv-nonpromoting/{PurePosixPath(source_path).name}"
              archive_path = f".ci/product-state-inputs/post-main-overlay/{overlay_path}"
              raw = files.get(archive_path)
              if type(raw) is not bytes or raw != files.get(product_input) or row.get("overlay_path") != overlay_path or row.get("product_state_input_path") != product_input or row.get("schema_path") != schema_path or row.get("schema_version") != schema_version or row.get("bytes") != len(raw) or row.get("sha256") != digest(raw) or row.get("promotion_eligible") is not False: fail("external_receipt_identity_invalid")
              schema_raw, schema_blob = external_schema_raw[schema_path]
              if row.get("schema_blob_sha") != schema_blob or row.get("schema_sha256") != digest(schema_raw): fail("external_receipt_schema_identity_invalid")
              receipt = load(raw, source_path)
              receipt_schema = load(schema_raw, schema_path)
              schema_properties = receipt_schema.get("properties")
              schema_required = receipt_schema.get("required")
              if receipt_schema.get("type") != "object" or receipt_schema.get("additionalProperties") is not False or type(schema_properties) is not dict or type(schema_required) is not list or set(receipt) != set(schema_properties) or not set(schema_required) <= set(receipt): fail("external_receipt_schema_shape_invalid")
              if receipt.get("schema_version") != schema_version or receipt.get("truth_class") != truth_class or receipt.get("source_commit_sha") != source_sha or type(receipt.get("technical_contract_pass")) is not bool or row.get("technical_contract_pass") is not receipt["technical_contract_pass"]: fail("external_receipt_contract_invalid")
