      - name: Re-fetch and seal the published final artifact by REST identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ID: ${{ steps.upload_final.outputs.artifact-id }}
          FINAL_DIGEST: ${{ format('sha256:{0}', steps.upload_final.outputs.artifact-digest) }}
          FINAL_NAME: product-state-current-${{ env.PRODUCT_STATE_CONCLUSION }}-${{ env.PRODUCT_STATE_SHA }}
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          SIGNED_ID: ${{ needs.attest-current-state.outputs.signed-id }}
          SIGNED_DIGEST: ${{ needs.attest-current-state.outputs.signed-digest }}
          SIGNED_NAME: ${{ needs.attest-current-state.outputs.signed-name }}
        run: |
          set -euo pipefail
          [[ "$FINAL_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FINAL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$FINAL_NAME" = "product-state-current-$PRODUCT_STATE_CONCLUSION-$PRODUCT_STATE_SHA"
          test "$SIGNED_NAME" = "product-state-signed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRODUCT_STATE_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/final-main-post-publish.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$NIGHTLY_RUN_ID" > "$RUNNER_TEMP/final-nightly-run.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_ID" > "$RUNNER_TEMP/signed-api.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_ID/zip" > "$RUNNER_TEMP/signed.zip"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/final-artifacts.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_ID" > "$RUNNER_TEMP/final-artifact-api.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_ID/zip" > "$RUNNER_TEMP/final-artifact.zip"
          FINAL_ROOT="$RUNNER_TEMP/signed-product-state" python -I - <<'PY'
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import struct
          import unicodedata
          import zipfile

          def fail(reason): raise SystemExit(reason)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: fail(f"duplicate_json_key:{key}")
                  result[key] = value
              return result
          def reject(token): fail(f"nonfinite_json_number:{token}")
          def finite(token):
              value = float(token)
              if not math.isfinite(value): fail(f"nonfinite_json_number:{token}")
              return value
          def load_raw(raw, label, object_required=True):
              try: value = json.loads(raw, object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
              except (UnicodeError, json.JSONDecodeError, ValueError) as exc: fail(f"strict_json_invalid:{label}:{exc}")
              if object_required and type(value) is not dict: fail(f"json_object_required:{label}")
              return value
          def load(path, label): return load_raw(Path(path).read_bytes(), label)
          def digest(raw): return "sha256:" + hashlib.sha256(raw).hexdigest()
          def portable_path_unsafe(path):
              for part in path.parts:
                  stem = part.split(".", 1)[0].casefold()
                  if part.endswith((".", " ")) or stem in {"con", "prn", "aux", "nul", "clock$", "conin$", "conout$"} or (len(stem) == 4 and stem[:3] in {"com", "lpt"} and stem[3] in "123456789"):
                      return True
              return False
          def validate_extra(extra):
              cursor = 0
              seen = set()
              while cursor < len(extra):
                  if len(extra) - cursor < 4: fail("final_zip_extra_field_truncated")
                  field_id, size = struct.unpack_from("<HH", extra, cursor)
                  cursor += 4
                  end = cursor + size
                  if end > len(extra) or field_id in seen: fail("final_zip_extra_field_invalid")
                  body = extra[cursor:end]
                  if field_id == 0x5455:
                      if len(body) != 5 or not body[0] & 1 or body[0] & ~7: fail("final_zip_timestamp_extra_invalid")
                  elif field_id == 0x7875:
                      if len(body) < 5 or body[0] != 1: fail("final_zip_uid_gid_extra_invalid")
                      uid_size = body[1]
                      uid_end = 2 + uid_size
                      if not 1 <= uid_size <= 4 or uid_end >= len(body): fail("final_zip_uid_gid_extra_invalid")
                      gid_size = body[uid_end]
                      if not 1 <= gid_size <= 4 or uid_end + 1 + gid_size != len(body): fail("final_zip_uid_gid_extra_invalid")
                  else: fail(f"final_zip_extra_field_unsupported:{field_id:04x}")
                  seen.add(field_id)
                  cursor = end
          def archive_members(raw_archive, label):
              files = {}
              total = 0
              collisions = set()
              try:
                  archive_context = zipfile.ZipFile(io.BytesIO(raw_archive))
              except (OSError, zipfile.BadZipFile) as exc:
                  fail(f"{label}_zip_invalid:{exc}")
              with archive_context as archive:
                  members = archive.infolist()
                  if not 1 <= len(members) <= 6010: fail(f"{label}_zip_entry_count_invalid")
                  for member in members:
                      validate_extra(member.extra)
                      name = member.filename
                      path = PurePosixPath(name)
                      folded = unicodedata.normalize("NFC", name).casefold()
                      mode = (member.external_attr >> 16) & 0xffff
                      if not name or len(name) > 2048 or unicodedata.normalize("NFC", name) != name or unicodedata.normalize("NFKC", name) != name or any(unicodedata.category(character) in {"Cc","Cf"} for character in name) or "\\" in name or "\0" in name or any(character in name for character in '<>:"|?*') or path.is_absolute() or path.as_posix() != name or any(part in {"", ".", ".."} for part in path.parts) or portable_path_unsafe(path) or folded in collisions or member.is_dir() or stat.S_IFMT(mode) not in {0, stat.S_IFREG} or member.flag_bits & 1 or member.create_system != 3 or member.create_version not in {20, 45} or member.extract_version != 20 or member.compress_type not in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED} or not 0 < member.file_size <= 300_000_000: fail(f"{label}_zip_member_invalid:{name}")
                      collisions.add(folded)
                      total += member.file_size
                      if total > 1_200_000_000: fail(f"{label}_zip_expansion_limit")
                      raw = archive.read(member)
                      if len(raw) != member.file_size: fail(f"{label}_zip_member_size_changed:{name}")
                      files[name] = raw
              return files
          def verified_attestation_subject(raw, label, expected_name, expected_raw):
              report = load_raw(raw, label, object_required=False)
              if type(report) is not list or len(report) != 1 or type(report[0]) is not dict: fail(f"{label}_shape_invalid")
              verification = report[0].get("verificationResult")
              if type(verification) is not dict or type(verification.get("signature")) is not dict or type(verification["signature"].get("certificate")) is not dict or not verification["signature"]["certificate"] or type(verification.get("verifiedTimestamps")) is not list or not verification["verifiedTimestamps"]: fail(f"{label}_verification_invalid")
              statement = verification.get("statement")
              if type(statement) is not dict or set(statement) != {"_type", "subject", "predicateType", "predicate"} or statement.get("_type") != "https://in-toto.io/Statement/v1" or statement.get("predicateType") != "https://slsa.dev/provenance/v1": fail(f"{label}_statement_invalid")
              expected_subject = [{"name": expected_name, "digest": {"sha256": hashlib.sha256(expected_raw).hexdigest()}}]
              if statement.get("subject") != expected_subject: fail(f"{label}_subject_invalid")
              return statement
          final_id = int(os.environ["FINAL_ID"])
          inventory = load(Path(os.environ["RUNNER_TEMP"], "final-artifacts.json"), "final_inventory")
          rows = inventory.get("artifacts")
          if type(rows) is not list or len(rows) > 100 or inventory.get("total_count") != len(rows) or any(type(row) is not dict for row in rows): fail("final_artifact_inventory_invalid")
          matches = [row for row in rows if row.get("id") == final_id and row.get("name") == os.environ["FINAL_NAME"]]
          if len(matches) != 1: fail("final_artifact_inventory_ambiguous")
          api = load(Path(os.environ["RUNNER_TEMP"], "final-artifact-api.json"), "final_artifact_api")
          identity_keys = ("id","name","digest","size_in_bytes","archive_download_url","expired","workflow_run")
          if any(matches[0].get(key) != api.get(key) for key in identity_keys): fail("final_artifact_list_direct_mismatch")
          expected_url = f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{final_id}/zip"
          final_run = api.get("workflow_run", {})
          if api.get("id") != final_id or api.get("name") != os.environ["FINAL_NAME"] or api.get("digest") != os.environ["FINAL_DIGEST"] or type(api.get("size_in_bytes")) is not int or not 0 < api["size_in_bytes"] <= 1_200_000_000 or api.get("archive_download_url") != expected_url or api.get("expired") is not False or final_run.get("id") != int(os.environ["GITHUB_RUN_ID"]) or final_run.get("head_branch") != "main" or final_run.get("head_sha") != os.environ["PRODUCT_STATE_SHA"]: fail("final_artifact_api_identity_invalid")
          raw_archive = Path(os.environ["RUNNER_TEMP"], "final-artifact.zip").read_bytes()
          if len(raw_archive) != api["size_in_bytes"] or digest(raw_archive) != api["digest"]: fail("final_artifact_raw_zip_identity_invalid")
          archive_files = archive_members(raw_archive, "final")
          root = Path(os.environ["FINAL_ROOT"])
          disk_files = {path.relative_to(root).as_posix(): path.read_bytes() for path in root.rglob("*") if path.is_file()}
          if set(archive_files) != set(disk_files) or any(raw != disk_files[name] for name, raw in archive_files.items()): fail("final_artifact_uploaded_bytes_mismatch")
          seal_raw = archive_files.get("product-state-candidate.seal.json")
          if type(seal_raw) is not bytes: fail("final_candidate_seal_missing")
          nightly = load(Path(os.environ["RUNNER_TEMP"], "final-nightly-run.json"), "final_nightly_run")
          event = load_raw(archive_files[".ci/product-state-inputs/nightly-workflow-run-event.json"], "final_nightly_event")
          stored_nightly = load_raw(archive_files[".ci/product-state-inputs/nightly-overlay-run.json"], "final_stored_nightly")
          event_run = event.get("workflow_run")
          nightly_keys = ("id","run_number","run_attempt","name","path","event","conclusion","head_branch","head_sha")
          if type(event_run) is not dict or nightly.get("status") != "completed" or nightly.get("id") != int(os.environ["NIGHTLY_RUN_ID"]) or nightly.get("head_branch") != "main" or nightly.get("head_sha") != os.environ["PRODUCT_STATE_SHA"] or any(event_run.get(key) != nightly.get(key) or stored_nightly.get(key) != nightly.get(key) for key in nightly_keys): fail("final_nightly_rest_signed_bytes_mismatch")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["SIGNED_DIGEST"]): fail("signed_digest_invalid")
          signed_archive = Path(os.environ["RUNNER_TEMP"], "signed.zip").read_bytes()
          if digest(signed_archive) != os.environ["SIGNED_DIGEST"]: fail("signed_archive_replay_digest_invalid")
          signed_api = load(Path(os.environ["RUNNER_TEMP"], "signed-api.json"), "signed_artifact_api")
          signed_url = f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['SIGNED_ID']}/zip"
          signed_run = signed_api.get("workflow_run", {})
          if signed_api.get("id") != int(os.environ["SIGNED_ID"]) or signed_api.get("name") != os.environ["SIGNED_NAME"] or signed_api.get("digest") != os.environ["SIGNED_DIGEST"] or signed_api.get("size_in_bytes") != len(signed_archive) or signed_api.get("archive_download_url") != signed_url or signed_api.get("expired") is not False or signed_run.get("id") != int(os.environ["GITHUB_RUN_ID"]) or signed_run.get("head_branch") != "main" or signed_run.get("head_sha") != os.environ["PRODUCT_STATE_SHA"]: fail("signed_artifact_final_replay_identity_invalid")
          signed_files = archive_members(signed_archive, "signed")
          if signed_files.get("product-state-candidate.seal.json") != seal_raw: fail("final_candidate_seal_signed_bytes_mismatch")
          seal = load_raw(seal_raw, "candidate_seal")
          seal_keys = {"schema_version","repository","source_commit_sha","source_tree_sha","source_ref","workflow_path","workflow_blob_sha","workflow_run_id","workflow_run_number","workflow_run_attempt","files","release_authority","claim_boundary"}
          if type(seal) is not dict or set(seal) != seal_keys or seal.get("schema_version") != "product-state-candidate-seal.v1" or seal.get("repository") != os.environ["GITHUB_REPOSITORY"] or seal.get("source_commit_sha") != os.environ["PRODUCT_STATE_SHA"] or seal.get("source_ref") != "refs/heads/main" or seal.get("workflow_path") != ".github/workflows/product-state-current.yml" or seal.get("workflow_run_id") != int(os.environ["GITHUB_RUN_ID"]) or seal.get("workflow_run_number") != int(os.environ["GITHUB_RUN_NUMBER"]) or seal.get("workflow_run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"]) or seal.get("release_authority") is not False: fail("final_candidate_seal_identity_invalid")
          seal_rows = seal.get("files")
          if type(seal_rows) is not list or not seal_rows or len(seal_rows) > 6000: fail("final_candidate_seal_rows_invalid")
          signed_additions = {
              "product-state-candidate.seal.json",
              "candidate-artifact-api.json",
              ".ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json",
          }
          final_additions = {
              ".ci/product-state-inputs/product-state.current.attestation-verification.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json",
              ".ci/product-state-inputs/post-main-overlay-final-attestation-verification.json",
          }
          sealed_files = {}
          for row in seal_rows:
              if type(row) is not dict or set(row) != {"path", "bytes", "sha256"}: fail("final_candidate_seal_row_shape_invalid")
              name = row.get("path")
              if type(name) is not str or name in signed_additions or name in final_additions or name in sealed_files or name not in signed_files or type(row.get("bytes")) is not int or not 0 < row["bytes"] <= 300_000_000 or not isinstance(row.get("sha256"), str) or re.fullmatch(r"sha256:[0-9a-f]{64}", row["sha256"]) is None: fail("final_candidate_seal_row_identity_invalid")
              raw = signed_files[name]
              if len(raw) != row["bytes"] or digest(raw) != row["sha256"] or archive_files.get(name) != raw: fail(f"final_candidate_seal_row_bytes_invalid:{name}")
              sealed_files[name] = raw
          if [row["path"] for row in seal_rows] != sorted(sealed_files): fail("final_candidate_seal_rows_not_canonical")
          if set(signed_files) != set(sealed_files) | signed_additions: fail("final_signed_artifact_member_set_not_sealed")
          if set(archive_files) != set(signed_files) | final_additions: fail("final_artifact_unapproved_member_set")
          if any(archive_files.get(name) != raw for name, raw in signed_files.items()): fail("final_artifact_replaced_signed_member")
          verified_attestation_subject(archive_files[".ci/product-state-inputs/product-state.current.attestation-verification.json"], "final_product_attestation", "product_state.current.v1.json", archive_files["artifacts/manifests/product_state.current.v1.json"])
          verified_attestation_subject(archive_files[".ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json"], "final_provenance_attestation", "product-state.provenance-bundle.v1.json", archive_files[".ci/product-state-inputs/product-state.provenance-bundle.v1.json"])
          verified_attestation_subject(archive_files[".ci/product-state-inputs/post-main-overlay-final-attestation-verification.json"], "final_overlay_attestation", "post-main-evidence-overlay.seal.json", archive_files[".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json"])
          seal_attestation_report = Path(os.environ["RUNNER_TEMP"], "product-state-candidate.seal.attestation-verification.json").read_bytes()
          verified_attestation_subject(seal_attestation_report, "candidate_seal_attestation", "product-state-candidate.seal.json", seal_raw)
          def verified_main_ref(path, label):
              ref = load(path, label)
              if ref.get("ref") != "refs/heads/main" or ref.get("object", {}).get("type") != "commit" or ref.get("object", {}).get("sha") != os.environ["PRODUCT_STATE_SHA"]: fail(f"{label}_not_exact_source")
              return ref["object"]["sha"]
          pre_main_sha = verified_main_ref(Path(os.environ["RUNNER_TEMP"], "final-main-pre-publish.json"), "pre_publish_main_ref")
          post_main_sha = verified_main_ref(Path(os.environ["RUNNER_TEMP"], "final-main-post-publish.json"), "post_publish_main_ref")
          manifest = [{"path": name, "bytes": len(raw), "sha256": digest(raw)} for name, raw in sorted(archive_files.items())]
          report = {
              "schema_version": "product-state-final-artifact-verification.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit_sha": os.environ["PRODUCT_STATE_SHA"],
              "workflow_path": ".github/workflows/product-state-current.yml",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "main_ref_before_publish": pre_main_sha,
              "main_ref_after_publish": post_main_sha,
              "nightly_run": {key: nightly[key] for key in ("id", "run_number", "run_attempt", "name", "path", "event", "conclusion", "head_branch", "head_sha")},
              "signed_artifact": {"id": int(os.environ["SIGNED_ID"]), "name": os.environ["SIGNED_NAME"], "digest": os.environ["SIGNED_DIGEST"], "raw_zip_bytes": len(signed_archive), "raw_zip_sha256": digest(signed_archive)},
              "final_artifact": {key: api[key] for key in identity_keys},
              "raw_zip_bytes": len(raw_archive),
              "raw_zip_sha256": digest(raw_archive),
              "candidate_seal_sha256": digest(seal_raw),
              "candidate_seal_attestation_verification_bytes": len(seal_attestation_report),
              "candidate_seal_attestation_verification_sha256": digest(seal_attestation_report),
              "files": manifest,
              "technical_integrity_pass": True,
              "release_authority": False,
              "claim_boundary": "Final artifact byte-integrity verification only; no release, legal, design, commercial, redistribution, or independent-verification authority is granted.",
          }
          Path(os.environ["RUNNER_TEMP"], "product-state-final-artifact-verification.v1.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Cryptographically replay final artifact attestations without repository code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/final-attestation-replay"
          mkdir -p "$verify_root"
          VERIFY_ROOT="$verify_root" python -I - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          wanted = {
              "artifacts/manifests/product_state.current.v1.json": "product-state.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json": "product-state.sigstore.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.v1.json": "provenance.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json": "provenance.sigstore.json",
              ".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json": "overlay-seal.json",
              ".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.sigstore.json": "overlay.sigstore.json",
              "product-state-candidate.seal.json": "candidate-seal.json",
              ".ci/product-state-inputs/product-state.current.attestation-verification.json": "product-state.embedded.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json": "provenance.embedded.json",
              ".ci/product-state-inputs/post-main-overlay-final-attestation-verification.json": "overlay-final.embedded.json",
              ".ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json": "overlay-privileged.embedded.json",
          }
          root = Path(os.environ["VERIFY_ROOT"])
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"], "final-artifact.zip")) as archive:
              names = {item.filename for item in archive.infolist()}
              if not set(wanted) <= names:
                  raise SystemExit("final_attestation_replay_subject_missing")
              for source, target in wanted.items():
                  raw = archive.read(source)
                  if not raw or len(raw) > 300_000_000:
                      raise SystemExit("final_attestation_replay_subject_invalid")
                  (root / target).write_bytes(raw)
          PY
          gh attestation verify "$verify_root/product-state.json" --repo "$GITHUB_REPOSITORY" --bundle "$verify_root/product-state.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$verify_root/product-state.replay.json"
          gh attestation verify "$verify_root/provenance.json" --repo "$GITHUB_REPOSITORY" --bundle "$verify_root/provenance.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$verify_root/provenance.replay.json"
          gh attestation verify "$verify_root/overlay-seal.json" --repo "$GITHUB_REPOSITORY" --bundle "$verify_root/overlay.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-full-quality.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$verify_root/overlay.replay.json"
          gh attestation verify "$verify_root/candidate-seal.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$verify_root/candidate-seal.replay.json"
          test -s "$verify_root/product-state.replay.json"
          test -s "$verify_root/provenance.replay.json"
          test -s "$verify_root/overlay.replay.json"
          test -s "$verify_root/candidate-seal.replay.json"
          cmp --silent "$verify_root/product-state.replay.json" "$verify_root/product-state.embedded.json"
          cmp --silent "$verify_root/provenance.replay.json" "$verify_root/provenance.embedded.json"
          cmp --silent "$verify_root/overlay.replay.json" "$verify_root/overlay-final.embedded.json"
          cmp --silent "$verify_root/overlay.replay.json" "$verify_root/overlay-privileged.embedded.json"
          cmp --silent "$verify_root/candidate-seal.replay.json" "$RUNNER_TEMP/product-state-candidate.seal.attestation-verification.json"

      - name: Upload final REST verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-state-final-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PRODUCT_STATE_SHA }}
          path: ${{ runner.temp }}/product-state-final-artifact-verification.v1.json
          if-no-files-found: error
          retention-days: 90

  replay-final-attestations:
    needs: verify-current-state
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Replay published attestations in isolated no-checkout job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.git"
          test -x /usr/bin/gh
          /usr/bin/gh version | /usr/bin/grep -E '^gh version [0-9]+\.[0-9]+\.[0-9]+'
          name="product-state-current-$PRODUCT_STATE_CONCLUSION-$PRODUCT_STATE_SHA"
          /usr/bin/gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          mapfile -t ids < <(/usr/bin/jq -r --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$RUNNER_TEMP/artifacts.json")
          test "${#ids[@]}" -eq 1
          /usr/bin/gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/${ids[0]}/zip" > "$RUNNER_TEMP/final.zip"
          root="$RUNNER_TEMP/replay"
          mkdir -p "$root"
          ROOT="$root" /usr/bin/python3 -I - <<'PY'
          import os, zipfile
          from pathlib import Path
          wanted = {
              "artifacts/manifests/product_state.current.v1.json":"product.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json":"product.sigstore.json",
              ".ci/product-state-inputs/product-state.current.attestation-verification.json":"product.embedded.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.v1.json":"provenance.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json":"provenance.sigstore.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json":"provenance.embedded.json",
              ".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json":"overlay.json",
              ".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.sigstore.json":"overlay.sigstore.json",
              ".ci/product-state-inputs/post-main-overlay-final-attestation-verification.json":"overlay-final.embedded.json",
              ".ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json":"overlay-privileged.embedded.json",
          }
          root=Path(os.environ["ROOT"])
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"],"final.zip")) as archive:
              if len(archive.infolist()) > 6010 or not set(wanted) <= set(archive.namelist()): raise SystemExit("isolated_replay_artifact_shape_invalid")
              for source,target in wanted.items():
                  raw=archive.read(source)
                  if not raw or len(raw)>300_000_000: raise SystemExit("isolated_replay_member_invalid")
                  (root/target).write_bytes(raw)
          PY
          /usr/bin/gh attestation verify "$root/product.json" --repo "$GITHUB_REPOSITORY" --bundle "$root/product.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$root/product.replay.json"
          /usr/bin/gh attestation verify "$root/provenance.json" --repo "$GITHUB_REPOSITORY" --bundle "$root/provenance.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$root/provenance.replay.json"
          /usr/bin/gh attestation verify "$root/overlay.json" --repo "$GITHUB_REPOSITORY" --bundle "$root/overlay.sigstore.json" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-full-quality.yml" --signer-digest "$PRODUCT_STATE_SHA" --source-digest "$PRODUCT_STATE_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json > "$root/overlay.replay.json"
          /usr/bin/cmp --silent "$root/product.replay.json" "$root/product.embedded.json"
          /usr/bin/cmp --silent "$root/provenance.replay.json" "$root/provenance.embedded.json"
          /usr/bin/cmp --silent "$root/overlay.replay.json" "$root/overlay-final.embedded.json"
          /usr/bin/cmp --silent "$root/overlay.replay.json" "$root/overlay-privileged.embedded.json"
