          direct = load(os.environ["POST_MAIN_OVERLAY_API"])
          identity_keys = ("id", "name", "digest", "size_in_bytes", "archive_download_url", "expired", "workflow_run")
          if any(inventory.get(key) != direct.get(key) for key in identity_keys):
              raise SystemExit("attested overlay list/direct API identity mismatch")
          artifact_id = int(os.environ["OVERLAY_ID"])
          expected_url = f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"
          if (
              direct.get("id") != artifact_id
              or direct.get("digest") != os.environ["OVERLAY_DIGEST"]
              or type(direct.get("size_in_bytes")) is not int
              or not 0 < direct["size_in_bytes"] <= 300_000_000
              or direct.get("archive_download_url") != expected_url
              or direct.get("expired") is not False
              or direct.get("workflow_run", {}).get("id") != int(os.environ["NIGHTLY_RUN_ID"])
          ):
              raise SystemExit("attested overlay direct API identity invalid")
          PY
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$overlay_id/zip" \
            > "$POST_MAIN_OVERLAY_ARCHIVE"
