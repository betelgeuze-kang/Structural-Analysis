      - name: Materialize exact-SHA canonical verification receipt
        shell: bash
        run: |
          mkdir -p .ci/canonical-receipt-download .ci/product-state-inputs
          canonical_run_id=""
          for attempt in {1..30}; do
            if ! gh api --method GET \
