          gh attestation verify "$root/.ci/product-state-inputs/product-state.provenance-bundle.v1.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$root/.ci/product-state-inputs/product-state.provenance-bundle.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/product-state-current.yml" \
