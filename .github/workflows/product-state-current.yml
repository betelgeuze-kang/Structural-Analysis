          api = json.loads(Path(os.environ["POST_MAIN_OVERLAY_API"]).read_text())
          if len(archive_raw) != api.get("size_in_bytes") or observed != os.environ["OVERLAY_DIGEST"] or observed != api.get("digest"):
              raise SystemExit("post-main overlay archive digest mismatch")
          root = Path(os.environ["POST_MAIN_OVERLAY_ROOT"])
          if root.exists() or root.is_symlink():
              raise SystemExit("post-main overlay extraction target already exists")
          root.mkdir(parents=True)
          files = {}
          collisions = set()
          total = 0
          def portable_path_unsafe(path):
              for part in path.parts:
                  stem = part.split(".", 1)[0].casefold()
                  if part.endswith((".", " ")) or stem in {"con", "prn", "aux", "nul", "clock$", "conin$", "conout$"} or (len(stem) == 4 and stem[:3] in {"com", "lpt"} and stem[3] in "123456789"):
                      return True
              return False
          def validate_extra(extra):
              cursor = 0
              seen = set()
              while cursor < len(extra):
                  if len(extra) - cursor < 4: raise SystemExit("ZIP extra field truncated")
