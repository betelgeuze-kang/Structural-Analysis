              artifact_hash = digest(json.dumps(material, allow_nan=False, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode())
              if receipt.get("artifact_hash") != artifact_hash or receipt.get("status") != ("partial" if receipt["technical_contract_pass"] else "blocked") or digest(str(receipt.get("claim_boundary", "")).encode()) != boundary_hash: fail("external_receipt_seal_invalid")
              receipt_claims = receipt.get("claims")
              if type(receipt_claims) is not dict or receipt.get("verification_hierarchy_operator_manifest_attached") is not False or receipt.get("verification_hierarchy_credit") is not False: fail("external_receipt_hierarchy_invalid")
              for key in nonpromoting_receipt_claims:
                  if key in receipt and receipt[key] is not False: fail(f"external_receipt_promoted:{key}")
                  if key in receipt_claims and receipt_claims[key] is not False: fail(f"external_receipt_promoted:{key}")
              runtimes = receipt.get("runtimes")
              if type(runtimes) is not dict or set(runtimes) != {"opensees", "calculix"}: fail("external_receipt_runtimes_invalid")
              for runtime in runtimes.values():
                  license_row = runtime.get("license") if type(runtime) is dict else None
                  if type(license_row) is not dict or license_row.get("product_legal_approval") is not False or license_row.get("commercial_redistribution_approved") is not False: fail("external_receipt_license_invalid")
              replay = receipt.get("replay_provenance")
              if type(replay) is not dict or replay.get("external_runtime_executed_in_this_generation") is not False or replay.get("external_execution_reused") is not True or replay.get("current_product_replay_pass") is not receipt["technical_contract_pass"] or type(replay.get("reuse_reason")) is not str or not replay["reuse_reason"].strip(): fail("external_receipt_replay_invalid")
              reject_promoted_authority(receipt)
          for name, raw in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          (root / "candidate-artifact-api.json").write_text(json.dumps(api, indent=2, sort_keys=True) + "\n")
          PY
          gh attestation verify \
            "$root/.ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$root/.ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-full-quality.yml" \
            --signer-digest "$PRODUCT_STATE_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json \
            > "$root/.ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json"
          name="product-state-signed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRODUCT_STATE_SHA"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest exact-SHA Product State
        id: attest_state
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ runner.temp }}/verified-product-state-candidate/artifacts/manifests/product_state.current.v1.json

      - name: Attest exact-SHA Product State provenance bundle
        id: attest_provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ runner.temp }}/verified-product-state-candidate/.ci/product-state-inputs/product-state.provenance-bundle.v1.json

      - name: Attest exact-SHA Product State candidate seal
        id: attest_candidate_seal
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ runner.temp }}/verified-product-state-candidate/product-state-candidate.seal.json

      - name: Retain both Sigstore bundles
        shell: bash
        run: |
          cp "${{ steps.attest_state.outputs.bundle-path }}" \
            "$RUNNER_TEMP/verified-product-state-candidate/.ci/product-state-inputs/product-state.current.sigstore.json"
          cp "${{ steps.attest_provenance.outputs.bundle-path }}" \
            "$RUNNER_TEMP/verified-product-state-candidate/.ci/product-state-inputs/product-state.provenance-bundle.sigstore.json"

      - name: Upload unchanged signed Product State candidate
        id: upload_signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/verified-product-state-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  verify-current-state:
    needs: attest-current-state
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact verification source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.PRODUCT_STATE_SHA }}

      - name: Verify pristine final source checkout
        run: |
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$PRODUCT_STATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.11"

      - name: Install exact verification dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Download signed artifact by immutable API identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ID: ${{ needs.attest-current-state.outputs.signed-id }}
          SIGNED_DIGEST: ${{ needs.attest-current-state.outputs.signed-digest }}
          SIGNED_NAME: ${{ needs.attest-current-state.outputs.signed-name }}
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SIGNED_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$SIGNED_NAME" = "product-state-signed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRODUCT_STATE_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_ID" > "$RUNNER_TEMP/signed-api.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_ID/zip" > "$RUNNER_TEMP/signed.zip"
          SIGNED_ROOT="$RUNNER_TEMP/signed-product-state" python -I - <<'PY'
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import struct
          import subprocess
          import unicodedata
          import zipfile

          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out: raise SystemExit(f"duplicate JSON key: {key}")
                  out[key] = value
              return out
          def reject(token): raise SystemExit(f"non-finite JSON number: {token}")
          def finite(token):
              value = float(token)
              if not math.isfinite(value): raise SystemExit(f"non-finite JSON number: {token}")
              return value
          api = json.loads(Path(os.environ["RUNNER_TEMP"], "signed-api.json").read_text(), object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
          expected_archive_url = f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['SIGNED_ID']}/zip"
          if api.get("id") != int(os.environ["SIGNED_ID"]) or api.get("name") != os.environ["SIGNED_NAME"] or api.get("digest") != os.environ["SIGNED_DIGEST"] or type(api.get("size_in_bytes")) is not int or not 0 < api["size_in_bytes"] <= 1_200_000_000 or api.get("archive_download_url") != expected_archive_url or api.get("expired") is not False or api.get("workflow_run", {}).get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("signed artifact API identity invalid")
          raw_archive = Path(os.environ["RUNNER_TEMP"], "signed.zip").read_bytes()
          if len(raw_archive) != api["size_in_bytes"] or "sha256:" + hashlib.sha256(raw_archive).hexdigest() != os.environ["SIGNED_DIGEST"]:
              raise SystemExit("signed artifact digest invalid")
          root = Path(os.environ["SIGNED_ROOT"])
          root.mkdir()
          total = 0
          collisions = set()
          observed = set()
          def portable_path_unsafe(path):
              for part in path.parts:
                  stem = part.split(".", 1)[0].casefold()
                  if part.endswith((".", " ")) or stem in {"con", "prn", "aux", "nul", "clock$", "conin$", "conout$"} or (len(stem) == 4 and stem[:3] in {"com", "lpt"} and stem[3] in "123456789"):
                      return True
              return False
          def validate_extra(extra):
              cursor = 0
              seen = set()
              while cursor < len(extra):
                  if len(extra) - cursor < 4: raise SystemExit("signed ZIP extra field truncated")
                  field_id, size = struct.unpack_from("<HH", extra, cursor)
                  cursor += 4
                  end = cursor + size
                  if end > len(extra) or field_id in seen: raise SystemExit("signed ZIP extra field invalid")
                  body = extra[cursor:end]
                  if field_id == 0x5455:
                      if len(body) != 5 or not body[0] & 1 or body[0] & ~7: raise SystemExit("signed ZIP timestamp extra invalid")
                  elif field_id == 0x7875:
                      if len(body) < 5 or body[0] != 1: raise SystemExit("signed ZIP UID/GID extra invalid")
                      uid_size = body[1]
                      uid_end = 2 + uid_size
                      if not 1 <= uid_size <= 4 or uid_end >= len(body): raise SystemExit("signed ZIP UID/GID extra invalid")
                      gid_size = body[uid_end]
                      if not 1 <= gid_size <= 4 or uid_end + 1 + gid_size != len(body): raise SystemExit("signed ZIP UID/GID extra invalid")
                  else: raise SystemExit(f"signed ZIP extra field unsupported: {field_id:04x}")
                  seen.add(field_id)
                  cursor = end
          with zipfile.ZipFile(io.BytesIO(raw_archive)) as archive:
              members = archive.infolist()
              if not 1 <= len(members) <= 6010: raise SystemExit("signed ZIP count invalid")
              for member in members:
                  validate_extra(member.extra)
                  name = member.filename
                  path = PurePosixPath(name)
                  folded = unicodedata.normalize("NFC", name).casefold()
                  mode = (member.external_attr >> 16) & 0xffff
                  if not name or len(name) > 2048 or unicodedata.normalize("NFC", name) != name or unicodedata.normalize("NFKC", name) != name or any(unicodedata.category(character) in {"Cc","Cf"} for character in name) or "\\" in name or "\0" in name or any(character in name for character in '<>:"|?*') or path.is_absolute() or path.as_posix() != name or any(part in {"", ".", ".."} for part in path.parts) or portable_path_unsafe(path) or folded in collisions or member.is_dir() or stat.S_IFMT(mode) not in {0, stat.S_IFREG} or member.flag_bits & 1 or member.create_system != 3 or member.create_version not in {20, 45} or member.extract_version != 20 or member.compress_type not in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED} or not 0 < member.file_size <= 300_000_000:
                      raise SystemExit(f"signed ZIP member invalid: {name!r}")
                  collisions.add(folded)
                  observed.add(name)
                  total += member.file_size
                  if total > 1_200_000_000: raise SystemExit("signed ZIP expansion invalid")
                  raw = archive.read(member)
                  if len(raw) != member.file_size:
                      raise SystemExit("signed ZIP member size changed")
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
          seal = json.loads((root / "product-state-candidate.seal.json").read_text(), object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
          seal_keys = {"schema_version","repository","source_commit_sha","source_tree_sha","source_ref","workflow_path","workflow_blob_sha","workflow_run_id","workflow_run_number","workflow_run_attempt","files","release_authority","claim_boundary"}
          if type(seal) is not dict or set(seal) != seal_keys:
              raise SystemExit("signed candidate seal keys invalid")
          source_tree_sha = subprocess.check_output(["/usr/bin/git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          workflow_blob_sha = subprocess.check_output(["/usr/bin/git", "rev-parse", "HEAD:.github/workflows/product-state-current.yml"], text=True).strip()
          boundary = "OIDC handoff candidate only; attestation does not grant release, legal, design, commercial, or independent-verification authority."
          if seal.get("schema_version") != "product-state-candidate-seal.v1" or seal.get("repository") != os.environ["GITHUB_REPOSITORY"] or seal.get("source_commit_sha") != os.environ["PRODUCT_STATE_SHA"] or seal.get("source_tree_sha") != source_tree_sha or seal.get("source_ref") != "refs/heads/main" or seal.get("workflow_path") != ".github/workflows/product-state-current.yml" or seal.get("workflow_blob_sha") != workflow_blob_sha or seal.get("workflow_run_id") != int(os.environ["GITHUB_RUN_ID"]) or seal.get("workflow_run_number") != int(os.environ["GITHUB_RUN_NUMBER"]) or seal.get("workflow_run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"]) or seal.get("release_authority") is not False or seal.get("claim_boundary") != boundary:
              raise SystemExit("signed candidate seal identity invalid")
          rows = seal.get("files") if type(seal) is dict else None
          if type(rows) is not list or not rows or len(rows) > 6000:
              raise SystemExit("signed candidate seal invalid")
          expected = {
              "product-state-candidate.seal.json",
              "candidate-artifact-api.json",
              ".ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json",
          }
          for row in rows:
              if type(row) is not dict or set(row) != {"path", "bytes", "sha256"}:
                  raise SystemExit("signed candidate seal row keys invalid")
              name = row.get("path")
              byte_length = row.get("bytes")
              sha256 = row.get("sha256")
              if type(name) is not str or name in expected or name not in observed or type(byte_length) is not int or not 0 < byte_length <= 300_000_000 or not isinstance(sha256, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", sha256) is None:
                  raise SystemExit("signed candidate seal row identity invalid")
              raw = (root / name).read_bytes()
              if len(raw) != byte_length or "sha256:" + hashlib.sha256(raw).hexdigest() != sha256:
                  raise SystemExit("signed candidate seal row bytes invalid")
              expected.add(name)
          if observed != expected:
              raise SystemExit("signed artifact member set invalid")
          PY

      - name: Independently bind final replay to the live Nightly run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          NIGHTLY_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          NIGHTLY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$NIGHTLY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$NIGHTLY_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$NIGHTLY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$NIGHTLY_RUN_ID" > "$RUNNER_TEMP/final-nightly-run.json"
          root="$RUNNER_TEMP/signed-product-state"
          ROOT="$root" python -I - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          def fail(reason): raise SystemExit(reason)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: fail(f"duplicate_json_key:{key}")
                  result[key] = value
              return result
          def reject(token): fail(f"nonfinite_json_number:{token}")
          def finite(token):
              value = float(token)
              if not math.isfinite(value): fail(f"nonfinite_json_number:{token}")
              return value
          def load(path, label):
              try: value = json.loads(Path(path).read_bytes(), object_pairs_hook=unique, parse_constant=reject, parse_float=finite)
              except (UnicodeError, json.JSONDecodeError, ValueError) as exc: fail(f"strict_json_invalid:{label}:{exc}")
              if type(value) is not dict: fail(f"json_object_required:{label}")
              return value
          root = Path(os.environ["ROOT"])
          nightly = load(Path(os.environ["RUNNER_TEMP"], "final-nightly-run.json"), "nightly_rest")
          expected = {
              "id": int(os.environ["NIGHTLY_RUN_ID"]),
              "run_number": int(os.environ["NIGHTLY_RUN_NUMBER"]),
              "run_attempt": int(os.environ["NIGHTLY_RUN_ATTEMPT"]),
              "name": "Nightly Full Quality",
              "path": ".github/workflows/nightly-full-quality.yml",
              "conclusion": os.environ["PRODUCT_STATE_CONCLUSION"],
              "head_branch": "main",
              "head_sha": os.environ["PRODUCT_STATE_SHA"],
          }
          if nightly.get("event") not in {"schedule", "workflow_dispatch"} or nightly.get("conclusion") not in {"action_required", "cancelled", "failure", "neutral", "skipped", "stale", "success", "timed_out"} or nightly.get("status") != "completed" or any(nightly.get(key) != value for key, value in expected.items()):
              fail("final_nightly_rest_identity_invalid")
          event = load(root / ".ci/product-state-inputs/nightly-workflow-run-event.json", "nightly_event")
          event_run = event.get("workflow_run")
          stored_run = load(root / ".ci/product-state-inputs/nightly-overlay-run.json", "stored_nightly_run")
          keys = ("id", "run_number", "run_attempt", "name", "path", "event", "conclusion", "head_branch", "head_sha")
          if type(event_run) is not dict or any(event_run.get(key) != nightly.get(key) or stored_run.get(key) != nightly.get(key) for key in keys):
              fail("final_nightly_event_rest_mismatch")
          product = load(root / "artifacts/manifests/product_state.current.v1.json", "product_state")
          provenance = load(root / ".ci/product-state-inputs/product-state.provenance-bundle.v1.json", "provenance")
          overlay = load(root / ".ci/product-state-inputs/post-main-overlay/post-main-evidence-overlay.seal.json", "overlay")
          quality = product.get("quality_evidence")
          provenance_nightly = provenance.get("workflow_runs", {}).get("nightly_full_quality")
          if type(quality) is not dict or quality.get("status") != "available" or quality.get("authority") != "github_actions_workflow_run_event" or type(provenance_nightly) is not dict:
              fail("final_nightly_product_provenance_missing")
          for api_key, evidence_key in (
              ("name", "workflow_name"), ("id", "run_id"),
              ("run_number", "run_number"), ("run_attempt", "run_attempt"),
              ("event", "trigger_event"), ("conclusion", "conclusion"),
              ("head_branch", "head_branch"), ("head_sha", "head_sha"),
          ):
              if quality.get(evidence_key) != nightly.get(api_key) or provenance_nightly.get(evidence_key) != nightly.get(api_key):
                  fail(f"final_nightly_product_provenance_mismatch:{api_key}")
          if provenance_nightly.get("workflow_path") != nightly.get("path") or provenance_nightly.get("authority") != "github_actions_workflow_run_event":
              fail("final_nightly_provenance_path_mismatch")
          producer = overlay.get("producer")
          if type(producer) is not dict or any(producer.get(key) != nightly.get(api_key) for key, api_key in (("workflow_name", "name"), ("workflow_path", "path"), ("event", "event"), ("run_id", "id"), ("run_attempt", "run_attempt"))) or overlay.get("source", {}).get("commit_sha") != nightly.get("head_sha"):
              fail("final_nightly_overlay_rest_mismatch")
          PY

      - name: Verify all exact-source attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/signed-product-state"
          gh attestation verify "$root/artifacts/manifests/product_state.current.v1.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$root/.ci/product-state-inputs/product-state.current.sigstore.json" \
