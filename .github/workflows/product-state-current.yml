              if type(artifact_id) is not int or artifact_id < 1:
                  raise SystemExit("invalid exact-name artifact id")
              expired = artifact.get("expired")
              if expired is True:
                  print("expired", artifact_id)
              elif expired is False:
                  print("available", artifact_id)
              else:
                  raise SystemExit("invalid exact-name artifact expiry state")
          PY
            )"; then
