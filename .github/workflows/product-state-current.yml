          with zipfile.ZipFile(io.BytesIO(raw_archive)) as archive:
              members = archive.infolist()
              if not 1 <= len(members) <= 32: raise SystemExit("overlay candidate ZIP count invalid")
              for member in members:
                  validate_extra(member.extra)
                  name = member.filename
                  path = PurePosixPath(name)
                  folded = unicodedata.normalize("NFC", name).casefold()
                  mode = (member.external_attr >> 16) & 0xffff
                  if not name or len(name) > 2048 or unicodedata.normalize("NFC", name) != name or unicodedata.normalize("NFKC", name) != name or any(unicodedata.category(character) in {"Cc", "Cf"} for character in name) or "\\" in name or "\0" in name or any(character in name for character in '<>:"|?*') or path.is_absolute() or path.as_posix() != name or any(part in {"", ".", ".."} for part in path.parts) or portable_path_unsafe(path) or folded in collisions or member.is_dir() or stat.S_IFMT(mode) not in {0, stat.S_IFREG} or member.flag_bits & 1 or member.create_system != 3 or member.create_version not in {20, 45} or member.extract_version != 20 or member.compress_type not in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED} or not 0 < member.file_size <= 100_000_000 or member.compress_size > 100_000_000:
                      raise SystemExit(f"overlay candidate ZIP member invalid: {name!r}")
                  collisions.add(folded)
                  total += member.file_size
                  if total > 300_000_000: raise SystemExit("overlay candidate ZIP expansion invalid")
                  raw = archive.read(member)
                  if len(raw) != member.file_size: raise SystemExit("overlay candidate ZIP member size changed")
                  files[name] = raw
          seal = load(Path(os.environ["POST_MAIN_OVERLAY_ROOT"], "post-main-evidence-overlay.seal.json"))
          expected_members = {"post-main-evidence-overlay.seal.json", *(row["overlay_path"] for row in seal.get("release_files", [])), *(row["overlay_path"] for row in seal.get("external_vv_nonpromotion", {}).get("receipts", []))}
          if set(files) != expected_members:
              raise SystemExit("overlay candidate raw ZIP member set invalid")
          for name, raw in files.items():
              if raw != Path(os.environ["POST_MAIN_OVERLAY_ROOT"], name).read_bytes():
                  raise SystemExit(f"overlay candidate to attested bytes mismatch: {name}")
          PY
          gh attestation verify "$POST_MAIN_OVERLAY_SEAL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$POST_MAIN_OVERLAY_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/nightly-full-quality.yml" \
            --signer-digest "$PRODUCT_STATE_SHA" \
            --source-digest "$PRODUCT_STATE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json \
            > .ci/product-state-inputs/post-main-overlay-attestation-verification.json
          python scripts/build_post_main_evidence_overlay.py materialize \
            --repo-root . \
            --overlay-root "$POST_MAIN_OVERLAY_ROOT" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$PRODUCT_STATE_SHA" \
