name: Finalize Product Boundary Split

on:
  push:
    branches: ["ci/product-boundary-split"]
    paths:
      - ".github/workflows/finalize-product-boundary-split.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout boundary branch
        uses: actions/checkout@v6
        with:
          ref: ci/product-boundary-split
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e .[dev]

      - name: Normalize quarantine control-plane references
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          old = ".github/workflows/molecular-quarantine-ci.yml"
          new = ".github/workflows/science-quarantine-ci.yml"
          paths = [
              Path("scripts/check_product_ci_boundaries.py"),
              Path("scripts/check_github_actions_runner_policy.py"),
              Path(".github/workflows/ci.yml"),
              Path("tests/test_product_ci_workflow_contract.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new)
              if new not in text:
                  raise SystemExit(f"missing quarantine workflow reference in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/molecular-quarantine-ci.yml
          rm -f .github/workflows/rename-science-quarantine-control-plane.yml
          rm -f .github/workflows/finalize-product-boundary-split.yml

      - name: Verify boundary and workflow contracts
        run: >-
          python -m ruff check
          scripts/check_product_ci_boundaries.py
          scripts/check_github_actions_runner_policy.py
          scripts/verify_quality_gate.py
          tests/test_check_product_ci_boundaries.py
          tests/test_product_ci_workflow_contract.py
          tests/test_verify_quality_gate.py
      - run: python scripts/check_product_ci_boundaries.py --json --fail-blocked
      - run: python scripts/check_github_actions_runner_policy.py --json --fail-blocked
      - run: >-
          python -m pytest -q
          tests/test_check_product_ci_boundaries.py
          tests/test_product_ci_workflow_contract.py
          tests/test_check_github_actions_runner_policy.py
          tests/test_verify_quality_gate.py

      - name: Commit finalized boundary split
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize product CI quarantine control plane"
          git push origin HEAD:ci/product-boundary-split
