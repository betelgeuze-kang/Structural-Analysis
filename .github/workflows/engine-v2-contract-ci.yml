      - "implementation/phase1/release_evidence/productization/engine_v2_hip_fgmres_multiblock_compile_receipt.json"
      - "implementation/phase1/release_evidence/productization/engine_v2_hip_fgmres_stage4_status.json"
      - "implementation/phase1/release_evidence/productization/engine_v2_hip_fgmres_*_device_receipt.json"
      - "implementation/phase1/release_evidence/productization/engine_v2_cpu_hip_primitive_parity_receipt.json"
      - "implementation/phase1/release_evidence/productization/engine_v2_hip_current_tangent_operator_compile_receipt.json"
      - "implementation/phase1/release_evidence/productization/g1_mgt_hip_current_tangent_host_parser_receipt.json"
      - "implementation/phase1/release_evidence/productization/g1_mgt_hip_current_tangent_hardware_parity_receipt.json"
