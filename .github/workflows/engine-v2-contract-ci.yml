  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: engine-v2-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and contract tools
        run: python -m pip install -e .[dev]

      - name: Lint Engine v2 contracts
        run: >-
          python -m ruff check
          src/structural_analysis/engine_v2
          src/structural_analysis/engine_v2_backends
          src/structural_analysis/model_ir
          scripts/build_g1_mgt_hip_current_tangent_host_parser_receipt.py
          scripts/run_g1_mgt_hip_current_tangent_hardware_parity.py
          scripts/build_engine_v2_hip_fgmres_stage4_status.py
          scripts/run_engine_v2_hip_current_tangent_operator.py
          scripts/run_engine_v2_hip_fgmres_device_receipt.py
          scripts/run_engine_v2_hip_fgmres_recurrence.py
          scripts/run_engine_v2_hip_primitive_parity.py
          scripts/run_engine_v2_hip_sparse_lu_apply.py
          tests/test_run_g1_mgt_hip_current_tangent_hardware_parity.py
          tests/test_engine_v2*.py
          tests/test_model_ir_v2_contract.py

      - name: Compile backend-neutral contract packages
        run: >-
          python -m compileall -q
          src/structural_analysis/engine_v2
          src/structural_analysis/engine_v2_backends
          src/structural_analysis/model_ir

      - name: Check committed HIP primitive receipt offline
        run: python scripts/run_engine_v2_hip_primitive_parity.py --check

      - name: Check committed HIP current-tangent compile receipt offline
        run: >-
          python scripts/run_engine_v2_hip_current_tangent_operator.py
          --compile-only --check

      - name: Check actual-MGT HIP current-tangent parser receipt sources offline
        run: >-
          python scripts/build_g1_mgt_hip_current_tangent_host_parser_receipt.py
          --check-source-only

      - name: Check actual-MGT HIP current-tangent hardware receipt sources offline
        run: >-
          python scripts/run_g1_mgt_hip_current_tangent_hardware_parity.py
          --check-source-only

      - name: Check committed HIP sparse-LU compile receipt offline
        run: >-
          python scripts/run_engine_v2_hip_sparse_lu_apply.py
          --compile-only --check

      - name: Check committed HIP FGMRES multi-block compile receipt offline
        run: >-
          python scripts/run_engine_v2_hip_fgmres_recurrence.py
          --compile-only --check

      - name: Check committed HIP FGMRES recurrence receipt offline
        run: python scripts/run_engine_v2_hip_fgmres_recurrence.py --check

      - name: Check committed gfx1030 device receipt offline
        run: >-
          python scripts/run_engine_v2_hip_fgmres_device_receipt.py
          --out implementation/phase1/release_evidence/productization/engine_v2_hip_fgmres_gfx1030_device_receipt.json
          --check

      - name: Check HIP FGMRES Stage 4 evidence status offline
        run: python scripts/build_engine_v2_hip_fgmres_stage4_status.py --check

      - name: Run complete Engine v2 contract suite
        run: >-
          python -m pytest -q
          tests/test_engine_v2*.py
          tests/test_model_ir_v2_contract.py
