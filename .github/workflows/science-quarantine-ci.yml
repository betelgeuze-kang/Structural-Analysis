name: Molecular Quarantine CI

on:
  pull_request:
    paths:
      - "implementation/phase1/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/science-quarantine-ci.yml"
  push:
    branches: ["main", "ci/**", "molecular/**", "science/**"]
    paths:
      - "implementation/phase1/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/science-quarantine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molecular-quarantine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecular-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Validate quarantine ownership
        run: >-
          python scripts/check_product_ci_boundaries.py
          --json
          --out molecular-quarantine-boundary-report.json
          --fail-blocked

      - name: Ruff and compile quarantined Python
        run: python scripts/run_product_ci_lane.py --lane molecular_quarantine --ruff --compile

      - name: Collect quarantined tests without product promotion
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            python scripts/check_product_ci_boundaries.py \
              --print-paths molecular_quarantine | grep '^tests/' || true
          )
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No quarantined Python tests are currently tracked."
          else
            python -m pytest --collect-only -q "${tests[@]}"
          fi

      - name: Upload quarantine receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molecular-quarantine-ci-${{ github.run_id }}
          path: molecular-quarantine-boundary-report.json
          if-no-files-found: warn
          retention-days: 14
