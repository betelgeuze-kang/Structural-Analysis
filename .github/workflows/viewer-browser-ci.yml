name: Viewer Browser CI

# Structure-viewer-specific deterministic verification. Hardware-specific rendering
# or private workstation captures belong in the separate heavy lane.

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - "tests/frontend/structure-viewer-smoke.spec.ts"
      - "native/crates/structural-frontend-contract/src/browser_smoke.rs"
      - "scripts/structure-viewer-*.mjs"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/crates/structural-frontend-contract/**"
      - "native/decommission/legacy-frontend-build-contract-v1.json"
      - "scripts/verify_structure_viewer_contracts.py"
      - "tests/test_structure_viewer_*.py"
      - "tests/test_viewer_shared_selection_contract.py"
      - "tests/test_generate_selfcontained_viewer.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/viewer-browser-ci.yml"
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - "src/structure-viewer/**"
      - "tests/frontend/structure-viewer-smoke.spec.ts"
      - "native/crates/structural-frontend-contract/src/browser_smoke.rs"
      - "scripts/structure-viewer-*.mjs"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/crates/structural-frontend-contract/**"
      - "native/decommission/legacy-frontend-build-contract-v1.json"
      - "scripts/verify_structure_viewer_contracts.py"
      - "tests/test_structure_viewer_*.py"
      - "tests/test_viewer_shared_selection_contract.py"
      - "tests/test_generate_selfcontained_viewer.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/viewer-browser-ci.yml"
  workflow_dispatch:

concurrency:
  group: viewer-browser-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  viewer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Verify Rust-native viewer manifest
        run: npm run verify:viewer-manifest

      - name: Verify viewer contracts
        run: python scripts/verify_structure_viewer_contracts.py

      - name: Rust-orchestrated Playwright browser install
        run: npm run install:browser-runtime

      - name: Rust-orchestrated minimal structure-viewer browser smoke
        run: npm run verify:frontend-browser-smoke -- --mode minimal
