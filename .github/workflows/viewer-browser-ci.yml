name: Viewer Browser CI

# Structure-viewer-specific deterministic verification. Hardware-specific rendering
# or private workstation captures belong in the separate heavy lane.

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - "tests/frontend/structure-viewer-smoke.spec.ts"
      - "scripts/verify-frontend-browser-smoke.mjs"
      - "scripts/structure-viewer-*.mjs"
      - "scripts/verify-structure-viewer-project-manifest.mjs"
      - "scripts/verify_structure_viewer_contracts.py"
      - "tests/test_structure_viewer_*.py"
      - "tests/test_viewer_shared_selection_contract.py"
      - "tests/test_generate_selfcontained_viewer.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/viewer-browser-ci.yml"
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - "src/structure-viewer/**"
      - "tests/frontend/structure-viewer-smoke.spec.ts"
      - "scripts/verify-frontend-browser-smoke.mjs"
      - "scripts/structure-viewer-*.mjs"
      - "scripts/verify-structure-viewer-project-manifest.mjs"
      - "scripts/verify_structure_viewer_contracts.py"
      - "tests/test_structure_viewer_*.py"
      - "tests/test_viewer_shared_selection_contract.py"
      - "tests/test_generate_selfcontained_viewer.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/viewer-browser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-browser-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  viewer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Node dependencies
        run: >-
          npm ci --ignore-scripts --engine-strict
          --registry=https://registry.npmjs.org/ --strict-ssl=true

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Verify viewer manifest
        run: npm run verify:viewer-manifest

      - name: Verify viewer contracts
        run: python scripts/verify_structure_viewer_contracts.py

      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Minimal structure-viewer browser smoke
        run: npm run verify:frontend-browser-smoke -- --mode minimal
