name: Codex Temp Local Ops Storage Patch

on:
  pull_request:
    paths:
      - "src/structure-viewer/**"
      - ".github/workflows/codex-temp-local-ops-storage-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Patch local ops storage reads and writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/structure-viewer/viewer-local-ops-state.js')
          text = path.read_text(encoding='utf-8')

          import_needle = """import {
            prepareViewerLocalOpsStateForStorage,
          } from './viewer-local-ops-persistence-policy.js';
          """
          import_replacement = import_needle + """import {
            readViewerLocalOpsStorage,
            writeViewerLocalOpsStorage,
          } from './viewer-local-ops-storage-policy.js';
          """
          if text.count(import_needle) != 1:
              raise SystemExit(f'expected one persistence import; found={text.count(import_needle)}')
          text = text.replace(import_needle, import_replacement, 1)

          read_pattern = re.compile(
              r"export function readViewerLocalOpsState\(\{.*?\n\}\n\n"
              r"export function writeViewerLocalOpsState",
              re.DOTALL,
          )
          read_replacement = """export function readViewerLocalOpsState({
            storageGet = (key) => globalThis.localStorage?.getItem(key),
            storageKey = VIEWER_LOCAL_OPS_STATE_KEY,
          } = {}) {
            const storageRead = readViewerLocalOpsStorage({storageGet, storageKey});
            if (!storageRead.ok) return emptyViewerLocalOpsState();
            const parsed = parseState(storageRead.text);
            const candidate = {
              recentSelections: Array.isArray(parsed.recentSelections) ? parsed.recentSelections : [],
              auditEventsJsonl: normalizeText(parsed.auditEventsJsonl),
              exportHistory: Array.isArray(parsed.exportHistory) ? parsed.exportHistory : [],
              reviewNotes: parsed.reviewNotes && typeof parsed.reviewNotes === 'object' ? parsed.reviewNotes : {},
              reviewTasks: parsed.reviewTasks && typeof parsed.reviewTasks === 'object' ? parsed.reviewTasks : {},
              annotations: parsed.annotations && typeof parsed.annotations === 'object' ? parsed.annotations : {},
              receiptIndex: parsed.receiptIndex && typeof parsed.receiptIndex === 'object' ? parsed.receiptIndex : {},
              lastImportPreview: parsed.lastImportPreview && typeof parsed.lastImportPreview === 'object' ? parsed.lastImportPreview : null,
              lastIngestPreview: parsed.lastIngestPreview && typeof parsed.lastIngestPreview === 'object' ? parsed.lastIngestPreview : null,
              lastIngestRenderablePayload: parsed.lastIngestRenderablePayload && typeof parsed.lastIngestRenderablePayload === 'object'
                ? parsed.lastIngestRenderablePayload
                : null,
            };
            const prepared = prepareViewerLocalOpsStateForStorage(candidate);
            return prepared.valid ? prepared.state : emptyViewerLocalOpsState();
          }

          export function writeViewerLocalOpsState"""
          text, count = read_pattern.subn(read_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one local ops read function; replaced={count}')

          write_pattern = re.compile(
              r"export function writeViewerLocalOpsState\(state = \{\}, \{.*?\n\}\n\n"
              r"export function rememberViewerWorkspaceSelection",
              re.DOTALL,
          )
          write_replacement = """export function writeViewerLocalOpsState(state = {}, {
            storageGet = (key) => globalThis.localStorage?.getItem(key),
            storageSet = (key, value) => globalThis.localStorage?.setItem(key, value),
            storageKey = VIEWER_LOCAL_OPS_STATE_KEY,
          } = {}) {
            const previousState = readViewerLocalOpsState({storageGet, storageKey});
            const prepared = prepareViewerLocalOpsStateForStorage(state);
            if (!prepared.valid) return previousState;
            const serialized = JSON.stringify(prepared.state);
            const storageWrite = writeViewerLocalOpsStorage({
              storageSet,
              storageKey,
              text: serialized,
            });
            return storageWrite.ok ? prepared.state : previousState;
          }

          export function rememberViewerWorkspaceSelection"""
          text, count = write_pattern.subn(write_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one local ops write function; replaced={count}')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/codex-temp-local-ops-storage-patch.yml').unlink()
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('src/structure-viewer/viewer-local-ops-state.js').read_text(encoding='utf-8')
          required = (
              "from './viewer-local-ops-storage-policy.js';",
              'const storageRead = readViewerLocalOpsStorage({storageGet, storageKey});',
              'if (!storageRead.ok) return emptyViewerLocalOpsState();',
              'const previousState = readViewerLocalOpsState({storageGet, storageKey});',
              'const storageWrite = writeViewerLocalOpsStorage({',
              'return storageWrite.ok ? prepared.state : previousState;',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing storage contracts: {missing}')
          read_match = re.search(
              r"export function readViewerLocalOpsState\(\{.*?\n\}",
              text,
              re.DOTALL,
          )
          write_match = re.search(
              r"export function writeViewerLocalOpsState\(state = \{\}, \{.*?\n\}",
              text,
              re.DOTALL,
          )
          if read_match is None or write_match is None:
              raise SystemExit('patched storage functions missing')
          if 'storageGet(storageKey)' in read_match.group(0):
              raise SystemExit('direct storageGet call remains in read function')
          if 'storageSet(storageKey' in write_match.group(0):
              raise SystemExit('direct storageSet call remains in write function')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structure-viewer/viewer-local-ops-state.js .github/workflows/codex-temp-local-ops-storage-patch.yml
          git commit -m "Fail closed on local ops storage errors"
          git push origin HEAD:${{ github.head_ref }}
