name: Sync Typed Domain Model With Main

on:
  push:
    branches: ["core/typed-domain-model-1"]
    paths:
      - ".github/workflows/sync-typed-domain-main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-typed-domain-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout typed-domain branch
        uses: actions/checkout@v6
        with:
          ref: core/typed-domain-model-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Merge current main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [[ $merge_code -ne 0 ]]; then
            git checkout --ours .github/workflows/authoritative-linear-core-ci.yml
            git add .github/workflows/authoritative-linear-core-ci.yml
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge paths:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git add -A

      - name: Install and verify combined semantics and typed model
        run: python -m pip install -e .[dev]
      - run: >-
          python -m ruff check
          src/structural_analysis
          tests/test_authoritative_linear_engineering_semantics.py
          tests/test_typed_domain_model.py
          tests/test_structural_analysis_core_api.py
      - run: >-
          python -m pytest -q
          tests/test_authoritative_linear_engineering_semantics.py
          tests/test_typed_domain_model.py
          tests/test_structural_analysis_core_api.py
          tests/test_check_product_ci_boundaries.py
          tests/test_product_ci_workflow_contract.py

      - name: Commit synchronized branch
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/sync-typed-domain-main.yml
          git add -A
          git commit -m "Merge current main into typed domain model"
          git push origin HEAD:core/typed-domain-model-1
