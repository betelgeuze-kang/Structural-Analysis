name: Regenerate PostCSS lockfile

on:
  push:
    branches:
      - codex/fix-postcss-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency resolution
        run: |
          node -e "const lock=require('./package-lock.json'); const packages=lock.packages; if (packages['node_modules/postcss'].version !== '8.5.22') process.exit(1); if (packages['node_modules/nanoid'].version !== '3.3.16') process.exit(1)"
          npm audit --audit-level high
      - uses: actions/upload-artifact@v7
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit regenerated lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: regenerate frontend lockfile"
          git push origin HEAD:codex/fix-postcss-audit
