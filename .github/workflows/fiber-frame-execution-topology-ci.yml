            tests/test_stateful_fiber_frame2d_nonlinear_recovery.py \
            tests/test_stateful_corotational_fiber_frame2d.py \
            tests/test_stateful_corotational_fiber_frame2d_adaptive.py \
            tests/test_stateful_corotational_fiber_frame2d_arc_length.py \
            tests/test_stateful_corotational_steel_frame_cyclic_benchmark.py \
            tests/test_stateful_corotational_fiber_frame2d_solver.py \
            tests/test_public_rc_fiber_frame_api.py \
            tests/test_engine_v2_solver_episode_v1.py \
            tests/test_shadow_solver_controller.py \
            tests/test_fiber_frame_solver_episode_adapter.py
          python -m ruff format --check \
            src/structural_analysis/assembly/__init__.py \
            src/structural_analysis/benchmark/__init__.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_adaptive.py \
