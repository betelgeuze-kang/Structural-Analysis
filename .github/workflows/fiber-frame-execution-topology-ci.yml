            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_result_adapter.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_recovery.py \
            src/structural_analysis/api/_output_integrity.py \
            src/structural_analysis/api/__init__.py \
            src/structural_analysis/api/nonlinear_fiber_frame.py \
            src/structural_analysis/api/nonlinear_fiber_frame_cli.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_result.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_recovery.py \
            src/structural_analysis/ai/__init__.py \
            src/structural_analysis/ai/shadow_solver_controller.py \
            src/structural_analysis/ai/fiber_frame_solver_episode_adapter.py \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state_chain.py \
