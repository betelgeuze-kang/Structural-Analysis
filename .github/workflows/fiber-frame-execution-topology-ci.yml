name: Fiber-frame Execution Topology CI

on:
  pull_request:
    paths:
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_execution_topology.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_physical_equation_scaling.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state_chain.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_execution_state_binding.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_terminal_receipt.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_result_adapter.py"
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_recovery.py"
      - "src/structural_analysis/engine_v2/contracts/nonlinear_result.py"
      - "src/structural_analysis/engine_v2/contracts/nonlinear_recovery.py"
      - "src/structural_analysis/schemas/nonlinear_numerical_result_ir_v1.schema.json"
      - "src/structural_analysis/ai/__init__.py"
      - "src/structural_analysis/ai/shadow_solver_controller.py"
      - "src/structural_analysis/ai/fiber_frame_solver_episode_adapter.py"
      - "tests/test_stateful_fiber_frame2d_execution_topology.py"
      - "tests/test_stateful_fiber_frame2d_physical_equation_scaling.py"
      - "tests/test_stateful_fiber_frame2d_kinematic_state_chain.py"
      - "tests/test_stateful_fiber_frame2d_nonlinear_execution_state_binding.py"
      - "tests/test_stateful_fiber_frame2d_nonlinear_terminal_receipt.py"
      - "tests/test_stateful_fiber_frame2d_nonlinear_result_adapter.py"
      - "tests/test_stateful_fiber_frame2d_nonlinear_recovery.py"
      - "tests/test_engine_v2_nonlinear_result_recovery_v1.py"
      - "tests/test_engine_v2_nonlinear_recovery_source_binding.py"
      - "tests/test_engine_v2_solver_episode_v1.py"
      - "tests/test_shadow_solver_controller.py"
      - "tests/test_fiber_frame_solver_episode_adapter.py"
      - "docs/fiber-frame-nonlinear-execution-topology.md"
      - "docs/fiber-frame-physical-equation-scaling.md"
      - "docs/fiber-frame-nonlinear-kinematic-state-chain.md"
      - "docs/fiber-frame-material-state-projection-chain.md"
      - "docs/fiber-frame-nonlinear-execution-state-binding.md"
      - "docs/fiber-frame-nonlinear-terminal-receipt.md"
      - "docs/fiber-frame-nonlinear-result-adapter.md"
      - "docs/fiber-frame-nonlinear-engineering-recovery.md"
      - "docs/engine-v2-nonlinear-result-recovery.md"
      - "docs/fiber-frame-solver-episode-adapter.md"
      - "docs/ai-shadow-solver-controller.md"
      - "docs/cto-ai-solver-improvement-plan.md"
      - ".github/workflows/fiber-frame-execution-topology-ci.yml"
      - "scripts/check_github_actions_runner_policy.py"

permissions:
  contents: read

jobs:
  topology-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Ruff
        run: |
          python -m ruff check \
            src/structural_analysis/assembly/stateful_fiber_frame2d_execution_topology.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_physical_equation_scaling.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state_chain.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_result_adapter.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_recovery.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_result.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_recovery.py \
            src/structural_analysis/ai/__init__.py \
            src/structural_analysis/ai/shadow_solver_controller.py \
            src/structural_analysis/ai/fiber_frame_solver_episode_adapter.py \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state_chain.py \
            tests/test_stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            tests/test_stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            tests/test_stateful_fiber_frame2d_nonlinear_result_adapter.py \
            tests/test_stateful_fiber_frame2d_nonlinear_recovery.py \
            tests/test_engine_v2_solver_episode_v1.py \
            tests/test_shadow_solver_controller.py \
            tests/test_fiber_frame_solver_episode_adapter.py
          python -m ruff format --check \
            src/structural_analysis/assembly/stateful_fiber_frame2d_execution_topology.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_physical_equation_scaling.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state_chain.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_result_adapter.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_recovery.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_result.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_recovery.py \
            src/structural_analysis/ai/__init__.py \
            src/structural_analysis/ai/fiber_frame_solver_episode_adapter.py \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state_chain.py \
            tests/test_stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            tests/test_stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            tests/test_stateful_fiber_frame2d_nonlinear_result_adapter.py \
            tests/test_stateful_fiber_frame2d_nonlinear_recovery.py \
            tests/test_fiber_frame_solver_episode_adapter.py
      - name: Compile
        run: |
          python -m compileall -q \
            src/structural_analysis/assembly/stateful_fiber_frame2d_execution_topology.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_physical_equation_scaling.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state_chain.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_result_adapter.py \
            src/structural_analysis/assembly/stateful_fiber_frame2d_nonlinear_recovery.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_result.py \
            src/structural_analysis/engine_v2/contracts/nonlinear_recovery.py \
            src/structural_analysis/ai/__init__.py \
            src/structural_analysis/ai/shadow_solver_controller.py \
            src/structural_analysis/ai/fiber_frame_solver_episode_adapter.py \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state_chain.py \
            tests/test_stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            tests/test_stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            tests/test_stateful_fiber_frame2d_nonlinear_result_adapter.py \
            tests/test_stateful_fiber_frame2d_nonlinear_recovery.py \
            tests/test_engine_v2_solver_episode_v1.py \
            tests/test_shadow_solver_controller.py \
            tests/test_fiber_frame_solver_episode_adapter.py
      - name: Focused topology, scaling, and nonlinear-state binding tests
        run: |
          python -m pytest -vv \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state_chain.py \
            tests/test_stateful_fiber_frame2d_nonlinear_execution_state_binding.py \
            tests/test_stateful_fiber_frame2d_nonlinear_terminal_receipt.py \
            tests/test_stateful_fiber_frame2d_nonlinear_result_adapter.py \
            tests/test_stateful_fiber_frame2d_nonlinear_recovery.py \
            tests/test_engine_v2_nonlinear_result_recovery_v1.py \
            tests/test_engine_v2_nonlinear_recovery_source_binding.py \
            tests/test_engine_v2_core_dependency_boundary.py \
            tests/test_engine_v2_solver_episode_v1.py \
            tests/test_shadow_solver_controller.py \
            tests/test_fiber_frame_solver_episode_adapter.py \
            tests/test_engine_v2_equation_scaling_v1.py
      - name: Fiber-frame regression neighborhood
        run: |
          python -m pytest -q \
            tests/test_stateful_fiber_frame2d.py \
            tests/test_stateful_fiber_frame2d_material_state_bundle.py \
            tests/test_stateful_fiber_frame2d_material_state_projection_chain.py
