permissions:
  contents: read

jobs:
  topology-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Ruff
        run: |
          python -m ruff check \
            src/structural_analysis/assembly/__init__.py \
            src/structural_analysis/benchmark/__init__.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_adaptive.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_arc_length.py \
            src/structural_analysis/benchmark/stateful_corotational_fiber_frame2d_diagnostics.py \
            src/structural_analysis/benchmark/stateful_corotational_steel_frame_cyclic.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_checkpoint_io.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_solver.py \
            src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_state.py \
