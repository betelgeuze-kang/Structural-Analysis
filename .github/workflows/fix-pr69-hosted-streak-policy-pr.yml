name: Fix PR69 Hosted Streak Policy PR

on:
  pull_request:
    paths:
      - "scripts/migrate_pr69_hosted_streak_policy.py"
      - ".github/workflows/fix-pr69-hosted-streak-policy-pr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-pr69-hosted-streak-policy-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ci/hosted-release-lanes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Apply hosted streak migration
        shell: bash
        run: |
          set +e
          {
            python scripts/migrate_pr69_hosted_streak_policy.py
            python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          path = Path("scripts/build_ci_streak_intake_packet.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    runner_blockers: list[str] = []\n",
              "    # No self-hosted runner blocker is appended to canonical streak credit.\n",
              "runner blocker variable",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_build_ci_streak_intake_packet.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def test_ci_streak_intake_packet_surfaces_missing_pr_streak")
          end = text.index("\ndef test_ci_streak_intake_packet_blocks_closed_manifest", start)
          segment = text[start:end]
          for old, new in (
              ("blockers=12 | runner=not_evaluated", "blockers=10 | runner=not_evaluated"),
              ('assert payload["current_blocker_count"] == 12', 'assert payload["current_blocker_count"] == 10'),
              ('assert payload["blocker_id_count"] == 14', 'assert payload["blocker_id_count"] == 12'),
              ('assert payload["summary"]["blocker_id_count"] == 14', 'assert payload["summary"]["blocker_id_count"] == 12'),
          ):
              segment = replace_once(segment, old, new, f"missing-pr:{old}")
          text = text[:start] + segment + text[end:]

          start = text.index("def test_ci_streak_intake_packet_surfaces_offline_self_hosted_runner")
          end = text.index("\ndef test_ci_streak_intake_packet_passes_closed_manifest", start)
          segment = text[start:end]
          segment = replace_once(
              segment,
              "blockers=8 | runner=blocked",
              "blockers=6 | runner=blocked",
              "offline-runner summary count",
          )
          segment = replace_once(
              segment,
              'assert payload["current_blocker_count"] == 8',
              'assert payload["current_blocker_count"] == 6',
              "offline-runner blocker count",
          )
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_build_product_readiness_snapshot.py")
          text = path.read_text(encoding="utf-8")
          old_name = "def test_snapshot_blocks_github_hosted_actions_runner_policy"
          new_name = "def test_snapshot_blocks_self_hosted_runner_in_deterministic_ci_policy"
          text = replace_once(text, old_name, new_name, "readiness negative test name")
          start = text.index(new_name)
          end = text.index("\ndef test_snapshot_blocks_missing_self_hosted_runner_status", start)
          segment = text[start:end]
          segment = replace_once(
              segment,
              "runs-on: ubuntu-latest\\n",
              "runs-on: self-hosted\\n",
              "readiness negative runner",
          )
          segment = replace_once(
              segment,
              "github_hosted_runner_label",
              "github_hosted_runner_required",
              "readiness negative blocker",
          )
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          } > hosted-streak-apply.log 2>&1
          code=$?
          cat hosted-streak-apply.log
          exit "$code"

      - name: Upload migration apply log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-streak-apply-${{ github.run_id }}
          path: hosted-streak-apply.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run focused lint and regressions
        shell: bash
        run: |
          set +e
          python -m ruff check \
            scripts/build_ci_streak_intake_packet.py \
            scripts/migrate_pr69_hosted_streak_policy.py \
            tests/test_build_ci_streak_intake_packet.py \
            tests/test_build_product_readiness_snapshot.py \
            > hosted-streak-migration.log 2>&1
          ruff_code=$?
          if [[ $ruff_code -eq 0 ]]; then
            python -m pytest -q \
              tests/test_build_ci_streak_intake_packet.py \
              tests/test_build_product_readiness_snapshot.py \
              >> hosted-streak-migration.log 2>&1
            test_code=$?
          else
            test_code=0
          fi
          cat hosted-streak-migration.log
          if [[ $ruff_code -ne 0 ]]; then exit $ruff_code; fi
          exit $test_code

      - name: Upload focused migration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-streak-migration-pr-${{ github.run_id }}
          path: hosted-streak-migration.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit migration and remove temporary helpers
        shell: bash
        run: |
          set -euxo pipefail
          rm -f \
            .github/workflows/fix-pr69-hosted-streak-policy.yml \
            .github/workflows/fix-pr69-hosted-streak-policy-pr.yml \
            scripts/migrate_pr69_hosted_streak_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align CI streak and readiness contracts with hosted lanes"
          git push origin HEAD:ci/hosted-release-lanes
