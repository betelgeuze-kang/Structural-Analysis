name: Nightly Heavy Solver

# Hardware/private-corpus/full release checks. This lane intentionally remains
# self-hosted and does not contribute to the deterministic CI/nightly streak.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 18 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONNOUSERSITE: "1"

permissions:
  contents: read

concurrency:
  group: nightly-heavy-solver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy-full-quality:
    runs-on: ${{ fromJSON(vars.STRUCTURAL_ACTIONS_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Create isolated Python environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/heavy-quality-venv"
          echo "$RUNNER_TEMP/heavy-quality-venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install Python package
        run: |
          # Keep the receipt-producing numerical environment identical to the
          # deterministic Nightly lane. The project dependency ranges are
          # intentionally broader than the audited evidence environment.
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Verify isolated source import
        run: >-
          python -c "import os, pathlib, sys;
          import structural_analysis.api.nonlinear_frame as module;
          expected = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'heavy-quality-venv').resolve();
          source = (pathlib.Path.cwd() / 'src').resolve();
          assert pathlib.Path(sys.prefix).resolve() == expected;
          assert pathlib.Path(module.__file__).resolve().is_relative_to(source)"

      - name: Validate pristine commercial gap ledger
        run: >-
          python -m pytest -q
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          # Recompute bounded internal Level 1 evidence only in this ephemeral checkout.
          python scripts/build_analytic_frame_verification_artifact.py
          python scripts/build_analytic_frame_verification_artifact.py --check
          python scripts/build_verification_hierarchy_status.py
          python scripts/build_verification_hierarchy_status.py --check
          python scripts/build_phase2_state_updated_steel_material_artifacts.py
          python scripts/build_phase2_state_updated_bilinear_link_artifacts.py
          python scripts/build_phase2_state_updated_composite_section_artifacts.py
          python scripts/build_phase2_state_updated_concrete_damage_artifacts.py
          python scripts/build_phase2_adaptive_newton_continuation_artifacts.py
          # Admit fresh bounded modal evidence without Level 2 or release credit.
          env OPENBLAS_CORETYPE=Haswell OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/build_phase2_whole_model_modal_artifacts.py
          env OPENBLAS_CORETYPE=Haswell OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/build_phase2_whole_model_modal_artifacts.py --check
          python - <<'MODAL_SUMMARY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("implementation/phase1/release_evidence/productization/phase2_whole_model_modal_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != "phase2-whole-model-modal-artifacts.v1":
              raise SystemExit("modal materialization summary schema is invalid")
          if payload.get("status") != "partial" or payload.get("contract_pass") is not True:
              raise SystemExit("modal materialization did not pass its bounded contract")
          for field in ("case_count", "passing_case_count"):
              if type(payload.get(field)) is not int or payload[field] != 4:
                  raise SystemExit("modal materialization requires exactly four passing cases")
          expected_sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", expected_sha) is None or payload.get("source_commit_sha") != expected_sha:
              raise SystemExit("modal materialization is not bound to GITHUB_SHA")
          claims = payload.get("claims")
          if not isinstance(claims, dict) or any(claims.get(field) is not False for field in (
              "independent_code_to_code_or_verification_level_2", "release_readiness",
          )):
              raise SystemExit("modal materialization cannot grant Level 2 or release authority")
          for field in ("source_set_hash", "result_artifact_hash"):
              if not isinstance(payload.get(field), str) or re.fullmatch(r"sha256:[0-9a-f]{64}", payload[field]) is None:
                  raise SystemExit("modal materialization source/result identity is invalid")
          print(json.dumps({
              "schema": "ci-whole-model-modal-materialization.v1",
              **{field: payload[field] for field in (
                  "status", "contract_pass", "case_count", "passing_case_count",
                  "source_commit_sha", "source_set_hash", "result_artifact_hash",
              )},
              "verification_level_2": False,
              "release_readiness": False,
          }, sort_keys=True))
          MODAL_SUMMARY
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Heavy product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Heavy product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked
          python scripts/build_stateful_nonlinear_no_solve_reaction_only_artifact.py
          python scripts/build_fracture_energy_concrete_benchmark.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_fgmres_smoke.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_newton_continuation_receipt.py
          python scripts/build_phase2_linear_reference_artifacts.py
          python scripts/build_phase2_newton_globalization_artifacts.py
          python scripts/build_phase2_nonlinear_load_step_artifacts.py
          python scripts/build_phase2_material_newton_breadth_artifacts.py
          python scripts/build_phase2_material_mesh_newton_artifacts.py
          python scripts/build_phase2_patch_rigidbody_artifacts.py
          python scripts/build_phase2_mesh_load_step_convergence_artifacts.py
          python scripts/build_phase2_frame_shell_material_coupling_artifacts.py
      - name: Run materialized repository Python suite
        run: >-
          python -m pytest -q
          --deselect
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers
          --deselect
          tests/test_build_g1_mgt_hip_current_tangent_host_parser_receipt.py::test_committed_receipt_is_reproducible

      - name: Materialize current-source readiness graph
        shell: bash
        run: |
          # The full repository suite above intentionally validates the same
          # materialized receipt epoch as the deterministic Nightly shards.
          # Readiness aggregation is a separate cyclic epoch whose tracked
          # summaries are consumed by the non-pytest quality checks below.
          python scripts/build_phase1_core_api_contract_artifacts.py
          for pass in 1 2 3; do
            echo "readiness propagation pass=${pass}"
            python scripts/build_developer_preview_readiness.py
            python scripts/build_developer_preview_rc_status.py
            python scripts/report_release_evidence_freshness.py
            python scripts/report_pm_release_gate.py
            python scripts/build_pm_release_blocker_action_register.py
            python scripts/build_product_readiness_snapshot.py
            python scripts/build_structural_product_development_roadmap.py
          done

      - name: Full workstation/release quality gate
        run: >-
          python scripts/verify_quality_gate.py
          --mode full
          --python-suite-verified-in-prior-step
