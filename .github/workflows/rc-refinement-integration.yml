name: RC Refinement Integration

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: rc-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-inputs:
    name: rc-integration-source-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain bounded tracked source inputs only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path(os.environ['RUNNER_TEMP']) / 'rc-integration-source'
          root.mkdir(exist_ok=False)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          revisions = {
              'checked-out': head,
              'main-before': '4de4e3f55aae1d267cf704cec7d7533f3a627498',
              'main-integrated': '234c3122c78dea064411aa16b06b18ab16157576',
              'research-base': '9453bc210325305569442cbf7ac2fc075f8d1be0',
              'refinement-base': '1e84e9908912738b698a5fc8ff62711936474c75',
              'durable-candidate': '264cd592b295c5d72481c029e7390561643c0fed',
              'persistence-alternative': '2e1c2b41048ee6ea3caea7263de7a216be47a4a0',
          }
          report = {'schema': 'rc-integration-source-diagnostic.v1', 'head': head, 'snapshots': []}
          for label, revision in revisions.items():
              if not re.fullmatch('[0-9a-f]{40}', revision):
                  raise SystemExit('invalid revision')
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', revision])
              selected = []
              entries = []
              for record in raw.split(b'\0'):
                  if not record:
                      continue
                  metadata, path_raw = record.split(b'\t', 1)
                  mode, kind, digest = metadata.decode('ascii').split()
                  path = path_raw.decode('utf-8')
                  include = (
                      path.startswith('src/structural_analysis/')
                      or (path.startswith(('scripts/', 'tests/')) and path.endswith('.py'))
                      or (path.startswith('.github/workflows/') and path.endswith(('.yml', '.yaml')))
                      or (path.startswith(('canonical/', 'examples/')) and path.endswith('.json'))
                      or path in ('pyproject.toml', 'MANIFEST.in', 'setup.cfg', '.gitattributes')
                  )
                  if include:
                      if kind != 'blob' or mode not in ('100644', '100755'):
                          raise SystemExit('unexpected source entry')
                      selected.append(path)
                      entries.append({'path': path, 'mode': mode, 'blob_sha': digest})
              if not selected or len(selected) > 6000:
                  raise SystemExit('source entry bound')
              target = root / (label + '.tar')
              subprocess.run(['git', 'archive', '--format=tar', '--output=' + str(target), revision, '--', *selected], check=True)
              if target.stat().st_size > 128 * 1024 * 1024:
                  raise SystemExit('source archive bound')
              report['snapshots'].append({'label': label, 'revision': revision, 'archive': target.name, 'sha256': hashlib.sha256(target.read_bytes()).hexdigest(), 'entries': entries})
          (root / 'inventory.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n')
          PY
      - name: Retain formatter distribution for exact local diagnostics
        run: >-
          python -m pip download --only-binary=:all: --no-deps ruff==0.15.0
          --dest "$RUNNER_TEMP/rc-integration-source/tools"
      - name: Preserve integration source diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-integration-source-${{ github.sha }}
          path: ${{ runner.temp }}/rc-integration-source/
          if-no-files-found: error
          retention-days: 3
  integration:
    name: rc-refinement-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install package and tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e '.[dev]' ruff==0.15.0
      - name: Run integrated RC and input regressions
        run: >-
          python -m pytest -q --junitxml=rc-refinement-tests.xml
          tests/test_neutral_strict_input.py
          tests/test_rc_control_refinement.py
          tests/test_rc_control_local_research.py
          tests/test_rc_control_persistence.py
          tests/test_rc_local_resources.py
      - name: Check formatting without changing committed bytes
        if: ${{ !cancelled() }}
        run: >-
          python -m ruff format --check --diff
          src/structural_analysis/io/neutral/loader.py
          src/structural_analysis/benchmark/rc_control_refinement.py
          src/structural_analysis/benchmark/rc_control_refinement_cli.py
          src/structural_analysis/benchmark/rc_control_design.py
          src/structural_analysis/benchmark/rc_control_reuse.py
          tests/test_neutral_strict_input.py
          tests/test_rc_control_refinement.py
          > rc-refinement-format.diff
      - name: Check changed Python lint
        if: ${{ !cancelled() }}
        run: >-
          python -m ruff check --output-format=json
          src/structural_analysis/io/neutral/loader.py
          src/structural_analysis/benchmark/rc_control_refinement.py
          src/structural_analysis/benchmark/rc_control_refinement_cli.py
          src/structural_analysis/benchmark/rc_control_design.py
          src/structural_analysis/benchmark/rc_control_reuse.py
          tests/test_neutral_strict_input.py
          tests/test_rc_control_refinement.py
          > rc-refinement-lint.json
      - name: Retain original diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-refinement-diagnostics-${{ github.sha }}
          path: |
            rc-refinement-tests.xml
            rc-refinement-format.diff
            rc-refinement-lint.json
          if-no-files-found: warn
          retention-days: 14
