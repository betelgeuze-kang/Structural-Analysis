name: Agent Concrete Determinism Materialize

on:
  push:
    branches:
      - agent/fix-concrete-damage-artifact-determinism

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-concrete-damage-artifact-determinism
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Decode exact materialized source, test, and artifacts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('.')
          staged = {
              'scripts/build_phase2_state_updated_concrete_damage_artifacts.py': (
                  root / 'scripts/.agent_concrete_builder.gz.b64'
              ).read_text().strip(),
              'tests/test_build_phase2_state_updated_concrete_damage_artifacts.py': (
                  root / 'scripts/.agent_concrete_test.gz.b64'
              ).read_text().strip(),
              'implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json': ''.join(
                  (root / path).read_text().strip()
                  for path in (
                      'scripts/.agent_concrete_result.part00',
                      'scripts/.agent_concrete_result.part01',
                      'scripts/.agent_concrete_result.part02',
                      'scripts/.agent_concrete_result.part03a',
                      'scripts/.agent_concrete_result.part03b',
                      'scripts/.agent_concrete_result.part03c',
                      'scripts/.agent_concrete_result.part03d',
                      'scripts/.agent_concrete_result.part04a',
                      'scripts/.agent_concrete_result.part04b',
                  )
              ),
              'implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json': ''.join(
                  (root / path).read_text().strip()
                  for path in (
                      'scripts/.agent_concrete_summary.part00',
                      'scripts/.agent_concrete_summary.part01',
                      'scripts/.agent_concrete_summary.part02',
                  )
              ),
          }
          expected = {
              'scripts/build_phase2_state_updated_concrete_damage_artifacts.py': '77d6263227f6f8679914f56a90032d556177b8570bc9054c10613eb6efc4e5f2',
              'tests/test_build_phase2_state_updated_concrete_damage_artifacts.py': '84f00c9c362cb10ea607b0de0ae1c2f13387760535da5f57a5d2ad17a74a5ee7',
              'implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json': '8878ab0bdb0618530683367ff90360618c08386b530d680759ff1328871ae203',
              'implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json': 'e9b822e23a550a2e1169e68e06259556faf72c85bcf60a186627ff54be761539',
          }
          for relative, encoded in staged.items():
              payload = gzip.decompress(base64.b64decode(encoded))
              digest = hashlib.sha256(payload).hexdigest()
              if digest != expected[relative]:
                  raise SystemExit(
                      f'staged payload hash mismatch for {relative}: {digest}'
                  )
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f'{relative}: {len(payload)} bytes sha256:{digest}')
          PY
      - name: Validate exact source and artifacts
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python -m ruff check \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python -m ruff format --check \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py
          python scripts/build_phase2_state_updated_concrete_damage_artifacts.py --check
          python -m pytest -q \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_state_updated_concrete_damage_newton.py
      - name: Commit only final source, test, and generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build_phase2_state_updated_concrete_damage_artifacts.py \
            tests/test_build_phase2_state_updated_concrete_damage_artifacts.py \
            implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_result.json \
            implementation/phase1/release_evidence/productization/phase2_state_updated_concrete_damage_summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make concrete-damage localization artifacts deterministic"
          git push origin HEAD:agent/fix-concrete-damage-artifact-determinism
