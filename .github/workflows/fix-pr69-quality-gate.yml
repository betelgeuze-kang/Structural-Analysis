name: Fix PR69 Quality Gate

on:
  push:
    branches: ["ci/hosted-release-lanes"]
    paths:
      - ".github/workflows/fix-pr69-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-pr69-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ci/hosted-release-lanes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install focused test tools
        run: python -m pip install -e .[dev]

      - name: Apply the three Ruff fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/build_g1_load_dependent_near_null_packet.py",
              "    DEFAULT_OUTPUT_JSON as DEFAULT_BASELINE_NEAR_NULL,\n",
              "",
          )
          replace_once(
              "scripts/materialize_gpcr_hard_decoy_operator_template_from_rows.py",
              "    RAW_RANKING_ROW_FIELDS,\n",
              "",
          )
          duplicate_name = (
              "def test_public_benchmark_enrichment_materializer_blocks_duplicate_row_identities() -> None:"
          )
          replace_once(
              "tests/test_materialize_public_benchmark_enrichment_scorecard.py",
              duplicate_name,
              "def test_public_benchmark_enrichment_materializer_blocks_duplicate_target_and_molecule_rows() -> None:",
          )
          replace_once(
              "tests/test_materialize_public_benchmark_enrichment_scorecard.py",
              duplicate_name,
              "def test_public_benchmark_enrichment_materializer_blocks_cross_target_and_molecule_duplicate_identities() -> None:",
          )
          PY

      - name: Verify focused lint and tests
        run: |
          python -m ruff check \
            scripts/build_g1_load_dependent_near_null_packet.py \
            scripts/materialize_gpcr_hard_decoy_operator_template_from_rows.py \
            tests/test_materialize_public_benchmark_enrichment_scorecard.py
          python -m pytest -q tests/test_materialize_public_benchmark_enrichment_scorecard.py

      - name: Commit fixes and remove this one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/fix-pr69-quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix repository Ruff errors blocking hosted CI"
          git push origin HEAD:ci/hosted-release-lanes
