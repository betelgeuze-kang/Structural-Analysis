name: CI

# Canonical structural-product integration gate. Legacy evidence and quarantined
# science code have independent ownership workflows and cannot redefine this lane.
# Frontend and static-viewer sources are owned by their dedicated web workflows;
# this lane is triggered by the Python structural package and shared product gates.

on:
  merge_group:
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "solver/**", "ci/**"]
    paths:
      - "implementation/**"
      - "artifacts/manifests/product_identity.json"
      - "artifacts/manifests/capabilities.yaml"
      - "artifacts/manifests/core_quality.json"
      - "artifacts/manifests/large_blob_policy.json"
      - "LICENSE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/CODEOWNERS"
      - "src/structural_analysis/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".coveragerc"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/core-quality-ci.yml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/pr-metadata-ci.yml"
      - ".github/workflows/science-quarantine-ci.yml"
  pull_request:
    paths:
      - "implementation/**"
      - "artifacts/manifests/product_identity.json"
      - "artifacts/manifests/capabilities.yaml"
      - "artifacts/manifests/core_quality.json"
      - "artifacts/manifests/large_blob_policy.json"
      - "LICENSE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - ".github/CODEOWNERS"
      - "src/structural_analysis/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".coveragerc"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/core-quality-ci.yml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/pr-metadata-ci.yml"
      - ".github/workflows/science-quarantine-ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python package
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked

      - name: Build current-HEAD readiness snapshot
        run: |
          python scripts/build_product_readiness_snapshot.py \
            --out "$RUNNER_TEMP/current-head-product-readiness-snapshot.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "current-head-product-readiness-snapshot.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("source_commit_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("readiness snapshot is not bound to GITHUB_SHA")
          print(f"current-HEAD readiness snapshot: {payload.get('status')}")
          PY

      - name: Upload current-HEAD readiness snapshot
        uses: actions/upload-artifact@v7
        with:
          name: current-head-product-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/current-head-product-readiness-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate product CI ownership boundaries
        run: >-
          python scripts/check_product_ci_boundaries.py
          --json
          --out product-ci-boundary-report.json
          --fail-blocked

      - name: Verify structural core Python lane
        run: python scripts/run_product_ci_lane.py --lane core --ruff --compile

      - name: Materialize deterministic structural-scope audit candidate
        run: python scripts/check_structural_scope_contamination.py --tracked-only

      - name: Upload structural-scope audit candidate
        uses: actions/upload-artifact@v7
        with:
          name: structural-scope-audit-${{ github.run_id }}
          path: |
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.json
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.md
            product-ci-boundary-report.json
          if-no-files-found: error
          retention-days: 14

      - name: PR quality gate
        shell: bash
        env:
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set +e
          python scripts/verify_quality_gate.py --mode pr > ci-quality-gate.log 2>&1
          code=$?
          tail -n 300 ci-quality-gate.log
          exit "$code"

      - name: Upload quality-gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-gate-${{ github.run_id }}
          path: ci-quality-gate.log
          if-no-files-found: warn
          retention-days: 14
