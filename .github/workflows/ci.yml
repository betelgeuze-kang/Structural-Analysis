name: CI

# Canonical structural-product integration gate. Legacy evidence and quarantined
# science code have independent ownership workflows and cannot redefine this lane.
# Frontend and static-viewer sources are owned by their dedicated web workflows;
# this lane is triggered by the Python structural package and shared product gates.

on:
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "solver/**", "ci/**"]
    paths:
      - "implementation/**"
      - "src/structural_analysis/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/science-quarantine-ci.yml"
  pull_request:
    paths:
      - "implementation/**"
      - "src/structural_analysis/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/legacy-evidence-ci.yml"
      - ".github/workflows/science-quarantine-ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate product CI ownership boundaries
        run: >-
          python scripts/check_product_ci_boundaries.py
          --json
          --out product-ci-boundary-report.json
          --fail-blocked

      - name: Verify structural core Python lane
        run: python scripts/run_product_ci_lane.py --lane core --ruff --compile

      - name: Materialize deterministic structural-scope audit candidate
        run: python scripts/check_structural_scope_contamination.py --tracked-only

      - name: Upload structural-scope audit candidate
        uses: actions/upload-artifact@v7
        with:
          name: structural-scope-audit-${{ github.run_id }}
          path: |
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.json
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.md
            product-ci-boundary-report.json
          if-no-files-found: error
          retention-days: 14

      - name: PR quality gate
        shell: bash
        run: |
          set +e
          python scripts/verify_quality_gate.py --mode pr > ci-quality-gate.log 2>&1
          code=$?
          tail -n 300 ci-quality-gate.log
          exit "$code"

      - name: Diagnose G1 MGT fixture drift
        if: failure()
        shell: bash
        run: |
          PYTHONPATH=src:implementation/phase1:scripts python - <<'PY'
          import json
          from pathlib import Path

          from build_g1_mgt_hip_current_tangent_host_parser_receipt import (
              DEFAULT_CHECKPOINT,
              DEFAULT_MGT,
              build_actual_fixture,
              summarize_actual_fixture,
          )
          from structural_analysis.engine_v2.contracts._canonical import array_data_hash

          root = Path.cwd()
          fixture, state, direction, metadata = build_actual_fixture(
              mgt_path=root / DEFAULT_MGT,
              checkpoint_npz=root / DEFAULT_CHECKPOINT,
          )
          expected = json.loads(
              (root / "implementation/phase1/release_evidence/productization/"
               "g1_mgt_hip_current_tangent_hardware_parity_receipt.json").read_text()
          )
          print(json.dumps({
              "expected_fixture": expected["fixture"],
              "observed_fixture": summarize_actual_fixture(fixture),
              "expected_state_data_hash": expected["inputs"]["state_data_hash"],
              "observed_state_data_hash": array_data_hash(state),
              "expected_direction_data_hash": expected["inputs"]["direction_data_hash"],
              "observed_direction_data_hash": array_data_hash(direction),
              "free_equation_count": metadata["free_equation_count"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload quality-gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-gate-${{ github.run_id }}
          path: ci-quality-gate.log
          if-no-files-found: warn
          retention-days: 14
