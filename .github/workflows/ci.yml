name: CI

# Deterministic repository quality gate. Hardware/GPU and private-corpus work is
# isolated in Nightly Heavy Solver so normal pull requests never wait for a local runner.
# Every branch repair is followed by an exact-head Actions run before merge.

on:
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "solver/**", "ci/**"]
    paths:
      - "implementation/**"
      - "src/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "implementation/**"
      - "src/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      - "requirements*.txt"
      - ".betelgeuze/**"
      - "docs/commercial-structural-solver-product-gap-ledger.md"
      - "docs/structural-analysis-ai-engine-gap-ledger.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Materialize deterministic structural-scope audit candidate
        run: python scripts/check_structural_scope_contamination.py --tracked-only

      - name: Upload structural-scope audit candidate
        uses: actions/upload-artifact@v7
        with:
          name: structural-scope-audit-${{ github.run_id }}
          path: |
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.json
            implementation/phase1/release_evidence/productization/structural_scope_contamination_audit.md
          if-no-files-found: error
          retention-days: 14

      - name: PR quality gate
        shell: bash
        run: |
          set +e
          python scripts/verify_quality_gate.py --mode pr > ci-quality-gate.log 2>&1
          code=$?
          tail -n 300 ci-quality-gate.log
          exit "$code"

      - name: Upload quality-gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-gate-${{ github.run_id }}
          path: ci-quality-gate.log
          if-no-files-found: warn
          retention-days: 14
