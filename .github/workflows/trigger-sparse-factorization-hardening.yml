name: Trigger sparse factorization hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/harden-sparse-factorization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Extract and execute focused patch
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/apply-sparse-factorization-hardening.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_sparse_patch.py
          python /tmp/apply_sparse_patch.py
      - name: Format, lint, and test
        run: |
          python -m ruff format src/structural_analysis/solvers/nonlinear/sparse_factorization.py tests/test_sparse_factorization_diagnostics.py
          python -m ruff check src/structural_analysis/solvers/nonlinear/sparse_factorization.py tests/test_sparse_factorization_diagnostics.py
          pytest -q tests/test_sparse_factorization_diagnostics.py
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structural_analysis/solvers/nonlinear/sparse_factorization.py tests/test_sparse_factorization_diagnostics.py
          git commit -m "fix: harden sparse factorization diagnostics"
          git push origin HEAD:${{ github.head_ref }}
