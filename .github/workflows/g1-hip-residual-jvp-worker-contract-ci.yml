name: G1 HIP Residual JVP Worker Contract CI

on:
  merge_group:
  pull_request:
    paths:
      - "src/structural_analysis/solvers/nonlinear/residual_jacobian_consistency.py"
      - "src/structural_analysis/engine_v2_backends/_hip_residual_jvp_worker_contract.py"
      - "src/structural_analysis/engine_v2_backends/hip_residual_jvp_worker.py"
      - "scripts/build_g1_hip_residual_jvp_worker_contract.py"
      - "tests/test_residual_jacobian_consistency.py"
      - "tests/test_hip_residual_jvp_worker.py"
      - ".github/workflows/g1-hip-residual-jvp-worker-contract-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/structural_analysis/solvers/nonlinear/residual_jacobian_consistency.py"
      - "src/structural_analysis/engine_v2_backends/_hip_residual_jvp_worker_contract.py"
      - "src/structural_analysis/engine_v2_backends/hip_residual_jvp_worker.py"
      - "scripts/build_g1_hip_residual_jvp_worker_contract.py"
      - "tests/test_residual_jacobian_consistency.py"
      - "tests/test_hip_residual_jvp_worker.py"
      - ".github/workflows/g1-hip-residual-jvp-worker-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: "${{ github.sha }}"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

concurrency:
  group: g1-hip-residual-jvp-worker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Run mathematical and worker state-machine tests
        run: >-
          python -m pytest -q
          tests/test_residual_jacobian_consistency.py
          tests/test_hip_residual_jvp_worker.py
          tests/test_hip_residual_jvp_worker_public_boundary.py

      - name: Build fail-closed contract-test receipt
        run: >-
          python scripts/build_g1_hip_residual_jvp_worker_contract.py --json
          --source-commit "$SOURCE_SHA"
          --out ".ci/g1-hip-worker/contract-test-receipt.json"

      - name: Upload diagnostic-only receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g1-hip-residual-jvp-worker-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/g1-hip-worker/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
