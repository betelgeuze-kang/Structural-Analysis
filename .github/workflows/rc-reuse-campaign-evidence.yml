name: RC Reuse Three-Topology Evidence

# A fixed synthetic development campaign with downloadable original receipts.
# Each run binds to the PR head (or dispatched/pushed commit), not a PR merge ref.
on:
  pull_request:
    paths:
      - ".github/workflows/rc-reuse-campaign-evidence.yml"
      - "scripts/**"
      - "src/structural_analysis/**"
      - "examples/**"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rc-reuse-campaign-evidence.yml"
      - "scripts/**"
      - "src/structural_analysis/**"
      - "examples/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONPATH: .:src
  RC_REUSE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  three-topology:
    name: rc-reuse-three-topology-originals
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RC_REUSE_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_REUSE_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned runtime dependencies
        run: >-
          python -m pip install numpy==1.26.4 scipy==1.12.0
          matplotlib==3.8.4 jsonschema==4.26.0

      - name: Run frozen three-topology campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc-reuse-campaign"
          python scripts/run_rc_reuse_campaign.py \
            --require-clean-source \
            examples/research/rc_reuse_campaign/three-topology-plan.json \
            "$RUNNER_TEMP/rc-reuse-campaign/packet"

      - name: Independently audit saved packet
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc-reuse-campaign"
          python scripts/audit_rc_reuse_campaign_packet.py \
            "$RUNNER_TEMP/rc-reuse-campaign/packet" \
            --expected-plan examples/research/rc_reuse_campaign/three-topology-plan.json \
            > "$RUNNER_TEMP/rc-reuse-campaign/audit.json"

      - name: Upload full original packet and audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-reuse-three-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-reuse-campaign/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
