name: P0 Canonical Verification Contract

on:
  merge_group:
  pull_request:
  push:
    branches: ["main", "codex/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  TZ: "UTC"
  PYTHONHASHSEED: "0"
  OPENBLAS_CORETYPE: "Haswell"
  CANONICAL_WHEELHOUSE: .ci/canonical-wheelhouse
  CANONICAL_WHEEL_DIR: .ci/canonical-wheel
  CANONICAL_WHEEL_CONTRACT: .ci/canonical-project-wheel-contract.json
  CANONICAL_RECEIPT_PATH: artifacts/manifests/canonical_verification_environment.current.v1.json
  DAG_CANDIDATE_STATE_PATH: .ci/generated-artifact-dag-candidate-state.v2.json
  DAG_CANDIDATE_REPORT_PATH: .ci/generated-artifact-dag-candidate-report.v2.json

jobs:
  canonical-contract:
    name: canonical-contract
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12.11-bookworm@sha256:47d28e7d429679c31c3ea60e90857c54c7967084685e2ee287935116e5a79b92
    timeout-minutes: 30
    steps:
      - name: Verify source-control toolchain
        shell: bash
        run: |
          command -v git
          git --version

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Materialize and install exact hashed canonical dependencies
        shell: bash
        run: |
          mkdir -p "$CANONICAL_WHEELHOUSE"
          python -m pip download \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --dest "$CANONICAL_WHEELHOUSE" \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --force-reinstall \
            --no-cache-dir \
            --no-index \
            --find-links "$CANONICAL_WHEELHOUSE" \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock

      - name: Verify generated capability surfaces
        run: python scripts/generate_capability_surfaces.py

      - name: Derive operational source epoch from exact commit
        shell: bash
        run: |
          source_sha="${{ github.sha }}"
          checkout_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$checkout_sha" = "$source_sha"
          source_date_epoch="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct "$source_sha")"
          case "$source_date_epoch" in
            ''|*[!0-9]*)
              echo "invalid SOURCE_DATE_EPOCH for $source_sha: $source_date_epoch" >&2
              exit 1
              ;;
          esac
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=safe.directory" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build twice and replay exact installed project wheel
        run: >-
          python scripts/build_canonical_project_wheel.py
          --source-sha "${{ github.sha }}"
          --source-date-epoch "$SOURCE_DATE_EPOCH"
          --wheelhouse "$CANONICAL_WHEELHOUSE"
          --wheel-dir "$CANONICAL_WHEEL_DIR"
          --write "$CANONICAL_WHEEL_CONTRACT"

      - name: Verify canonical declarations and freshness behavior
        run: >-
          python -m pytest -q
          tests/test_build_canonical_verification_receipt.py
          tests/test_build_canonical_project_wheel.py
          tests/test_bounded_planar_wheel_smoke.py
          tests/test_generated_artifact_dag.py

      - name: Build exact-source canonical environment receipt
        run: >-
          python scripts/build_canonical_verification_receipt.py
          --enforce
          --source-sha "${{ github.sha }}"
          --project-wheel-contract "$CANONICAL_WHEEL_CONTRACT"
          --project-wheel-dir "$CANONICAL_WHEEL_DIR"
          --dependency-wheelhouse "$CANONICAL_WHEELHOUSE"
          --write "$CANONICAL_RECEIPT_PATH"

      - name: Validate receipt schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(
              Path("canonical/canonical-verification-receipt.v1.schema.json").read_text()
          )
          receipt = json.loads(
              Path("artifacts/manifests/canonical_verification_environment.current.v1.json").read_text()
          )
          jsonschema.Draft202012Validator(schema).validate(receipt)
          wheel_schema = json.loads(
              Path("canonical/canonical-project-wheel-contract.v1.schema.json").read_text()
          )
          wheel_contract = json.loads(
              Path(".ci/canonical-project-wheel-contract.json").read_text()
          )
          jsonschema.Draft202012Validator(wheel_schema).validate(wheel_contract)
          assert receipt["contract_profile"] == "p0-canonical-installed-wheel.v1"
          assert receipt["contract_pass"] is True
          assert receipt["source_checkout_head_sha"] == receipt["source_commit_sha"]
          assert wheel_contract["wheel"]["filename"] == "structural_analysis-0.3.0-py3-none-any.whl"
          assert receipt["project_wheel"]["wheel"]["sha256"] == wheel_contract["wheel"]["sha256"]
          PY

      - name: Build non-authoritative candidate DAG state and report
        run: >-
          python scripts/check_generated_artifact_dag.py
          --write-candidate-state "$DAG_CANDIDATE_STATE_PATH"
          --report "$DAG_CANDIDATE_REPORT_PATH"

      - name: Validate candidate DAG schemas and claim boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          state = json.loads(Path(".ci/generated-artifact-dag-candidate-state.v2.json").read_text())
          report = json.loads(Path(".ci/generated-artifact-dag-candidate-report.v2.json").read_text())
          state_schema = json.loads(Path("canonical/generated-artifact-dag-state.v2.schema.json").read_text())
          report_schema = json.loads(Path("canonical/generated-artifact-dag-report.v2.schema.json").read_text())
          jsonschema.Draft202012Validator(state_schema).validate(state)
          jsonschema.Draft202012Validator(report_schema).validate(report)
          assert state["state_kind"] == "candidate"
          assert state["evaluated_through"] == "verification-receipts"
          assert report["scope_pass"] is True
          assert report["contract_pass"] is False
          assert report["stale_nodes"] == ["product-state"]
          assert all(
              report["nodes"][node_id]["current_binding"]["status"] == "current"
              for node_id in (
                  "capability-registry",
                  "generated-capability-surfaces",
                  "verification-receipts",
              )
          )
          assert report["nodes"]["product-state"]["status"] == "stale"
          assert report["nodes"]["product-state"]["current_binding"]["status"] == "out_of_scope"
          PY

      - name: Upload canonical environment identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-verification-environment-${{ github.sha }}
          path: |
            ${{ env.CANONICAL_RECEIPT_PATH }}
            ${{ env.CANONICAL_WHEEL_CONTRACT }}
            ${{ env.CANONICAL_WHEEL_DIR }}/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload candidate DAG diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-artifact-dag-candidate-${{ github.sha }}
          path: |
            ${{ env.DAG_CANDIDATE_STATE_PATH }}
            ${{ env.DAG_CANDIDATE_REPORT_PATH }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
