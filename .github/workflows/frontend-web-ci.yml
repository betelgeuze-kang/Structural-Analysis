name: Frontend Web CI

# Frontend-only verification for the React workbench and static prototype.
# Structure-viewer browser smoke remains in Viewer Browser CI. The ordered
# negative pattern keeps Python-only src/structural_analysis changes out of this
# lane while mixed Python/frontend pull requests still trigger it.

on:
  merge_group:
  pull_request:
    paths:
      - "index.html"
      - "prototype/**"
      - "src/**"
      - "!src/structural_analysis/**"
      - "tests/frontend/**"
      - "scripts/*.mjs"
      - "scripts/build_native_workbench_evidence_bundle.sh"
      - "scripts/build_native_benchmark_catalog.sh"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/crates/structural-catalog/**"
      - "native/crates/structural-evidence/**"
      - "native/crates/structural-frontend-contract/**"
      - "native/catalog/**"
      - "native/evidence/**"
      - "native/decommission/legacy-frontend-build-contract-v1.json"
      - "implementation/phase1/open_data/irregular/collected/reports/**"
      - "implementation/phase1/open_data/pbd_hinge/peer_spd_specimens/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-web-ci.yml"
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - "index.html"
      - "prototype/**"
      - "src/**"
      - "!src/structural_analysis/**"
      - "tests/frontend/**"
      - "scripts/*.mjs"
      - "scripts/build_native_workbench_evidence_bundle.sh"
      - "scripts/build_native_benchmark_catalog.sh"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "native/crates/structural-catalog/**"
      - "native/crates/structural-evidence/**"
      - "native/crates/structural-frontend-contract/**"
      - "native/catalog/**"
      - "native/evidence/**"
      - "native/decommission/legacy-frontend-build-contract-v1.json"
      - "implementation/phase1/open_data/irregular/collected/reports/**"
      - "implementation/phase1/open_data/pbd_hinge/peer_spd_specimens/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-web-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Rust-orchestrated frontend dependency install
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- frontend-install --root .

      - name: Rust-orchestrated non-blocking dependency audit
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- frontend-audit --root .

      - name: Verify native benchmark catalog
        run: bash ./scripts/build_native_benchmark_catalog.sh --check

      - name: Build evidence bundle (read-only)
        run: bash ./scripts/build_native_workbench_evidence_bundle.sh || echo "::warning::Evidence bundle unavailable; Workbench must show an unavailable state."

      - name: Type-check and build
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- frontend-build --root .

      - name: Frontend build contract
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- check --root .

      - name: Rust-native Workbench prototype static contract
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- prototype --root .

      - name: Rust-orchestrated Playwright browser install
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- playwright-install --root .

      - name: Rust-orchestrated Workbench prototype browser smoke
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- prototype-browser-smoke --root .

      - name: Rust-orchestrated Workbench v2 E2E
        run: cargo run --quiet --locked --manifest-path native/Cargo.toml -p structural-frontend-contract -- workbench-v2-browser-smoke --root .
