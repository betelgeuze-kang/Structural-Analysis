name: Frontend Web CI

# Frontend-only verification for the React workbench and static prototype.
# Structure-viewer browser smoke remains in Viewer Browser CI. The ordered
# negative pattern keeps Python-only src/structural_analysis changes out of this
# lane while mixed Python/frontend pull requests still trigger it.

on:
  merge_group:
  pull_request:
    paths:
      - "index.html"
      - "prototype/**"
      - "src/**"
      - "!src/structural_analysis/**"
      - "tests/frontend/**"
      - "scripts/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_frontend_dependency_audit_report.py"
      - "tests/test_build_frontend_dependency_audit_report.py"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-web-ci.yml"
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - "index.html"
      - "prototype/**"
      - "src/**"
      - "!src/structural_analysis/**"
      - "tests/frontend/**"
      - "scripts/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_frontend_dependency_audit_report.py"
      - "tests/test_build_frontend_dependency_audit_report.py"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Dependency audit before install
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          audit_config="$RUNNER_TEMP/frontend-web-audit-config"
          mkdir -m 700 "$audit_config"
          : > "$audit_config/user.npmrc"
          : > "$audit_config/global.npmrc"
          isolated=(
            env -i
            "PATH=$PATH"
            "NPM_CONFIG_USERCONFIG=$audit_config/user.npmrc"
            "NPM_CONFIG_GLOBALCONFIG=$audit_config/global.npmrc"
            "NPM_CONFIG_CACHE=$audit_config/cache"
          )
          args=(
            --registry=https://registry.npmjs.org/
            --strict-ssl=true
            --include=prod
            --include=dev
            --include=optional
            --include=peer
          )
          "${isolated[@]}" npm audit --json --audit-level=info "${args[@]}"
          "${isolated[@]}" npm audit signatures --json "${args[@]}"

      - name: Install dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --engine-strict
          --registry=https://registry.npmjs.org/ --strict-ssl=true

      - name: Build evidence bundle (read-only)
        run: npm run build:evidence-bundle || echo "::warning::Evidence bundle unavailable; Workbench must show an unavailable state."

      - name: Type-check and build
        run: npm run build

      - name: Frontend build contract
        run: npm run verify:frontend-contract

      - name: Workbench prototype DOM contract
        run: npm run verify:workbench-prototype-dom-contract

      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Workbench prototype browser smoke
        run: npm run verify:workbench-prototype-browser-smoke

      - name: Workbench v2 E2E
        run: npm run verify:workbench-v2-e2e
