name: Workflow Contract CI

# Lightweight syntax, runner-class, trigger, provenance-topology, and product-
# ownership validation. This lane is intentionally independent of workstation
# availability.

on:
  merge_group:
  pull_request:
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/check_github_actions_runner_policy.py"
      - "scripts/check_product_ci_boundaries.py"
      - "scripts/run_product_ci_lane.py"
      - "scripts/build_github_actions_ci_streak_evidence.py"
      - "scripts/verify_quality_gate.py"
      - "tests/test_check_github_actions_runner_policy.py"
      - "tests/test_check_product_ci_boundaries.py"
      - "tests/test_external_vv_clean_runner_contract.py"
      - "tests/test_product_ci_workflow_contract.py"
      - "tests/test_build_github_actions_ci_streak_evidence.py"
      - "tests/test_verify_quality_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Hydrate merge-ref ancestry for provenance tests
        shell: bash
        run: |
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --deepen=512 origin
          fi
          git cat-file -e "${GITHUB_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install workflow validation tools
        run: python -m pip install -e .[dev] PyYAML==6.0.2

      - name: Validate workflow YAML and required shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          errors = []
          paths = sorted(Path('.github/workflows').glob('*.y*ml'))
          if not paths:
              errors.append('no workflow files found')

          for path in paths:
              try:
                  payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'{path}: YAML parse failed: {exc}')
                  continue

              if not isinstance(payload, dict):
                  errors.append(f'{path}: top level must be a mapping')
                  continue

              # YAML 1.1 parsers may normalize the unquoted key `on` to True.
              if 'on' not in payload and True not in payload:
                  errors.append(f'{path}: missing on trigger')
              jobs = payload.get('jobs')
              if not isinstance(jobs, dict) or not jobs:
                  errors.append(f'{path}: jobs must be a non-empty mapping')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f'validated {len(paths)} workflow file(s)')
          PY

      - name: Validate deterministic and hardware runner classes
        run: python scripts/check_github_actions_runner_policy.py --json --fail-blocked

      - name: Validate product CI ownership boundaries
        run: python scripts/check_product_ci_boundaries.py --json --fail-blocked

      - name: Verify workflow, boundary, provenance, and CI-streak contracts
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_check_github_actions_runner_policy.py \
            tests/test_check_product_ci_boundaries.py \
            tests/test_external_vv_clean_runner_contract.py::test_embedded_product_receipts_preserve_integrity_and_invalidate_stale_sources \
            tests/test_product_ci_workflow_contract.py \
            tests/test_build_github_actions_ci_streak_evidence.py \
            tests/test_verify_quality_gate.py \
            > workflow-contract-tests.log 2>&1
          code=$?
          cat workflow-contract-tests.log
          exit "$code"

      - name: Upload workflow contract test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-contract-tests-${{ github.run_id }}
          path: workflow-contract-tests.log
          if-no-files-found: warn
          retention-days: 14
