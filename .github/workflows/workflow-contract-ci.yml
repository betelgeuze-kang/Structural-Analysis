name: Workflow Contract CI

# Lightweight syntax, runner-class, trigger, provenance-topology, and product-
# ownership validation. This lane is intentionally independent of workstation
# availability.

on:
  merge_group:
    paths:
      - ".github/workflows/**"
      - "scripts/check_github_actions_runner_policy.py"
      - "scripts/check_native_ci_contract.py"
      - "scripts/check_native_capabilities.py"
      - "scripts/check_native_dependency_boundary.py"
      - "scripts/check_native_dependency_licenses.py"
      - "scripts/classify_native_ci_scope.py"
      - "scripts/check_product_ci_boundaries.py"
      - "scripts/run_product_ci_lane.py"
      - "scripts/build_github_actions_ci_streak_evidence.py"
      - "scripts/verify_quality_gate.py"
      - "tests/test_check_github_actions_runner_policy.py"
      - "tests/test_native_ci_scope.py"
      - "tests/test_native_capability_manifest.py"
      - "tests/test_native_ci_workflow_contract.py"
      - "tests/test_native_dependency_license.py"
      - "tests/test_check_product_ci_boundaries.py"
      - "tests/test_external_vv_clean_runner_contract.py"
      - "tests/test_external_vv_receipt_ancestry_contract.py"
      - "tests/test_product_ci_workflow_contract.py"
      - "tests/test_repository_python_workflow_contract.py"
      - "tests/test_workflow_yaml_strict.py"
      - "tests/test_workflow_ancestry_single_fetch.py"
      - "tests/test_long_running_workflow_action_pins.py"
      - "tests/test_build_github_actions_ci_streak_evidence.py"
      - "tests/test_verify_quality_gate.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_github_actions_runner_policy.py"
      - "scripts/check_native_ci_contract.py"
      - "scripts/check_native_capabilities.py"
      - "scripts/check_native_dependency_boundary.py"
      - "scripts/check_native_dependency_licenses.py"
      - "scripts/classify_native_ci_scope.py"
      - "scripts/check_product_ci_boundaries.py"
      - "scripts/run_product_ci_lane.py"
      - "scripts/build_github_actions_ci_streak_evidence.py"
      - "scripts/verify_quality_gate.py"
      - "tests/test_check_github_actions_runner_policy.py"
      - "tests/test_native_ci_scope.py"
      - "tests/test_native_capability_manifest.py"
      - "tests/test_native_ci_workflow_contract.py"
      - "tests/test_native_dependency_license.py"
      - "tests/test_check_product_ci_boundaries.py"
      - "tests/test_external_vv_clean_runner_contract.py"
      - "tests/test_external_vv_receipt_ancestry_contract.py"
      - "tests/test_product_ci_workflow_contract.py"
      - "tests/test_repository_python_workflow_contract.py"
      - "tests/test_workflow_yaml_strict.py"
      - "tests/test_workflow_ancestry_single_fetch.py"
      - "tests/test_long_running_workflow_action_pins.py"
      - "tests/test_build_github_actions_ci_streak_evidence.py"
      - "tests/test_verify_quality_gate.py"
  push:
    branches: ["main", "codex/**", "web/**", "feat/**", "ci/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/check_github_actions_runner_policy.py"
      - "scripts/check_native_ci_contract.py"
      - "scripts/check_native_capabilities.py"
      - "scripts/check_native_dependency_boundary.py"
      - "scripts/check_native_dependency_licenses.py"
      - "scripts/classify_native_ci_scope.py"
      - "scripts/check_product_ci_boundaries.py"
      - "scripts/run_product_ci_lane.py"
      - "scripts/build_github_actions_ci_streak_evidence.py"
      - "scripts/verify_quality_gate.py"
      - "tests/test_check_github_actions_runner_policy.py"
      - "tests/test_native_ci_scope.py"
      - "tests/test_native_capability_manifest.py"
      - "tests/test_native_ci_workflow_contract.py"
      - "tests/test_native_dependency_license.py"
      - "tests/test_check_product_ci_boundaries.py"
      - "tests/test_external_vv_clean_runner_contract.py"
      - "tests/test_external_vv_receipt_ancestry_contract.py"
      - "tests/test_product_ci_workflow_contract.py"
      - "tests/test_repository_python_workflow_contract.py"
      - "tests/test_workflow_yaml_strict.py"
      - "tests/test_workflow_ancestry_single_fetch.py"
      - "tests/test_long_running_workflow_action_pins.py"
      - "tests/test_build_github_actions_ci_streak_evidence.py"
      - "tests/test_verify_quality_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merge ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hydrate direct and nested merge-parent ancestry for provenance tests
        shell: bash
        run: |
          # Repeated shallow fetches can leave concurrent maintenance processes
          # racing on .git/shallow. Disable automatic maintenance and fetch each
          # ancestry generation in one process instead of mutating the shallow
          # boundary once per commit.
          git config maintenance.auto false
          git config gc.auto 0

          mapfile -t parents < <(
            git cat-file -p HEAD | awk '$1 == "parent" { print $2 }' | sort -u
          )
          if [[ "${#parents[@]}" -eq 0 ]]; then
            echo "HEAD has no parent commits" >&2
            exit 1
          fi

          git -c maintenance.auto=false -c gc.auto=0 fetch \
            --no-tags --depth=512 origin "${parents[@]}"
          for parent in "${parents[@]}"; do
            git cat-file -e "${parent}^{commit}"
          done

          mapfile -t nested_parents < <(
            for parent in "${parents[@]}"; do
              git cat-file -p "$parent" | awk '$1 == "parent" { print $2 }'
            done | sort -u
          )
          if [[ "${#nested_parents[@]}" -gt 0 ]]; then
            git -c maintenance.auto=false -c gc.auto=0 fetch \
              --no-tags --depth=512 origin "${nested_parents[@]}"
          fi
          for nested_parent in "${nested_parents[@]}"; do
            git cat-file -e "${nested_parent}^{commit}"
          done

          git cat-file -e "${GITHUB_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install workflow validation tools
        run: python -m pip install -e .[dev] PyYAML==6.0.2

      - name: Validate workflow YAML and required shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import stat
          import sys
          import yaml
          from yaml.constructor import ConstructorError
          from yaml.nodes import MappingNode

          class StrictWorkflowLoader(yaml.SafeLoader):
              pass

          def construct_unique_mapping(loader, node, deep=False):
              loader.flatten_mapping(node)
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  try:
                      duplicate = key in mapping
                  except TypeError as exc:
                      raise ConstructorError(
                          'while constructing a workflow mapping',
                          node.start_mark,
                          'found an unhashable mapping key',
                          key_node.start_mark,
                      ) from exc
                  if duplicate:
                      raise ConstructorError(
                          'while constructing a workflow mapping',
                          node.start_mark,
                          f'found duplicate key {key!r}',
                          key_node.start_mark,
                      )
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          StrictWorkflowLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_unique_mapping,
          )

          errors = []
          workflow_root = Path('.github/workflows')
          paths = sorted(
              {*workflow_root.rglob('*.yml'), *workflow_root.rglob('*.yaml')},
              key=lambda path: path.as_posix(),
          )
          if not paths:
              errors.append('no workflow files found')

          for path in paths:
              try:
                  metadata = path.lstat()
                  if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                      raise ValueError('workflow path must be a regular non-symlink file')
                  payload = yaml.load(
                      path.read_text(encoding='utf-8'),
                      Loader=StrictWorkflowLoader,
                  )
              except Exception as exc:
                  errors.append(f'{path}: YAML parse failed: {exc}')
                  continue

              if not isinstance(payload, dict):
                  errors.append(f'{path}: top level must be a mapping')
                  continue

              # YAML 1.1 parsers may normalize the unquoted key `on` to True.
              if 'on' not in payload and True not in payload:
                  errors.append(f'{path}: missing on trigger')
              jobs = payload.get('jobs')
              if not isinstance(jobs, dict) or not jobs:
                  errors.append(f'{path}: jobs must be a non-empty mapping')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)

          print(f'validated {len(paths)} workflow file(s)')
          PY

      - name: Validate deterministic and hardware runner classes
        run: python scripts/check_github_actions_runner_policy.py --json --fail-blocked

      - name: Validate product CI ownership boundaries
        run: python scripts/check_product_ci_boundaries.py --json --fail-blocked

      - name: Verify workflow, provenance, action-pin, and CI-streak contracts
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_check_github_actions_runner_policy.py \
            tests/test_native_ci_scope.py \
            tests/test_native_capability_manifest.py \
            tests/test_native_ci_workflow_contract.py \
            tests/test_native_dependency_license.py \
            tests/test_check_product_ci_boundaries.py \
            tests/test_external_vv_receipt_ancestry_contract.py \
            tests/test_external_vv_clean_runner_contract.py::test_git_ancestry_fallback_walks_raw_objects_across_shallow_boundary \
            tests/test_external_vv_clean_runner_contract.py::test_git_ancestry_probe_preserves_git_errors \
            tests/test_external_vv_clean_runner_contract.py::test_embedded_product_receipts_preserve_integrity_and_invalidate_stale_sources \
            tests/test_product_ci_workflow_contract.py \
            tests/test_repository_python_workflow_contract.py \
            tests/test_workflow_yaml_strict.py \
            tests/test_workflow_ancestry_single_fetch.py \
            tests/test_long_running_workflow_action_pins.py \
            tests/test_build_github_actions_ci_streak_evidence.py \
            tests/test_verify_quality_gate.py \
            > workflow-contract-tests.log 2>&1
          code=$?
          cat workflow-contract-tests.log
          exit "$code"

      - name: Upload workflow contract test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-contract-tests-${{ github.run_id }}
          path: workflow-contract-tests.log
          if-no-files-found: warn
          retention-days: 14
