name: Nightly Full Quality

# Canonical clean-checkout regression lane used for the nightly pass streak.
# Tests requiring workstation hardware, private corpora, or generated release
# artifacts remain in Nightly Heavy Solver and do not block this deterministic lane.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: nightly-full-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked

      - name: Deterministic repository quality gate
        run: python scripts/verify_quality_gate.py --mode full

      - name: Deterministic Python regression suite
        run: python -m pytest -q

      - name: Workbench v2 browser regression
        run: npm run verify:workbench-v2-e2e

      - name: Viewer report contract
        run: npm run verify:viewer-report-pdf

      - name: Viewer performance contract
        run: npm run verify:viewer-performance-probe

      - name: Viewer visual-regression contract
        run: npm run verify:viewer-visual-regression

      - name: Current Phase 1 evidence contract
        run: python scripts/build_phase1_core_api_contract_artifacts.py --check

      - name: Diff hygiene
        run: git diff --check
