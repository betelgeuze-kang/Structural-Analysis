name: Nightly Full Quality

# Canonical clean-checkout regression lane used for the nightly pass streak.
# Tests requiring workstation hardware, private corpora, or generated release
# artifacts remain in Nightly Heavy Solver and do not block this deterministic lane.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

permissions:
  contents: read

concurrency:
  group: nightly-full-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_full_shards:
    name: nightly-pytest-full-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Validate pristine commercial gap ledger
        run: >-
          python -m pytest -q
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked
          python scripts/build_stateful_nonlinear_no_solve_reaction_only_artifact.py
          python scripts/build_fracture_energy_concrete_benchmark.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_fgmres_smoke.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_newton_continuation_receipt.py
          # These Phase 2 summaries also bind the exact Git commit. Materialize
          # them in the clean runner before tests inspect their source state.
          python scripts/build_phase2_linear_reference_artifacts.py
          python scripts/build_phase2_newton_globalization_artifacts.py
          python scripts/build_phase2_nonlinear_load_step_artifacts.py
          python scripts/build_phase2_material_newton_breadth_artifacts.py
          python scripts/build_phase2_material_mesh_newton_artifacts.py
          python scripts/build_phase2_patch_rigidbody_artifacts.py
          python scripts/build_phase2_mesh_load_step_convergence_artifacts.py
          python scripts/build_phase2_frame_shell_material_coupling_artifacts.py

      - name: Run materialized repository test suite shard
        run: >-
          python scripts/run_pytest_shard.py
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --
          -q
          --deselect
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers
          --deselect
          tests/test_build_g1_mgt_hip_current_tangent_host_parser_receipt.py::test_committed_receipt_is_reproducible

  deterministic_quality:
    name: deterministic-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install Python package
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: >-
          npm ci --ignore-scripts --engine-strict
          --registry=https://registry.npmjs.org/ --strict-ssl=true

      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Validate pristine commercial gap ledger
        run: >-
          python -m pytest -q
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked
          # These tracked receipts bind the exact Git commit. Rebuild them only in
          # the ephemeral runner so full pytest validates current-source bytes.
          python scripts/build_stateful_nonlinear_no_solve_reaction_only_artifact.py
          python scripts/build_fracture_energy_concrete_benchmark.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_fgmres_smoke.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_newton_continuation_receipt.py
          python scripts/build_phase2_linear_reference_artifacts.py
          python scripts/build_phase2_newton_globalization_artifacts.py
          python scripts/build_phase2_nonlinear_load_step_artifacts.py
          python scripts/build_phase2_material_newton_breadth_artifacts.py
          python scripts/build_phase2_material_mesh_newton_artifacts.py
          python scripts/build_phase2_patch_rigidbody_artifacts.py
          python scripts/build_phase2_mesh_load_step_convergence_artifacts.py
          python scripts/build_phase2_frame_shell_material_coupling_artifacts.py
          # Developer Preview readiness consumes the Phase 1 summary. Refresh
          # that source receipt before propagating the cyclic readiness graph.
          python scripts/build_phase1_core_api_contract_artifacts.py
          # The readiness graph contains deliberate, bounded back-references.
          # Propagate current-source receipts to a semantic fixed point before
          # the full gate checks the generated snapshots. Three passes are the
          # repository's tested upper bound for a stale protected snapshot.
          for pass in 1 2 3; do
            echo "readiness propagation pass=${pass}"
            python scripts/build_developer_preview_readiness.py
            python scripts/build_developer_preview_rc_status.py
            python scripts/report_release_evidence_freshness.py
            python scripts/report_pm_release_gate.py
            python scripts/build_pm_release_blocker_action_register.py
            python scripts/build_product_readiness_snapshot.py
            python scripts/build_structural_product_development_roadmap.py
          done

      - name: Deterministic repository quality gate
        run: >-
          python scripts/verify_quality_gate.py
          --mode full
          --python-suite-delegated-to-workflow-shards

      - name: Workbench v2 browser regression
        run: npm run verify:workbench-v2-e2e

      - name: Viewer report contract
        run: npm run verify:viewer-report-pdf

      - name: Viewer performance contract
        run: npm run verify:viewer-performance-probe

      - name: Viewer visual-regression contract
        run: npm run verify:viewer-visual-regression

      - name: Current Phase 1 evidence contract
        run: python scripts/build_phase1_core_api_contract_artifacts.py --check

      - name: Diff hygiene
        run: git diff --check

  full_quality:
    name: full-quality
    if: ${{ always() }}
    needs: [python_full_shards, deterministic_quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require deterministic quality and every Python shard
        env:
          PYTHON_FULL_SHARDS_RESULT: ${{ needs.python_full_shards.result }}
          DETERMINISTIC_QUALITY_RESULT: ${{ needs.deterministic_quality.result }}
        run: |
          test "$PYTHON_FULL_SHARDS_RESULT" = "success"
          test "$DETERMINISTIC_QUALITY_RESULT" = "success"

  build_post_main_overlay:
    name: build-post-main-overlay
    if: ${{ always() }}
    needs: full_quality
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.identity.outputs.name }}
    steps:
      - name: Checkout exact Nightly source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify pristine exact-main producer source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(find . -xdev -type l -not -path './.git/*' -print -quit)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.11"

      - name: Install exact current-state dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            -r canonical/requirements-cp312-manylinux2014-x86_64.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Bootstrap pinned official Node audit toolchain
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          node_root="$RUNNER_TEMP/trusted-node-v24.20.0"
          download_home="$RUNNER_TEMP/trusted-node-download-home"
          archive="$RUNNER_TEMP/node-v24.20.0-linux-x64.tar.xz"
          shasums="$RUNNER_TEMP/node-v24.20.0-SHASUMS256.txt"
          /usr/bin/mkdir -m 700 "$node_root" "$download_home"
          download=(/usr/bin/env -i "HOME=$download_home" "PATH=/usr/bin:/bin" LANG=C.UTF-8 LC_ALL=C.UTF-8)
          "${download[@]}" /usr/bin/curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --noproxy '*' https://nodejs.org/dist/v24.20.0/SHASUMS256.txt -o "$shasums"
          "${download[@]}" /usr/bin/curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --noproxy '*' https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz -o "$archive"
          expected='2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  node-v24.20.0-linux-x64.tar.xz'
          actual="$(/usr/bin/awk '$2 == "node-v24.20.0-linux-x64.tar.xz" {print; found++} END {if (found != 1) exit 1}' "$shasums")"
          test "$actual" = "$expected"
          test "$(/usr/bin/sha256sum "$archive" | /usr/bin/awk '{print $1}')" = "${expected%% *}"
          /usr/bin/tar --extract --xz --file "$archive" --directory "$node_root" --strip-components=1 --no-same-owner --no-same-permissions
          node="$node_root/bin/node"
          npm_cli="$node_root/lib/node_modules/npm/bin/npm-cli.js"
          test "$(/usr/bin/sha256sum "$node" | /usr/bin/awk '{print $1}')" = 89af8424dd53e560b1933f87ba650d8bf57c83ca5a04600eefb31f416aabbae7
          test "$(/usr/bin/sha256sum "$npm_cli" | /usr/bin/awk '{print $1}')" = 8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7
          test "$(/usr/bin/realpath "$node")" = "$node"
          test "$(/usr/bin/realpath "$npm_cli")" = "$npm_cli"
          isolated=(/usr/bin/env -i HOME="$download_home" PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8)
          test "$("${isolated[@]}" "$node" --version)" = v24.20.0
          test "$("${isolated[@]}" "$node" "$npm_cli" --version)" = 11.19.0
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "npm-cli=$npm_cli" >> "$GITHUB_OUTPUT"

      - name: Generate exact-source frontend audit before tracked output mutation
        run: >-
          python scripts/build_frontend_dependency_audit_report.py
          --expected-source-sha "$GITHUB_SHA"
          --trusted-node "${{ steps.toolchain.outputs.node }}"
          --trusted-npm-cli "${{ steps.toolchain.outputs.npm-cli }}"

      - name: Generate fresh runtime, nonpromoting V&V, and readiness leaves
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly post-main overlay replay; external bytes reused without freshness or promotion credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "Nightly post-main overlay replay; external bytes reused without freshness or promotion credit."
          python scripts/build_runtime_packaging_manifest.py
          for pass in 1 2 3; do
            echo "post-main readiness propagation pass=${pass}"
            python scripts/build_developer_preview_readiness.py
            python scripts/build_developer_preview_rc_status.py
            python scripts/report_release_evidence_freshness.py
            python scripts/report_pm_release_gate.py
            python scripts/build_pm_release_blocker_action_register.py
            python scripts/build_pm_release_blocker_closure_board.py
            python scripts/build_product_readiness_snapshot.py
            python scripts/build_structural_product_development_roadmap.py
          done

      - name: Build and self-check source-bound post-main overlay
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          overlay_root="$RUNNER_TEMP/post-main-evidence-overlay"
          python scripts/build_post_main_evidence_overlay.py build \
            --repo-root . \
            --overlay-root "$overlay_root" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"
          python scripts/build_post_main_evidence_overlay.py check \
            --repo-root . \
            --overlay-root "$overlay_root" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/post-main-overlay-check.json"
          python -I - "$RUNNER_TEMP/post-main-overlay-check.json" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          def reject(token):
              raise ValueError(token)
          def finite(token):
              value = float(token)
              if not math.isfinite(value):
                  raise ValueError(token)
              return value
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(key)
                  result[key] = value
              return result
          overlay = json.loads(
              Path(sys.argv[1]).read_text(),
              parse_constant=reject,
              parse_float=finite,
              object_pairs_hook=unique,
          )
          assert overlay["generated_artifact_dag"] == {
              "validator_path": "scripts/check_generated_artifact_dag.py",
              "release_leaf_contract_pass": True,
              "violations": [],
          }
          PY
          name="post-main-evidence-overlay-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable unprivileged overlay candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/post-main-evidence-overlay
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  attest_post_main_overlay:
    name: attest-post-main-overlay
    needs: build_post_main_overlay
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.identity.outputs.name }}
    steps:
      # Deliberately no checkout, setup action, dependency installation, or
      # repository executable in this OIDC-bearing job.
      - name: Authenticate candidate API identity and archive bytes
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.build_post_main_overlay.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ needs.build_post_main_overlay.outputs.artifact-digest }}
          CANDIDATE_NAME: ${{ needs.build_post_main_overlay.outputs.artifact-name }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$CANDIDATE_NAME" = "post-main-evidence-overlay-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          root="$RUNNER_TEMP/verified-post-main-overlay"
          mkdir -m 700 "$root"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ID" > "$RUNNER_TEMP/artifact.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/workflows/nightly-full-quality.yml?ref=$GITHUB_SHA" > "$RUNNER_TEMP/workflow-content.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/canonical/nonpromotion-authority-key-policy.v1.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/authority-policy.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/src/structural_analysis/schemas/external_code_to_code_technical_receipt_v1.schema.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/external-code-schema.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/src/structural_analysis/schemas/external_modal_buckling_technical_receipt_v1.schema.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/external-modal-schema.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ID/zip" > "$RUNNER_TEMP/candidate.zip"
          python -I - "$RUNNER_TEMP" "$root" "$CANDIDATE_ID" "$CANDIDATE_DIGEST" "$CANDIDATE_NAME" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import struct
          import sys
          import unicodedata
          import zipfile

          temp, root = map(Path, sys.argv[1:3])
          candidate_id, candidate_digest, candidate_name = sys.argv[3:6]
          repository, source_sha = sys.argv[6:8]
          run_id, run_attempt = map(int, sys.argv[8:10])
          event = sys.argv[10]
          safe_max = 9007199254740991
          sha = re.compile(r"[0-9a-f]{40}")
          digest = re.compile(r"sha256:[0-9a-f]{64}")
          expected_release = {
              path: "release-files/" + path
              for path in {
                  "implementation/phase1/native_runtime_artifact_manifest.json",
                  "implementation/phase1/production_runtime_packaging_manifest.json",
                  "implementation/phase1/runtime_sbom.json",
                  "implementation/phase1/runtime_version_compatibility_matrix.json",
                  "implementation/phase1/release_evidence/productization/frontend_dependency_audit_report.json",
                  "implementation/phase1/release_evidence/productization/pm_release_gate_report.json",
                  "implementation/phase1/release_evidence/productization/pm_release_blocker_action_register.json",
                  "implementation/phase1/release_evidence/productization/pm_release_blocker_closure_board.json",
                  "implementation/phase1/release_evidence/productization/product_readiness_snapshot.json",
                  "implementation/phase1/release_evidence/productization/structural_product_development_roadmap.json",
                  "implementation/phase1/release_evidence/productization/structural_product_development_roadmap.md",
              }
          }
          expected_external = {
              "implementation/phase1/release_evidence/productization/external_code_to_code_technical_execution_receipt.json": (
                  "external-vv-nonpromoting/external_code_to_code_technical_execution_receipt.json",
                  ".ci/product-state-inputs/code-to-code-receipt.json",
                  "src/structural_analysis/schemas/external_code_to_code_technical_receipt_v1.schema.json",
                  "external-code-to-code-technical-execution.v1",
                  "external_code_to_code_technical_execution",
                  "sha256:2c3877649b94ddd250ec2f5d4690f18c13b126db274c31c43b0232763fb0fd7a",
                  "external-code-schema.json",
              ),
              "implementation/phase1/release_evidence/productization/external_modal_buckling_technical_execution_receipt.json": (
                  "external-vv-nonpromoting/external_modal_buckling_technical_execution_receipt.json",
                  ".ci/product-state-inputs/modal-buckling-receipt.json",
                  "src/structural_analysis/schemas/external_modal_buckling_technical_receipt_v1.schema.json",
                  "external-modal-buckling-technical-execution.v1",
                  "external_code_to_code_modal_buckling_technical_execution",
                  "sha256:46381abd9eee13c5b02986f21f49251f47c856c711e23581b9b57032e0457f31",
                  "external-modal-schema.json",
              ),
          }
          def fail(reason): raise SystemExit(reason)
          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out: fail(f"duplicate_json_key:{key}")
                  out[key] = value
