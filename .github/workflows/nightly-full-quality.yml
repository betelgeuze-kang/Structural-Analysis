name: Nightly Full Quality

# Canonical clean-checkout regression lane used for the nightly pass streak.
# Tests requiring workstation hardware, private corpora, or generated release
# artifacts remain in Nightly Heavy Solver and do not block this deterministic lane.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: nightly-full-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python package
        run: python -m pip install -e .[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deterministic repository quality gate
        run: python scripts/verify_quality_gate.py --mode full

      - name: Deterministic Python regression suite
        run: python -m pytest -q

      - name: Rust-orchestrated Workbench v2 browser regression
        run: npm run verify:workbench-v2-e2e

      - name: Rust-orchestrated Viewer report PDF contract
        run: npm run verify:viewer-report-pdf

      - name: Viewer performance contract
        run: npm run verify:viewer-performance-probe

      - name: Viewer visual-regression contract
        run: npm run verify:viewer-visual-regression

      - name: Current Phase 1 evidence contract
        run: python scripts/build_phase1_core_api_contract_artifacts.py --check

      - name: Diff hygiene
        run: git diff --check
