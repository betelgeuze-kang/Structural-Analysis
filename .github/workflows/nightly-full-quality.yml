          if workflow.get("sha") != producer.get("workflow_blob_sha") or hash_bytes(workflow_raw) != producer.get("workflow_sha256"): fail("workflow_blob_identity_invalid")
          if producer.get("workflow_name") != "Nightly Full Quality" or producer.get("workflow_path") != ".github/workflows/nightly-full-quality.yml" or producer.get("event") != event or producer.get("run_id") != run_id or producer.get("run_attempt") != run_attempt or type(producer.get("run_id")) is not int or not 1 <= producer["run_id"] <= safe_max or type(producer.get("run_attempt")) is not int or not 1 <= producer["run_attempt"] <= safe_max: fail("overlay_producer_identity_invalid")
          if seal.get("authority_flow") != {"producer":"Nightly Full Quality","consumer":"Product State Current","cycle_free":True}: fail("authority_flow_invalid")
          if seal.get("generated_artifact_dag") != {"validator_path":"scripts/check_generated_artifact_dag.py","release_leaf_contract_pass":True,"violations":[]}: fail("dag_contract_invalid")
          observed = set()
          for row in seal.get("release_files", []):
              path = safe_path(row.get("path"), "release_path")
              overlay_path = safe_path(row.get("overlay_path"), "release_overlay_path")
              if path in observed or expected_release.get(path) != overlay_path or overlay_path not in files: fail("release_file_set_invalid")
              observed.add(path)
              raw = files[overlay_path]
              if row.get("bytes") != len(raw) or row.get("sha256") != hash_bytes(raw): fail("release_file_identity_invalid")
              if path.endswith(".json"): load(raw, path)
          if observed != set(expected_release): fail("release_file_set_invalid")
          external = seal.get("external_vv_nonpromotion", {})
          effective_claims = external.get("effective_claims")
          expected_effective_claims = {
              "independent_operator_attested",
              "verification_hierarchy_operator_manifest_attached",
              "verification_hierarchy_credit",
              "product_legal_license_approval",
              "external_runtime_redistribution_approval",
              "commercial_redistribution_approved",
              "formal_verification_level_2",
              "commercial_equivalence",
              "design_authority",
              "release_readiness",
              "release_authority",
          }
          if external.get("promotion_eligible") is not False or type(effective_claims) is not dict or set(effective_claims) != expected_effective_claims or any(value is not False for value in effective_claims.values()): fail("external_promotion_boundary_invalid")
          external_paths = set()
          external_sources = set()
          for row in external.get("receipts", []):
              if type(row) is not dict or set(row) != {"source_path","overlay_path","product_state_input_path","schema_version","schema_path","schema_blob_sha","schema_sha256","bytes","sha256","technical_contract_pass","promotion_eligible"}: fail("external_receipt_row_shape_invalid")
              source_path = safe_path(row.get("source_path"), "external_source_path")
              overlay_path = safe_path(row.get("overlay_path"), "external_overlay_path")
              input_path = safe_path(row.get("product_state_input_path"), "external_input_path")
              contract = expected_external.get(source_path)
              if source_path in external_sources or overlay_path in external_paths or overlay_path not in files or contract is None or contract[:2] != (overlay_path, input_path) or row.get("promotion_eligible") is not False: fail("external_receipt_identity_invalid")
              external_sources.add(source_path)
              external_paths.add(overlay_path)
              raw = files[overlay_path]
              receipt = load(raw, overlay_path)
              claims = receipt.get("claims")
              schema_path, schema_version, truth_class, boundary_digest, schema_api_name = contract[2:]
              schema_api = load((temp / schema_api_name).read_bytes(), schema_api_name)
              schema_raw = source_file(schema_api, schema_path)
              receipt_schema = load(schema_raw, schema_path)
              schema_properties = receipt_schema.get("properties")
              schema_required = receipt_schema.get("required")
              if receipt_schema.get("type") != "object" or receipt_schema.get("additionalProperties") is not False or type(schema_properties) is not dict or type(schema_required) is not list or set(receipt) != set(schema_properties) or not set(schema_required) <= set(receipt): fail("external_receipt_schema_shape_invalid")
              if row.get("schema_path") != schema_path or row.get("schema_version") != schema_version or row.get("schema_blob_sha") != schema_api.get("sha") or row.get("schema_sha256") != hash_bytes(schema_raw): fail("external_schema_identity_invalid")
              if type(claims) is not dict or receipt.get("status") == "ready" or receipt.get("schema_version") != schema_version or receipt.get("truth_class") != truth_class or receipt.get("source_commit_sha") != source_sha: fail("external_receipt_contract_invalid")
              artifact_material = {key:value for key,value in receipt.items() if key != "artifact_hash"}
              artifact_raw = json.dumps(artifact_material, allow_nan=False, ensure_ascii=False, separators=(",",":"), sort_keys=True).encode()
              if receipt.get("artifact_hash") != hash_bytes(artifact_raw): fail("external_receipt_artifact_hash_invalid")
              for key in ("commercial_equivalence","commercial_redistribution_approved","design_authority","external_runtime_redistribution_approval","product_legal_license_approval","product_legal_approval","release_readiness","verification_level_2","release_authority","formal_verification_level_2","independent_operator_attested"):
                  if (key in receipt and receipt[key] is not False) or (key in claims and claims[key] is not False): fail("external_receipt_promotes_authority")
              if receipt.get("verification_hierarchy_operator_manifest_attached") is not False or receipt.get("verification_hierarchy_credit") is not False: fail("external_receipt_promotes_hierarchy")
              runtimes = receipt.get("runtimes")
              if type(runtimes) is not dict or set(runtimes) != {"opensees","calculix"}: fail("external_receipt_runtimes_invalid")
              for runtime in runtimes.values():
                  license_row = runtime.get("license") if type(runtime) is dict else None
                  if type(license_row) is not dict or license_row.get("product_legal_approval") is not False or license_row.get("commercial_redistribution_approved") is not False: fail("external_receipt_runtime_license_promoted")
              replay = receipt.get("replay_provenance")
              technical_pass = receipt.get("technical_contract_pass")
              if row.get("technical_contract_pass") is not technical_pass or type(replay) is not dict or replay.get("external_runtime_executed_in_this_generation") is not False or replay.get("external_execution_reused") is not True or type(technical_pass) is not bool or replay.get("current_product_replay_pass") is not technical_pass or type(replay.get("reuse_reason")) is not str or not replay["reuse_reason"].strip() or receipt.get("status") != ("partial" if technical_pass else "blocked"): fail("external_receipt_replay_invalid")
              if hash_bytes(str(receipt.get("claim_boundary", "")).encode()) != boundary_digest: fail("external_receipt_claim_boundary_invalid")
              reject_promoted_authority(receipt)
              if row.get("bytes") != len(raw) or row.get("sha256") != hash_bytes(raw): fail("external_receipt_digest_invalid")
          if external_sources != set(expected_external) or len(external_paths) != 2: fail("external_receipt_set_invalid")
          handoff = seal.get("technical_handoff_contracts", {})
          lanes = handoff.get("lanes", [])
          if handoff.get("promotion_eligible") is not False or {row.get("lane") for row in lanes} != {"medium","ifc","mgt9","mgt10","native"} or any(row.get("authority") != "technical_only" or row.get("promotion_eligible") is not False for row in lanes): fail("technical_handoff_boundary_invalid")
          expected_members = {seal_name, *(row["overlay_path"] for row in seal["release_files"]), *(row["overlay_path"] for row in external["receipts"])}
          if set(files) != expected_members: fail("candidate_archive_member_set_invalid")
          for name, raw in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          (root / "candidate-artifact-api.json").write_text(json.dumps(api, indent=2, sort_keys=True) + "\n")
          PY
          name="post-main-evidence-overlay-attested-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest immutable post-main overlay seal
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ runner.temp }}/verified-post-main-overlay/post-main-evidence-overlay.seal.json

      - name: Retain attestation without changing sealed evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "$RUNNER_TEMP/verified-post-main-overlay/post-main-evidence-overlay.sigstore.json"

      - name: Upload attested post-main overlay
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/verified-post-main-overlay
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
