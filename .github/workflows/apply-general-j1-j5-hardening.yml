name: Apply connected Frame2D manifest hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/harden-general-j1-j5-manifest'
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Apply focused manifest hardening
        run: python .github/apply_general_j1_j5_hardening.py
      - name: Format, lint, and test
        run: |
          python -m ruff format src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_general.py tests/test_corotational_fiber_frame_general.py
          python -m ruff check src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_general.py tests/test_corotational_fiber_frame_general.py
          pytest -q tests/test_corotational_fiber_frame_general.py
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/structural_analysis/assembly/stateful_corotational_fiber_frame2d_general.py tests/test_corotational_fiber_frame_general.py
          git commit -m "fix: harden connected Frame2D manifest bindings"
          git push origin HEAD:${{ github.head_ref }}
