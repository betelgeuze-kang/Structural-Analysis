name: Agent J3 EquationScaling Binding Materialize

on:
  pull_request:
    paths:
      - "src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state.py"
      - "tests/test_stateful_fiber_frame2d_kinematic_state.py"
      - "docs/fiber-frame-nonlinear-kinematic-state.md"
      - ".github/workflows/agent-j3-equation-scaling-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Adapt J3 to canonical J2 binding
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "src/structural_analysis/assembly/"
              "stateful_fiber_frame2d_kinematic_state.py"
          )
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "from structural_analysis.assembly.stateful_fiber_frame2d_physical_scaling import (\n"
              "    FiberFramePhysicalEquationScalingReceipt,\n"
              "    validate_fiber_frame_physical_equation_scaling_against_problem,\n"
              ")",
              "from structural_analysis.assembly.stateful_fiber_frame2d_physical_equation_scaling import (\n"
              "    FiberFramePhysicalEquationScalingBinding,\n"
              "    validate_fiber_frame_physical_equation_scaling_against_problem,\n"
              ")",
          )
          text = text.replace(
              "FiberFramePhysicalEquationScalingReceipt",
              "FiberFramePhysicalEquationScalingBinding",
          )
          text = text.replace(
              "physical_scaling.scaling_hash",
              "physical_scaling.binding_hash",
          )
          source.write_text(text, encoding="utf-8")

          test = Path("tests/test_stateful_fiber_frame2d_kinematic_state.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              "from structural_analysis.assembly.stateful_fiber_frame2d_physical_scaling import (\n"
              "    create_fiber_frame_physical_equation_scaling,\n"
              ")",
              "from structural_analysis.assembly.stateful_fiber_frame2d_physical_equation_scaling import (\n"
              "    create_stateful_fiber_frame2d_physical_equation_scaling,\n"
              ")",
          )
          text = text.replace(
              "create_fiber_frame_physical_equation_scaling(problem, topology)",
              "create_stateful_fiber_frame2d_physical_equation_scaling(\n"
              "        problem, topology\n"
              "    )",
          )
          text = text.replace("scaling.scaling_hash", "scaling.binding_hash")
          test.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state.py \
            tests/test_stateful_fiber_frame2d_kinematic_state.py
          python -m ruff format \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state.py \
            tests/test_stateful_fiber_frame2d_kinematic_state.py
      - name: Focused J3 tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv \
            tests/test_stateful_fiber_frame2d_execution_topology.py \
            tests/test_stateful_fiber_frame2d_physical_equation_scaling.py \
            tests/test_stateful_fiber_frame2d_kinematic_state.py \
            tests/test_stateful_fiber_frame2d.py \
            2>&1 | tee j3-kinematic-state-pytest.log
      - name: Upload J3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j3-kinematic-state-pytest-${{ github.run_id }}
          path: j3-kinematic-state-pytest.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve focused failure
        if: steps.focused.outcome == 'failure'
        run: exit 1
      - name: Commit adapted J3 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/structural_analysis/assembly/stateful_fiber_frame2d_kinematic_state.py \
            tests/test_stateful_fiber_frame2d_kinematic_state.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bind nonlinear kinematic state to EquationScaling J2"
          git push origin HEAD:${{ github.head_ref }}
