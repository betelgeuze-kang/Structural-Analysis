name: Repository Python Tests

# Protected Option B is active: every pull request collects and runs every test.
# Merge queue, main, and explicit dispatch retain the same complete suite.
# Do not narrow PR coverage without a corresponding branch-protection decision.

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

permissions:
  contents: read

concurrency:
  group: repository-python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: pytest-collection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Validate hosted HIP receipt source binding
        run: >-
          python scripts/build_g1_mgt_hip_current_tangent_host_parser_receipt.py
          --check-source-only

      - name: Collect complete repository test suite
        run: python -m pytest --collect-only -q

  full_shards:
    name: pytest-full-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Each shard retains the full hosted-job ceiling.  Deterministic module
    # partitioning keeps normal wall time below that ceiling while every test
    # remains covered exactly once by the required aggregate context.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      # This contract describes the committed productization snapshot.  The
      # following materialization step intentionally rewrites source-bound
      # receipts for ephemeral replay, so validate the snapshot first and do
      # not mix the two evidence epochs in one assertion.
      - name: Validate pristine commercial gap ledger
        run: >-
          python -m pytest -q
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers

      - name: Materialize exact current-source test evidence
        shell: bash
        run: |
          python scripts/run_external_code_to_code_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python scripts/run_external_modal_buckling_technical_receipt.py \
            --refresh-product-replay \
            --reuse-reason "CI product replay; external execution bytes reused without freshness credit."
          python benchmarks/clean-runners/opensees-calculix/run_clean_runner.py \
            --repo-root . \
            --output-dir artifacts/vv/opensees_calculix_clean_runner \
            --refresh-product-replay-summary
          python scripts/build_bounded_planar_external_linear_case_package.py
          python scripts/build_bounded_planar_external_negative_case_package.py
          python scripts/build_bounded_planar_external_scaling_case_package.py
          python scripts/build_bounded_planar_external_modal_buckling_case_package.py
          python scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py
          python scripts/build_bounded_planar_external_vv_matrix.py
          python scripts/build_internal_license_due_diligence.py --fail-blocked
          # These tracked receipts bind the exact Git commit. Rebuild them only in
          # the ephemeral runner so full pytest validates current-source bytes.
          python scripts/build_stateful_nonlinear_no_solve_reaction_only_artifact.py
          python scripts/build_fracture_energy_concrete_benchmark.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_fgmres_smoke.py
          python scripts/build_g1_mgt_state_updated_frame_axial_matrix_free_newton_continuation_receipt.py

      - name: Run materialized repository test suite shard
        run: >-
          python scripts/run_pytest_shard.py
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --
          -q
          --deselect
          tests/test_commercial_gap_ledger_status.py::test_commercial_gap_ledger_status_is_honest_about_current_blockers
          --deselect
          tests/test_build_g1_mgt_hip_current_tangent_host_parser_receipt.py::test_committed_receipt_is_reproducible

  full:
    name: pytest-full
    if: ${{ always() }}
    needs: full_shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every deterministic repository test shard
        env:
          FULL_SHARDS_RESULT: ${{ needs.full_shards.result }}
        run: test "$FULL_SHARDS_RESULT" = "success"
