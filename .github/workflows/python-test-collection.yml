name: Repository Python Tests

# Repository-wide import/collection integrity is independent of path ownership.
# Every PR must collect every test; merge queue and main execute the full suite.

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: repository-python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Collect complete repository test suite
        run: python -m pytest --collect-only -q

  full:
    if: github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e .[dev]

      - name: Run complete repository test suite
        run: python -m pytest -q
