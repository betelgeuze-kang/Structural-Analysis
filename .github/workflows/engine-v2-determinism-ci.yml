name: Engine v2 Cross-platform Determinism CI

# Exact canonical-hash replay only. Passing this lane is not CPU/HIP parity,
# hardware evidence, solver validation, or product-readiness evidence.

on:
  pull_request:
    paths:
      - "src/structural_analysis/engine_v2/**"
      - "src/structural_analysis/model_ir/**"
      - "src/structural_analysis/schemas/**"
      - "tests/fixtures/model_ir_v2/**"
      - "tests/test_engine_v2_cross_platform_goldens.py"
      - "tests/test_build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_engine_v2_cross_platform_determinism_receipt.py"
      - "pyproject.toml"
      - ".github/workflows/engine-v2-determinism-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/structural_analysis/engine_v2/**"
      - "src/structural_analysis/model_ir/**"
      - "src/structural_analysis/schemas/**"
      - "tests/fixtures/model_ir_v2/**"
      - "tests/test_engine_v2_cross_platform_goldens.py"
      - "tests/test_build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_engine_v2_cross_platform_determinism_receipt.py"
      - "pyproject.toml"
      - ".github/workflows/engine-v2-determinism-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ENGINE_V2_SOURCE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
  # Keep checkout faithful to committed bytes: historical evidence contains both
  # direct NPZ blobs and LFS pointers, plus paths longer than Win32's default.
  GIT_CONFIG_COUNT: "6"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: filter.lfs.required
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: filter.lfs.clean
  GIT_CONFIG_VALUE_2: cat
  GIT_CONFIG_KEY_3: filter.lfs.smudge
  GIT_CONFIG_VALUE_3: cat
  GIT_CONFIG_KEY_4: filter.lfs.process
  GIT_CONFIG_VALUE_4: ""
  GIT_CONFIG_KEY_5: core.autocrlf
  GIT_CONFIG_VALUE_5: "false"

concurrency:
  group: engine-v2-determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-goldens:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENGINE_V2_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and contract tools
        run: python -m pip install -e .[dev]

      - name: Replay exact Engine v2 golden hashes
        run: >-
          python -m pytest -q
          tests/test_engine_v2_cross_platform_goldens.py
          tests/test_build_engine_v2_cross_platform_determinism_receipt.py

      - name: Build coordinate determinism receipt
        if: ${{ always() }}
        run: >-
          python scripts/build_engine_v2_cross_platform_determinism_receipt.py run
          --os-label "${{ matrix.os }}"
          --python-version "${{ matrix.python-version }}"
          --source-commit "${{ env.ENGINE_V2_SOURCE_SHA }}"
          --origin-kind github_actions
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --job "${{ github.job }}"
          --runner-name "${{ runner.name }}"
          --out ".ci/engine-v2-determinism/${{ matrix.os }}-python-${{ matrix.python-version }}.json"
          --json
          --fail-blocked

      - name: Upload coordinate determinism receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-v2-determinism-coordinate-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: .ci/engine-v2-determinism/*.json
          if-no-files-found: warn
          retention-days: 30

  matrix-receipt:
    name: Aggregate four-way determinism receipt
    if: ${{ always() }}
    needs: cross-platform-goldens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENGINE_V2_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and receipt tools
        run: python -m pip install -e .[dev]

      - name: Download coordinate receipts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: engine-v2-determinism-coordinate-*
          path: .ci/engine-v2-determinism/coordinates
          merge-multiple: true

      - name: Aggregate exact four-way receipt
        run: >-
          python scripts/build_engine_v2_cross_platform_determinism_receipt.py aggregate
          --receipts-dir .ci/engine-v2-determinism/coordinates
          --source-commit "${{ env.ENGINE_V2_SOURCE_SHA }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --matrix-job-result "${{ needs.cross-platform-goldens.result }}"
          --out .ci/engine-v2-determinism/engine-v2-four-way-matrix-receipt.json
          --json
          --fail-blocked

      - name: Upload four-way determinism receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-v2-determinism-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/engine-v2-determinism/engine-v2-four-way-matrix-receipt.json
          if-no-files-found: warn
          retention-days: 30
