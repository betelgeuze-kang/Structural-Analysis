name: Engine v2 Cross-platform Determinism CI

# Reference-coordinate exact hashes plus four-way bounded-planar semantic replay.
# The separately pinned P0 canonical workflow owns canonical-environment truth.
# Each coordinate requires two byte-identical builds in one workflow execution.
# Future-run and cross-platform wheel byte equality are deliberately not claimed.
# Passing this lane is not CPU/HIP parity, independent V&V, hardware evidence,
# or product readiness.

on:
  merge_group:
  pull_request:
    paths:
      - "src/structural_analysis/engine_v2/**"
      - "src/structural_analysis/adapters/**"
      - "src/structural_analysis/model_ir/**"
      - "src/structural_analysis/schemas/**"
      - "src/structural_analysis/api/**"
      - "src/structural_analysis/assembly/**"
      - "src/structural_analysis/elements/**"
      - "src/structural_analysis/materials/**"
      - "src/structural_analysis/solvers/nonlinear/**"
      - "src/structural_analysis/io/neutral/**"
      - "src/structural_analysis/model/**"
      - "examples/public_corotational_member_features.json"
      - "examples/bounded_planar_frame_alpha.model-ir.v2.json"
      - "examples/bounded_planar_settlement.model-ir.v2.json"
      - "tests/fixtures/model_ir_v2/**"
      - "tests/test_unified_nonlinear_frame_api.py"
      - "tests/test_bounded_planar_model_ir_adapter.py"
      - "tests/test_bounded_planar_wheel_smoke.py"
      - "tests/test_build_bounded_planar_wheel_smoke_manifest.py"
      - "tests/test_engine_v2_cross_platform_goldens.py"
      - "tests/test_build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_bounded_planar_wheel_smoke_manifest.py"
      - "scripts/verify_bounded_planar_wheel_smoke.py"
      - "ci/bounded-planar-wheel-smoke.constraints.txt"
      - "pyproject.toml"
      - ".github/workflows/engine-v2-determinism-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/structural_analysis/engine_v2/**"
      - "src/structural_analysis/adapters/**"
      - "src/structural_analysis/model_ir/**"
      - "src/structural_analysis/schemas/**"
      - "src/structural_analysis/api/**"
      - "src/structural_analysis/assembly/**"
      - "src/structural_analysis/elements/**"
      - "src/structural_analysis/materials/**"
      - "src/structural_analysis/solvers/nonlinear/**"
      - "src/structural_analysis/io/neutral/**"
      - "src/structural_analysis/model/**"
      - "examples/public_corotational_member_features.json"
      - "examples/bounded_planar_frame_alpha.model-ir.v2.json"
      - "examples/bounded_planar_settlement.model-ir.v2.json"
      - "tests/fixtures/model_ir_v2/**"
      - "tests/test_unified_nonlinear_frame_api.py"
      - "tests/test_bounded_planar_model_ir_adapter.py"
      - "tests/test_bounded_planar_wheel_smoke.py"
      - "tests/test_build_bounded_planar_wheel_smoke_manifest.py"
      - "tests/test_engine_v2_cross_platform_goldens.py"
      - "tests/test_build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_engine_v2_cross_platform_determinism_receipt.py"
      - "scripts/build_bounded_planar_wheel_smoke_manifest.py"
      - "scripts/verify_bounded_planar_wheel_smoke.py"
      - "ci/bounded-planar-wheel-smoke.constraints.txt"
      - "pyproject.toml"
      - ".github/workflows/engine-v2-determinism-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep noncanonical semantic replay independent of hosted-runner CPU dispatch
  # and parallel reduction order. The separately pinned canonical workflow still
  # owns the exact dependency and BLAS/LAPACK identity receipt.
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  ENGINE_V2_SOURCE_SHA: "${{ github.sha }}"
  ENGINE_V2_MATRIX_RECEIPT: ".ci/engine-v2-determinism/engine-v2-four-way-matrix-receipt.json"
  ENGINE_V2_WHEEL_MANIFEST: ".ci/engine-v2-wheel-smoke-manifest/bounded-planar-wheel-smoke-four-way.json"
  ENGINE_V2_ATTESTATION_BUNDLE: ".ci/engine-v2-determinism/engine-v2-four-way-matrix-receipt.sigstore.json"
  ENGINE_V2_ATTESTATION_VERIFICATION: ".ci/engine-v2-determinism/engine-v2-four-way-matrix-receipt.attestation-verification.json"
  ENGINE_V2_WHEEL_ATTESTATION_BUNDLE: ".ci/engine-v2-wheel-smoke-manifest/bounded-planar-wheel-smoke-four-way.sigstore.json"
  ENGINE_V2_WHEEL_ATTESTATION_VERIFICATION: ".ci/engine-v2-wheel-smoke-manifest/bounded-planar-wheel-smoke-four-way.attestation-verification.json"
  GH_TOKEN: "${{ github.token }}"
  # Keep checkout faithful to committed bytes: historical evidence contains both
  # direct NPZ blobs and LFS pointers, plus paths longer than Win32's default.
  GIT_CONFIG_COUNT: "6"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: filter.lfs.required
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: filter.lfs.clean
  GIT_CONFIG_VALUE_2: cat
  GIT_CONFIG_KEY_3: filter.lfs.smudge
  GIT_CONFIG_VALUE_3: cat
  GIT_CONFIG_KEY_4: filter.lfs.process
  GIT_CONFIG_VALUE_4: ""
  GIT_CONFIG_KEY_5: core.autocrlf
  GIT_CONFIG_VALUE_5: "false"

concurrency:
  group: engine-v2-determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-goldens:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENGINE_V2_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and contract tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Verify installed-wheel bounded planar sample
        run: >-
          python scripts/verify_bounded_planar_wheel_smoke.py --json
          --os-label "${{ matrix.os }}"
          --python-version "${{ matrix.python-version }}"
          --wheel-out-dir ".ci/engine-v2-wheel-smoke/wheel"
          --write ".ci/engine-v2-wheel-smoke/receipt.json"

      - name: Upload exact-source wheel smoke receipt and wheel
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bounded-planar-wheel-smoke-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: .ci/engine-v2-wheel-smoke/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Replay reference-exact and semantic Engine v2 goldens
        run: >-
          python -m pytest -q
          tests/test_engine_v2_cross_platform_goldens.py
          tests/test_build_engine_v2_cross_platform_determinism_receipt.py

      - name: Build coordinate determinism receipt
        if: ${{ always() }}
        run: >-
          python scripts/build_engine_v2_cross_platform_determinism_receipt.py run
          --os-label "${{ matrix.os }}"
          --python-version "${{ matrix.python-version }}"
          --source-commit "${{ env.ENGINE_V2_SOURCE_SHA }}"
          --origin-kind github_actions
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --job "${{ github.job }}"
          --runner-name "${{ runner.name }}"
          --out ".ci/engine-v2-determinism/${{ matrix.os }}-python-${{ matrix.python-version }}.json"
          --json
          --fail-blocked

      - name: Upload coordinate determinism receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-v2-determinism-coordinate-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: .ci/engine-v2-determinism/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  matrix-receipt:
    name: Aggregate four-way determinism receipt
    if: ${{ always() }}
    needs: cross-platform-goldens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENGINE_V2_SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and receipt tools
        run: |
          python -m pip install numpy==1.26.4 scipy==1.12.0
          python -m pip install -e .[dev]

      - name: Download coordinate receipts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: engine-v2-determinism-coordinate-*
          path: .ci/engine-v2-determinism/coordinates
          merge-multiple: true

      - name: Download exact-source wheel smoke receipts and wheels
        uses: actions/download-artifact@v7
        with:
          pattern: bounded-planar-wheel-smoke-*
          path: .ci/engine-v2-wheel-smoke/coordinates
          merge-multiple: false

      - name: Aggregate four-way exact and semantic receipt
        run: >-
          python scripts/build_engine_v2_cross_platform_determinism_receipt.py aggregate
          --receipts-dir .ci/engine-v2-determinism/coordinates
          --source-commit "${{ env.ENGINE_V2_SOURCE_SHA }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --matrix-job-result "${{ needs.cross-platform-goldens.result }}"
          --out "$ENGINE_V2_MATRIX_RECEIPT"
          --json
          --fail-blocked

      - name: Validate and bind four-way wheel smoke artifacts
        run: >-
          python scripts/build_bounded_planar_wheel_smoke_manifest.py
          --artifacts-dir .ci/engine-v2-wheel-smoke/coordinates
          --source-commit "${{ env.ENGINE_V2_SOURCE_SHA }}"
          --out "$ENGINE_V2_WHEEL_MANIFEST"
          --json

      - name: Upload four-way determinism receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-v2-determinism-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ENGINE_V2_MATRIX_RECEIPT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload four-way wheel smoke manifest
        uses: actions/upload-artifact@v7
        with:
          name: bounded-planar-wheel-smoke-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ENGINE_V2_WHEEL_MANIFEST }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  attest-current-main:
    name: Attest current-main four-way receipt
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: matrix-receipt
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact four-way receipt
        uses: actions/download-artifact@v7
        with:
          name: engine-v2-determinism-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/engine-v2-determinism

      - name: Download exact four-way wheel smoke manifest
        uses: actions/download-artifact@v7
        with:
          name: bounded-planar-wheel-smoke-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/engine-v2-wheel-smoke-manifest

      - name: Attest current-main four-way receipt
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ENGINE_V2_MATRIX_RECEIPT }}

      - name: Attest current-main four-way wheel smoke manifest
        id: attest-wheel-manifest
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ENGINE_V2_WHEEL_MANIFEST }}

      - name: Retain and verify exact current-main provenance bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$ENGINE_V2_ATTESTATION_BUNDLE"
          gh attestation verify "$ENGINE_V2_MATRIX_RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ENGINE_V2_ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/engine-v2-determinism-ci.yml" \
            --source-digest "$ENGINE_V2_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ENGINE_V2_ATTESTATION_VERIFICATION"

      - name: Retain and verify exact current-main wheel manifest provenance
        run: |
          cp "${{ steps.attest-wheel-manifest.outputs.bundle-path }}" "$ENGINE_V2_WHEEL_ATTESTATION_BUNDLE"
          gh attestation verify "$ENGINE_V2_WHEEL_MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ENGINE_V2_WHEEL_ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/engine-v2-determinism-ci.yml" \
            --source-digest "$ENGINE_V2_SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ENGINE_V2_WHEEL_ATTESTATION_VERIFICATION"

      - name: Upload attested receipt and verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: engine-v2-determinism-four-way-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ENGINE_V2_MATRIX_RECEIPT }}
            ${{ env.ENGINE_V2_ATTESTATION_BUNDLE }}
            ${{ env.ENGINE_V2_ATTESTATION_VERIFICATION }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload attested wheel manifest and verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: bounded-planar-wheel-smoke-four-way-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ENGINE_V2_WHEEL_MANIFEST }}
            ${{ env.ENGINE_V2_WHEEL_ATTESTATION_BUNDLE }}
            ${{ env.ENGINE_V2_WHEEL_ATTESTATION_VERIFICATION }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
