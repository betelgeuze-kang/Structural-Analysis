name: Bounded Planar Upload Identity

on:
  workflow_call:
    inputs:
      source-sha: {type: string, required: true}
      family-id: {type: string, required: true}

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ inputs.source-sha }}
  FAMILY_ID: ${{ inputs.family-id }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  verify-upload-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source in a separate unprivileged job
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify exact source identity before transport inspection
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.11"

      - name: Verify unique signed upload by ID and archive digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/verify_supplemental_artifact_identity.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --family "$FAMILY_ID" \
            --output "$RUNNER_TEMP/supplemental-upload-identity.json"

      - name: Retain bounded non-authoritative transport diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-planar-${{ inputs.family-id }}-upload-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supplemental-upload-identity.json
          if-no-files-found: warn
          retention-days: 7
