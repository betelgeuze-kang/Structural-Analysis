name: Bounded Planar Sealed Technical Attestor

on:
  workflow_call:
    inputs:
      producer-artifact-id: {type: string, required: true}
      producer-artifact-digest: {type: string, required: true}
      source-sha: {type: string, required: true}
      family-id: {type: string, required: true}
      caller-workflow-path: {type: string, required: true}
      receipt-path: {type: string, required: true}
      seal-path: {type: string, required: true}
      handoff-path: {type: string, required: true}
      attestation-bundle-path: {type: string, required: true}
      attestation-verification-path: {type: string, required: true}
      candidate-artifact-name: {type: string, required: true}
      final-artifact-name: {type: string, required: true}

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_SHA: ${{ inputs.source-sha }}
      FAMILY_ID: ${{ inputs.family-id }}
      CALLER_WORKFLOW_PATH: ${{ inputs.caller-workflow-path }}
      RECEIPT_PATH: ${{ inputs.receipt-path }}
      SEAL_PATH: ${{ inputs.seal-path }}
      HANDOFF_PATH: ${{ inputs.handoff-path }}
      ATTESTATION_BUNDLE_PATH: ${{ inputs.attestation-bundle-path }}
      ATTESTATION_VERIFICATION_PATH: ${{ inputs.attestation-verification-path }}
      CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate-artifact-name }}
      FINAL_ARTIFACT_NAME: ${{ inputs.final-artifact-name }}
      PRODUCER_ARTIFACT_ID: ${{ inputs.producer-artifact-id }}
      PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer-artifact-digest }}
    steps:
      - name: Fetch exact source tree and immutable artifact archive without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/main-ref.json"
          source_tree_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha')
          test "$source_tree_sha" != ""
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$source_tree_sha?recursive=1" > "$RUNNER_TEMP/source-tree.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID" > "$RUNNER_TEMP/producer-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/producer-artifact.zip"

      - name: Strictly authenticate sealed candidate
        run: |
          python3 -I - "$PWD/candidate" "$RUNNER_TEMP/main-ref.json" "$RUNNER_TEMP/source-tree.json" "$RUNNER_TEMP/producer-run.json" "$RUNNER_TEMP/producer-artifact.json" "$RUNNER_TEMP/producer-artifact.zip" <<'PY'
          import hashlib, json, math, os, re, stat, sys, unicodedata, zipfile
          from datetime import datetime, timezone
          from pathlib import Path, PurePosixPath
          root, main_path, tree_path, run_path, artifact_metadata_path, archive_path = map(Path, sys.argv[1:])
          def fail(code): raise SystemExit(code)
          def pairs(rows):
              out = {}
              for key, value in rows:
                  if key in out: fail("duplicate_json_key")
                  out[key] = value
              return out
          def number(token):
              value = float(token)
              if not math.isfinite(value): fail("non_finite_json_number")
              return value
          def constant(_token): fail("non_finite_json_number")
          def load(path):
              try:
                  return json.loads(path.read_bytes().decode("utf-8"), object_pairs_hook=pairs,
                                    parse_float=number, parse_constant=constant)
              except (OSError, UnicodeError, json.JSONDecodeError): fail("strict_json_invalid")
          def timestamp(value, code):
              try: parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError: fail(code)
              if parsed.tzinfo is None or parsed.utcoffset() is None: fail(code)
              return parsed
          def digest(path): return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          def safe(relative):
              value = Path(relative)
              if value.is_absolute() or ".." in value.parts or value.as_posix() != relative: fail("candidate_path_invalid")
              path = root / value
              cursor = root
              for part in value.parts:
                  cursor /= part
                  if cursor.is_symlink(): fail("candidate_symlink_forbidden")
              try: path.resolve(strict=True).relative_to(root.resolve())
              except (OSError, ValueError): fail("candidate_path_invalid")
              if not path.is_file(): fail("candidate_file_missing")
              return path
          main = load(main_path); tree = load(tree_path); producer_run = load(run_path); artifact_metadata = load(artifact_metadata_path)
          if main.get("object", {}).get("sha") != os.environ["SOURCE_SHA"]: fail("main_moved")
          if tree.get("truncated") is not False or not isinstance(tree.get("tree"), list): fail("source_tree_invalid")
          artifact_id = os.environ["PRODUCER_ARTIFACT_ID"]; artifact_digest = os.environ["PRODUCER_ARTIFACT_DIGEST"]
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id) or not re.fullmatch(r"[0-9a-f]{64}", artifact_digest): fail("producer_artifact_identity_invalid")
          artifact_run = artifact_metadata.get("workflow_run", {})
          if (artifact_metadata.get("id") != int(artifact_id) or artifact_metadata.get("name") != os.environ["CANDIDATE_ARTIFACT_NAME"] or
              artifact_metadata.get("digest") != "sha256:" + artifact_digest or artifact_metadata.get("expired") is not False or
              type(artifact_metadata.get("size_in_bytes")) is not int or artifact_metadata.get("size_in_bytes", 0) < 1 or
              artifact_run.get("id") != int(os.environ["GITHUB_RUN_ID"]) or artifact_run.get("head_sha") != os.environ["SOURCE_SHA"] or
              artifact_run.get("head_branch") != "main"): fail("producer_artifact_metadata_invalid")
          if (producer_run.get("id") != int(os.environ["GITHUB_RUN_ID"]) or producer_run.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"]) or
              producer_run.get("head_sha") != os.environ["SOURCE_SHA"] or producer_run.get("head_branch") != "main" or
              producer_run.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]): fail("producer_workflow_run_invalid")
          run_started_at = timestamp(producer_run.get("run_started_at"), "producer_workflow_run_timestamp_invalid")
          artifact_created_at = timestamp(artifact_metadata.get("created_at"), "producer_artifact_timestamp_invalid")
          verification_started_at = datetime.now(timezone.utc)
          if not run_started_at <= artifact_created_at <= verification_started_at: fail("producer_artifact_timestamp_invalid")
          try: archive_bytes = archive_path.read_bytes()
          except OSError: fail("producer_artifact_archive_unreadable")
          if (hashlib.sha256(archive_bytes).hexdigest() != artifact_digest or
              len(archive_bytes) != artifact_metadata.get("size_in_bytes")): fail("producer_artifact_archive_digest_invalid")
          if root.exists(): fail("candidate_destination_not_fresh")
          root.mkdir()
          try:
              with zipfile.ZipFile(archive_path) as archive:
                  infos = archive.infolist()
                  if not infos or len(infos) > 20000 or sum(info.file_size for info in infos) > 268435456: fail("producer_artifact_archive_limits_invalid")
                  names = set()
                  for info in infos:
                      name = info.filename
                      if (not name or "\\" in name or unicodedata.normalize("NFC", name) != name or
                          any(unicodedata.category(ch) in {"Cc", "Cf"} for ch in name) or info.flag_bits & 1 or
                          name in names): fail("producer_artifact_archive_entry_invalid")
                      names.add(name)
                      trimmed = name[:-1] if info.is_dir() and name.endswith("/") else name
                      relative = PurePosixPath(trimmed)
                      if (not trimmed or relative.is_absolute() or ".." in relative.parts or "." in relative.parts or
                          relative.as_posix() != trimmed): fail("producer_artifact_archive_entry_invalid")
                      mode_type = stat.S_IFMT((info.external_attr >> 16) & 0xFFFF)
                      if info.is_dir():
                          if mode_type not in (0, stat.S_IFDIR): fail("producer_artifact_archive_entry_invalid")
                          continue
                      if mode_type not in (0, stat.S_IFREG): fail("producer_artifact_archive_entry_invalid")
                      target = root.joinpath(*relative.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(info) as source_handle, target.open("xb") as target_handle:
                          while chunk := source_handle.read(1024 * 1024): target_handle.write(chunk)
          except (OSError, ValueError, zipfile.BadZipFile): fail("producer_artifact_archive_invalid")
          blobs = {row.get("path"): row.get("sha") for row in tree.get("tree", [])
                   if isinstance(row, dict) and row.get("type") == "blob"}
          artifact_layout = {
              "linear": ("bounded-planar-opensees", "bounded-planar-opensees-technical"),
              "negative": ("bounded-planar-negative-opensees", "bounded-planar-negative-opensees"),
              "scaling": ("bounded-planar-scaling-opensees", "bounded-planar-scaling-opensees"),
              "modal_buckling": ("bounded-planar-modal-buckling", "bounded-planar-modal-buckling"),
              "nonlinear_material_recovery": ("bounded-planar-nonlinear-material-recovery", "bounded-planar-nonlinear-material-recovery"),
          }
          if os.environ["FAMILY_ID"] not in artifact_layout: fail("producer_family_invalid")
          artifact_dir, artifact_prefix = artifact_layout[os.environ["FAMILY_ID"]]
          expected_paths = {
              "RECEIPT_PATH": f".ci/{artifact_dir}/technical-receipt.json",
              "SEAL_PATH": f".ci/{artifact_dir}/producer-seal.json",
              "HANDOFF_PATH": f".ci/{artifact_dir}/artifact-handoff.json",
              "ATTESTATION_BUNDLE_PATH": f".ci/{artifact_dir}/artifact-handoff.sigstore.json",
              "ATTESTATION_VERIFICATION_PATH": f".ci/{artifact_dir}/attestation-verification.json",
          }
          if any(os.environ[key] != value for key, value in expected_paths.items()): fail("artifact_path_contract_invalid")
          suffix = f"-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          if (os.environ["CANDIDATE_ARTIFACT_NAME"] != artifact_prefix + "-candidate" + suffix or
              os.environ["FINAL_ARTIFACT_NAME"] != artifact_prefix + suffix): fail("artifact_name_contract_invalid")
          seal_path = safe(os.environ["SEAL_PATH"]); seal = load(seal_path)
          body = dict(seal); claimed = body.pop("artifact_hash", None)
          canonical = json.dumps(body, allow_nan=False, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          if claimed != "sha256:" + hashlib.sha256(canonical).hexdigest(): fail("seal_hash_invalid")
          execution = seal.get("execution_binding", {}); source = seal.get("source_binding", {})
          runtime = seal.get("runtime_binding", {}); technical = seal.get("technical_receipt", {})
          expected_seal_keys = {"schema_version", "family_id", "source_binding", "execution_binding", "runtime_binding",
                                "technical_receipt", "candidate_files", "claims", "artifact_hash"}
          expected_source_keys = {"source_commit_sha", "source_tree_sha", "workflow_sha", "tracked_tree_clean", "source_scope",
                                  "tracked_product_file_count", "tracked_product_python_count", "source_files"}
          expected_execution_keys = {"repository", "workflow_path", "run_id", "run_attempt", "runner_environment",
                                     "candidate_artifact_name"}
          expected_runtime_keys = {"product_runtime_lock", "python_requirements", "preexecution_lock", "container_image",
                                   "execution_policy", "external_assets", "wheel_assets",
                                   "all_external_runtime_assets_pre_execution_hash_locked", "runtime_asset_bytes_attached",
                                   "runtime_asset_metadata_sealed", "technical_authority_eligible", "blockers"}
          file_binding_keys = {"path", "file_sha256", "size"}
          source_file_binding_keys = file_binding_keys | {"git_blob_sha1", "snapshot_path"}
          expected_seal_claims = {
              "same_operator_technical_evidence_only": True,
              "independent_operator_attested": False,
              "legal_use_approved": False,
              "formal_promotion_receipt_attached": False,
              "verification_level_2": False,
              "design_authority": False,
              "commercial_equivalence": False,
              "release_readiness": False,
          }
          if (set(seal) != expected_seal_keys or not isinstance(source, dict) or set(source) != expected_source_keys or
              not isinstance(execution, dict) or set(execution) != expected_execution_keys or
              not isinstance(runtime, dict) or set(runtime) != expected_runtime_keys or
              not isinstance(technical, dict) or set(technical) != file_binding_keys or
              seal.get("schema_version") != "bounded-planar-technical-producer-seal.v2" or seal.get("family_id") != os.environ["FAMILY_ID"] or
              source.get("source_commit_sha") != os.environ["SOURCE_SHA"] or
              source.get("workflow_sha") != os.environ["SOURCE_SHA"] or source.get("source_tree_sha") != tree.get("sha") or
              source.get("tracked_tree_clean") is not True or execution.get("repository") != os.environ["GITHUB_REPOSITORY"] or
              execution.get("workflow_path") != os.environ["CALLER_WORKFLOW_PATH"] or
              execution.get("run_id") != int(os.environ["GITHUB_RUN_ID"]) or execution.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"]) or
              execution.get("candidate_artifact_name") != os.environ["CANDIDATE_ARTIFACT_NAME"] or
              seal.get("claims") != expected_seal_claims): fail("seal_identity_invalid")
          listed = {}
          for row in seal.get("candidate_files", []):
              if not isinstance(row, dict) or set(row) != file_binding_keys: fail("candidate_file_binding_invalid")
              path = safe(row.get("path", "")); relative = path.relative_to(root).as_posix()
              if relative in listed or digest(path) != row.get("file_sha256") or path.stat().st_size != row.get("size"): fail("candidate_file_binding_invalid")
              if path.suffix == ".json": load(path)
              listed[relative] = row
          actual = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and p != seal_path}
          if actual != set(listed): fail("candidate_file_set_invalid")
          if any(path.casefold().endswith((".whl", ".deb", ".rpm", ".msi", ".exe")) for path in actual): fail("third_party_runtime_bytes_forbidden")
          forbidden_runtime_hashes = {
              "sha256:1f16bc7466c252e432ac2ca69f4e9ca08f6c053e8b977157c6dccba3dfa19e65",
              "sha256:63d919a3ed06bd00e7e09ce55afac6394ad82fd89180e046070b19d68717308a",
              "sha256:3e2001110e080e8cd01176ca171ee73993fa3a23e73e9febda3241b031a2b65e",
              "sha256:07a4b576bd52ae9b0f487a3739b8922183ac88ceb1b2f2e943e3e68b8a12108a",
              "sha256:34dd2bf283347402d49b7a9f3e07dc118385e62d8f63ce3fe245b612d2f3a917",
          }
          if any(row.get("file_sha256") in forbidden_runtime_hashes for row in listed.values()): fail("third_party_runtime_bytes_forbidden")
          common_control = {
              ".github/workflows/bounded-planar-sealed-technical-attestor.yml",
              "benchmarks/clean-runners/bounded-planar-supplemental/Dockerfile",
              "benchmarks/clean-runners/bounded-planar-supplemental/run_family.py",
              "canonical/requirements-cp312-manylinux2014-x86_64.lock", "pyproject.toml",
              "scripts/bounded_planar_runtime_lock.py", "scripts/strict_json.py",
              "scripts/build_bounded_planar_technical_producer_seal.py",
          }
          family_control = {
              "linear": {
                  "scripts/build_bounded_planar_external_linear_case_package.py",
                  "scripts/ingest_bounded_planar_external_linear_results.py",
                  "src/structural_analysis/schemas/bounded_planar_external_linear_case_package_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_opensees_linear_result_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_linear_execution_receipt_v1.schema.json",
              },
              "negative": {
                  "scripts/build_bounded_planar_external_negative_case_package.py",
                  "scripts/build_bounded_planar_external_linear_case_package.py",
                  "scripts/ingest_bounded_planar_external_negative_results.py",
                  "src/structural_analysis/schemas/bounded_planar_external_negative_case_package_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_opensees_negative_result_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_negative_execution_receipt_v1.schema.json",
              },
              "scaling": {
                  "scripts/build_bounded_planar_external_scaling_case_package.py",
                  "scripts/build_bounded_planar_external_linear_case_package.py",
                  "scripts/ingest_bounded_planar_external_scaling_results.py",
                  "src/structural_analysis/schemas/bounded_planar_external_scaling_case_package_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_opensees_scaling_result_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_scaling_execution_receipt_v1.schema.json",
              },
              "modal_buckling": {
                  "scripts/build_bounded_planar_external_modal_buckling_case_package.py",
                  "scripts/ingest_bounded_planar_external_modal_buckling_results.py",
                  "scripts/run_bounded_planar_external_modal_buckling_case.py",
                  "src/structural_analysis/schemas/bounded_planar_external_modal_buckling_case_package_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_modal_buckling_result_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_modal_buckling_execution_receipt_v1.schema.json",
              },
              "nonlinear_material_recovery": {
                  "scripts/build_bounded_planar_external_nonlinear_material_recovery_case_package.py",
                  "scripts/ingest_bounded_planar_external_nonlinear_material_recovery_results.py",
                  "scripts/run_bounded_planar_external_nonlinear_material_recovery_case.py",
                  "src/structural_analysis/schemas/bounded_planar_external_nonlinear_material_recovery_case_package_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_opensees_nonlinear_material_recovery_result_v1.schema.json",
                  "src/structural_analysis/schemas/bounded_planar_external_nonlinear_material_recovery_execution_receipt_v1.schema.json",
              },
          }
          if os.environ["FAMILY_ID"] not in family_control: fail("producer_family_invalid")
          product_sources = {path for path in blobs if path.startswith("src/structural_analysis/")}
          product_python_sources = {path for path in product_sources if path.endswith(".py")}
          expected_sources = product_sources | common_control | family_control.get(os.environ["FAMILY_ID"], set()) | {os.environ["CALLER_WORKFLOW_PATH"]}
          source_rows = source.get("source_files")
          if not isinstance(source_rows, list) or any(not isinstance(row, dict) for row in source_rows): fail("source_snapshot_set_invalid")
          source_paths = [row.get("path") for row in source_rows]
          if (len(source_paths) != len(set(source_paths)) or set(source_paths) != expected_sources or
              source.get("source_scope") != "full_tracked_product_package_plus_family_control_plane" or
              source.get("tracked_product_file_count") != len(product_sources) or
              source.get("tracked_product_python_count") != len(product_python_sources)): fail("source_snapshot_set_invalid")
          for row in source_rows:
              if set(row) != source_file_binding_keys: fail("source_snapshot_binding_invalid")
              snapshot = safe(row.get("snapshot_path", "")); raw = snapshot.read_bytes()
              blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
              if (blob != row.get("git_blob_sha1") or blobs.get(row.get("path")) != blob or digest(snapshot) != row.get("file_sha256") or len(raw) != row.get("size")): fail("source_snapshot_binding_invalid")
          expected_assets = [
              {"asset_id": "openseespy", "filename": "openseespy-3.7.1.2-py3-none-any.whl", "file_sha256": "sha256:1f16bc7466c252e432ac2ca69f4e9ca08f6c053e8b977157c6dccba3dfa19e65", "kind": "python_wheel", "version": "3.7.1.2", "source": "https://pypi.org/project/openseespy/3.7.1.2/"},
              {"asset_id": "openseespylinux", "filename": "openseespylinux-3.7.1.2-py3-none-any.whl", "file_sha256": "sha256:63d919a3ed06bd00e7e09ce55afac6394ad82fd89180e046070b19d68717308a", "kind": "python_wheel", "version": "3.7.1.2", "source": "https://pypi.org/project/openseespylinux/3.7.1.2/"},
          ]
          if os.environ["FAMILY_ID"] == "modal_buckling":
              expected_assets.extend([
                  {"asset_id": "calculix-ccx", "filename": "calculix-ccx_2.17-3_amd64.deb", "file_sha256": "sha256:3e2001110e080e8cd01176ca171ee73993fa3a23e73e9febda3241b031a2b65e", "kind": "debian_package", "version": "2.17-3", "source": "https://packages.ubuntu.com/jammy/calculix-ccx"},
                  {"asset_id": "libarpack2", "filename": "libarpack2_3.8.0-1_amd64.deb", "file_sha256": "sha256:07a4b576bd52ae9b0f487a3739b8922183ac88ceb1b2f2e943e3e68b8a12108a", "kind": "debian_package", "version": "3.8.0-1", "source": "https://packages.ubuntu.com/jammy/libarpack2"},
                  {"asset_id": "libspooles2.2", "filename": "libspooles2.2_2.2-14_amd64.deb", "file_sha256": "sha256:34dd2bf283347402d49b7a9f3e07dc118385e62d8f63ce3fe245b612d2f3a917", "kind": "debian_package", "version": "2.2-14", "source": "https://packages.ubuntu.com/jammy/libspooles2.2"},
              ])
          assets = runtime.get("external_assets")
          if not isinstance(assets, list) or len(assets) != len(expected_assets): fail("runtime_asset_set_invalid")
          for observed, expected_asset in zip(assets, expected_assets):
              if (not isinstance(observed, dict) or set(observed) != set(expected_asset) | {"size"} or
                  any(observed.get(key) != value for key, value in expected_asset.items()) or
                  type(observed.get("size")) is not int or observed.get("size", 0) < 1): fail("runtime_asset_metadata_invalid")
          wheels = runtime.get("wheel_assets", [])
          expected_wheels = [{"filename": row["filename"], "file_sha256": row["file_sha256"], "size": row["size"],
                              "package": row["asset_id"], "version": row["version"], "source": row["source"]}
                             for row in assets[:2]]
          if wheels != expected_wheels: fail("runtime_wheel_metadata_invalid")
          requirements = runtime.get("python_requirements", {})
          if not isinstance(requirements, dict) or set(requirements) != file_binding_keys: fail("runtime_requirements_lock_invalid")
          requirements_text = safe(requirements.get("path", "")).read_text(encoding="utf-8")
          for row in expected_assets[:2]:
              if requirements_text.count("--hash=" + row["file_sha256"]) != 1: fail("runtime_requirements_lock_invalid")
          product_lock = runtime.get("product_runtime_lock", {})
          if not isinstance(product_lock, dict) or set(product_lock) != file_binding_keys: fail("product_runtime_lock_invalid")
          product_lock_path = safe(product_lock.get("path", ""))
          if (digest(product_lock_path) != product_lock.get("file_sha256") or
              product_lock_path.stat().st_size != product_lock.get("size")): fail("product_runtime_lock_invalid")
          lock_rows = [line.strip() for line in product_lock_path.read_text(encoding="utf-8").splitlines()
                       if line.strip() and not line.lstrip().startswith("#")]
          if not lock_rows or any(" --hash=sha256:" not in line for line in lock_rows): fail("product_runtime_lock_invalid")
          source_lock = next((row for row in source.get("source_files", [])
                              if row.get("path") == "canonical/requirements-cp312-manylinux2014-x86_64.lock"), None)
          if (not isinstance(source_lock, dict) or source_lock.get("snapshot_path") != product_lock.get("path") or
              source_lock.get("file_sha256") != product_lock.get("file_sha256")): fail("product_runtime_source_binding_invalid")
          prelock_binding = runtime.get("preexecution_lock", {})
          if not isinstance(prelock_binding, dict) or set(prelock_binding) != file_binding_keys: fail("runtime_preexecution_lock_path_invalid")
          expected_prelock_path = f".ci/{artifact_dir}/runtime-preexecution-lock.json"
          if prelock_binding.get("path") != expected_prelock_path: fail("runtime_preexecution_lock_path_invalid")
          prelock_path = safe(expected_prelock_path); prelock = load(prelock_path)
          prelock_body = dict(prelock); prelock_claimed = prelock_body.pop("artifact_hash", None)
          prelock_canonical = json.dumps(prelock_body, allow_nan=False, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          image = prelock.get("container_image", {}); policy = prelock.get("execution_policy")
          expected_prelock_keys = {
              "schema_version", "family_id", "source_commit_sha", "source_tree_sha", "prepared_at", "lock_mode",
              "prepared_before_external_execution", "networked_acquisition_completed_before_lock", "control_files",
              "container_image", "external_assets", "execution_policy", "runtime_asset_bytes_attached",
              "runtime_asset_metadata_sealed", "same_operator_technical_credit_only", "claim_boundary", "artifact_hash",
          }
          expected_image_keys = {
              "base_image", "derived_image_id", "rootfs_layer_diff_ids", "os", "architecture",
              "content_addressed_before_execution", "published",
          }
          expected_lock_boundary = (
              "The local OCI image and named external assets were content-addressed before a no-network execution. "
              "This supports same-operator technical freshness only; it is not redistribution or legal-use approval, independent "
              "reproduction, Verification Level 2, or release authority."
          )
          expected_policy = {"image_selected_by_content_address": True, "network_disabled": True,
                             "root_filesystem_read_only": True, "repository_mount_read_only": True,
                             "asset_mount_read_only": True, "capabilities_dropped": True,
                             "no_new_privileges": True, "docker_socket_mounted": False,
                             "only_persistent_result_mount_writable": True}
          if (set(prelock) != expected_prelock_keys or set(image) != expected_image_keys or
              digest(prelock_path) != prelock_binding.get("file_sha256") or prelock_path.stat().st_size != prelock_binding.get("size") or
              prelock.get("schema_version") != "bounded-planar-runtime-preexecution-lock.v1" or
              prelock_claimed != "sha256:" + hashlib.sha256(prelock_canonical).hexdigest() or
              prelock.get("family_id") != os.environ["FAMILY_ID"] or prelock.get("source_commit_sha") != os.environ["SOURCE_SHA"] or
              prelock.get("source_tree_sha") != tree.get("sha") or prelock.get("lock_mode") != "local_content_addressed_oci_image_plus_hash_locked_assets" or
              prelock.get("prepared_before_external_execution") is not True or prelock.get("networked_acquisition_completed_before_lock") is not True or
              prelock.get("runtime_asset_bytes_attached") is not False or prelock.get("runtime_asset_metadata_sealed") is not True or
              prelock.get("same_operator_technical_credit_only") is not True or prelock.get("claim_boundary") != expected_lock_boundary or
              prelock.get("external_assets") != assets or
              image.get("base_image") != "docker.io/library/python:3.11-slim-bookworm@sha256:b18992999dbe963a45a8a4da40ac2b1975be1a776d939d098c647482bcad5cba" or
              not re.fullmatch(r"sha256:[0-9a-f]{64}", str(image.get("derived_image_id"))) or image.get("os") != "linux" or
              image.get("architecture") != "amd64" or image.get("content_addressed_before_execution") is not True or image.get("published") is not False or
              not isinstance(image.get("rootfs_layer_diff_ids"), list) or not image.get("rootfs_layer_diff_ids") or
              any(not re.fullmatch(r"sha256:[0-9a-f]{64}", str(layer)) for layer in image.get("rootfs_layer_diff_ids", [])) or policy != expected_policy or
              runtime.get("container_image") != image or runtime.get("execution_policy") != policy): fail("runtime_preexecution_lock_invalid")
          controls = prelock.get("control_files")
          expected_control_paths = ["benchmarks/clean-runners/bounded-planar-supplemental/Dockerfile",
                                    "benchmarks/clean-runners/bounded-planar-supplemental/run_family.py",
                                    "scripts/bounded_planar_runtime_lock.py"]
          if not isinstance(controls, list) or [row.get("path") for row in controls if isinstance(row, dict)] != expected_control_paths: fail("runtime_control_binding_invalid")
          source_by_path = {row.get("path"): row for row in source_rows}
          for control in controls:
              source_control = source_by_path.get(control.get("path"))
              if (not isinstance(source_control, dict) or set(control) != {"path", "file_sha256", "size"} or
                  control.get("file_sha256") != source_control.get("file_sha256") or control.get("size") != source_control.get("size")): fail("runtime_control_binding_invalid")
          docker_source = source_by_path["benchmarks/clean-runners/bounded-planar-supplemental/Dockerfile"]
          docker_snapshot = safe(docker_source.get("snapshot_path", ""))
          if docker_snapshot.read_text(encoding="utf-8").splitlines()[0] != "FROM docker.io/library/python:3.11-slim-bookworm@sha256:b18992999dbe963a45a8a4da40ac2b1975be1a776d939d098c647482bcad5cba": fail("runtime_base_image_declaration_invalid")
          prepared_at = timestamp(prelock.get("prepared_at"), "runtime_preexecution_timestamp_invalid")
          if not run_started_at <= prepared_at <= artifact_created_at: fail("runtime_preexecution_timestamp_invalid")
          eligible = runtime.get("technical_authority_eligible")
          if (eligible is not True or runtime.get("all_external_runtime_assets_pre_execution_hash_locked") is not True or
              runtime.get("runtime_asset_bytes_attached") is not False or runtime.get("runtime_asset_metadata_sealed") is not True or
              runtime.get("blockers") != []): fail("runtime_authority_invalid")
          receipt = safe(os.environ["RECEIPT_PATH"]); payload = load(receipt); claims = payload.get("claims", {})
          expected_technical_claims = {
              "linear": {"package_bytes_authenticated": True, "external_results_self_consistent": True,
                         "fresh_current_source_external_execution": False, "independent_operator_attested": False,
                         "legal_use_approved": False, "verification_matrix_credit": False, "verification_level_2": False},
              "negative": {"package_bytes_authenticated": True, "external_results_self_consistent": True,
                           "exact_rejection_classifications": True, "invalid_geometry_external_solver_execution": False,
                           "fresh_current_source_external_execution": False, "independent_operator_attested": False,
                           "legal_use_approved": False, "verification_matrix_credit": False, "verification_level_2": False},
              "scaling": {"package_bytes_authenticated": True, "external_results_self_consistent": True,
                          "fresh_current_source_external_execution": False, "independent_operator_attested": False,
                          "legal_use_approved": False, "verification_matrix_credit": False, "verification_level_2": False},
              "modal_buckling": {"fresh_external_solver_execution": False, "same_operator_technical_comparison": True,
                                  "independent_operator_attested": False, "legal_use_approved": False,
                                  "verification_matrix_credit": False, "verification_level_2": False},
              "nonlinear_material_recovery": {"package_bytes_authenticated": True, "external_results_self_consistent": True,
                                              "fresh_current_source_external_execution": False,
                                              "independent_operator_attested": False, "legal_use_approved": False,
                                              "verification_matrix_credit": False, "verification_level_2": False},
          }
          if (digest(receipt) != technical.get("file_sha256") or payload.get("source_commit_sha") != os.environ["SOURCE_SHA"] or
              payload.get("technical_contract_pass") is not True or
              claims != expected_technical_claims[os.environ["FAMILY_ID"]]): fail("technical_receipt_invalid")
          receipt_cases = payload.get("cases")
          if not isinstance(receipt_cases, list) or not receipt_cases: fail("runtime_execution_timestamp_invalid")
          for case in receipt_cases:
              external = case.get("external_result") if isinstance(case, dict) else None
              result_path = external.get("path") if isinstance(external, dict) else case.get("result_path") if isinstance(case, dict) else None
              result = load(safe(result_path or ""))
              executed_at = timestamp(result.get("executed_at"), "runtime_execution_timestamp_invalid")
              if not prepared_at <= executed_at <= artifact_created_at: fail("runtime_execution_timestamp_invalid")
          handoff = {"schema_version": "bounded-planar-technical-attestor-handoff.v1", "family_id": os.environ["FAMILY_ID"],
                     "source_commit_sha": os.environ["SOURCE_SHA"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                     "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "producer_artifact": {"id": int(artifact_id),
                     "digest": artifact_digest, "name": os.environ["CANDIDATE_ARTIFACT_NAME"]},
                     "technical_receipt_sha256": digest(receipt), "producer_seal_sha256": digest(seal_path),
                     "producer_seal_artifact_hash": claimed, "technical_authority_eligible": eligible}
          target = root / os.environ["HANDOFF_PATH"]; target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(handoff, allow_nan=False, indent=2, sort_keys=True) + "\n")
          PY

      - name: Attest authenticated immutable handoff
        id: attest_handoff
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: candidate/${{ inputs.handoff-path }}

      - name: Retain and verify exact provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest_handoff.outputs.bundle-path }}" "candidate/$ATTESTATION_BUNDLE_PATH"
          gh attestation verify "candidate/$HANDOFF_PATH" --repo "$GITHUB_REPOSITORY" \
            --bundle "candidate/$ATTESTATION_BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/bounded-planar-sealed-technical-attestor.yml" \
            --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > "candidate/$ATTESTATION_VERIFICATION_PATH"

      - name: Upload signed technical artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.final-artifact-name }}
          path: candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
