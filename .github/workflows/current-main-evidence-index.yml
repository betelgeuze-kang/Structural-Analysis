                  "workflow_name": "Product State Current",
                  "workflow_path": ".github/workflows/product-state-current.yml",
                  "trigger": "workflow_run", "exact_source_required": True,
                  "successful_first_attempt_required": True,
                  "required_jobs": ["build-current-state", "attest-current-state", "verify-current-state"],
                  "overlay_interface": {
                      "direction": "nightly_to_product_state_to_evidence_index",
                      "version": "reserved-for-authenticated-product-state-overlay.v1",
                      "consumption_enabled": False, "artifact": None,
                  },
              },
              "catalog_product_state_invalid",
          )
          catalog_lanes = catalog["lanes"]
          require(
              isinstance(catalog_lanes, list)
              and [row.get("lane_id") for row in catalog_lanes]
              == ["medium", "ifc", "mgt9", "mgt10", "native"],
              "catalog_lanes_invalid",
          )
          lane_keys = {
              "lane_id", "category", "evidence_mode", "workflow_name", "workflow_path",
              "allowed_events", "producer_job", "attestor_job_suffix", "subject_path",
              "subject_schema_version", "subject_source_key", "handoff_name_template",
              "attestation_name_template", "technical_scope", "authority_not_granted",
              "promotion_blockers",
          }
          for specification in catalog_lanes:
              lane = specification["lane_id"]
              exact(specification, lane_keys, "catalog_lane:" + lane)
              trust = lane_trust[lane]
              require(
                  all(specification[key] == value for key, value in trust.items())
                  and specification["evidence_mode"] == "handoff_pair"
                  and specification["producer_job"] == "produce-unprivileged"
                  and specification["attestor_job_suffix"] == "verify-attest-privileged-fresh-hosted"
                  and specification["handoff_name_template"]
                  == "{lane}-technical-handoff-{run_id}-{run_attempt}-{source_sha}"
                  and specification["attestation_name_template"]
                  == "{lane}-technical-handoff-{run_id}-{run_attempt}-{source_sha}-attestation"
                  and isinstance(specification["allowed_events"], list)
                  and specification["allowed_events"]
                  and set(specification["allowed_events"]).issubset({"push", "workflow_dispatch"})
                  and isinstance(specification["authority_not_granted"], list)
                  and "release" in specification["authority_not_granted"]
                  and isinstance(specification["promotion_blockers"], list)
                  and bool(specification["promotion_blockers"]),
                  "catalog_lane_contract_invalid:" + lane,
              )
          reject_nested_authority(catalog, "$catalog")

          verification_root = root.parent / (root.name + "-verification")
          require(not verification_root.exists(), "verification_root_exists")
          verification_root.mkdir(parents=True)
          product_state_run_id = positive(int(os.environ["PRODUCT_STATE_RUN_ID"]), "product_state_run_id")
          product_state_blob = source_blob(
              ".github/workflows/product-state-current.yml", "product_state_workflow"
          )
          product_state = workflow_run(
              product_state_run_id,
              path=".github/workflows/product-state-current.yml",
              name="Product State Current", events={"workflow_run"}, label="product_state",
          )
          product_jobs = workflow_jobs(product_state_run_id, "product_state")
          required_product_jobs = {"build-current-state", "attest-current-state", "verify-current-state"}
          require(
              len(product_jobs) == 3
              and {row.get("name") for row in product_jobs} == required_product_jobs
              and len({row.get("id") for row in product_jobs}) == 3,
              "product_state_exact_three_job_success_required",
          )
          for job in product_jobs:
              github_hosted_job(
                  job, run=product_state_run_id, labels={"ubuntu-latest"},
                  label="product_state:" + str(job.get("name")),
              )
          try:
              datetime.fromisoformat(str(product_state.get("updated_at")).replace("Z", "+00:00"))
          except ValueError:
              fail("product_state_updated_at_invalid")

          product_inventory = api(
              f"actions/runs/{product_state_run_id}/artifacts?per_page=100",
              "artifacts:product_state",
          )
          product_inventory_rows = product_inventory.get("artifacts")
          require(
              isinstance(product_inventory_rows, list)
              and all(isinstance(item, dict) for item in product_inventory_rows)
              and len(product_inventory_rows) <= 100
              and product_inventory.get("total_count") == len(product_inventory_rows),
              "product_state_artifact_inventory_invalid",
          )
          product_artifact_name = f"product-state-current-success-{source}"
          product_matches = [
              item for item in product_inventory_rows
              if item.get("name") == product_artifact_name
          ]
          require(len(product_matches) == 1, "product_state_artifact_identity_ambiguous")
          product_artifact_id = positive(
              product_matches[0].get("id"), "product_state_artifact_id"
          )
          product_artifact = artifact_identity(
              api(
                  f"actions/artifacts/{product_artifact_id}",
                  "artifact:product_state",
              ),
              expected_id=product_artifact_id,
              expected_name=product_artifact_name,
              run=product_state_run_id,
              label="product_state",
              maximum=MAX_PRODUCT_TOTAL,
          )
          require(
              all(
                  product_matches[0].get(field) == product_artifact.get(field)
                  for field in (
                      "id", "name", "digest", "size_in_bytes", "expired", "workflow_run"
                  )
              ),
              "product_state_artifact_list_refetch_mismatch",
          )
          product_archive = download_artifact(
              product_artifact, "product_state", maximum=MAX_PRODUCT_TOTAL
          )
          product_files = safe_archive(
              product_archive, "product_state", archive_limit=MAX_PRODUCT_TOTAL,
              entries=MAX_PRODUCT_ENTRIES, member=MAX_PRODUCT_MEMBER,
              total_limit=MAX_PRODUCT_TOTAL,
          )
          del product_archive
          product_path = "artifacts/manifests/product_state.current.v1.json"
          provenance_path = ".ci/product-state-inputs/product-state.provenance-bundle.v1.json"
          product_seal_path = "product-state-candidate.seal.json"
          product_seal = exact(
              strict_json(product_files.get(product_seal_path, b""), "product_state_seal"),
              {
                  "schema_version", "repository", "source_commit_sha", "source_tree_sha",
                  "source_ref", "workflow_path", "workflow_blob_sha", "workflow_run_id",
                  "workflow_run_number", "workflow_run_attempt", "files",
                  "release_authority", "claim_boundary",
              },
              "product_state_seal",
          )
          require(
              product_seal["schema_version"] == "product-state-candidate-seal.v1"
              and product_seal["repository"] == repository
              and product_seal["source_commit_sha"] == source
              and product_seal["source_tree_sha"] == source_commit["tree"]["sha"]
              and product_seal["source_ref"] == "refs/heads/main"
              and product_seal["workflow_path"] == ".github/workflows/product-state-current.yml"
              and product_seal["workflow_blob_sha"] == product_state_blob
              and product_seal["workflow_run_id"] == product_state_run_id
              and product_seal["workflow_run_number"]
              == positive(product_state.get("run_number"), "product_state_run_number")
              and product_seal["workflow_run_attempt"] == 1
              and product_seal["release_authority"] is False
              and product_seal["claim_boundary"]
              == (
                  "OIDC handoff candidate only; attestation does not grant release, legal, "
                  "design, commercial, or independent-verification authority."
              ),
              "product_state_seal_identity_invalid",
          )
          product_sealed_paths, product_seal_rows = validate_sealed_file_rows(
              product_files, product_seal_path, product_seal["files"],
              "product_state_seal",
          )
          product_added_paths = {
              "candidate-artifact-api.json",
              ".ci/product-state-inputs/post-main-overlay-privileged-attestation-verification.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json",
              ".ci/product-state-inputs/product-state.current.attestation-verification.json",
              ".ci/product-state-inputs/product-state.provenance-bundle.attestation-verification.json",
              ".ci/product-state-inputs/post-main-overlay-final-attestation-verification.json",
          }
          require(
              product_sealed_paths.isdisjoint(product_added_paths)
              and set(product_files)
              == product_sealed_paths | product_added_paths | {product_seal_path},
              "product_state_artifact_member_set_invalid",
          )
          candidate_api_path = "candidate-artifact-api.json"
          stored_candidate_artifact = strict_json(
              product_files[candidate_api_path], "product_state_candidate_artifact_api"
          )
          product_candidate_id = positive(
              stored_candidate_artifact.get("id"), "product_state_candidate_artifact_id"
          )
          product_candidate_name = (
              f"product-state-candidate-{product_state_run_id}-1-{source}"
          )
          artifact_identity(
              stored_candidate_artifact, expected_id=product_candidate_id,
              expected_name=product_candidate_name, run=product_state_run_id,
              label="product_state_candidate_stored", maximum=MAX_PRODUCT_TOTAL,
          )
          live_candidate_artifact = artifact_identity(
              api(
                  f"actions/artifacts/{product_candidate_id}",
                  "artifact:product_state_candidate",
              ),
              expected_id=product_candidate_id, expected_name=product_candidate_name,
              run=product_state_run_id, label="product_state_candidate_live",
              maximum=MAX_PRODUCT_TOTAL,
          )
          require(
              live_candidate_artifact == stored_candidate_artifact,
              "product_state_candidate_artifact_refetch_mismatch",
          )
          candidate_inventory_matches = [
              item for item in product_inventory_rows
              if item.get("id") == product_candidate_id
              and item.get("name") == product_candidate_name
          ]
          require(
              len(candidate_inventory_matches) == 1
              and all(
                  candidate_inventory_matches[0].get(field)
                  == live_candidate_artifact.get(field)
                  for field in (
                      "id", "name", "digest", "size_in_bytes", "expired", "workflow_run"
                  )
              ),
              "product_state_candidate_artifact_inventory_mismatch",
          )
          product_candidate_archive = download_artifact(
              live_candidate_artifact, "product_state_candidate",
              maximum=MAX_PRODUCT_TOTAL,
          )
          product_candidate_files = safe_archive(
              product_candidate_archive, "product_state_candidate",
              archive_limit=MAX_PRODUCT_TOTAL, entries=MAX_PRODUCT_ENTRIES,
              member=MAX_PRODUCT_MEMBER, total_limit=MAX_PRODUCT_TOTAL,
          )
          del product_candidate_archive
          product_seal_digest = sha256(product_files[product_seal_path])
          require(
              validate_candidate_to_final_files(
                  product_candidate_files, product_files, product_sealed_paths,
                  product_seal_path, "product_state",
              ) == product_seal_digest,
              "product_state_candidate_seal_digest_mismatch",
          )
          require(
              product_seal_rows.get(product_path, {}).get("sha256")
              == sha256(product_files[product_path])
              and product_seal_rows.get(provenance_path, {}).get("sha256")
              == sha256(product_files[provenance_path]),
              "product_state_candidate_seal_provenance_binding_invalid",
          )
          del product_candidate_files
          product_signed_name = (
              f"product-state-signed-{product_state_run_id}-1-{source}"
          )
          signed_inventory_matches = [
              item for item in product_inventory_rows
              if item.get("name") == product_signed_name
          ]
          require(
              len(signed_inventory_matches) == 1,
              "product_state_signed_artifact_identity_ambiguous",
          )
          product_signed_id = positive(
              signed_inventory_matches[0].get("id"), "product_state_signed_artifact_id"
          )
          product_signed_artifact = artifact_identity(
              api(
                  f"actions/artifacts/{product_signed_id}",
                  "artifact:product_state_signed",
              ),
              expected_id=product_signed_id, expected_name=product_signed_name,
              run=product_state_run_id, label="product_state_signed",
              maximum=MAX_PRODUCT_TOTAL,
          )
          require(
              all(
                  signed_inventory_matches[0].get(field)
                  == product_signed_artifact.get(field)
                  for field in (
                      "id", "name", "digest", "size_in_bytes", "expired", "workflow_run"
                  )
              ),
              "product_state_signed_artifact_inventory_mismatch",
          )
          product_signed_archive = download_artifact(
              product_signed_artifact, "product_state_signed",
              maximum=MAX_PRODUCT_TOTAL,
          )
          product_signed_files = safe_archive(
              product_signed_archive, "product_state_signed",
              archive_limit=MAX_PRODUCT_TOTAL, entries=MAX_PRODUCT_ENTRIES,
              member=MAX_PRODUCT_MEMBER, total_limit=MAX_PRODUCT_TOTAL,
          )
          del product_signed_archive
          product_signed_added_paths = {
              candidate_api_path,
              ".ci/product-state-inputs/"
              "post-main-overlay-privileged-attestation-verification.json",
              ".ci/product-state-inputs/product-state.current.sigstore.json",
              ".ci/product-state-inputs/"
              "product-state.provenance-bundle.sigstore.json",
          }
          require(
              set(product_signed_files)
              == product_sealed_paths | product_signed_added_paths | {product_seal_path}
              and all(
                  product_signed_files[path] == product_files[path]
                  for path in product_signed_files
              ),
              "product_state_signed_to_final_bytes_mismatch",
          )
          del product_signed_files
          for path, label in (
              (".github/workflows/product-state-current.yml", "product_state_workflow"),
              ("canonical/product-state.current.v1.schema.json", "product_state_schema"),
              (
                  "canonical/product-state-provenance-bundle.v1.schema.json",
                  "product_state_provenance_schema",
              ),
          ):
              require(
                  path in product_files
                  and git_blob(product_files[path]) == source_blob(path, label),
                  "product_state_source_blob_mismatch:" + label,
              )
          product_bundle_path = ".ci/product-state-inputs/product-state.current.sigstore.json"
          provenance_bundle_path = (
              ".ci/product-state-inputs/product-state.provenance-bundle.sigstore.json"
          )
          product_document = strict_json(product_files[product_path], "product_state_document")
          provenance_document = strict_json(
              product_files[provenance_path], "product_state_provenance"
          )
          for document, schema_path, version, label in (
              (
                  product_document, "canonical/product-state.current.v1.schema.json",
                  "product-state.current.v1", "product_state",
              ),
              (
                  provenance_document,
                  "canonical/product-state-provenance-bundle.v1.schema.json",
                  "product-state-provenance-bundle.v1", "product_state_provenance",
              ),
          ):
              schema = strict_json(product_files[schema_path], label + "_schema")
              properties = schema.get("properties") if isinstance(schema, dict) else None
              required = schema.get("required") if isinstance(schema, dict) else None
              require(
                  isinstance(document, dict) and isinstance(schema, dict)
                  and schema.get("type") == "object"
                  and schema.get("additionalProperties") is False
                  and isinstance(properties, dict) and isinstance(required, list)
                  and set(document) == set(properties) == set(required)
                  and isinstance(properties.get("schema_version"), dict)
                  and properties["schema_version"].get("const") == version,
                  label + "_source_schema_root_contract_invalid",
              )
          require(
              isinstance(product_document, dict)
              and product_document.get("schema_version") == "product-state.current.v1"
              and product_document.get("source_commit_sha") == source
              and product_document.get("observed_github_main_sha") == source
              and product_document.get("source_matches_observed_github_main") is True
              and product_document.get("candidate_worktree_dirty") is False
              and product_document.get("contract_pass") is True
              and product_document.get("release_authority") is False
              and product_document.get("release_eligible") is False,
              "product_state_document_contract_invalid",
          )
          authority_tracks = product_document.get("authority_tracks")
          external_promotion = (
              authority_tracks.get("external_promotion")
              if isinstance(authority_tracks, dict) else None
          )
          external_evidence = (
              external_promotion.get("evidence")
              if isinstance(external_promotion, dict) else None
          )
          require(
              isinstance(external_promotion, dict)
              and external_promotion.get("status") == "unavailable"
              and isinstance(external_evidence, dict)
              and set(external_evidence) == {
                  "independent_operator_identity_authentication",
                  "product_legal_license_approval",
                  "formal_level_2_promotion",
              }
              and all(
                  value == {"status": "unavailable"}
                  for value in external_evidence.values()
              ),
              "product_state_external_promotion_boundary_invalid",
          )
          require(
              isinstance(provenance_document, dict)
              and provenance_document.get("schema_version")
              == "product-state-provenance-bundle.v1"
              and provenance_document.get("source_commit_sha") == source
              and provenance_document.get("bundle_integrity_pass") is True
              and provenance_document.get("release_authority") is False,
              "product_state_provenance_contract_invalid",
          )
          validate_product_provenance_bindings(
              product_files, product_sealed_paths, product_path, provenance_document
          )
          provenance_contracts = provenance_document.get("contracts")
          post_main_overlay_contract = (
              provenance_contracts.get("post_main_overlay")
              if isinstance(provenance_contracts, dict) else None
          )
          exact(
              post_main_overlay_contract,
              {
                  "schema_version", "repository", "source_commit_sha", "source_tree_sha",
                  "workflow_path", "workflow_blob_sha", "run_id", "run_attempt",
                  "producer_event", "release_leaf_contract_pass",
                  "technical_handoff_promotion_eligible",
                  "external_vv_promotion_eligible", "external_vv_effective_claims",
                  "contract_pass",
              },
              "product_state_post_main_overlay_contract",
          )
          overlay_run_id = positive(
              post_main_overlay_contract["run_id"], "product_state_overlay_run_id"
          )
          overlay_workflow_path = ".github/workflows/nightly-full-quality.yml"
          overlay_workflow_blob = source_blob(
              overlay_workflow_path, "product_state_overlay_workflow"
          )
          overlay_run = workflow_run(
              overlay_run_id, path=overlay_workflow_path, name="Nightly Full Quality",
              events={"schedule", "workflow_dispatch"}, label="product_state_overlay",
          )
          overlay_jobs = workflow_jobs(overlay_run_id, "product_state_overlay")
          overlay_attestors = [
              job for job in overlay_jobs
              if job.get("name") == "attest-post-main-overlay"
          ]
          require(
              len(overlay_attestors) == 1,
              "product_state_overlay_attestor_job_invalid",
          )
          github_hosted_job(
              overlay_attestors[0], run=overlay_run_id, labels={"ubuntu-24.04"},
              label="product_state_overlay:attest-post-main-overlay",
          )
          overlay_claims = post_main_overlay_contract["external_vv_effective_claims"]
          expected_overlay_claims = {
              "independent_operator_attested",
              "verification_hierarchy_operator_manifest_attached",
              "verification_hierarchy_credit", "product_legal_license_approval",
              "external_runtime_redistribution_approval",
              "commercial_redistribution_approved", "formal_verification_level_2",
              "commercial_equivalence", "design_authority", "release_readiness",
              "release_authority",
          }
          require(
              post_main_overlay_contract["schema_version"]
              == "post-main-evidence-overlay.v1"
              and post_main_overlay_contract["repository"] == repository
              and post_main_overlay_contract["source_commit_sha"] == source
              and post_main_overlay_contract["source_tree_sha"]
              == source_commit["tree"]["sha"]
              and post_main_overlay_contract["workflow_path"] == overlay_workflow_path
              and post_main_overlay_contract["workflow_blob_sha"]
              == overlay_workflow_blob
              and type(post_main_overlay_contract["run_attempt"]) is int
              and post_main_overlay_contract["run_attempt"] == 1
              and post_main_overlay_contract["producer_event"] == overlay_run["event"]
              and post_main_overlay_contract["release_leaf_contract_pass"] is True
              and post_main_overlay_contract["technical_handoff_promotion_eligible"]
              is False
              and post_main_overlay_contract["external_vv_promotion_eligible"] is False
              and isinstance(overlay_claims, dict)
              and set(overlay_claims) == expected_overlay_claims
              and all(value is False for value in overlay_claims.values())
              and post_main_overlay_contract["contract_pass"] is True,
              "product_state_post_main_overlay_identity_invalid",
          )
          reject_nested_authority(product_document, "$product_state")
          reject_nested_authority(provenance_document, "$product_state_provenance")
          product_verification, _, _ = fresh_sigstore_verification(
              subject_raw=product_files[product_path],
              bundle_raw=product_files[product_bundle_path],
              subject_name=PurePosixPath(product_path).name,
              signer_path=".github/workflows/product-state-current.yml",
              workflow_path=".github/workflows/product-state-current.yml",
              event="workflow_run", run=product_state_run_id, run_attempt=1,
              label="product-state",
              verification_root=verification_root,
              candidate_report_raw=product_files[
                  ".ci/product-state-inputs/"
                  "product-state.current.attestation-verification.json"
              ],
          )
          provenance_verification, _, _ = fresh_sigstore_verification(
              subject_raw=product_files[provenance_path],
              bundle_raw=product_files[provenance_bundle_path],
              subject_name=PurePosixPath(provenance_path).name,
              signer_path=".github/workflows/product-state-current.yml",
              workflow_path=".github/workflows/product-state-current.yml",
              event="workflow_run", run=product_state_run_id, run_attempt=1,
              label="product-provenance",
              verification_root=verification_root,
              candidate_report_raw=product_files[
                  ".ci/product-state-inputs/"
                  "product-state.provenance-bundle.attestation-verification.json"
              ],
          )
          overlay_path = (
              ".ci/product-state-inputs/post-main-overlay/"
              "post-main-evidence-overlay.seal.json"
          )
          overlay_bundle_path = (
              ".ci/product-state-inputs/post-main-overlay/"
              "post-main-evidence-overlay.sigstore.json"
          )
          overlay_verification, _, _ = fresh_sigstore_verification(
              subject_raw=product_files[overlay_path],
              bundle_raw=product_files[overlay_bundle_path],
              subject_name=PurePosixPath(overlay_path).name,
              signer_path=overlay_workflow_path, workflow_path=overlay_workflow_path,
              event=overlay_run["event"], run=overlay_run_id, run_attempt=1,
              label="product-overlay", verification_root=verification_root,
              candidate_report_raw=product_files[
                  ".ci/product-state-inputs/"
                  "post-main-overlay-final-attestation-verification.json"
              ],
          )
          require(
              overlay_verification == strict_json(
                  product_files[
                      ".ci/product-state-inputs/"
                      "post-main-overlay-privileged-attestation-verification.json"
                  ],
                  "product_state_overlay_privileged_verification",
              )
              and product_verification
              == strict_json(
                  product_files[
                      ".ci/product-state-inputs/"
                      "product-state.current.attestation-verification.json"
                  ],
                  "product_state_final_verification",
              )
              and provenance_verification
              == strict_json(
                  product_files[
                      ".ci/product-state-inputs/"
                      "product-state.provenance-bundle.attestation-verification.json"
                  ],
                  "product_state_provenance_final_verification",
              ),
              "product_state_final_verification_report_mismatch",
          )

          index = exact_nonpromotion(
              strict_json(files[index_name], "index"),
              {"schema_version", "index_id", "generated_at", "source", "catalog", "upstream",
               "generator", "status", "contract_pass", "technical_pair_count", "authority",
               "lanes", "claim_boundary", "artifact_hash"},
              "index",
          )
          rows = index["lanes"]
          require(
              isinstance(rows, list) and [row.get("lane_id") for row in rows]
              == ["medium", "ifc", "mgt9", "mgt10", "native"],
              "index_lanes_invalid",
          )
          attestor_path = ".github/workflows/_technical-evidence-attest.yml"
          attestor_blob = source_blob(attestor_path, "attestor_workflow")
          artifact_ids = {
              product_artifact_id, product_candidate_id, product_signed_id,
          }
          require(len(artifact_ids) == 3, "product_state_artifact_id_collision")
          run_ids = {product_state_run_id, overlay_run_id}
          require(len(run_ids) == 2, "product_state_run_id_collision")
          expected_rows = []
          row_keys = {
              "lane_id", "workflow_path", "workflow_blob_sha", "attestor_workflow_path",
              "attestor_workflow_blob_sha", "run_id", "run_attempt", "event",
              "producer_job_id", "attestor_job_id", "handoff_artifact",
              "attestation_artifact", "technical_subject_path", "technical_subject_sha256",
              "pair_sha256", "sigstore_verification_report_sha256", "contract_pass",
              "technical_scope", "authority_not_granted", "promotion_eligible",
              "promotion_blockers",
          }
          artifact_keys = {
              "id", "name", "api_digest", "size_in_bytes", "workflow_run_id",
              "workflow_run_attempt", "source_sha",
          }
          subject_key_sets = {
              "medium": {"schema_version", "profile_id", "generator_policy", "source_commit_sha",
                         "source_tree_clean", "receipt_payload_sha256", "environment", "policy",
                         "cases", "summary", "status", "contract_pass", "release_authority",
                         "blockers_remaining", "claim_boundary"},
              "ifc": {"schema_version", "generated_at", "source_commit_sha", "source_identity",
                      "status", "technical_contract_pass", "receipt_schema", "manifest", "counts",
                      "claims", "case_receipts", "supporting_receipts", "support_manifest",
                      "technical_blockers", "legal_and_product_blockers", "nontechnical_blockers",
                      "spillover_blockers", "raw_ifc_files_uploaded", "claim_boundary"},
              "mgt9": {"schema_version", "generated_at", "source_commit_sha", "execution_environment",
                       "manifest", "source_binding", "identity_gate", "summary", "cases",
                       "technical_available_set_contract_pass", "target_10_case_contract_pass",
                       "status", "technical_blockers", "target_blockers", "target_gap", "claims",
                       "raw_mgt_files_uploaded", "claim_boundary"},
              "mgt10": {"schema_version", "generated_at", "source_commit_sha", "execution_environment",
                        "manifest", "source_binding", "same_run_core", "tenth_case",
                        "case_identity_bindings", "identity_gate", "summary", "support_artifacts",
                        "technical_10_case_contract_pass", "status", "technical_blockers",
                        "authority_blockers", "claims", "raw_mgt_files_uploaded", "claim_boundary"},
              "native": {"authority_claims", "run_attempt", "run_id", "schema_version", "source_sha",
                         "source_workflow_path", "source_workflow_sha", "technical_scope"},
          }

          for row, specification in zip(rows, catalog_lanes, strict=True):
              lane = specification["lane_id"]
              exact(row, row_keys, "index_lane:" + lane)
              lane_run_id = positive(row["run_id"], "lane_run_id:" + lane)
              require(lane_run_id not in run_ids, "lane_run_id_collision:" + lane)
              run_ids.add(lane_run_id)
              lane_run = workflow_run(
                  lane_run_id, path=specification["workflow_path"],
                  name=specification["workflow_name"], events=set(specification["allowed_events"]),
                  label=lane,
              )
              workflow_blob = source_blob(specification["workflow_path"], "lane_workflow:" + lane)
              jobs = workflow_jobs(lane_run_id, lane)
              producers = [job for job in jobs if job.get("name") == specification["producer_job"]]
              attestors = [
                  job for job in jobs if isinstance(job.get("name"), str)
                  and (job["name"] == specification["attestor_job_suffix"]
                       or job["name"].endswith(" / " + specification["attestor_job_suffix"]))
              ]
              require(len(producers) == len(attestors) == 1, "lane_job_identity_invalid:" + lane)
              allowed_job_labels = (
                  {"ubuntu-24.04", "windows-2025"}
                  if lane == "native" else {"ubuntu-24.04"}
              )
              observed_job_ids = {
                  github_hosted_job(
                      job, run=lane_run_id, labels=allowed_job_labels,
                      label=lane + ":" + str(job.get("name")),
                  )
                  for job in jobs
              }
              require(
                  len(observed_job_ids) == len(jobs)
                  and producers[0]["id"] != attestors[0]["id"],
                  "lane_job_inventory_identity_invalid:" + lane,
              )

              substitutions = {
                  "lane": lane, "run_id": lane_run_id, "run_attempt": 1, "source_sha": source,
              }
              handoff_name = specification["handoff_name_template"].format(**substitutions)
              attestation_name = specification["attestation_name_template"].format(**substitutions)
              inventory = api(f"actions/runs/{lane_run_id}/artifacts?per_page=100", "artifacts:" + lane)
              inventory_rows = inventory.get("artifacts")
              require(
                  isinstance(inventory_rows, list) and all(isinstance(item, dict) for item in inventory_rows)
                  and len(inventory_rows) <= 100 and inventory.get("total_count") == len(inventory_rows),
                  "artifact_inventory_invalid:" + lane,
              )
              authenticated = []
              for kind, key, expected_name in (
                  ("handoff", "handoff_artifact", handoff_name),
                  ("attestation", "attestation_artifact", attestation_name),
              ):
                  candidate_identity = exact(row[key], artifact_keys, "index_artifact:" + lane + ":" + kind)
                  upstream_id = positive(candidate_identity["id"], "artifact_id:" + lane + ":" + kind)
                  require(upstream_id not in artifact_ids, "artifact_id_collision:" + lane)
                  matches = [item for item in inventory_rows if item.get("name") == expected_name]
                  require(len(matches) == 1 and matches[0].get("id") == upstream_id, "artifact_inventory_identity_invalid:" + lane + ":" + kind)
                  metadata_row = artifact_identity(
                      api(f"actions/artifacts/{upstream_id}", "artifact:" + lane + ":" + kind),
                      expected_id=upstream_id, expected_name=expected_name,
                      run=lane_run_id, label=lane + ":" + kind,
                  )
                  require(
                      all(matches[0].get(field) == metadata_row.get(field) for field in
                          ("id", "name", "digest", "size_in_bytes", "expired", "workflow_run")),
                      "artifact_list_refetch_mismatch:" + lane + ":" + kind,
                  )
                  normalized = {
                      "id": upstream_id, "name": expected_name,
                      "api_digest": metadata_row["digest"], "size_in_bytes": metadata_row["size_in_bytes"],
                      "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
                  }
                  require(candidate_identity == normalized, "index_artifact_binding_invalid:" + lane + ":" + kind)
                  artifact_ids.add(upstream_id)
                  authenticated.append((metadata_row, download_artifact(metadata_row, lane + ":" + kind)))
              handoff_metadata, handoff_raw = authenticated[0]
              attestation_metadata, attestation_raw = authenticated[1]
              handoff_files = safe_archive(
                  handoff_raw, lane + ":handoff", archive_limit=MAX_UPSTREAM_TOTAL,
                  entries=MAX_UPSTREAM_ENTRIES, member=MAX_UPSTREAM_MEMBER,
                  total_limit=MAX_UPSTREAM_TOTAL,
              )
              attestation_files = safe_archive(
                  attestation_raw, lane + ":attestation", archive_limit=MAX_UPSTREAM_TOTAL,
                  entries=MAX_UPSTREAM_ENTRIES, member=MAX_UPSTREAM_MEMBER,
                  total_limit=MAX_UPSTREAM_TOTAL,
              )
              require(set(attestation_files) == {"attestation.json"}, "attestation_member_set_invalid:" + lane)
              require("handoff-seal.json" in handoff_files, "handoff_seal_missing:" + lane)
              subject_path = specification["subject_path"]
              require(subject_path in handoff_files, "technical_subject_missing:" + lane)
              seal_raw = handoff_files["handoff-seal.json"]
              subject_raw = handoff_files[subject_path]
              bundle_raw = attestation_files["attestation.json"]
              seal = exact(
                  strict_json(seal_raw, "seal:" + lane),
                  {"artifact_files", "lane", "run_attempt", "run_id", "schema_version",
                   "source_sha", "source_workflow_path", "source_workflow_sha"},
                  "seal:" + lane,
              )
              require(
                  seal["schema_version"] == "technical-evidence-handoff-seal.v1"
                  and seal["lane"] == lane and seal["run_attempt"] == 1
                  and seal["run_id"] == lane_run_id and seal["source_sha"] == source
                  and seal["source_workflow_path"] == specification["workflow_path"]
                  and seal["source_workflow_sha"] == source,
                  "handoff_seal_identity_invalid:" + lane,
              )
              require(
                  isinstance(seal["artifact_files"], dict)
                  and set(seal["artifact_files"]) == set(handoff_files) - {"handoff-seal.json"},
                  "handoff_seal_inventory_invalid:" + lane,
              )
              for name, member_digest in seal["artifact_files"].items():
                  require(
                      isinstance(member_digest, str) and SHA256.fullmatch(member_digest)
                      and sha256(handoff_files[name]) == member_digest,
                      "handoff_seal_member_invalid:" + lane + ":" + name,
                  )

              pair_name = f".ci/current-main-evidence-bundle/{lane}/pair.json"
              subject_name = f".ci/current-main-evidence-bundle/{lane}/technical-subject.json"
              report_name = f".ci/current-main-evidence-bundle/{lane}/sigstore-verification.json"
              verified_name = f".ci/current-main-evidence-bundle/{lane}/verified-pair.json"
              require(files[subject_name] == subject_raw, "candidate_subject_bytes_mismatch:" + lane)
              subject = exact(
                  strict_json(subject_raw, "subject:" + lane), subject_key_sets[lane], "subject:" + lane
              )
              require(
                  subject["schema_version"] == specification["subject_schema_version"]
                  and subject[specification["subject_source_key"]] == source,
                  "technical_subject_source_invalid:" + lane,
              )
              reject_nested_authority(subject, "$subject." + lane)
              if lane == "medium":
                  evidence_authority = subject.get("summary")
                  require(
                      subject.get("release_authority") is False and isinstance(evidence_authority, dict)
                      and evidence_authority.get("scientific_medium_benchmark_credit_count") == 0
                      and evidence_authority.get("native_medium_product_authority_count") == 0
                      and evidence_authority.get("scientific_medium_benchmark_5_of_5") is False
                      and evidence_authority.get("native_medium_product_authority_5_of_5") is False,
                      "medium_nested_authority_invalid",
                  )
              elif lane == "ifc":
                  claims = subject.get("claims")
                  require(
                      isinstance(claims, dict) and all(claims.get(key) is False for key in (
                          "solver_ready_geometry_or_topology", "independent_reproduction",
                          "product_legal_approval", "redistribution_authority",
                          "commercial_use_authority", "phase3_quantity_credit", "release_authority",
                      )),
                      "ifc_nested_authority_invalid",
                  )
              elif lane in {"mgt9", "mgt10"}:
                  require(
                      isinstance(subject.get("claims"), dict) and subject["claims"]
                      and all(value is False for value in subject["claims"].values()),
                      "mgt_nested_authority_invalid:" + lane,
                  )
              else:
                  require(
                      isinstance(subject.get("authority_claims"), dict) and subject["authority_claims"]
                      and all(value is False for value in subject["authority_claims"].values()),
                      "native_nested_authority_invalid",
                  )

              signed_subject_name = PurePosixPath(subject_path).name
              fresh_sigstore_verification(
                  subject_raw=subject_raw,
                  bundle_raw=bundle_raw,
                  subject_name=signed_subject_name,
                  signer_path=attestor_path,
                  workflow_path=specification["workflow_path"],
                  event=lane_run["event"], run=lane_run_id, run_attempt=1,
                  label=lane,
                  verification_root=verification_root,
                  candidate_report_raw=files[report_name],
              )

              normalized_handoff = {
                  "id": handoff_metadata["id"], "name": handoff_metadata["name"],
                  "api_digest": handoff_metadata["digest"], "size_in_bytes": handoff_metadata["size_in_bytes"],
                  "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
              }
              normalized_attestation = {
                  "id": attestation_metadata["id"], "name": attestation_metadata["name"],
                  "api_digest": attestation_metadata["digest"], "size_in_bytes": attestation_metadata["size_in_bytes"],
                  "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
              }
              report_digest = sha256(files[report_name])
              subject_digest = sha256(subject_raw)
              expected_pair = {
                  "schema_version": "technical-evidence-handoff-pair.v1", "lane": lane,
                  "github_api": {
                      "repository": repository, "source_commit_sha": source,
                      "source_tree_sha": source_commit["tree"]["sha"], "source_ref": "refs/heads/main",
                      "workflow_path": specification["workflow_path"], "workflow_blob_sha": workflow_blob,
                      "attestor_workflow_path": attestor_path,
                      "attestor_workflow_blob_sha": attestor_blob,
                      "event": lane_run["event"], "run_id": lane_run_id,
                      "run_attempt": 1,
                  },
                  "handoff_artifact": {key: normalized_handoff[key] for key in (
                      "id", "name", "api_digest", "workflow_run_id", "workflow_run_attempt", "source_sha"
                  )},
                  "handoff_seal": {"path": "handoff-seal.json", "sha256": sha256(seal_raw)},
                  "technical_subject": {
                      "path": subject_path, "sha256": subject_digest,
                      "schema_version": specification["subject_schema_version"],
                  },
                  "attestation_artifact": {
                      **{key: normalized_attestation[key] for key in (
                          "id", "name", "api_digest", "workflow_run_id", "workflow_run_attempt", "source_sha"
                      )},
                      "bundle_path": "attestation.json", "bundle_sha256": sha256(bundle_raw),
                  },
                  "sigstore_verification": {
                      "verified": True, "report_sha256": report_digest,
                      "bundle_sha256": sha256(bundle_raw), "subject_name": signed_subject_name,
                      "subject_sha256": subject_digest, "repository": repository,
                      "signer_workflow": f"{repository}/{attestor_path}", "signer_digest": source,
                      "source_digest": source, "source_ref": "refs/heads/main",
                      "deny_self_hosted_runners": True,
                  },
              }
              pair = exact_nonpromotion(
                  strict_json(files[pair_name], "pair:" + lane), expected_pair.keys(), "pair:" + lane
              )
              require(pair == expected_pair and files[pair_name] == pretty(expected_pair), "trusted_pair_reconstruction_mismatch:" + lane)
              expected_verified = {
                  "schema_version": "technical-evidence-handoff-pair.v1", "lane": lane,
                  "repository": repository, "source_commit_sha": source,
                  "source_tree_sha": source_commit["tree"]["sha"],
                  "workflow_path": specification["workflow_path"], "workflow_blob_sha": workflow_blob,
                  "attestor_workflow_path": attestor_path,
                  "attestor_workflow_blob_sha": attestor_blob, "run_id": lane_run_id,
                  "run_attempt": 1, "event": lane_run["event"],
                  "handoff_artifact_id": handoff_metadata["id"],
                  "handoff_artifact_digest": handoff_metadata["digest"],
                  "attestation_artifact_id": attestation_metadata["id"],
                  "attestation_artifact_digest": attestation_metadata["digest"],
                  "technical_subject_path": subject_path, "subject_sha256": subject_digest,
                  "sigstore_report_sha256": report_digest, "valid": True,
              }
              verified = exact_nonpromotion(
                  strict_json(files[verified_name], "verified:" + lane),
                  expected_verified.keys(), "verified:" + lane,
              )
              require(verified == expected_verified, "trusted_verified_pair_reconstruction_mismatch:" + lane)
              reject_nested_authority(pair, "$pair." + lane)
              reject_nested_authority(verified, "$verified." + lane)
              expected_row = {
                  "lane_id": lane, "workflow_path": specification["workflow_path"],
                  "workflow_blob_sha": workflow_blob, "attestor_workflow_path": attestor_path,
                  "attestor_workflow_blob_sha": attestor_blob, "run_id": lane_run_id,
                  "run_attempt": 1, "event": lane_run["event"],
                  "producer_job_id": producers[0]["id"], "attestor_job_id": attestors[0]["id"],
                  "handoff_artifact": normalized_handoff,
                  "attestation_artifact": normalized_attestation,
                  "technical_subject_path": subject_path, "technical_subject_sha256": subject_digest,
                  "pair_sha256": sha256(files[pair_name]),
                  "sigstore_verification_report_sha256": report_digest, "contract_pass": True,
                  "technical_scope": specification["technical_scope"],
                  "authority_not_granted": specification["authority_not_granted"],
                  "promotion_eligible": False, "promotion_blockers": specification["promotion_blockers"],
              }
              require(row == expected_row, "trusted_lane_reconstruction_mismatch:" + lane)
              reject_nested_authority(row, "$index.lanes." + lane)
              expected_rows.append(expected_row)
          require(len(run_ids) == 7 and len(artifact_ids) == 13, "global_identity_collision")

          expected_index = {
              "schema_version": "current-main-evidence-index.v1",
              "index_id": "current-main-authenticated-technical-handoff-pairs.v1",
              "generated_at": product_state["updated_at"],
              "source": {
                  "repository": repository, "commit_sha": source,
                  "tree_sha": source_commit["tree"]["sha"], "observed_main_sha": source,
                  "exact_main_match": True,
              },
              "catalog": {
                  "path": "canonical/current-main-evidence-lanes.v1.json",
                  "sha256": sha256(files["canonical/current-main-evidence-lanes.v1.json"]),
                  "schema_path": "canonical/current-main-evidence-lanes.v1.schema.json",
                  "schema_sha256": sha256(files["canonical/current-main-evidence-lanes.v1.schema.json"]),
              },
              "upstream": {
                  "workflow_name": "Product State Current",
                  "workflow_path": ".github/workflows/product-state-current.yml",
                  "workflow_blob_sha": product_state_blob, "run_id": product_state_run_id,
                  "run_attempt": 1, "conclusion": "success", "head_sha": source,
                  "overlay": {
                      "direction": "nightly_to_product_state_to_evidence_index",
                      "consumed": False, "artifact": None,
                  },
              },
              "generator": {
                  "workflow_path": ".github/workflows/current-main-evidence-index.yml",
                  "workflow_blob_sha": source_blobs[".github/workflows/current-main-evidence-index.yml"],
                  "run_id": run_id, "run_attempt": 1, "event": generator_run["event"],
              },
              "status": "pass", "contract_pass": True, "technical_pair_count": 5,
              "authority": {
                  "technical_only": True, "scientific_validation": False,
                  "legal_authority": False, "commercial_use": False,
                  "engineering_design": False, "release": False,
              },
              "lanes": expected_rows, "claim_boundary": CLAIM_BOUNDARY,
          }
          expected_index["artifact_hash"] = sha256(canonical(expected_index))
          require(index == expected_index, "trusted_index_reconstruction_mismatch")
          require(files[index_name] == pretty(expected_index), "trusted_index_bytes_mismatch")
          reject_nested_authority(index, "$index")
          final_main = api("git/ref/heads/main", "final_main_ref")
          require(final_main.get("object", {}).get("sha") == source, "main_changed_before_attestation")
          for name, raw in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(raw)
          PY

      - name: Attest exact independently checked technical index
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/current-main-evidence-index/artifacts/manifests/current_main_evidence_index.current.v1.json
          show-summary: false

      - name: Publish technical-only index and provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-main-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/current-main-evidence-index/artifacts/manifests/current_main_evidence_index.current.v1.json
            ${{ runner.temp }}/current-main-evidence-index/.ci/current-main-evidence-bundle
            ${{ steps.attest.outputs.bundle-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
