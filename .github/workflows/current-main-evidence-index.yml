          KNOWN_AUTHORITY_COMPACT = frozenset(
              key.replace("_", "") for key in KNOWN_AUTHORITY_KEYS
          )
          SENSITIVE_AUTHORITY_SCOPES = frozenset({
              "commercial", "design", "engineering", "independent", "legal",
              "license", "paid", "pilot", "promotion", "redistribution", "release",
              "scientific", "verification",
          })
          AUTHORITY_DECISIONS = frozenset({
              "allowed", "approval", "approved", "attestation", "attested", "authority",
              "authorization", "authorized", "certified", "claim", "claims", "clearance",
              "credit", "eligible", "eligibility", "equivalence", "grant", "granted",
              "grants", "operator", "readiness", "ready", "rights", "status",
              "validated", "validation",
          })
          TECHNICAL_GRANTS = ("bounded_developer_preview_technical_claims",)
          SAFE_AUTHORITY_STATUSES = frozenset({
              "blocked", "denied", "false", "non_authoritative", "not_established",
              "not_granted", "pending", "unavailable",
          })

          def canonical_contract_token(value: str, path: str) -> str:
              require(isinstance(value, str), "contract_token_type_invalid:" + path)
              normalized = unicodedata.normalize("NFKC", value)
              require(
                  normalized == value and value.isascii()
                  and all(
                      unicodedata.category(character) not in {"Cc", "Cf"}
                      for character in value
                  ),
                  "contract_token_unicode_invalid:" + path,
              )
              canonical = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1_\2", normalized)
              canonical = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", canonical)
              canonical = re.sub(r"[^A-Za-z0-9]+", "_", canonical).strip("_").casefold()
              require(
                  bool(canonical) and re.fullmatch(r"[a-z0-9]+(?:_[a-z0-9]+)*", canonical),
                  "contract_token_semantics_invalid:" + path,
              )
              return canonical

          def authority_semantic_key(canonical: str) -> bool:
              parts = frozenset(canonical.split("_"))
              scopes = parts & SENSITIVE_AUTHORITY_SCOPES
              compact = canonical.replace("_", "")
              compact_scopes = {
                  scope for scope in SENSITIVE_AUTHORITY_SCOPES if scope in compact
              }
              return (
                  canonical in KNOWN_AUTHORITY_KEYS
                  or compact in KNOWN_AUTHORITY_COMPACT
                  or canonical in SENSITIVE_AUTHORITY_SCOPES
                  or len(scopes) >= 2
                  or bool(scopes) and bool(parts & AUTHORITY_DECISIONS)
                  or len(compact_scopes) >= 2
                  or bool(compact_scopes)
                  and any(decision in compact for decision in AUTHORITY_DECISIONS)
              )

          def nonpromoting_authority(value) -> bool:
              if value is False or value is None:
                  return True
              if type(value) in {int, float}:
                  return value == 0
              if isinstance(value, str):
                  return value in SAFE_AUTHORITY_STATUSES
              if isinstance(value, dict):
                  return set(value) == {"status"} and nonpromoting_authority(value["status"])
              return False

          def reject_nested_authority(value, path="$"):
              if isinstance(value, dict):
                  canonical_keys = set()
                  for key, child in value.items():
                      canonical = canonical_contract_token(key, path + ".<key>")
                      require(
                          canonical not in canonical_keys,
                          "contract_key_semantic_collision:" + path + "." + key,
                      )
                      canonical_keys.add(canonical)
                      canonical_parts = frozenset(canonical.split("_"))
                      grants_container = (
                          bool(canonical_parts & {"grant", "grants"})
                          and "not" not in canonical_parts
                      ) or canonical.replace("_", "") == "grants"
                      if grants_container:
                          require(
                              isinstance(child, list)
                              and tuple(
                                  canonical_contract_token(
                                      token, path + "." + key + f"[{position}]"
                                  )
                                  for position, token in enumerate(child)
                              ) == TECHNICAL_GRANTS,
                              "technical_grants_invalid:" + path + "." + key,
                          )
                      elif authority_semantic_key(canonical):
                          require(
                              nonpromoting_authority(child),
                              "nested_authority_promoted:" + path + "." + key,
                          )
                      reject_nested_authority(child, path + "." + key)
              elif isinstance(value, list):
                  for position, child in enumerate(value):
                      reject_nested_authority(child, f"{path}[{position}]")

          def exact_issue_false_authority(value, label: str):
              result = exact(value, set(ISSUE_AUTHORITY), label)
              require(
                  all(
                      type(result[key]) is bool and result[key] is False
                      for key in ISSUE_AUTHORITY
                  ),
                  "issue_state_false_authority_invalid:" + label,
              )
              return result

          def validate_issue_inventory_authority(value) -> None:
              require(
                  isinstance(value, dict)
                  and value.get("claim_boundary") == ISSUE_CLAIM_BOUNDARY,
                  "issue_state_inventory_nonpromotion_contract_invalid",
              )
              exact_issue_false_authority(
                  value.get("claims"), "issue_state_inventory_claims"
              )
              reject_nested_authority(value, "$issue_state_inventory")

          def exact_nonpromotion(value, keys, label: str):
              result = exact(value, keys, label)
              reject_nested_authority(result, "$" + label)
              return result

          def validate_sigstore_report(fresh, candidate, bundle, statement, lane: str) -> None:
              if candidate is not None:
                  require(
                      canonical(fresh) == canonical(candidate),
                      "sigstore_report_replay_mismatch:" + lane,
                  )
              require(
                  isinstance(fresh, list) and len(fresh) == 1
                  and isinstance(fresh[0], dict)
                  and set(fresh[0]) == {"attestation", "verificationResult"},
                  "sigstore_report_shape_invalid:" + lane,
              )
              attestation = exact(
                  fresh[0]["attestation"], {"bundle", "bundle_url", "initiator"},
                  "sigstore_report_attestation:" + lane,
              )
              result = fresh[0]["verificationResult"]
              require(
                  attestation["bundle"] == bundle
                  and attestation["bundle_url"] == "" and attestation["initiator"] == ""
                  and isinstance(result, dict)
                  and isinstance(result.get("signature"), dict)
                  and isinstance(result["signature"].get("certificate"), dict)
                  and bool(result["signature"]["certificate"])
                  and isinstance(result.get("verifiedTimestamps"), list)
                  and bool(result["verifiedTimestamps"])
                  and all(isinstance(item, dict) and item for item in result["verifiedTimestamps"])
                  and result.get("statement") == statement,
                  "sigstore_report_result_invalid:" + lane,
              )

          def sigstore_bundle_statement(bundle_raw: bytes, label: str):
              bundle = exact(
                  strict_json(bundle_raw, "sigstore_bundle:" + label),
                  {"mediaType", "verificationMaterial", "dsseEnvelope"},
                  "sigstore_bundle:" + label,
              )
              envelope = exact(
                  bundle["dsseEnvelope"], {"payload", "payloadType", "signatures"},
                  "sigstore_envelope:" + label,
              )
              require(
                  bundle["mediaType"] == "application/vnd.dev.sigstore.bundle.v0.3+json"
                  and isinstance(bundle["verificationMaterial"], dict)
                  and bundle["verificationMaterial"]
                  and envelope["payloadType"] == "application/vnd.in-toto+json"
                  and isinstance(envelope["payload"], str)
                  and 0 < len(envelope["payload"]) <= ((16 * 1024 * 1024 + 2) // 3) * 4
                  and isinstance(envelope["signatures"], list)
                  and len(envelope["signatures"]) == 1,
                  "sigstore_bundle_shape_invalid:" + label,
              )
              try:
                  statement_raw = base64.b64decode(
                      envelope["payload"].encode("ascii"), validate=True
                  )
                  require(
                      0 < len(statement_raw) <= 16 * 1024 * 1024,
                      "sigstore_statement_size_invalid:" + label,
                  )
                  signature = envelope["signatures"][0]
                  require(
                      isinstance(signature, dict)
                      and set(signature).issubset({"keyid", "sig"})
                      and isinstance(signature.get("sig"), str)
                      and bool(signature["sig"]),
                      "sigstore_signature_shape_invalid:" + label,
                  )
                  base64.b64decode(signature["sig"].encode("ascii"), validate=True)
              except (UnicodeError, binascii.Error, ValueError):
                  fail("sigstore_base64_invalid:" + label)
              statement = exact(
                  strict_json(statement_raw, "sigstore_statement:" + label),
                  {"_type", "subject", "predicateType", "predicate"},
                  "sigstore_statement:" + label,
              )
              require(
                  statement["_type"] == "https://in-toto.io/Statement/v1"
                  and statement["predicateType"] == "https://slsa.dev/provenance/v1"
                  and isinstance(statement["predicate"], dict)
                  and isinstance(statement["subject"], list)
                  and len(statement["subject"]) == 1,
                  "sigstore_statement_shape_invalid:" + label,
              )
              return bundle, statement

          def validate_sigstore_predicate(
              statement, *, workflow_path: str, builder_path: str, event: str,
              run: int, run_attempt: int, label: str,
          ) -> None:
              require(run_attempt == 1, "sigstore_run_attempt_invalid:" + label)
              provenance = exact(
                  statement["predicate"], {"buildDefinition", "runDetails"},
                  "sigstore_predicate:" + label,
              )
              build = exact(
                  provenance["buildDefinition"],
                  {"buildType", "externalParameters", "internalParameters", "resolvedDependencies"},
                  "sigstore_build_definition:" + label,
              )
              require(
                  build["buildType"] == "https://actions.github.io/buildtypes/workflow/v1",
                  "sigstore_build_type_mismatch:" + label,
              )
              external = exact(
                  build["externalParameters"], {"workflow"},
                  "sigstore_external_parameters:" + label,
              )
              workflow = exact(
                  external["workflow"], {"path", "ref", "repository"},
                  "sigstore_workflow:" + label,
              )
              repository_url = "https://github.com/" + repository
              require(
                  workflow == {
                      "path": workflow_path,
                      "ref": "refs/heads/main",
                      "repository": repository_url,
                  },
                  "sigstore_workflow_identity_mismatch:" + label,
              )
              internal = exact(
                  build["internalParameters"], {"github"},
                  "sigstore_internal_parameters:" + label,
              )
              github = exact(
                  internal["github"],
                  {"event_name", "repository_id", "repository_owner_id", "runner_environment"},
                  "sigstore_github_parameters:" + label,
              )
              require(
                  github["event_name"] == event
                  and github["runner_environment"] == "github-hosted",
                  "sigstore_github_identity_mismatch:" + label,
              )
              for identifier in ("repository_id", "repository_owner_id"):
                  value = github[identifier]
                  require(
                      isinstance(value, str)
                      and re.fullmatch(r"[1-9][0-9]*", value) is not None
                      and int(value) <= MAX_SAFE,
                      "sigstore_repository_identifier_invalid:" + label + ":" + identifier,
                  )
              dependencies = build["resolvedDependencies"]
              require(
                  isinstance(dependencies, list) and len(dependencies) == 1,
                  "sigstore_resolved_dependencies_invalid:" + label,
              )
              dependency = exact(
                  dependencies[0], {"uri", "digest"},
                  "sigstore_resolved_dependency:" + label,
              )
              require(
                  dependency["uri"]
                  == "git+" + repository_url + "@refs/heads/main",
                  "sigstore_resolved_dependency_uri_mismatch:" + label,
              )
              dependency_digest = exact(
                  dependency["digest"], {"gitCommit"},
                  "sigstore_resolved_dependency_digest:" + label,
              )
              require(
                  dependency_digest["gitCommit"] == source,
                  "sigstore_resolved_dependency_digest_mismatch:" + label,
              )
              details = exact(
                  provenance["runDetails"], {"builder", "metadata"},
                  "sigstore_run_details:" + label,
              )
              builder = exact(details["builder"], {"id"}, "sigstore_builder:" + label)
              metadata = exact(
                  details["metadata"], {"invocationId"},
                  "sigstore_metadata:" + label,
              )
              require(
                  builder["id"]
                  == repository_url + "/" + builder_path + "@refs/heads/main",
                  "sigstore_builder_identity_mismatch:" + label,
              )
              require(
                  metadata["invocationId"]
                  == repository_url + f"/actions/runs/{run}/attempts/{run_attempt}",
                  "sigstore_invocation_identity_mismatch:" + label,
              )

          def fresh_sigstore_verification(
              *, subject_raw: bytes, bundle_raw: bytes, subject_name: str,
              signer_path: str, workflow_path: str, event: str, run: int,
              run_attempt: int, label: str, verification_root: Path,
              candidate_report_raw: bytes | None = None,
          ):
              require(
                  re.fullmatch(r"[A-Za-z0-9_.-]+", label) is not None
                  and PurePosixPath(subject_name).name == subject_name
                  and re.fullmatch(r"[A-Za-z0-9_.-]+", subject_name) is not None,
                  "sigstore_local_path_invalid:" + label,
              )
              verify_dir = verification_root / label
              verify_dir.mkdir()
              verify_subject = verify_dir / subject_name
              verify_bundle = verify_dir / "attestation.json"
              verify_subject.write_bytes(subject_raw)
              verify_bundle.write_bytes(bundle_raw)
              command = [
                  "gh", "attestation", "verify", str(verify_subject), "--repo", repository,
                  "--bundle", str(verify_bundle), "--signer-workflow",
                  f"{repository}/{signer_path}", "--signer-digest", source,
                  "--source-digest", source, "--source-ref", "refs/heads/main",
                  "--deny-self-hosted-runners", "--format", "json",
              ]
              try:
                  result = subprocess.run(
                      command, check=False, capture_output=True, timeout=120
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail("gh_attestation_verify_unavailable:" + label)
              require(
                  result.returncode == 0 and 0 < len(result.stdout) <= 16 * 1024 * 1024
                  and len(result.stderr) <= 1024 * 1024,
                  "gh_attestation_verify_failed:" + label,
              )
              fresh_report = strict_json(result.stdout, "fresh_sigstore_report:" + label)
              candidate_report = (
                  strict_json(candidate_report_raw, "candidate_sigstore_report:" + label)
                  if candidate_report_raw is not None
                  else None
              )
              bundle, statement = sigstore_bundle_statement(bundle_raw, label)
              signed_subject = statement["subject"][0]
              require(
                  isinstance(signed_subject, dict)
                  and signed_subject.get("name") == subject_name
                  and signed_subject.get("digest")
                  == {"sha256": sha256(subject_raw).removeprefix("sha256:")},
                  "sigstore_statement_subject_invalid:" + label,
              )
              validate_sigstore_predicate(
                  statement, workflow_path=workflow_path, builder_path=signer_path,
                  event=event, run=run, run_attempt=run_attempt, label=label,
              )
              validate_sigstore_report(
                  fresh_report, candidate_report, bundle, statement, label
              )
              return fresh_report, bundle, statement

