          subject_key_sets = {
              "medium": {"schema_version", "profile_id", "generator_policy", "source_commit_sha",
                         "source_tree_clean", "receipt_payload_sha256", "environment", "policy",
                         "cases", "summary", "status", "contract_pass", "release_authority",
                         "blockers_remaining", "claim_boundary"},
              "ifc": {"schema_version", "generated_at", "source_commit_sha", "source_identity",
                      "status", "technical_contract_pass", "receipt_schema", "manifest", "counts",
                      "claims", "case_receipts", "supporting_receipts", "support_manifest",
                      "technical_blockers", "legal_and_product_blockers", "nontechnical_blockers",
                      "spillover_blockers", "raw_ifc_files_uploaded", "claim_boundary"},
              "mgt9": {"schema_version", "generated_at", "source_commit_sha", "execution_environment",
                       "manifest", "source_binding", "identity_gate", "summary", "cases",
                       "technical_available_set_contract_pass", "target_10_case_contract_pass",
                       "status", "technical_blockers", "target_blockers", "target_gap", "claims",
                       "raw_mgt_files_uploaded", "claim_boundary"},
              "mgt10": {"schema_version", "generated_at", "source_commit_sha", "execution_environment",
                        "manifest", "source_binding", "same_run_core", "tenth_case",
                        "case_identity_bindings", "identity_gate", "summary", "support_artifacts",
                        "technical_10_case_contract_pass", "status", "technical_blockers",
                        "authority_blockers", "claims", "raw_mgt_files_uploaded", "claim_boundary"},
              "native": {"authority_claims", "run_attempt", "run_id", "schema_version", "source_sha",
                         "source_workflow_path", "source_workflow_sha", "technical_scope"},
          }

          for row, specification in zip(rows, catalog_lanes, strict=True):
              lane = specification["lane_id"]
              exact(row, row_keys, "index_lane:" + lane)
              lane_run_id = positive(row["run_id"], "lane_run_id:" + lane)
              require(lane_run_id not in run_ids, "lane_run_id_collision:" + lane)
              run_ids.add(lane_run_id)
              lane_workflow_file = quote(
                  PurePosixPath(specification["workflow_path"]).name, safe=""
              )
              lane_run_inventory = api(
                  f"actions/workflows/{lane_workflow_file}/runs?branch=main"
                  + "&head_sha=" + source + "&per_page=100",
                  "workflow_runs:" + lane,
              )
              lane_run_rows = lane_run_inventory.get("workflow_runs")
              require(
                  isinstance(lane_run_rows, list) and len(lane_run_rows) <= 100
                  and all(isinstance(item, dict) for item in lane_run_rows)
                  and type(lane_run_inventory.get("total_count")) is int
                  and lane_run_inventory["total_count"] == len(lane_run_rows),
                  "workflow_run_inventory_invalid:" + lane,
              )
              require(
                  len(lane_run_rows) == 1
                  and type(lane_run_rows[0].get("run_number")) is int
                  and 1 <= lane_run_rows[0].get("run_number") <= MAX_SAFE
                  and type(lane_run_rows[0].get("run_attempt")) is int
                  and lane_run_rows[0].get("run_attempt") == 1
                  and lane_run_rows[0].get("head_sha") == source
                  and lane_run_rows[0].get("head_branch") == "main"
                  and lane_run_rows[0].get("path") == specification["workflow_path"]
                  and lane_run_rows[0].get("name") == specification["workflow_name"]
                  and lane_run_rows[0].get("event") in set(specification["allowed_events"])
                  and type(lane_run_rows[0].get("id")) is int
                  and lane_run_rows[0].get("id") == lane_run_id
                  and lane_run_rows[0].get("status") == "completed"
                  and lane_run_rows[0].get("conclusion") == "success",
                  "unique_successful_exact_source_run_required:" + lane,
              )
              lane_run = workflow_run(
                  lane_run_id, path=specification["workflow_path"],
                  name=specification["workflow_name"], events=set(specification["allowed_events"]),
                  label=lane,
              )
              require(
                  same_fields(
                      lane_run_rows[0], lane_run,
                      (
                          "id", "run_number", "run_attempt", "status", "conclusion",
                          "head_sha", "head_branch", "path", "name", "event",
                      ),
                  ),
                  "lane_run_list_refetch_mismatch:" + lane,
              )
              workflow_blob = source_blob(specification["workflow_path"], "lane_workflow:" + lane)
              jobs = workflow_jobs(lane_run_id, lane)
              producers = [job for job in jobs if job.get("name") == specification["producer_job"]]
              attestors = [
                  job for job in jobs if isinstance(job.get("name"), str)
                  and (job["name"] == specification["attestor_job_suffix"]
                       or job["name"].endswith(" / " + specification["attestor_job_suffix"]))
              ]
              require(len(producers) == len(attestors) == 1, "lane_job_identity_invalid:" + lane)
              allowed_job_labels = (
                  {"ubuntu-24.04", "windows-2025"}
                  if lane == "native" else {"ubuntu-24.04"}
              )
              observed_job_ids = {
                  github_hosted_job(
                      job, run=lane_run_id, labels=allowed_job_labels,
                      label=lane + ":" + str(job.get("name")),
                  )
                  for job in jobs
              }
              require(
                  len(observed_job_ids) == len(jobs)
                  and producers[0]["id"] != attestors[0]["id"],
                  "lane_job_inventory_identity_invalid:" + lane,
              )

              substitutions = {
                  "lane": lane, "run_id": lane_run_id, "run_attempt": 1, "source_sha": source,
              }
              handoff_name = specification["handoff_name_template"].format(**substitutions)
              attestation_name = specification["attestation_name_template"].format(**substitutions)
              inventory = api(f"actions/runs/{lane_run_id}/artifacts?per_page=100", "artifacts:" + lane)
              inventory_rows = inventory.get("artifacts")
              require(
                  isinstance(inventory_rows, list) and all(isinstance(item, dict) for item in inventory_rows)
                  and len(inventory_rows) <= 100
                  and type(inventory.get("total_count")) is int
                  and inventory.get("total_count") == len(inventory_rows),
                  "artifact_inventory_invalid:" + lane,
              )
              authenticated = []
              for kind, key, expected_name in (
                  ("handoff", "handoff_artifact", handoff_name),
                  ("attestation", "attestation_artifact", attestation_name),
              ):
                  candidate_identity = exact(row[key], artifact_keys, "index_artifact:" + lane + ":" + kind)
                  upstream_id = positive(candidate_identity["id"], "artifact_id:" + lane + ":" + kind)
                  require(upstream_id not in artifact_ids, "artifact_id_collision:" + lane)
                  matches = [item for item in inventory_rows if item.get("name") == expected_name]
                  require(len(matches) == 1 and matches[0].get("id") == upstream_id, "artifact_inventory_identity_invalid:" + lane + ":" + kind)
                  metadata_row = artifact_identity(
                      api(f"actions/artifacts/{upstream_id}", "artifact:" + lane + ":" + kind),
                      expected_id=upstream_id, expected_name=expected_name,
                      run=lane_run_id, label=lane + ":" + kind,
                  )
                  require(
                      same_fields(
                          matches[0], metadata_row,
                          (
                              "id", "name", "digest", "size_in_bytes", "expired",
                              "workflow_run",
                          ),
                      ),
                      "artifact_list_refetch_mismatch:" + lane + ":" + kind,
                  )
                  normalized = {
                      "id": upstream_id, "name": expected_name,
                      "api_digest": metadata_row["digest"], "size_in_bytes": metadata_row["size_in_bytes"],
                      "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
                  }
                  require(candidate_identity == normalized, "index_artifact_binding_invalid:" + lane + ":" + kind)
                  artifact_ids.add(upstream_id)
                  authenticated.append((metadata_row, download_artifact(metadata_row, lane + ":" + kind)))
              handoff_metadata, handoff_raw = authenticated[0]
              attestation_metadata, attestation_raw = authenticated[1]
              handoff_files = safe_archive(
                  handoff_raw, lane + ":handoff", archive_limit=MAX_UPSTREAM_TOTAL,
                  entries=MAX_UPSTREAM_ENTRIES, member=MAX_UPSTREAM_MEMBER,
                  total_limit=MAX_UPSTREAM_TOTAL,
              )
              attestation_files = safe_archive(
                  attestation_raw, lane + ":attestation", archive_limit=MAX_UPSTREAM_TOTAL,
                  entries=MAX_UPSTREAM_ENTRIES, member=MAX_UPSTREAM_MEMBER,
                  total_limit=MAX_UPSTREAM_TOTAL,
              )
              require(set(attestation_files) == {"attestation.json"}, "attestation_member_set_invalid:" + lane)
              require("handoff-seal.json" in handoff_files, "handoff_seal_missing:" + lane)
              subject_path = specification["subject_path"]
              require(subject_path in handoff_files, "technical_subject_missing:" + lane)
              seal_raw = handoff_files["handoff-seal.json"]
              subject_raw = handoff_files[subject_path]
              bundle_raw = attestation_files["attestation.json"]
              seal = exact(
                  strict_json(seal_raw, "seal:" + lane),
                  {"artifact_files", "lane", "run_attempt", "run_id", "schema_version",
                   "source_sha", "source_workflow_path", "source_workflow_sha"},
                  "seal:" + lane,
              )
              require(
                  seal["schema_version"] == "technical-evidence-handoff-seal.v1"
                  and seal["lane"] == lane
                  and type(seal["run_attempt"]) is int
                  and seal["run_attempt"] == 1
                  and type(seal["run_id"]) is int
                  and seal["run_id"] == lane_run_id and seal["source_sha"] == source
                  and seal["source_workflow_path"] == specification["workflow_path"]
                  and seal["source_workflow_sha"] == source,
                  "handoff_seal_identity_invalid:" + lane,
              )
              require(
                  isinstance(seal["artifact_files"], dict)
                  and set(seal["artifact_files"]) == set(handoff_files) - {"handoff-seal.json"},
                  "handoff_seal_inventory_invalid:" + lane,
              )
              for name, member_digest in seal["artifact_files"].items():
                  require(
                      isinstance(member_digest, str) and SHA256.fullmatch(member_digest)
                      and sha256(handoff_files[name]) == member_digest,
                      "handoff_seal_member_invalid:" + lane + ":" + name,
                  )

              pair_name = f".ci/current-main-evidence-bundle/{lane}/pair.json"
              subject_name = f".ci/current-main-evidence-bundle/{lane}/technical-subject.json"
              report_name = f".ci/current-main-evidence-bundle/{lane}/sigstore-verification.json"
              bundle_name = f".ci/current-main-evidence-bundle/{lane}/sigstore-bundle.json"
              seal_name = f".ci/current-main-evidence-bundle/{lane}/handoff-seal.json"
              verified_name = f".ci/current-main-evidence-bundle/{lane}/verified-pair.json"
              require(files[subject_name] == subject_raw, "candidate_subject_bytes_mismatch:" + lane)
              require(files[bundle_name] == bundle_raw, "candidate_sigstore_bundle_bytes_mismatch:" + lane)
              require(files[seal_name] == seal_raw, "candidate_handoff_seal_bytes_mismatch:" + lane)
              subject = exact(
                  strict_json(subject_raw, "subject:" + lane), subject_key_sets[lane], "subject:" + lane
              )
              require(
                  subject["schema_version"] == specification["subject_schema_version"]
                  and subject[specification["subject_source_key"]] == source,
                  "technical_subject_source_invalid:" + lane,
              )
              reject_nested_authority(subject, "$subject." + lane)
              if lane == "medium":
                  evidence_authority = subject.get("summary")
                  require(
                      subject.get("release_authority") is False and isinstance(evidence_authority, dict)
                      and type(evidence_authority.get("scientific_medium_benchmark_credit_count")) is int
                      and evidence_authority.get("scientific_medium_benchmark_credit_count") == 0
                      and type(evidence_authority.get("native_medium_product_authority_count")) is int
                      and evidence_authority.get("native_medium_product_authority_count") == 0
                      and evidence_authority.get("scientific_medium_benchmark_5_of_5") is False
                      and evidence_authority.get("native_medium_product_authority_5_of_5") is False,
                      "medium_nested_authority_invalid",
                  )
              elif lane == "ifc":
                  claims = subject.get("claims")
                  require(
                      isinstance(claims, dict) and all(claims.get(key) is False for key in (
                          "solver_ready_geometry_or_topology", "independent_reproduction",
                          "product_legal_approval", "redistribution_authority",
                          "commercial_use_authority", "phase3_quantity_credit", "release_authority",
                      )),
                      "ifc_nested_authority_invalid",
                  )
              elif lane in {"mgt9", "mgt10"}:
                  require(
                      isinstance(subject.get("claims"), dict) and subject["claims"]
                      and all(value is False for value in subject["claims"].values()),
                      "mgt_nested_authority_invalid:" + lane,
                  )
              else:
                  require(
                      isinstance(subject.get("authority_claims"), dict) and subject["authority_claims"]
                      and all(value is False for value in subject["authority_claims"].values()),
                      "native_nested_authority_invalid",
                  )

              signed_subject_name = PurePosixPath(subject_path).name
              fresh_sigstore_verification(
                  subject_raw=subject_raw,
                  bundle_raw=bundle_raw,
                  subject_name=signed_subject_name,
                  signer_path=attestor_path,
                  workflow_path=specification["workflow_path"],
                  event=lane_run["event"], run=lane_run_id, run_attempt=1,
                  label=lane,
                  verification_root=verification_root,
                  candidate_report_raw=files[report_name],
              )

              normalized_handoff = {
                  "id": handoff_metadata["id"], "name": handoff_metadata["name"],
                  "api_digest": handoff_metadata["digest"], "size_in_bytes": handoff_metadata["size_in_bytes"],
                  "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
              }
              normalized_attestation = {
                  "id": attestation_metadata["id"], "name": attestation_metadata["name"],
                  "api_digest": attestation_metadata["digest"], "size_in_bytes": attestation_metadata["size_in_bytes"],
                  "workflow_run_id": lane_run_id, "workflow_run_attempt": 1, "source_sha": source,
              }
              report_digest = sha256(files[report_name])
              subject_digest = sha256(subject_raw)
              expected_pair = {
                  "schema_version": "technical-evidence-handoff-pair.v1", "lane": lane,
                  "github_api": {
                      "repository": repository, "source_commit_sha": source,
                      "source_tree_sha": source_commit["tree"]["sha"], "source_ref": "refs/heads/main",
                      "workflow_path": specification["workflow_path"], "workflow_blob_sha": workflow_blob,
                      "attestor_workflow_path": attestor_path,
                      "attestor_workflow_blob_sha": attestor_blob,
                      "event": lane_run["event"], "run_id": lane_run_id,
                      "run_attempt": 1,
                  },
                  "handoff_artifact": {key: normalized_handoff[key] for key in (
                      "id", "name", "api_digest", "workflow_run_id", "workflow_run_attempt", "source_sha"
                  )},
                  "handoff_seal": {"path": "handoff-seal.json", "sha256": sha256(seal_raw)},
                  "technical_subject": {
                      "path": subject_path, "sha256": subject_digest,
                      "schema_version": specification["subject_schema_version"],
                  },
                  "attestation_artifact": {
                      **{key: normalized_attestation[key] for key in (
                          "id", "name", "api_digest", "workflow_run_id", "workflow_run_attempt", "source_sha"
                      )},
                      "bundle_path": "attestation.json", "bundle_sha256": sha256(bundle_raw),
                  },
                  "sigstore_verification": {
                      "verified": True, "report_sha256": report_digest,
                      "bundle_sha256": sha256(bundle_raw), "subject_name": signed_subject_name,
                      "subject_sha256": subject_digest, "repository": repository,
                      "signer_workflow": f"{repository}/{attestor_path}", "signer_digest": source,
                      "source_digest": source, "source_ref": "refs/heads/main",
                      "deny_self_hosted_runners": True,
                  },
              }
              pair = exact_nonpromotion(
                  strict_json(files[pair_name], "pair:" + lane), expected_pair.keys(), "pair:" + lane
              )
              require(pair == expected_pair and files[pair_name] == pretty(expected_pair), "trusted_pair_reconstruction_mismatch:" + lane)
              expected_verified = {
                  "schema_version": "technical-evidence-handoff-pair.v1", "lane": lane,
                  "repository": repository, "source_commit_sha": source,
                  "source_tree_sha": source_commit["tree"]["sha"],
                  "workflow_path": specification["workflow_path"], "workflow_blob_sha": workflow_blob,
                  "attestor_workflow_path": attestor_path,
                  "attestor_workflow_blob_sha": attestor_blob, "run_id": lane_run_id,
                  "run_attempt": 1, "event": lane_run["event"],
                  "handoff_artifact_id": handoff_metadata["id"],
                  "handoff_artifact_digest": handoff_metadata["digest"],
                  "attestation_artifact_id": attestation_metadata["id"],
                  "attestation_artifact_digest": attestation_metadata["digest"],
                  "technical_subject_path": subject_path, "subject_sha256": subject_digest,
                  "sigstore_report_sha256": report_digest, "valid": True,
              }
              verified = exact_nonpromotion(
                  strict_json(files[verified_name], "verified:" + lane),
                  expected_verified.keys(), "verified:" + lane,
              )
              require(
                  canonical(verified) == canonical(expected_verified)
                  and files[verified_name] == pretty(expected_verified),
                  "trusted_verified_pair_reconstruction_mismatch:" + lane,
              )
              reject_nested_authority(pair, "$pair." + lane)
              reject_nested_authority(verified, "$verified." + lane)
              expected_row = {
                  "lane_id": lane, "workflow_path": specification["workflow_path"],
                  "workflow_blob_sha": workflow_blob, "attestor_workflow_path": attestor_path,
                  "attestor_workflow_blob_sha": attestor_blob, "run_id": lane_run_id,
                  "run_attempt": 1, "event": lane_run["event"],
                  "producer_job_id": producers[0]["id"], "attestor_job_id": attestors[0]["id"],
                  "handoff_artifact": normalized_handoff,
                  "attestation_artifact": normalized_attestation,
                  "technical_subject_path": subject_path, "technical_subject_sha256": subject_digest,
                  "pair_sha256": sha256(files[pair_name]),
                  "sigstore_verification_report_sha256": report_digest,
                  "sigstore_bundle_sha256": sha256(files[bundle_name]),
                  "handoff_seal_sha256": sha256(files[seal_name]),
                  "verified_pair_sha256": sha256(files[verified_name]),
                  "contract_pass": True,
                  "technical_scope": specification["technical_scope"],
                  "authority_not_granted": specification["authority_not_granted"],
                  "promotion_eligible": False, "promotion_blockers": specification["promotion_blockers"],
              }
              require(row == expected_row, "trusted_lane_reconstruction_mismatch:" + lane)
              reject_nested_authority(row, "$index.lanes." + lane)
              expected_rows.append(expected_row)
          require(len(run_ids) == 9 and len(artifact_ids) == 16, "global_identity_collision")

          upstream_prefix = ".ci/current-main-evidence-bundle/upstream/"
          upstream_root_rows = [
              {
                  "path": upstream_prefix + name,
                  "sha256": sha256(product_root_files[name]),
                  "bytes": len(product_root_files[name]),
              }
              for name in UPSTREAM_ROOT_FILES
          ]
          upstream_root_manifest = {
              row["path"]: row for row in upstream_root_rows
          }
          def upstream_root(name: str):
              return upstream_root_manifest[upstream_prefix + name]
          def normalized_upstream_artifact(artifact, producer_run: int):
              return {
                  "id": artifact["id"], "name": artifact["name"],
                  "api_digest": artifact["digest"],
                  "size_in_bytes": artifact["size_in_bytes"],
                  "workflow_run_id": producer_run,
                  "workflow_run_attempt": 1, "source_sha": source,
                  "expired": False, "expires_at": artifact["expires_at"],
              }
          expected_contract_rows = [
              {
                  "path": path,
                  "sha256": sha256(files[path]),
                  "bytes": len(files[path]),
                  "git_blob_sha": source_blobs[path],
              }
              for path in CONTRACT_FILES
          ]

          expected_index = {
              "schema_version": "current-main-evidence-index.v1",
              "index_id": "current-main-authenticated-technical-handoff-pairs.v1",
              "generated_at": product_state["updated_at"],
              "source": {
                  "repository": repository, "commit_sha": source,
                  "tree_sha": source_commit["tree"]["sha"], "observed_main_sha": source,
                  "exact_main_match": True,
              },
              "catalog": {
                  "path": "canonical/current-main-evidence-lanes.v1.json",
                  "sha256": sha256(files["canonical/current-main-evidence-lanes.v1.json"]),
                  "schema_path": "canonical/current-main-evidence-lanes.v1.schema.json",
                  "schema_sha256": sha256(files["canonical/current-main-evidence-lanes.v1.schema.json"]),
              },
              "contracts": {
                  "file_count": len(CONTRACT_FILES),
                  "files": expected_contract_rows,
              },
              "upstream": {
                  "workflow_name": "Product State Current",
                  "workflow_path": ".github/workflows/product-state-current.yml",
                  "workflow_blob_sha": product_state_blob, "run_id": product_state_run_id,
                  "run_attempt": 1, "conclusion": "success", "head_sha": source,
                  "product_state_artifact": normalized_upstream_artifact(
                      product_artifact, product_state_run_id
                  ),
                  "root_bundle": {
                      "artifact": normalized_upstream_artifact(
                          product_root_artifact, product_state_run_id
                      ),
                      "file_count": len(UPSTREAM_ROOT_FILES),
                      "files": upstream_root_rows,
                  },
                  "roots": {
                      "product_state_document": upstream_root("product-state.json"),
                      "product_state_attestation_bundle": upstream_root(
                          "product-state.sigstore.json"
                      ),
                      "product_state_attestation_report": upstream_root(
                          "product-state.embedded-verification.json"
                      ),
                      "provenance_document": upstream_root("provenance.json"),
                      "provenance_attestation_bundle": upstream_root(
                          "provenance.sigstore.json"
                      ),
                      "provenance_attestation_report": upstream_root(
                          "provenance.embedded-verification.json"
                      ),
                      "candidate_seal": upstream_root("candidate-seal.json"),
                      "candidate_seal_attestation_bundle": upstream_root(
                          "candidate-seal.sigstore.json"
                      ),
                      "candidate_seal_attestation_report": upstream_root(
                          "candidate-seal.verification.json"
                      ),
                  },
                  "overlay": {
                      "direction": "nightly_to_product_state_to_evidence_index",
                      "consumed": True, "workflow_name": "Nightly Full Quality",
                      "workflow_path": ".github/workflows/nightly-full-quality.yml",
                      "workflow_blob_sha": overlay_workflow_blob,
                      "run_id": overlay_run_id, "run_attempt": 1,
                      "event": overlay_run["event"],
                      "artifact": normalized_upstream_artifact(
                          overlay_artifact, overlay_run_id
                      ),
                      "seal": upstream_root("overlay-seal.json"),
                      "attestation_bundle": upstream_root("overlay.sigstore.json"),
                      "attestation_report": upstream_root(
                          "overlay.final-verification.json"
                      ),
                  },
              },
              "generator": {
                  "workflow_path": ".github/workflows/current-main-evidence-index.yml",
                  "workflow_blob_sha": source_blobs[".github/workflows/current-main-evidence-index.yml"],
                  "run_id": run_id, "run_attempt": 1, "event": generator_run["event"],
              },
              "status": "pass", "contract_pass": True, "technical_pair_count": 5,
              "authority": {
                  "technical_only": True, "scientific_validation": False,
                  "legal_authority": False, "commercial_use": False,
                  "engineering_design": False, "release": False,
              },
              "lanes": expected_rows,
              "issue_state_observation": expected_issue_observation,
              "claim_boundary": CLAIM_BOUNDARY,
          }
          expected_index["artifact_hash"] = sha256(canonical(expected_index))
          require(index == expected_index, "trusted_index_reconstruction_mismatch")
          require(files[index_name] == pretty(expected_index), "trusted_index_bytes_mismatch")
          reject_nested_authority(index, "$index")
          late_specs = [
              (
                  run_id, ".github/workflows/current-main-evidence-index.yml",
                  "Current Main Evidence Index", {"workflow_run"}, "generator",
              ),
              (
                  product_state_run_id, ".github/workflows/product-state-current.yml",
                  "Product State Current", {"workflow_run"}, "product_state",
              ),
              (
                  overlay_run_id, ".github/workflows/nightly-full-quality.yml",
                  "Nightly Full Quality", {"schedule", "workflow_dispatch"},
                  "product_state_overlay",
              ),
              (
                  issue_run_id, ".github/workflows/issue-state-current.yml",
                  "Issue State Current", {"push"}, "issue_state",
              ),
          ]
          late_specs.extend(
              (
                  row["run_id"], specification["workflow_path"],
                  specification["workflow_name"],
                  set(specification["allowed_events"]), specification["lane_id"],
              )
              for row, specification in zip(rows, catalog_lanes, strict=True)
          )
          for selected_run, path, name, events, label in late_specs:
              late = unique_exact_source_workflow_run(
                  selected_run, path=path, name=name, events=events,
                  label="late:" + label,
              )
              require(
                  type(late.get("id")) is int and late.get("id") == selected_run
                  and type(late.get("run_attempt")) is int
                  and late.get("run_attempt") == 1,
                  "late_exact_source_run_identity_changed:" + label,
              )
          final_main = api("git/ref/heads/main", "final_main_ref")
          require(final_main.get("object", {}).get("sha") == source, "main_changed_before_attestation")
          for name, raw in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(raw)
          PY

      - name: Attest exact independently checked technical index
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/current-main-evidence-index/artifacts/manifests/current_main_evidence_index.current.v1.json
          show-summary: false

      - name: Stage exact single-root final artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ROOT: ${{ runner.temp }}/current-main-evidence-index
          PUBLISH_ROOT: ${{ runner.temp }}/current-main-evidence-index-publish
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_VERIFICATION_PATH: ${{ runner.temp }}/current-main-evidence-index-attestation-verification.json
        run: |
          set -euo pipefail
          test ! -e "$PUBLISH_ROOT"
          index_subject="$VERIFIED_ROOT/artifacts/manifests/current_main_evidence_index.current.v1.json"
          gh attestation verify "$index_subject" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/current-main-evidence-index.yml" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_VERIFICATION_PATH"
          python3 -I - <<'PY'
          from __future__ import annotations
          import base64
          import binascii
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re

          source_root = Path(os.environ["VERIFIED_ROOT"])
          publish_root = Path(os.environ["PUBLISH_ROOT"])
          attestation_path = Path(os.environ["ATTESTATION_BUNDLE_PATH"])
          verification_path = Path(os.environ["ATTESTATION_VERIFICATION_PATH"])
          index_path = "artifacts/manifests/current_main_evidence_index.current.v1.json"
          bundle_paths = {
              f".ci/current-main-evidence-bundle/{lane}/{name}"
              for lane in ("medium", "ifc", "mgt9", "mgt10", "native")
              for name in (
                  "pair.json", "technical-subject.json",
                  "sigstore-verification.json", "sigstore-bundle.json",
                  "handoff-seal.json", "verified-pair.json",
              )
          }
          bundle_paths.update({
              ".ci/current-main-evidence-bundle/issue-state/"
              ".github/workflows/issue-state-current.yml",
              ".ci/current-main-evidence-bundle/issue-state/"
              "artifacts/manifests/issue_supersession_inventory.json",
              ".ci/current-main-evidence-bundle/issue-state/"
              "canonical/issue-state-current.v1.schema.json",
              ".ci/current-main-evidence-bundle/issue-state/issue-state-current.json",
              ".ci/current-main-evidence-bundle/issue-state/"
              "scripts/check_issue_supersession_inventory.py",
          })
          bundle_paths.update({
              ".ci/current-main-evidence-bundle/upstream/" + name
              for name in (
                  "candidate-seal.json",
                  "candidate-seal.replay-verification.json",
                  "candidate-seal.sigstore.json",
                  "candidate-seal.verification.json",
                  "final-verification.json",
                  "overlay-seal.json",
                  "overlay.final-verification.json",
                  "overlay.privileged-verification.json",
                  "overlay.replay-verification.json",
                  "overlay.sigstore.json",
                  "product-state.embedded-verification.json",
                  "product-state.json",
                  "product-state.replay-verification.json",
                  "product-state.sigstore.json",
                  "provenance.embedded-verification.json",
                  "provenance.json",
                  "provenance.replay-verification.json",
                  "provenance.sigstore.json",
              )
          })
          contract_paths = {
              ".github/workflows/_technical-evidence-attest.yml",
              ".github/workflows/current-main-evidence-index.yml",
              ".github/workflows/ifc-import-health-current-source.yml",
              ".github/workflows/issue-state-current.yml",
              ".github/workflows/medium-scale-current-source.yml",
              ".github/workflows/mgt-import-health-current-source.yml",
              ".github/workflows/mgt-import-health-tenth-source.yml",
              ".github/workflows/native-frame-alpha-clean-install.yml",
              ".github/workflows/nightly-full-quality.yml",
              ".github/workflows/product-state-current.yml",
              "canonical/current-main-evidence-index.v1.schema.json",
              "canonical/current-main-evidence-lanes.v1.json",
              "canonical/current-main-evidence-lanes.v1.schema.json",
              "canonical/technical-evidence-handoff-pair.v1.schema.json",
              "scripts/verify_technical_evidence_handoff_pair.py",
          }
          source_expected = {index_path} | bundle_paths | contract_paths
          bundle_root = source_root / ".ci/current-main-evidence-bundle"
          if (
              not source_root.is_dir() or source_root.is_symlink()
              or not bundle_root.is_dir() or bundle_root.is_symlink()
              or not (source_root / index_path).is_file()
              or (source_root / index_path).is_symlink()
          ):
              raise SystemExit("verified_final_source_root_invalid")
          source_actual = set()
          for path in source_root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit("verified_final_source_symlink")
              if path.is_file():
                  source_actual.add(path.relative_to(source_root).as_posix())
              elif not path.is_dir():
                  raise SystemExit("verified_final_source_nonregular")
          if source_actual != source_expected:
              raise SystemExit("verified_final_source_member_set_invalid")

          def pairs(rows):
              value = {}
              for key, item in rows:
                  if key in value:
                      raise ValueError("duplicate_json_key")
                  value[key] = item
              return value

          def require(condition: object, reason: str) -> None:
              if not condition:
                  raise SystemExit(reason)

          def strict_json_raw(raw: bytes, label: str):
              try:
                  return json.loads(
                      raw.decode("utf-8"),
                      object_pairs_hook=pairs,
                      parse_int=lambda token: (
                          int(token)
                          if abs(int(token)) <= 9_007_199_254_740_991
                          else require(False, "unsafe_json_integer:" + label)
                      ),
                      parse_float=lambda token: (
                          float(token)
                          if math.isfinite(float(token))
                          else require(False, "nonfinite_json_number:" + label)
                      ),
                      parse_constant=lambda token: require(
                          False, "nonfinite_json_number:" + label
                      ),
                  )
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  raise SystemExit("strict_json_invalid:" + label) from None

          def exact(value, keys, label: str):
              require(
                  isinstance(value, dict) and set(value) == set(keys),
                  "object_keys_invalid:" + label,
              )
              return value

          def validate_index_attestation_subject(
              statement, subject_raw: bytes, subject_name: str
          ) -> None:
              require(
                  statement.get("_type") == "https://in-toto.io/Statement/v1"
                  and statement.get("predicateType")
                  == "https://slsa.dev/provenance/v1"
                  and statement.get("subject")
                  == [{
                      "name": subject_name,
                      "digest": {
                          "sha256": hashlib.sha256(subject_raw).hexdigest()
                      },
                  }],
                  "index_attestation_subject_invalid",
              )

          if (
              not attestation_path.is_file() or attestation_path.is_symlink()
              or not 0 < attestation_path.stat().st_size <= 20_000_000
              or not verification_path.is_file() or verification_path.is_symlink()
              or not 0 < verification_path.stat().st_size <= 20_000_000
          ):
              raise SystemExit("index_attestation_bundle_invalid")
          try:
              attestation_raw = attestation_path.read_bytes()
              attestation_document = exact(
                  strict_json_raw(attestation_raw, "index_attestation_bundle"),
                  {"mediaType", "verificationMaterial", "dsseEnvelope"},
                  "index_attestation_bundle",
              )
              envelope = exact(
                  attestation_document["dsseEnvelope"],
                  {"payload", "payloadType", "signatures"},
                  "index_attestation_envelope",
              )
              require(
                  attestation_document["mediaType"]
                  == "application/vnd.dev.sigstore.bundle.v0.3+json"
                  and isinstance(attestation_document["verificationMaterial"], dict)
                  and bool(attestation_document["verificationMaterial"])
                  and envelope["payloadType"] == "application/vnd.in-toto+json"
                  and isinstance(envelope["payload"], str)
                  and isinstance(envelope["signatures"], list)
                  and len(envelope["signatures"]) == 1,
                  "index_attestation_bundle_shape_invalid",
              )
              statement_raw = base64.b64decode(
                  envelope["payload"].encode("ascii"), validate=True
              )
              signature = envelope["signatures"][0]
              require(
                  0 < len(statement_raw) <= 20_000_000
                  and isinstance(signature, dict)
                  and set(signature).issubset({"keyid", "sig"})
                  and isinstance(signature.get("sig"), str)
                  and bool(signature["sig"]),
                  "index_attestation_signature_shape_invalid",
              )
              base64.b64decode(signature["sig"].encode("ascii"), validate=True)
          except (UnicodeError, binascii.Error, ValueError):
              raise SystemExit("index_attestation_base64_invalid") from None
          statement = exact(
              strict_json_raw(statement_raw, "index_attestation_statement"),
              {"_type", "subject", "predicateType", "predicate"},
              "index_attestation_statement",
          )
          subject_raw = (source_root / index_path).read_bytes()
          validate_index_attestation_subject(
              statement, subject_raw, Path(index_path).name
          )
          predicate = exact(
              statement["predicate"], {"buildDefinition", "runDetails"},
              "index_attestation_predicate",
          )
          build = exact(
              predicate["buildDefinition"],
              {"buildType", "externalParameters", "internalParameters",
               "resolvedDependencies"},
              "index_attestation_build_definition",
          )
          external = exact(
              build["externalParameters"], {"workflow"},
              "index_attestation_external_parameters",
          )
          workflow = exact(
              external["workflow"], {"path", "ref", "repository"},
              "index_attestation_workflow",
          )
          internal = exact(
              build["internalParameters"], {"github"},
              "index_attestation_internal_parameters",
          )
          github = exact(
              internal["github"],
              {"event_name", "repository_id", "repository_owner_id",
               "runner_environment"},
              "index_attestation_github_parameters",
          )
          dependencies = build["resolvedDependencies"]
          require(
              isinstance(dependencies, list) and len(dependencies) == 1,
              "index_attestation_resolved_dependencies_invalid",
          )
          dependency = exact(
              dependencies[0], {"uri", "digest"},
              "index_attestation_resolved_dependency",
          )
          details = exact(
              predicate["runDetails"], {"builder", "metadata"},
              "index_attestation_run_details",
          )
          repository_url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          workflow_path = ".github/workflows/current-main-evidence-index.yml"
          require(
              build["buildType"]
              == "https://actions.github.io/buildtypes/workflow/v1"
              and workflow == {
                  "path": workflow_path,
                  "ref": "refs/heads/main",
                  "repository": repository_url,
              }
              and github == {
                  "event_name": os.environ["GITHUB_EVENT_NAME"],
                  "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
                  "repository_owner_id": os.environ["GITHUB_REPOSITORY_OWNER_ID"],
                  "runner_environment": "github-hosted",
              }
              and dependency == {
                  "uri": "git+" + repository_url + "@refs/heads/main",
                  "digest": {"gitCommit": os.environ["SOURCE_SHA"]},
              }
              and details["builder"] == {
                  "id": repository_url + "/" + workflow_path + "@refs/heads/main"
              }
              and details["metadata"] == {
                  "invocationId": repository_url + "/actions/runs/"
                  + os.environ["GITHUB_RUN_ID"] + "/attempts/1"
              },
              "index_attestation_provenance_identity_invalid",
          )
          verification_report = strict_json_raw(
              verification_path.read_bytes(), "index_attestation_verification"
          )
          require(
              isinstance(verification_report, list)
              and len(verification_report) == 1
              and isinstance(verification_report[0], dict)
              and set(verification_report[0])
              == {"attestation", "verificationResult"},
              "index_attestation_verification_report_shape_invalid",
          )
          report_attestation = exact(
              verification_report[0]["attestation"],
              {"bundle", "bundle_url", "initiator"},
              "index_attestation_verification_report_attestation",
          )
          verification_result = verification_report[0]["verificationResult"]
          require(
              report_attestation["bundle"] == attestation_document
              and report_attestation["bundle_url"] == ""
              and report_attestation["initiator"] == ""
              and isinstance(verification_result, dict)
              and verification_result.get("statement") == statement
              and isinstance(verification_result.get("signature"), dict)
              and isinstance(
                  verification_result["signature"].get("certificate"), dict
              )
              and bool(verification_result["signature"]["certificate"])
              and isinstance(verification_result.get("verifiedTimestamps"), list)
              and bool(verification_result["verifiedTimestamps"])
              and all(
                  isinstance(item, dict) and bool(item)
                  for item in verification_result["verifiedTimestamps"]
              ),
              "index_attestation_verification_report_invalid",
          )

          final_attestation = "current-main-evidence-index.sigstore.json"
          publish_root.mkdir(parents=True, exist_ok=False)
          for relative in sorted(source_expected):
              raw = (source_root / relative).read_bytes()
              if not raw:
                  raise SystemExit("verified_final_source_empty:" + relative)
              target = publish_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as stream:
                  stream.write(raw)
          with (publish_root / final_attestation).open("xb") as stream:
              stream.write(attestation_path.read_bytes())
          final_expected = source_expected | {final_attestation}
          final_actual = {
              path.relative_to(publish_root).as_posix()
              for path in publish_root.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          if final_actual != final_expected:
              raise SystemExit("staged_final_artifact_member_set_invalid")
          PY

      - name: Publish technical-only index and provenance bundle
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-main-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/current-main-evidence-index-publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Reauthenticate published artifact and final main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ROOT: ${{ runner.temp }}/current-main-evidence-index-publish
          PUBLISHED_ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          PUBLISHED_ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
          PUBLISHED_ARTIFACT_NAME: current-main-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          metadata_path="$RUNNER_TEMP/current-main-evidence-index-published-metadata.json"
          metadata_tmp="$metadata_path.tmp"
          metadata_ready=false
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHED_ARTIFACT_ID" > "$metadata_tmp"; then
              mv "$metadata_tmp" "$metadata_path"
              metadata_ready=true
              break
            fi
            sleep 2
          done
          test "$metadata_ready" = true
          inventory_path="$RUNNER_TEMP/current-main-evidence-index-published-inventory.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$inventory_path"
          archive_path="$RUNNER_TEMP/current-main-evidence-index-published.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHED_ARTIFACT_ID/zip" > "$archive_path"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          export PUBLISHED_METADATA_PATH="$metadata_path"
          export PUBLISHED_INVENTORY_PATH="$inventory_path"
          export PUBLISHED_ARCHIVE_PATH="$archive_path"
          python3 -I - <<'PY'
          from __future__ import annotations
          from datetime import datetime, timezone
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import unicodedata
          import zipfile

          MAX_SAFE = 9_007_199_254_740_991
          MAX_ARCHIVE = 100_000_000
          MAX_MEMBER = 20_000_000
          MAX_ENTRIES = 96
          source = os.environ["SOURCE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          repository_id = int(os.environ["GITHUB_REPOSITORY_ID"])
          run_id = int(os.environ["GITHUB_RUN_ID"])
          artifact_id_text = os.environ["PUBLISHED_ARTIFACT_ID"]
          expected_name = os.environ["PUBLISHED_ARTIFACT_NAME"]
          output_digest = os.environ["PUBLISHED_ARTIFACT_DIGEST"]
          publish_root = Path(os.environ["PUBLISH_ROOT"])

          def fail(reason: str) -> None:
              raise SystemExit(reason)

          def require(condition: object, reason: str) -> None:
              if not condition:
                  fail(reason)

          def pairs(rows):
              value = {}
              for key, item in rows:
                  require(key not in value, "duplicate_json_key:" + key)
                  value[key] = item
              return value

          def strict_json(path: Path, label: str):
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8"),
                      object_pairs_hook=pairs,
                      parse_int=lambda token: (
                          int(token) if abs(int(token)) <= MAX_SAFE
                          else fail("unsafe_json_integer:" + label)
                      ),
                      parse_float=lambda token: fail(
                          "floating_json_number:" + label
                      ),
                      parse_constant=lambda token: fail("nonfinite_json_number:" + label),
                  )
              except (UnicodeError, json.JSONDecodeError, ValueError, OSError):
                  fail("strict_json_invalid:" + label)

          def strict_json_bytes(raw: bytes, label: str):
              require(
                  isinstance(raw, bytes) and 0 < len(raw) <= 10_000_000,
                  "strict_json_bytes_size_invalid:" + label,
              )
              try:
                  return json.loads(
                      raw.decode("utf-8"),
                      object_pairs_hook=pairs,
                      parse_int=lambda token: (
                          int(token) if abs(int(token)) <= MAX_SAFE
                          else fail("unsafe_json_integer:" + label)
                      ),
                      parse_float=lambda token: fail(
                          "floating_json_number:" + label
                      ),
                      parse_constant=lambda token: fail(
                          "nonfinite_json_number:" + label
                      ),
                  )
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  fail("strict_json_invalid:" + label)

          def positive(value, label: str) -> int:
              require(
                  type(value) is int and 1 <= value <= MAX_SAFE,
                  "safe_positive_integer_required:" + label,
              )
              return value

          def canonical(value) -> bytes:
              return json.dumps(
                  value,
                  allow_nan=False,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")

          def same_fields(left, right, fields) -> bool:
              return canonical({field: left.get(field) for field in fields}) == canonical(
                  {field: right.get(field) for field in fields}
              )

          def gh_json(endpoint: str, label: str):
              require(
                  endpoint and not endpoint.startswith(("/", "."))
                  and "\\" not in endpoint and "\x00" not in endpoint,
                  "terminal_api_endpoint_invalid:" + label,
              )
              try:
                  completed = subprocess.run(
                      ["gh", "api", f"repos/{repository}/{endpoint}"],
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=30,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail("terminal_api_unavailable:" + label)
              require(
                  completed.returncode == 0
                  and len(completed.stderr) <= 1_000_000,
                  "terminal_api_failed:" + label,
              )
              return strict_json_bytes(completed.stdout, "terminal_api:" + label)

          def validate_terminal_run_payload(
              payload,
              *,
              selected_run: int,
              workflow_path: str,
              workflow_name: str,
              allowed_events: set[str],
              completion_mode: str,
          ) -> None:
              selected_run = positive(selected_run, "terminal_selected_run")
              require(
                  isinstance(payload, dict)
                  and type(payload.get("total_count")) is int
                  and payload.get("total_count") == 1
                  and isinstance(payload.get("workflow_runs"), list)
                  and len(payload["workflow_runs"]) == 1
                  and isinstance(payload["workflow_runs"][0], dict),
                  "terminal_unique_run_inventory_invalid",
              )
              row = payload["workflow_runs"][0]
              require(
                  type(row.get("id")) is int
                  and row.get("id") == selected_run
                  and type(row.get("run_number")) is int
                  and 1 <= row.get("run_number") <= MAX_SAFE
                  and type(row.get("run_attempt")) is int
                  and row.get("run_attempt") == 1
                  and row.get("head_sha") == source
                  and row.get("head_branch") == "main"
                  and row.get("path") == workflow_path
                  and row.get("name") == workflow_name
                  and row.get("event") in allowed_events
                  and (
                      completion_mode == "active"
                      and row.get("status") == "in_progress"
                      and row.get("conclusion") is None
                      or completion_mode == "success"
                      and row.get("status") == "completed"
                      and row.get("conclusion") == "success"
                  ),
                  "terminal_unique_run_identity_invalid",
              )

          require(
              re.fullmatch(r"[1-9][0-9]*", artifact_id_text) is not None,
              "published_artifact_id_invalid",
          )
          artifact_id = int(artifact_id_text)
          require(artifact_id <= MAX_SAFE, "published_artifact_id_unsafe")
          expected_digest = (
              "sha256:" + output_digest
              if re.fullmatch(r"[0-9a-f]{64}", output_digest)
              else output_digest
          )
          require(
              re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is not None,
              "published_output_digest_invalid",
          )
          metadata = strict_json(
              Path(os.environ["PUBLISHED_METADATA_PATH"]), "published_metadata"
          )
          inventory = strict_json(
              Path(os.environ["PUBLISHED_INVENTORY_PATH"]), "published_inventory"
          )
          require(isinstance(metadata, dict), "published_metadata_object_required")
          workflow = metadata.get("workflow_run")
          api_url = (
              f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}"
          )
          require(
              metadata.get("id") == artifact_id
              and metadata.get("name") == expected_name
              and metadata.get("digest") == expected_digest
              and type(metadata.get("size_in_bytes")) is int
              and 0 < metadata["size_in_bytes"] <= MAX_ARCHIVE
              and metadata.get("expired") is False
              and metadata.get("url") == api_url
              and metadata.get("archive_download_url") == api_url + "/zip"
              and isinstance(workflow, dict)
              and type(workflow.get("id")) is int
              and workflow.get("id") == run_id
              and workflow.get("head_sha") == source
              and workflow.get("head_branch") == "main"
              and type(workflow.get("repository_id")) is int
              and workflow.get("repository_id") == repository_id
              and type(workflow.get("head_repository_id")) is int
              and workflow.get("head_repository_id") == repository_id,
              "published_artifact_identity_invalid",
          )
          try:
              expires_at = datetime.fromisoformat(
                  metadata["expires_at"].replace("Z", "+00:00")
              )
          except (AttributeError, ValueError, KeyError):
              fail("published_artifact_expiry_invalid")
          require(
              expires_at > datetime.now(timezone.utc),
              "published_artifact_already_expired",
          )
          rows = inventory.get("artifacts") if isinstance(inventory, dict) else None
          require(
              isinstance(rows, list) and len(rows) <= 100
              and all(isinstance(row, dict) for row in rows)
              and type(inventory.get("total_count")) is int
              and inventory.get("total_count") == len(rows),
              "published_artifact_inventory_incomplete",
          )
          matches = [row for row in rows if row.get("name") == expected_name]
          require(
              len(matches) == 1
              and type(matches[0].get("id")) is int
              and matches[0].get("id") == artifact_id
              and type(matches[0].get("size_in_bytes")) is int
              and same_fields(
                  matches[0],
                  metadata,
                  (
                      "id", "name", "digest", "size_in_bytes", "expired",
                      "expires_at", "workflow_run",
                  ),
              ),
              "published_artifact_list_refetch_mismatch",
          )

          archive = Path(os.environ["PUBLISHED_ARCHIVE_PATH"]).read_bytes()
          require(
              len(archive) == metadata["size_in_bytes"]
              and "sha256:" + hashlib.sha256(archive).hexdigest() == expected_digest,
              "published_artifact_archive_identity_invalid",
          )
          expected_files = {
              path.relative_to(publish_root).as_posix(): path.read_bytes()
              for path in publish_root.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          require(len(expected_files) == 70, "published_local_member_set_invalid")
          observed = {}
          aliases = set()
          total = 0
          try:
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  infos = zipped.infolist()
                  require(
                      len(infos) == len(expected_files) <= MAX_ENTRIES,
                      "published_archive_entry_count_invalid",
                  )
                  for info in infos:
                      name = info.filename
                      path = PurePosixPath(name)
                      require(
                          name and not name.startswith(("/", "./"))
                          and not name.endswith("/") and "\\" not in name
                          and "\x00" not in name and ":" not in name
                          and path.as_posix() == name
                          and all(part not in {"", ".", ".."} for part in path.parts)
                          and unicodedata.normalize("NFC", name) == name
                          and all(
                              unicodedata.category(character) not in {"Cc", "Cf"}
                              for character in name
                          ),
                          "published_archive_member_path_invalid",
                      )
                      alias = name.casefold()
                      require(
                          name not in observed and alias not in aliases,
                          "published_archive_duplicate_member",
                      )
                      mode = (info.external_attr >> 16) & 0xFFFF
                      require(
                          stat.S_IFMT(mode) in {0, stat.S_IFREG}
                          and not (info.flag_bits & 1)
                          and info.compress_type
                          in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED}
                          and 0 < info.file_size <= MAX_MEMBER,
                          "published_archive_nonregular_or_unsafe_member",
                      )
                      require(
                          info.compress_size > 0
                          and info.file_size <= info.compress_size * 200,
                          "published_archive_compression_ratio_invalid",
                      )
                      total += info.file_size
                      require(total <= MAX_ARCHIVE, "published_archive_total_size_invalid")
                      raw = zipped.read(info)
                      require(
                          len(raw) == info.file_size,
                          "published_archive_member_size_changed",
                      )
                      observed[name] = raw
                      aliases.add(alias)
          except (OSError, zipfile.BadZipFile, RuntimeError):
              fail("published_archive_invalid")
          require(
              set(observed) == set(expected_files)
              and all(observed[name] == expected_files[name] for name in observed),
              "published_archive_exact_member_bytes_mismatch",
          )

          terminal_index = strict_json(
              publish_root
              / "artifacts/manifests/current_main_evidence_index.current.v1.json",
              "terminal_index",
          )
          require(isinstance(terminal_index, dict), "terminal_index_object_required")
          generator = terminal_index.get("generator")
          upstream = terminal_index.get("upstream")
          issue_state = terminal_index.get("issue_state_observation")
          lane_rows = terminal_index.get("lanes")
          require(
              isinstance(generator, dict)
              and isinstance(upstream, dict)
              and isinstance(upstream.get("overlay"), dict)
              and isinstance(issue_state, dict)
              and isinstance(lane_rows, list)
              and len(lane_rows) == 5
              and all(isinstance(row, dict) for row in lane_rows),
              "terminal_index_run_roots_invalid",
          )
          lanes = {row.get("lane_id"): row for row in lane_rows}
          require(
              set(lanes) == {"medium", "ifc", "mgt9", "mgt10", "native"},
              "terminal_index_lane_set_invalid",
          )
          terminal_specs = (
              (
                  generator.get("run_id"),
                  ".github/workflows/current-main-evidence-index.yml",
                  "Current Main Evidence Index",
                  {"workflow_run"},
                  "active",
              ),
              (
                  upstream.get("run_id"),
                  ".github/workflows/product-state-current.yml",
                  "Product State Current",
                  {"workflow_run"},
                  "success",
              ),
              (
                  upstream["overlay"].get("run_id"),
                  ".github/workflows/nightly-full-quality.yml",
                  "Nightly Full Quality",
                  {"schedule", "workflow_dispatch"},
                  "success",
              ),
              (
                  issue_state.get("run_id"),
                  ".github/workflows/issue-state-current.yml",
                  "Issue State Current",
                  {"push"},
                  "success",
              ),
              (
                  lanes["medium"].get("run_id"),
                  ".github/workflows/medium-scale-current-source.yml",
                  "Medium Scale Current Source",
                  {"push"},
                  "success",
              ),
              (
                  lanes["ifc"].get("run_id"),
                  ".github/workflows/ifc-import-health-current-source.yml",
                  "IFC Import Health Current Source",
                  {"push"},
                  "success",
              ),
              (
                  lanes["mgt9"].get("run_id"),
                  ".github/workflows/mgt-import-health-current-source.yml",
                  "MGT Import Health Current Source",
                  {"push"},
                  "success",
              ),
              (
                  lanes["mgt10"].get("run_id"),
                  ".github/workflows/mgt-import-health-tenth-source.yml",
                  "MGT Import Health Tenth Source",
                  {"push"},
                  "success",
              ),
              (
                  lanes["native"].get("run_id"),
                  ".github/workflows/native-frame-alpha-clean-install.yml",
                  "Native Frame Alpha Clean Install",
                  {"push", "workflow_dispatch"},
                  "success",
              ),
          )
          for selected_run, workflow_path, workflow_name, events, mode in terminal_specs:
              selected_run = positive(selected_run, "terminal_run:" + workflow_name)
              workflow_file = PurePosixPath(workflow_path).name
              payload = gh_json(
                  f"actions/workflows/{workflow_file}/runs?branch=main"
                  f"&head_sha={source}&per_page=100",
                  "terminal_run:" + workflow_name,
              )
              validate_terminal_run_payload(
                  payload,
                  selected_run=selected_run,
                  workflow_path=workflow_path,
                  workflow_name=workflow_name,
                  allowed_events=events,
                  completion_mode=mode,
              )
          final_main = gh_json("git/ref/heads/main", "terminal_main_ref")
          require(
              isinstance(final_main, dict)
              and isinstance(final_main.get("object"), dict)
              and final_main["object"].get("sha") == source,
              "main_changed_after_terminal_run_check",
          )
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
