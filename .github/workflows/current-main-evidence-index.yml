name: Current Main Evidence Index

# Consumes authenticated technical handoff pairs only after Product State.
# Passing this workflow never grants scientific, legal, engineering,
# commercial, independent-operator, or release authority.

on:
  workflow_run:
    workflows: ["Product State Current"]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: current-main-evidence-index-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  PRODUCT_STATE_RUN_ID: ${{ github.event.workflow_run.id }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  INPUT_ROOT: .ci/current-main-evidence-inputs
  BUNDLE_ROOT: .ci/current-main-evidence-bundle
  INDEX_PATH: artifacts/manifests/current_main_evidence_index.current.v1.json

jobs:
  collect-and-validate:
    name: collect-and-validate-unprivileged
    if: >-
      github.run_attempt == 1 &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: none
      artifact-metadata: none
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate-id: ${{ steps.upload.outputs.artifact-id }}
      candidate-digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
    steps:
      - name: Checkout exact current main without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify exact source ancestry and workflow identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          git show "$SOURCE_SHA:.github/workflows/current-main-evidence-index.yml" \
            | cmp - .github/workflows/current-main-evidence-index.yml
          checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$checkout_status"

      - name: Authenticate pairs then build technical-only index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/build_current_main_evidence_index.py collect \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --product-state-run-id "$PRODUCT_STATE_RUN_ID" \
            --generator-event "$GITHUB_EVENT_NAME" \
            --generator-run-id "$GITHUB_RUN_ID" \
            --generator-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --input-root "$INPUT_ROOT" \
            --bundle-root "$BUNDLE_ROOT" \
            --out "$INDEX_PATH"
          python3 scripts/build_current_main_evidence_index.py check \
            --index "$INDEX_PATH" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-generator-run-id "$GITHUB_RUN_ID" \
            --expected-product-state-run-id "$PRODUCT_STATE_RUN_ID"

      - name: Confirm current main is stable before candidate handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"

      - name: Upload immutable unprivileged candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-main-evidence-index-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ env.INDEX_PATH }}
            ${{ env.BUNDLE_ROOT }}
            canonical/current-main-evidence-lanes.v1.json
            canonical/current-main-evidence-lanes.v1.schema.json
            canonical/current-main-evidence-index.v1.schema.json
            canonical/technical-evidence-handoff-pair.v1.schema.json
            scripts/verify_technical_evidence_handoff_pair.py
            .github/workflows/_technical-evidence-attest.yml
            .github/workflows/current-main-evidence-index.yml
            .github/workflows/ifc-import-health-current-source.yml
            .github/workflows/issue-state-current.yml
            .github/workflows/medium-scale-current-source.yml
            .github/workflows/mgt-import-health-current-source.yml
            .github/workflows/mgt-import-health-tenth-source.yml
            .github/workflows/native-frame-alpha-clean-install.yml
            .github/workflows/nightly-full-quality.yml
            .github/workflows/product-state-current.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  attest-index:
    name: attest-index-privileged-no-checkout-no-dependencies
    needs: collect-and-validate
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Authenticate candidate by REST artifact ID and validate non-promotion contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.collect-and-validate.outputs.candidate-id }}
          CANDIDATE_DIGEST: ${{ needs.collect-and-validate.outputs.candidate-digest }}
          VERIFIED_ROOT: ${{ runner.temp }}/current-main-evidence-index
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test ! -e "$VERIFIED_ROOT"
          mkdir -p "$VERIFIED_ROOT"
          python3 -I - <<'PY'
          from __future__ import annotations
          import base64
          import binascii
          from datetime import datetime
          import hashlib
          import io
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import unicodedata
          from urllib.error import HTTPError
          from urllib.parse import quote, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          import zipfile

          MAX_SAFE = 9007199254740991
          MAX_ARCHIVE = 100_000_000
          MAX_MEMBER = 20_000_000
          MAX_TOTAL = 100_000_000
          MAX_ENTRIES = 96
          MAX_UPSTREAM_ENTRIES = 192
          MAX_UPSTREAM_MEMBER = 100_000_000
          MAX_UPSTREAM_TOTAL = 300_000_000
          MAX_PRODUCT_ENTRIES = 6_010
          MAX_PRODUCT_MEMBER = 300_000_000
          MAX_PRODUCT_TOTAL = 1_200_000_000
          SHA1 = re.compile(r"[0-9a-f]{40}")
          SHA256 = re.compile(r"sha256:[0-9a-f]{64}")
          CLAIM_BOUNDARY = (
              "authenticated_exact_main_same_operator_technical_pairs_only_"
              "leaf_signature_roots_retained_"
              "full_pair_recombination_depends_on_upstream_artifact_retention_"
              "no_scientific_legal_engineering_commercial_or_release_promotion"
          )
          ISSUE_CLAIM_BOUNDARY = (
              "This inventory and live report describe GitHub issue-state hygiene only. "
              "They do not prove solver accuracy, external V&V, design authority, legal "
              "rights, commercial authority, release eligibility, or product readiness."
          )
          ISSUE_AUTHORITY = {
              "commercial_authority": False,
              "design_authority": False,
              "external_validation_authority": False,
              "numerical_authority": False,
              "release_authority": False,
          }
          ISSUE_BUNDLE_FILES = [
              ".github/workflows/issue-state-current.yml",
              "artifacts/manifests/issue_supersession_inventory.json",
              "canonical/issue-state-current.v1.schema.json",
              "issue-state-current.json",
              "scripts/check_issue_supersession_inventory.py",
          ]
          UPSTREAM_ROOT_FILES = [
              "candidate-seal.json",
              "candidate-seal.replay-verification.json",
              "candidate-seal.sigstore.json",
              "candidate-seal.verification.json",
              "final-verification.json",
              "overlay-seal.json",
              "overlay.final-verification.json",
              "overlay.privileged-verification.json",
              "overlay.replay-verification.json",
              "overlay.sigstore.json",
              "product-state.embedded-verification.json",
              "product-state.json",
              "product-state.replay-verification.json",
              "product-state.sigstore.json",
              "provenance.embedded-verification.json",
              "provenance.json",
              "provenance.replay-verification.json",
              "provenance.sigstore.json",
          ]
          CONTRACT_FILES = [
              ".github/workflows/_technical-evidence-attest.yml",
              ".github/workflows/current-main-evidence-index.yml",
              ".github/workflows/ifc-import-health-current-source.yml",
              ".github/workflows/issue-state-current.yml",
              ".github/workflows/medium-scale-current-source.yml",
              ".github/workflows/mgt-import-health-current-source.yml",
              ".github/workflows/mgt-import-health-tenth-source.yml",
              ".github/workflows/native-frame-alpha-clean-install.yml",
              ".github/workflows/nightly-full-quality.yml",
              ".github/workflows/product-state-current.yml",
              "canonical/current-main-evidence-index.v1.schema.json",
              "canonical/current-main-evidence-lanes.v1.json",
              "canonical/current-main-evidence-lanes.v1.schema.json",
              "canonical/technical-evidence-handoff-pair.v1.schema.json",
              "scripts/verify_technical_evidence_handoff_pair.py",
          ]
          source = os.environ["SOURCE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          artifact_id_text = os.environ["CANDIDATE_ID"]
          digest = os.environ["CANDIDATE_DIGEST"]
          root = Path(os.environ["VERIFIED_ROOT"])

          def fail(reason: str) -> None:
              raise SystemExit(reason)

          def require(condition: object, reason: str) -> None:
              if not condition:
                  fail(reason)

          def pairs(rows):
              value = {}
              for key, item in rows:
                  require(key not in value, "duplicate_json_key:" + key)
                  value[key] = item
              return value

          def strict_json(raw: bytes, label: str):
              def integer(token: str) -> int:
                  value = int(token)
                  require(abs(value) <= MAX_SAFE, "unsafe_json_integer:" + label)
                  return value
              def floating(token: str) -> float:
                  value = float(token)
                  require(math.isfinite(value), "nonfinite_json_number:" + label)
                  return value
              try:
                  return json.loads(
                      raw.decode("utf-8"), object_pairs_hook=pairs,
                      parse_int=integer, parse_float=floating,
                      parse_constant=lambda token: fail("nonfinite_json_number:" + label),
                  )
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  fail("strict_json_invalid:" + label)

          def exact(value, keys, label: str):
              require(isinstance(value, dict) and set(value) == set(keys), "object_keys_invalid:" + label)
              return value

          def positive(value, label: str) -> int:
              require(type(value) is int and 1 <= value <= MAX_SAFE, "positive_integer_invalid:" + label)
              return value

          def sha256(raw: bytes) -> str:
              return "sha256:" + hashlib.sha256(raw).hexdigest()

          def git_blob(raw: bytes) -> str:
              return hashlib.sha1(
                  b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw
              ).hexdigest()

          def validate_sealed_file_rows(files, seal_path: str, rows, label: str):
              require(isinstance(rows, list) and rows, label + "_file_rows_invalid")
              sealed_paths = set()
              sealed_rows = {}
              for file_row in rows:
                  exact(file_row, {"path", "bytes", "sha256"}, label + "_file")
                  member_path = file_row["path"]
                  require(
                      isinstance(member_path, str) and member_path in files
                      and member_path != seal_path and member_path not in sealed_paths
                      and type(file_row["bytes"]) is int and file_row["bytes"] > 0
                      and len(files[member_path]) == file_row["bytes"]
                      and isinstance(file_row["sha256"], str)
                      and SHA256.fullmatch(file_row["sha256"])
                      and sha256(files[member_path]) == file_row["sha256"],
                      label + "_file_invalid:" + str(member_path),
                  )
                  sealed_paths.add(member_path)
                  sealed_rows[member_path] = file_row
              return sealed_paths, sealed_rows

          def validate_candidate_to_final_files(
              candidate_files, final_files, sealed_paths, seal_path: str, label: str,
          ) -> str:
              require(
                  set(candidate_files) == sealed_paths | {seal_path}
                  and all(
                      candidate_files[path] == final_files.get(path)
                      for path in candidate_files
                  ),
                  label + "_candidate_to_final_bytes_mismatch",
              )
              return sha256(candidate_files[seal_path])

          def validate_product_provenance_bindings(
              product_files, product_sealed_paths, product_path: str,
              provenance_document,
          ) -> None:
              provenance_artifacts = provenance_document.get("artifacts")
              expected_artifacts = {
                  "product_state": product_path,
                  "product_state_schema": "canonical/product-state.current.v1.schema.json",
                  "canonical_receipt": (
                      "artifacts/manifests/canonical_verification_environment.current.v1.json"
                  ),
                  "canonical_project_wheel_contract": (
                      ".ci/canonical-project-wheel-contract.json"
                  ),
                  "canonical_project_wheel": (
                      ".ci/canonical-wheel/structural_analysis-0.3.0-py3-none-any.whl"
                  ),
                  "generated_artifact_dag_state": (
                      ".ci/product-state-inputs/generated-artifact-dag-state.v2.json"
                  ),
                  "generated_artifact_dag_report": (
                      ".ci/product-state-inputs/generated-artifact-dag-report.v2.json"
                  ),
                  "product_state_workflow_definition": (
                      ".github/workflows/product-state-current.yml"
                  ),
                  "post_main_overlay_seal": (
                      ".ci/product-state-inputs/post-main-overlay/"
                      "post-main-evidence-overlay.seal.json"
                  ),
              }
              require(
                  isinstance(provenance_artifacts, dict)
                  and set(provenance_artifacts) == set(expected_artifacts),
                  "product_state_provenance_artifact_set_invalid",
              )
              provenance_paths = set()
              for artifact_label, artifact_row in provenance_artifacts.items():
                  exact(
                      artifact_row, {"path", "sha256", "byte_length"},
                      "product_state_provenance_artifact:" + artifact_label,
                  )
                  bound_path = artifact_row["path"]
                  require(
                      isinstance(bound_path, str)
                      and bound_path == expected_artifacts[artifact_label]
                      and bound_path in product_sealed_paths
                      and bound_path not in provenance_paths
                      and artifact_row["sha256"] == sha256(product_files[bound_path])
                      and type(artifact_row["byte_length"]) is int
                      and artifact_row["byte_length"] == len(product_files[bound_path]),
                      "product_state_provenance_artifact_binding_invalid:" + artifact_label,
                  )
                  provenance_paths.add(bound_path)
              expected_dag_nodes = {
                  "canonical_receipt": "verification-receipts",
                  "canonical_project_wheel_contract": "verification-receipts",
                  "canonical_project_wheel": "verification-receipts",
                  "product_state": "product-state",
              }
              dag_bindings = provenance_document.get("dag_artifact_bindings")
              require(
                  isinstance(dag_bindings, dict)
                  and set(dag_bindings) == set(expected_dag_nodes),
                  "product_state_provenance_dag_binding_set_invalid",
              )
              for binding_label, binding in dag_bindings.items():
                  exact(
                      binding, {"artifact", "node_id", "path", "sha256"},
                      "product_state_provenance_dag_binding:" + binding_label,
                  )
                  require(
                      isinstance(binding["artifact"], str)
                      and binding["artifact"] == binding_label,
                      "product_state_provenance_dag_artifact_invalid:" + binding_label,
                  )
                  artifact_row = provenance_artifacts[binding_label]
                  require(
                      isinstance(artifact_row, dict)
                      and binding["node_id"] == expected_dag_nodes[binding_label]
                      and binding["path"] == artifact_row["path"]
                      and binding["sha256"] == artifact_row["sha256"],
                      "product_state_provenance_dag_binding_invalid:" + binding_label,
                  )

          def pretty(value) -> bytes:
              return (
                  json.dumps(
                      value, allow_nan=False, ensure_ascii=False,
                      indent=2, sort_keys=True,
                  ) + "\n"
              ).encode("utf-8")

          def canonical(value) -> bytes:
              return (
                  json.dumps(
                      value, allow_nan=False, ensure_ascii=False,
                      separators=(",", ":"), sort_keys=True,
                  ) + "\n"
              ).encode("utf-8")

          def same_fields(left, right, fields) -> bool:
              return canonical({field: left.get(field) for field in fields}) == canonical(
                  {field: right.get(field) for field in fields}
              )

          def aware_datetime(value, label: str) -> str:
              require(isinstance(value, str), "datetime_type_invalid:" + label)
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  fail("datetime_invalid:" + label)
              require(
                  parsed.tzinfo is not None and parsed.utcoffset() is not None,
                  "datetime_timezone_missing:" + label,
              )
              return value

          def issue_canonical(value) -> bytes:
              return json.dumps(
                  value, allow_nan=False, ensure_ascii=False,
                  separators=(",", ":"), sort_keys=True,
              ).encode("utf-8")

          def issue_projection(rows):
              projected = []
              for row in rows:
                  labels = row.get("labels")
                  label_names = sorted(set(
                      label for label in labels if isinstance(label, str)
                  )) if isinstance(labels, list) else []
                  projected.append({
                      "body_sha256": row.get("body_sha256"),
                      "labels": label_names,
                      "number": row.get("number"),
                      "state": row.get("state"),
                      "title": row.get("title"),
                      "updated_at": row.get("updated_at"),
                      "url": row.get("url"),
                  })
              return sorted(
                  projected,
                  key=lambda row: (
                      row.get("number") if type(row.get("number")) is int else 0,
                      str(row),
                  ),
              )

          def safe_archive(
              raw: bytes, label: str, *, archive_limit: int,
              entries: int, member: int, total_limit: int,
          ):
              require(22 <= len(raw) <= archive_limit, "archive_size_invalid:" + label)
              files = {}
              aliases = set()
              total = 0
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as zipped:
                      infos = zipped.infolist()
                      require(0 < len(infos) <= entries, "archive_entry_count_invalid:" + label)
                      for info in infos:
                          name = info.filename
                          path = PurePosixPath(name)
                          require(
                              name and not name.startswith(("/", "./")) and not name.endswith("/")
                              and "\\" not in name and "\x00" not in name
                              and 1 <= len(name) <= 2_048 and ":" not in name
                              and path.as_posix() == name
                              and unicodedata.normalize("NFC", name) == name
                              and all(
                                  unicodedata.category(character) not in {"Cc", "Cf"}
                                  for character in name
                              )
                              and all(part not in {"", ".", ".."} for part in path.parts),
                              "archive_member_path_invalid:" + label,
                          )
                          alias = unicodedata.normalize("NFC", name).casefold()
                          require(name not in files and alias not in aliases, "archive_duplicate_member:" + label)
                          mode = (info.external_attr >> 16) & 0xFFFF
                          require(stat.S_IFMT(mode) in {0, stat.S_IFREG}, "archive_nonregular_member:" + label)
                          require(not (info.flag_bits & 1), "archive_encrypted_member:" + label)
                          require(
                              info.compress_type in {zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED},
                              "archive_compression_invalid:" + label,
                          )
                          require(0 <= info.file_size <= member, "archive_member_size_invalid:" + label)
                          require(
                              info.file_size == 0 or (
                                  info.compress_size > 0
                                  and info.file_size <= info.compress_size * 200
                              ),
                              "archive_compression_ratio_invalid:" + label,
                          )
                          total += info.file_size
                          require(total <= total_limit, "archive_total_size_invalid:" + label)
                          value = zipped.read(info)
                          require(len(value) == info.file_size, "archive_member_size_changed:" + label)
                          if name.endswith(".json"):
                              strict_json(value, label + ":" + name)
                          files[name] = value
                          aliases.add(alias)
              except (zipfile.BadZipFile, OSError, RuntimeError):
                  fail("archive_invalid:" + label)
              return files

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          require(re.fullmatch(r"[1-9][0-9]*", artifact_id_text), "candidate_id_invalid")
          require(re.fullmatch(r"sha256:[0-9a-f]{64}", digest), "candidate_digest_invalid")
          require(re.fullmatch(r"[0-9a-f]{40}", source), "source_sha_invalid")
          require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository), "repository_invalid")
          artifact_id = int(artifact_id_text)
          require(1 <= run_id <= MAX_SAFE, "generator_run_id_unsafe")
          require(artifact_id <= MAX_SAFE, "candidate_id_unsafe")
          api_root = "https://api.github.com/repos/" + repository
          artifact_url = api_root + "/actions/artifacts/" + artifact_id_text
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          opener = build_opener(NoRedirect())

          def api_json(url: str, label: str):
              parsed = urlsplit(url)
              require(
                  parsed.scheme == "https" and parsed.hostname == "api.github.com"
                  and parsed.port in {None, 443} and parsed.username is None
                  and parsed.password is None and parsed.fragment == ""
                  and parsed.path.startswith("/repos/" + repository + "/"),
                  "api_url_invalid:" + label,
              )
              try:
                  with opener.open(Request(url, headers=headers), timeout=30) as response:
                      require(
                          response.status == 200 and response.geturl() == url
                          and response.headers.get("Location") is None,
                          "api_response_invalid:" + label,
                      )
                      raw = response.read(2_000_001)
              except Exception:
                  fail("api_unavailable:" + label)
              require(0 < len(raw) <= 2_000_000, "api_size_invalid:" + label)
              value = strict_json(raw, label)
              require(isinstance(value, dict), "api_object_required:" + label)
              return value

          def api(endpoint: str, label: str):
              require(
                  endpoint and not endpoint.startswith(("/", "."))
                  and "\\" not in endpoint and "\x00" not in endpoint,
                  "api_endpoint_invalid:" + label,
              )
              return api_json(api_root + "/" + endpoint, label)

          def source_blob(path: str, label: str) -> str:
              payload = api(
                  "contents/" + quote(path, safe="/") + "?ref=" + source,
                  "source_blob:" + label,
              )
              blob = payload.get("sha")
              require(
                  payload.get("type") == "file" and payload.get("path") == path
                  and isinstance(blob, str) and SHA1.fullmatch(blob)
                  and type(payload.get("size")) is int
                  and 0 < payload["size"] <= 10_000_000,
                  "source_blob_identity_invalid:" + label,
              )
              return blob

          def workflow_run(run: int, *, path: str, name: str, events: set[str], label: str):
              positive(run, "workflow_run_id:" + label)
              value = api(f"actions/runs/{run}/attempts/1", "run:" + label)
              positive(value.get("run_number"), "workflow_run_number:" + label)
              head_repository = value.get("head_repository")
              require(
                  type(value.get("id")) is int and value.get("id") == run
                  and type(value.get("run_attempt")) is int
                  and value.get("run_attempt") == 1
                  and value.get("status") == "completed" and value.get("conclusion") == "success"
                  and value.get("head_sha") == source and value.get("head_branch") == "main"
                  and value.get("path") == path and value.get("name") == name
                  and value.get("event") in events
                  and isinstance(head_repository, dict)
                  and head_repository.get("full_name") == repository,
                  "workflow_run_identity_invalid:" + label,
              )
              return value

          def unique_exact_source_workflow_run(
              run: int, *, path: str, name: str, events: set[str], label: str,
          ):
              positive(run, "unique_workflow_run_id:" + label)
              workflow_file = quote(PurePosixPath(path).name, safe="")
              payload = api(
                  f"actions/workflows/{workflow_file}/runs?branch=main"
                  + "&head_sha=" + source + "&per_page=100",
                  "workflow_runs:" + label,
              )
              rows = payload.get("workflow_runs")
              require(
                  isinstance(rows, list) and len(rows) <= 100
                  and all(isinstance(row, dict) for row in rows)
                  and type(payload.get("total_count")) is int
                  and payload["total_count"] == len(rows),
                  "workflow_run_inventory_invalid:" + label,
              )
              require(
                  len(rows) == 1 and type(rows[0].get("id")) is int
                  and rows[0].get("id") == run
                  and type(rows[0].get("run_number")) is int
                  and 1 <= rows[0].get("run_number") <= MAX_SAFE
                  and type(rows[0].get("run_attempt")) is int
                  and rows[0].get("run_attempt") == 1
                  and rows[0].get("head_sha") == source
                  and rows[0].get("head_branch") == "main"
                  and rows[0].get("path") == path
                  and rows[0].get("name") == name
                  and rows[0].get("event") in events,
                  "unique_exact_source_workflow_run_required:" + label,
              )
              return rows[0]

          def workflow_jobs(run: int, label: str):
              payload = api(f"actions/runs/{run}/attempts/1/jobs?per_page=100", "jobs:" + label)
              rows = payload.get("jobs")
              require(
                  isinstance(rows, list) and all(isinstance(row, dict) for row in rows)
                  and 1 <= len(rows) <= 100
                  and type(payload.get("total_count")) is int
                  and payload.get("total_count") == len(rows),
                  "job_inventory_invalid:" + label,
              )
              return rows

          def github_hosted_job(
              job, *, run: int, labels: set[str], label: str,
          ) -> int:
              job_id = positive(job.get("id"), "job_id:" + label)
              runner_id = positive(job.get("runner_id"), "runner_id:" + label)
              observed_labels = job.get("labels")
              require(
                  type(job.get("run_id")) is int and job.get("run_id") == run
                  and type(job.get("run_attempt")) is int
                  and job.get("run_attempt") == 1
                  and job.get("head_sha") == source and job.get("status") == "completed"
                  and job.get("conclusion") == "success"
                  and isinstance(observed_labels, list) and len(observed_labels) == 1
                  and observed_labels[0] in labels
                  and type(job.get("runner_group_id")) is int
                  and job["runner_group_id"] == 0
                  and job.get("runner_group_name") == "GitHub Actions"
                  and job.get("runner_name") == f"GitHub Actions {runner_id}",
                  "github_hosted_job_identity_invalid:" + label,
              )
              return job_id

          def artifact_identity(
              value, *, expected_id: int, expected_name: str, run: int,
              label: str, maximum: int = MAX_UPSTREAM_TOTAL,
          ):
              workflow = value.get("workflow_run")
              expected_url = api_root + f"/actions/artifacts/{expected_id}"
              expires_at = value.get("expires_at")
              try:
                  expires = datetime.fromisoformat(
                      str(expires_at).replace("Z", "+00:00")
                  )
              except ValueError:
                  fail("artifact_expiration_invalid:" + label)
              require(
                  type(value.get("id")) is int and value.get("id") == expected_id
                  and value.get("name") == expected_name
                  and isinstance(value.get("digest"), str) and SHA256.fullmatch(value["digest"])
                  and type(value.get("size_in_bytes")) is int
                  and 0 < value["size_in_bytes"] <= maximum
                  and value.get("expired") is False and value.get("url") == expected_url
                  and value.get("archive_download_url") == expected_url + "/zip"
                  and isinstance(expires_at, str) and "T" in expires_at
                  and expires.tzinfo is not None and expires.utcoffset() is not None
                  and isinstance(workflow, dict)
                  and type(workflow.get("id")) is int and workflow.get("id") == run
                  and workflow.get("head_sha") == source and workflow.get("head_branch") == "main",
                  "artifact_identity_invalid:" + label,
              )
              return value

          def download_artifact(
              value, label: str, *, maximum: int = MAX_UPSTREAM_TOTAL,
          ) -> bytes:
              url = value["archive_download_url"]
              try:
                  opener.open(Request(url, headers=headers), timeout=30)
                  fail("artifact_redirect_required:" + label)
              except HTTPError as error:
                  require(error.code in {301, 302, 303, 307, 308}, "artifact_redirect_status_invalid:" + label)
                  location = error.headers.get("Location")
              except Exception:
                  fail("artifact_redirect_unavailable:" + label)
              require(isinstance(location, str), "artifact_location_missing:" + label)
              parsed = urlsplit(location)
              host = parsed.hostname or ""
              require(
                  parsed.scheme == "https" and parsed.port in {None, 443}
                  and parsed.username is None and parsed.password is None and parsed.fragment == ""
                  and (
                      host.endswith(".blob.core.windows.net")
                      or host.endswith(".actions.githubusercontent.com")
                      or host.endswith(".githubusercontent.com")
                  ),
                  "artifact_location_invalid:" + label,
              )
              try:
                  with opener.open(Request(location), timeout=60) as response:
                      require(
                          response.status == 200 and response.geturl() == location
                          and response.headers.get("Location") is None,
                          "artifact_blob_identity_invalid:" + label,
                      )
                      raw = response.read(maximum + 1)
              except Exception:
                  fail("artifact_download_failed:" + label)
              require(len(raw) == value["size_in_bytes"], "artifact_size_mismatch:" + label)
              require(sha256(raw) == value["digest"], "artifact_digest_mismatch:" + label)
              return raw

          metadata = api_json(artifact_url, "candidate_metadata")
